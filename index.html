"},{"q":"O COAF deve ser comunicado sobre operações suspeitas:","alts":["Acima de R$ 2.000.","Acima de R$ 50.000.","De qualquer valor.","Somente mediante requisição judicial."],"c":2,"exp":"Não há piso de valor para a comunicação de suspeita."},{"q":"Atuar como analista de valores mobiliários sem registro, gratuitamente, sujeita o agente a:","alts":["Nenhuma sanção, por ausência de remuneração.","Detenção de 6 a 24 meses e multa.","Reclusão de 1 a 8 anos e multa.","Apenas multa administrativa da CVM."],"c":1,"exp":"A lei alcança expressamente a atuação a título gratuito, com pena de detenção."},{"q":"O bloqueio de bens por determinação do Conselho de Segurança da ONU deve ser comunicado a:","alts":["Banco Central, COAF e Ministério da Justiça.","CVM, COAF e Polícia Federal.","Apenas ao COAF, como unidade de inteligência.","Apenas ao Ministério Público Federal."],"c":0,"exp":"Lei 13.810/2019: os três órgãos, e sem dar ciência ao cliente."},{"q":"Um investidor transfere recursos a outro por meio de day trades combinados em derivativo de baixa liquidez. A prática é:","alts":["Front running.","Money pass.","Churning.","Insider trading secundário."],"c":1,"exp":"Money pass, condição artificial enquadrada como manipulação de mercado, com pena de 1 a 8 anos."},{"q":"Um amigo do CEO recebe informação não divulgada e opera com ela. Ele é:","alts":["Insider primário.","Insider secundário.","Front runner.","Manipulador de benchmark."],"c":1,"exp":"Primário é quem soube pela função; secundário é quem recebeu do primário."}]},{"id":"R","titulo":"Reforço: Lacunas do Programa","subtitulo":"Exigido pela ANBIMA e ausente na apostila","niveis":[{"id":"R.1","titulo":"Payback, Custo de Oportunidade e Taxa Livre de Risco","resumo":["PAYBACK: prazo de retorno. Quanto tempo o projeto leva para devolver o capital investido.","PAYBACK SIMPLES: soma os fluxos nominais até zerar o investimento. Ignora o valor do dinheiro no tempo.","PAYBACK DESCONTADO: soma os fluxos trazidos a valor presente. Sempre resulta em prazo MAIOR ou igual ao simples.","Limitação central: o payback ignora tudo o que acontece DEPOIS da recuperação. Por isso não substitui VPL nem TIR.","CUSTO DE OPORTUNIDADE: o que se deixa de ganhar na melhor alternativa descartada. É o que dá sentido à TMA.","TAXA LIVRE DE RISCO: retorno de uma aplicação sem risco de crédito. No Brasil, a referência são os títulos públicos federais e a Selic. Serve de piso: nenhum ativo com risco deve render menos que ela."],"macete":"Payback descontado é sempre MAIOR que o simples, porque o desconto encolhe os fluxos. E payback nenhum enxerga o que vem depois.","pegadinha":"A banca aprova um projeto só pelo payback curto. Payback não mede rentabilidade nem enxerga fluxos posteriores: a decisão é do VPL e da TIR.","questoes":[{"q":"Um investimento de R$ 100.000 gera R$ 40.000 ao ano. O payback simples é de:","alts":["2 anos e meio.","2 anos exatos.","3 anos e meio.","4 anos exatos."],"c":0,"exp":"100.000 dividido por 40.000 resulta em 2,5 anos. O descontado seria maior, pois os fluxos valeriam menos a valor presente."},{"q":"Comparando payback simples e descontado para o mesmo projeto:","alts":["O simples é sempre maior que o descontado.","O descontado é maior ou igual ao simples.","Ambos resultam sempre no mesmo prazo.","O descontado ignora o valor do dinheiro no tempo."],"c":1,"exp":"Trazer os fluxos a valor presente reduz cada parcela, então demora mais para acumular o investimento."},{"q":"A principal limitação do payback como critério de decisão é:","alts":["Exigir o uso de calculadora financeira.","Desconsiderar os fluxos posteriores à recuperação do capital.","Só poder ser aplicado a projetos de curto prazo.","Depender da taxa mínima de atratividade."],"c":1,"exp":"Um projeto pode recuperar rápido e render pouco depois. Por isso o payback complementa, mas não substitui, VPL e TIR."},{"q":"REDENÇÃO: a taxa livre de risco no mercado brasileiro é usualmente representada:","alts":["Pelo CDI de bancos de primeira linha.","Pelos títulos públicos federais e pela Selic.","Pela rentabilidade média do Ibovespa.","Pela taxa de captação das debêntures."],"c":1,"exp":"O governo federal é o emissor de menor risco de crédito. Nenhum ativo com risco deveria render menos que isso."}]},{"id":"R.2","titulo":"CMPC (WACC) e Alavancagem Financeira","resumo":["CMPC, Custo Médio Ponderado de Capital (em inglês WACC): quanto a empresa paga, em média, pelo dinheiro que usa.","Ela se financia de duas formas: CAPITAL PRÓPRIO (dos sócios, remunerado por dividendos e valorização) e CAPITAL DE TERCEIROS (dívida, remunerada por juros).","O CMPC é a média dos dois custos PONDERADA pela participação de cada um na estrutura de capital.","Detalhe importante: os juros da dívida são despesa DEDUTÍVEL do imposto, o que barateia o capital de terceiros frente ao próprio.","Uso prático: o CMPC costuma ser a taxa de desconto do projeto, ou seja, vira a TMA da empresa. Projeto que rende menos que o CMPC destrói valor.","ALAVANCAGEM FINANCEIRA: usar dívida para ampliar o retorno sobre o capital próprio. Amplia o ganho quando o projeto rende mais que o custo da dívida, e amplia a perda no caso contrário."],"macete":"CMPC é o preço médio do dinheiro da empresa. Se o projeto não bate o CMPC, ele destrói valor. Dívida é mais barata porque o juro abate imposto.","pegadinha":"A banca diz que capital próprio é mais barato por não ter juros. É o contrário: o sócio exige retorno maior por assumir mais risco, e o juro da dívida ainda gera economia fiscal.","questoes":[{"q":"O CMPC de uma empresa representa:","alts":["O custo apenas do capital de terceiros.","A média ponderada do capital próprio e de terceiros.","A rentabilidade mínima exigida pelos sócios.","O total de juros pagos pela empresa no exercício."],"c":1,"exp":"É a média ponderada dos dois custos pela estrutura de capital da empresa."},{"q":"Um projeto apresenta retorno esperado inferior ao CMPC da empresa. Conclui-se que ele:","alts":["Gera valor, pois o retorno é positivo.","Destrói valor, pois não cobre o custo do capital.","É indiferente, pois o CMPC não é critério de decisão.","Deve ser aceito se o payback for curto."],"c":1,"exp":"Não cobrir o custo do capital significa entregar menos do que financiadores e sócios exigem."},{"q":"O capital de terceiros tende a ser mais barato que o próprio porque:","alts":["Não exige garantias reais da empresa.","Os juros abatem imposto e o credor arrisca menos.","Não precisa ser devolvido ao credor no prazo.","É remunerado por dividendos, e não por juros."],"c":1,"exp":"Credor recebe antes do sócio na fila e tem retorno contratado, então exige menos. A dedutibilidade dos juros reduz ainda mais o custo efetivo."},{"q":"REDENÇÃO: a alavancagem financeira consiste em:","alts":["Reduzir o endividamento para diminuir o risco.","Usar dívida para ampliar o retorno do sócio.","Emitir novas ações para captar recursos novos.","Distribuir todo o lucro do exercício aos sócios."],"c":1,"exp":"Usar dívida amplia ganhos quando o retorno supera o custo dela, e amplia perdas quando não supera."}]},{"id":"R.3","titulo":"Retorno Histórico, Esperado e Taxa Líquida","resumo":["RETORNO HISTÓRICO (ou observado): o que o ativo JÁ rendeu. É fato, olha para trás.","RETORNO ESPERADO: o que se PROJETA que renda. É estimativa, olha para frente. Rentabilidade passada não garante rentabilidade futura.","RETORNO ESPERADO DE UMA CARTEIRA: média PONDERADA dos retornos esperados de cada ativo, pelo peso de cada um.","Exemplo: 60% num ativo de 10% esperado e 40% em outro de 5% resulta em (0,6 × 10) + (0,4 × 5) = 8%.","TAXA BRUTA: rendimento antes dos tributos e custos. TAXA LÍQUIDA: o que sobra depois do IR, do IOF e das taxas.","É a taxa LÍQUIDA que permite comparar produtos. Um CDB a 100% do CDI perde para uma LCI a 90% do CDI quando o IR entra na conta, porque a LCI é isenta para pessoa física."],"macete":"Retorno de carteira é média PONDERADA, nunca média simples. E comparação de produtos só vale no líquido.","pegadinha":"A banca compara um produto tributado com um isento pela taxa bruta. Sempre traga tudo para o líquido antes de decidir.","questoes":[{"q":"Uma carteira tem 70% num ativo com retorno esperado de 12% e 30% em outro de 4%. O retorno esperado da carteira é:","alts":["8,0%","9,6%","16,0%","12,0%"],"c":1,"exp":"(0,7 × 12) + (0,3 × 4) = 8,4 + 1,2 = 9,6%. Média ponderada, não simples."},{"q":"A diferença essencial entre retorno histórico e retorno esperado é que:","alts":["O histórico é projetado e o esperado é observado.","O histórico é observado e o esperado é uma projeção.","Ambos se referem a períodos futuros.","O esperado é garantido pelo emissor."],"c":1,"exp":"Histórico olha para trás e é fato; esperado olha para frente e é estimativa, sem garantia."},{"q":"Um investidor pessoa física compara um CDB a 100% do CDI com uma LCI a 92% do CDI, ambos por dois anos. A análise correta é:","alts":["O CDB é melhor, pois a taxa bruta é maior.","A LCI pode ser melhor, pois é isenta e a comparação deve ser líquida.","São equivalentes, pois o indexador é o mesmo.","A LCI é melhor apenas se o prazo for inferior a seis meses."],"c":1,"exp":"O CDB sofre IR de 15% aos dois anos; a LCI é isenta para PF. Só a taxa líquida permite comparar."},{"q":"REDENÇÃO: o retorno esperado de uma carteira é obtido pela:","alts":["Soma simples dos retornos de cada ativo.","Média ponderada pelos pesos de cada ativo.","Média aritmética dos retornos históricos.","Diferença entre o maior e o menor retorno."],"c":1,"exp":"Cada ativo contribui na proporção do seu peso na carteira."}]},{"id":"R.4","titulo":"Cupom Cambial e Swap Cambial","resumo":["CUPOM CAMBIAL: é a taxa de juros em DÓLAR de quem investe no Brasil. Aproxima-se do juro interno em reais descontada a variação cambial esperada.","Serve para responder: vale a pena para o estrangeiro trazer dólares para cá? Cupom alto atrai capital externo; cupom baixo o afasta.","SWAP CAMBIAL: contrato de troca de rentabilidades usado pelo Banco Central como instrumento de política cambial, SEM gastar reservas em dólar. É liquidado em reais.","SWAP TRADICIONAL: o BC assume o risco da variação cambial e paga a alta do dólar, recebendo juros em reais. Equivale a VENDER dólar no futuro, o que ajuda a CONTER a alta da moeda.","SWAP REVERSO: a operação inversa, equivale a COMPRAR dólar futuro, usada para conter a queda excessiva do dólar.","Vantagem sobre a venda direta de reservas: o swap oferece proteção ao mercado sem tocar no estoque de dólares do país."],"macete":"Swap TRADICIONAL segura o dólar em alta (BC vende futuro). REVERSO segura o dólar em queda. E nenhum dos dois gasta reservas.","pegadinha":"A banca diz que o swap cambial consome as reservas internacionais. Não consome: é liquidado em reais, e essa é justamente a sua vantagem.","questoes":[{"q":"O cupom cambial pode ser entendido como:","alts":["A taxa de juros em dólar de quem investe no Brasil.","A diferença entre o câmbio turismo e o comercial.","O rendimento das reservas internacionais do país.","A taxa cobrada nas operações de câmbio pronto."],"c":0,"exp":"É o juro interno descontada a variação cambial: o retorno em dólar do capital estrangeiro aqui."},{"q":"Diante de forte alta do dólar, o Banco Central realiza swap cambial tradicional. Esse instrumento:","alts":["Consome reservas internacionais em dólar.","Equivale a vender dólar futuro e é liquidado em reais.","Equivale a comprar dólar futuro, elevando a cotação.","Substitui a definição da taxa Selic pelo Copom."],"c":1,"exp":"Tradicional equivale a venda futura de dólar e oferece hedge ao mercado sem tocar nas reservas."},{"q":"O swap cambial REVERSO é utilizado quando o objetivo é:","alts":["Conter a alta excessiva do dólar.","Conter a queda excessiva do dólar.","Aumentar as reservas internacionais.","Reduzir a taxa básica de juros."],"c":1,"exp":"Reverso equivale a comprar dólar futuro, sustentando a cotação."},{"q":"REDENÇÃO: a principal vantagem do swap cambial frente à venda direta de dólares é:","alts":["Gerar receita imediata ao Tesouro Nacional.","Oferecer proteção ao mercado sem consumir as reservas internacionais.","Dispensar autorização do Conselho Monetário Nacional.","Eliminar a volatilidade do câmbio de forma permanente."],"c":1,"exp":"Liquidação em reais preserva o estoque de dólares do país."}]},{"id":"R.5","titulo":"Lei de Responsabilidade Fiscal e Lei de Liberdade Econômica","resumo":["LRF, Lei Complementar 101/2000: disciplina as contas públicas de União, estados e municípios.","Pilares da LRF: planejamento com metas fiscais, LIMITES de gasto com pessoal, limites de endividamento, e a regra de que gasto novo permanente exige fonte de custeio correspondente.","Objetivo final: equilíbrio das contas públicas e transparência, evitando que o governo gaste hoje e transfira a conta ao futuro.","Conexão com o Módulo 1: é a LRF que dá musculatura ao controle da dívida pública, que por sua vez influencia juros, inflação e risco-país.","LEI DE LIBERDADE ECONÔMICA, Lei 13.874/2019: garante a livre iniciativa e o livre mercado.","Três marcas: presunção de BOA-FÉ do particular; liberdade de definição de PREÇOS em mercado não regulado; e vedação ao ABUSO REGULATÓRIO do Estado."],"macete":"LRF é a lei do equilíbrio fiscal (LC 101/2000). Liberdade Econômica é a lei da boa-fé e do preço livre (13.874/2019).","pegadinha":"A banca troca os números: LC 101 é a fiscal, 13.874 é a econômica. E a Liberdade Econômica não autoriza preço livre em mercado regulado.","questoes":[{"q":"A Lei de Responsabilidade Fiscal estabelece, entre outros pontos:","alts":["A meta anual de inflação a ser perseguida.","Limites de gasto com pessoal e de endividamento.","As alíquotas do imposto de renda da pessoa física.","A composição do Conselho Monetário Nacional."],"c":1,"exp":"Limites de pessoal e de dívida, com metas fiscais e exigência de fonte para gasto novo permanente."},{"q":"A Lei de Liberdade Econômica (13.874/2019) consagra:","alts":["O tabelamento de preços em setores essenciais.","A boa-fé do particular e o preço livre no mercado.","A licença prévia obrigatória para toda atividade.","O controle estatal sobre a remuneração dos gestores."],"c":1,"exp":"Boa-fé, preço livre onde não há regulação e vedação ao abuso regulatório."},{"q":"REDENÇÃO: a Lei de Responsabilidade Fiscal corresponde à:","alts":["Lei Complementar 101/2000.","Lei Complementar 105/2001.","Lei 13.874/2019.","Lei Complementar 179/2021."],"c":0,"exp":"LC 101/2000. A 105/2001 é o sigilo bancário e a 179/2021 é a autonomia do Banco Central."}]},{"id":"R.6","titulo":"Riscos de Mercado, Crédito e Liquidez","resumo":["Os três riscos que a ANBIMA cobra em conjunto, e a diferença entre eles é o que cai na prova.","RISCO DE MERCADO: o PREÇO oscila. Vem de juros, câmbio, inflação e cotações. Exemplo: um Tesouro IPCA+ perde valor quando os juros sobem.","RISCO DE CRÉDITO: a contraparte NÃO PAGA. É o calote do emissor. Exemplo: uma debênture de empresa em recuperação judicial.","RISCO DE LIQUIDEZ: não se consegue vender pelo preço justo no momento desejado, por falta de comprador. Exemplo: um FII pouco negociado ou um imóvel.","Como reduzir cada um: mercado, com diversificação e prazos mais curtos; crédito, com análise de rating e diversificação de emissores; liquidez, escolhendo ativos com mercado secundário ativo.","Título público federal tem risco de crédito baixíssimo, mas continua tendo risco de MERCADO na venda antecipada."],"macete":"Preço oscila = mercado. Não paga = crédito. Não consigo vender = liquidez.","pegadinha":"A pegadinha clássica é o Tesouro IPCA+ vendido antes do vencimento com prejuízo: muita gente marca risco de crédito. É risco de MERCADO.","questoes":[{"q":"Um investidor vende um Tesouro IPCA+ antes do vencimento com prejuízo, após alta dos juros. O risco materializado foi o de:","alts":["Crédito, pois o valor recebido foi menor.","Mercado, pela oscilação do preço com a taxa de juros.","Liquidez, pela dificuldade de encontrar comprador.","Operacional, por falha na execução da ordem."],"c":1,"exp":"O Tesouro garante a recompra, então não é liquidez. E o governo pagou, então não é crédito. É a marcação a mercado."},{"q":"Uma debênture deixa de ser paga porque a emissora entrou em recuperação judicial. Trata-se de risco de:","alts":["Mercado.","Crédito.","Liquidez.","Sistêmico."],"c":1,"exp":"Inadimplência da contraparte é a definição de risco de crédito."},{"q":"Um cotista de FII pouco negociado não encontra comprador para suas cotas pelo preço desejado. O risco é de:","alts":["Mercado.","Crédito.","Liquidez.","Contraparte central."],"c":2,"exp":"Existe preço, mas não há contraparte suficiente: risco de liquidez, típico dos FII, que são fundos fechados."},{"q":"REDENÇÃO: a forma mais direta de mitigar o risco de crédito de uma carteira é:","alts":["Encurtar o prazo médio dos títulos.","Diversificar emissores e observar o rating de cada um.","Escolher apenas ativos negociados em bolsa.","Concentrar a carteira em um único emissor sólido."],"c":1,"exp":"Encurtar prazo ataca o risco de mercado; concentrar aumenta o de crédito. Diversificação e análise de rating são a resposta."}]},{"id":"R.7","titulo":"Infraestruturas: CCP, Depositário, Registradora e Desintermediação","resumo":["A ANBIMA chama as infraestruturas de mercado de GATEKEEPERS: elas guardam os portões do sistema.","CONTRAPARTE CENTRAL (CCP): interpõe-se entre comprador e vendedor, tornando-se compradora de todo vendedor e vendedora de todo comprador. Assume o RISCO DE CONTRAPARTE e garante a liquidação, com salvaguardas e margens. A B3 exerce esse papel.","DEPOSITÁRIO CENTRAL: mantém a guarda escritural dos ativos e controla a titularidade. É o 'cartório' dos ativos.","ENTIDADE REGISTRADORA: registra operações e instrumentos que não são depositados, dando rastreabilidade e publicidade. Exemplo típico: registro de recebíveis e de títulos privados.","RISCO DA CONTRAPARTE: a chance de o outro lado da operação não honrar. A CCP existe justamente para eliminá-lo do participante individual e concentrá-lo num ente com salvaguardas.","DESINTERMEDIAÇÃO FINANCEIRA: poupador e tomador se encontram SEM o banco no meio, via mercado de capitais, fintechs e plataformas. Reduz o spread bancário e amplia o acesso."],"macete":"CCP assume o risco, Depositário guarda o ativo, Registradora anota a operação. Desintermediação é cortar o banco do meio.","pegadinha":"A banca confunde depositário com registradora: o depositário GUARDA e controla titularidade; a registradora apenas REGISTRA operações não depositadas.","questoes":[{"q":"A entidade que se interpõe entre comprador e vendedor, assumindo o risco de contraparte e garantindo a liquidação, é a:","alts":["Entidade registradora.","Contraparte central.","Depositária central.","Câmara de custódia simples."],"c":1,"exp":"A CCP torna-se compradora de todo vendedor e vendedora de todo comprador, com margens e salvaguardas."},{"q":"A função de manter a guarda escritural dos ativos e controlar sua titularidade cabe:","alts":["À contraparte central.","Ao depositário central.","À entidade registradora.","Ao Banco Central."],"c":1,"exp":"O depositário central é o cartório dos ativos escriturais."},{"q":"A desintermediação financeira caracteriza-se por:","alts":["Aumentar o número de bancos no sistema.","Aproximar poupador e tomador sem o banco como intermediário.","Concentrar as operações nas câmaras de compensação.","Elevar o spread bancário das operações de crédito."],"c":1,"exp":"Mercado de capitais, fintechs e plataformas ligam as pontas direto, o que tende a reduzir o spread."},{"q":"REDENÇÃO: o papel da entidade registradora é:","alts":["Guardar os ativos e controlar a titularidade.","Registrar operações que não são depositadas.","Assumir o risco de crédito das operações.","Definir os limites de concentração dos fundos."],"c":1,"exp":"Registro e publicidade de operações que não passam por depósito centralizado."}]},{"id":"R.8","titulo":"Operadores que Faltavam no SFN","resumo":["Cinco operadores do programa oficial que a apostila não detalha.","BANCO COOPERATIVO: banco comercial ou múltiplo constituído e controlado por COOPERATIVAS de crédito. Dá às cooperativas acesso ao sistema bancário (compensação, câmbio, mesa). Exemplos: Bancoob e Bansicredi.","SOCIEDADE DE CRÉDITO IMOBILIÁRIO (SCI): financia habitação. Integra o SFH e pode captar por poupança, letras hipotecárias e LCI.","COMPANHIA HIPOTECÁRIA: também financia imóveis, mas NÃO capta depósito à vista nem poupança. Capta por letras hipotecárias e repasses, e administra créditos hipotecários.","AGÊNCIA DE FOMENTO: controlada por um ESTADO (uma por unidade da federação), financia projetos de desenvolvimento local. NÃO capta recursos do público: opera com recursos próprios e repasses.","SCMEPP, Sociedade de Crédito ao Microempreendedor e à Empresa de Pequeno Porte: concede crédito a microempreendedores e pequenas empresas. Também NÃO capta do público."],"macete":"Quem NÃO capta do público: agência de fomento e SCMEPP. Companhia hipotecária capta, mas não por depósito nem poupança. SCI capta poupança.","pegadinha":"A banca faz a agência de fomento captar depósitos ou a companhia hipotecária captar poupança. Nenhuma das duas faz isso.","questoes":[{"q":"A instituição controlada por um estado, que financia o desenvolvimento local e não capta recursos do público, é a:","alts":["Sociedade de crédito imobiliário.","Agência de fomento.","Companhia hipotecária.","Cooperativa de crédito."],"c":1,"exp":"Uma por unidade da federação, operando com recursos próprios e repasses."},{"q":"A diferença entre sociedade de crédito imobiliário e companhia hipotecária está em que:","alts":["Só a companhia hipotecária financia imóveis.","A SCI pode captar poupança e a companhia hipotecária não.","A companhia hipotecária integra o SFH e a SCI não.","Ambas captam depósito à vista."],"c":1,"exp":"As duas financiam imóveis, mas a companhia hipotecária não capta depósito à vista nem poupança."},{"q":"O banco cooperativo caracteriza-se por:","alts":["Ser controlado pelo governo federal.","Ser constituído e controlado por cooperativas de crédito.","Atender exclusivamente pessoas físicas de baixa renda.","Não poder operar carteira comercial."],"c":1,"exp":"É banco comercial ou múltiplo das próprias cooperativas, dando a elas acesso à estrutura bancária."},{"q":"REDENÇÃO: a SCMEPP tem como público-alvo:","alts":["Grandes empresas exportadoras.","Microempreendedores e pequenas empresas.","Governos estaduais e municipais.","Investidores qualificados e profissionais."],"c":1,"exp":"Sociedade de Crédito ao Microempreendedor e à Empresa de Pequeno Porte, que também não capta do público."}]},{"id":"R.9","titulo":"Renda Variável: o que faltou","resumo":["S/A ABERTA: valores mobiliários admitidos à negociação no mercado, com registro na CVM. S/A FECHADA: não tem valores em negociação pública.","LISTADA é a que tem ações negociadas em bolsa. Toda listada é aberta, mas nem toda aberta é listada: uma companhia pode ser aberta só com debêntures.","CAPITAL PRÓPRIO: recursos dos sócios, via ações. Não tem prazo nem juro, mas dilui o controle. CAPITAL DE TERCEIROS: dívida, via debêntures e empréstimos. Tem prazo e juro, mas não dilui.","BÔNUS DE SUBSCRIÇÃO: título que dá ao titular o DIREITO (não a obrigação) de subscrever ações da companhia no futuro, por preço e prazo definidos. É emitido pela própria S/A.","AGO, Assembleia Geral ORDINÁRIA: obrigatória, uma vez por ano, nos QUATRO primeiros meses após o encerramento do exercício. Delibera demonstrações financeiras, destinação do lucro e eleição de administradores.","AGE, Assembleia Geral EXTRAORDINÁRIA: a qualquer tempo, para qualquer outro assunto, como reforma do estatuto, fusão ou incorporação.","RESTITUIÇÃO DE CAPITAL: devolução de parte do capital social aos acionistas, quando ele é reduzido por ser excessivo. Não é dividendo, pois não vem do lucro.","DRAG ALONG: o oposto do tag along. Dá ao CONTROLADOR o direito de OBRIGAR os minoritários a vender junto, viabilizando a venda de 100% da companhia."],"macete":"TAG along: o minoritário PODE ir junto (protege ele). DRAG along: o minoritário É ARRASTADO (protege a venda). AGO é anual e cabe nos 4 primeiros meses.","pegadinha":"Tag e drag são trocados o tempo todo. E cuidado: bônus de subscrição dá DIREITO, não obrigação, de subscrever.","questoes":[{"q":"A assembleia que aprova as demonstrações financeiras e a destinação do lucro deve ocorrer:","alts":["A qualquer tempo do ano, como AGE.","Nos quatro primeiros meses seguintes, como AGO.","Nos seis primeiros meses seguintes, como AGO.","Sempre no mês de dezembro, como AGE."],"c":1,"exp":"AGO é anual e ocorre nos quatro primeiros meses seguintes ao fim do exercício social."},{"q":"O direito do controlador de obrigar os minoritários a vender suas ações junto com ele é o:","alts":["Tag along.","Drag along.","Direito de subscrição.","Direito de retirada."],"c":1,"exp":"Drag along arrasta o minoritário. Tag along é o direito dele de acompanhar a venda, se quiser."},{"q":"O bônus de subscrição confere ao titular:","alts":["A obrigação de adquirir ações na nova emissão.","O direito de subscrever ações a preço definido.","A preferência no recebimento dos dividendos.","Um crédito conversível em debêntures da emissora."],"c":1,"exp":"É um direito, não uma obrigação, de subscrever ações da própria emissora."},{"q":"REDENÇÃO: uma companhia com debêntures negociadas no mercado e sem ações em bolsa é:","alts":["Fechada e não listada.","Aberta e não listada.","Aberta e listada.","Fechada e listada."],"c":1,"exp":"Ter valores mobiliários em negociação pública a torna aberta; sem ações em bolsa, não é listada."}]},{"id":"R.10","titulo":"Fundos, Rating, Poupança no SFH e Câmbio","resumo":["ASSEMBLEIA GERAL DE COTISTAS: delibera sobre o fundo como um todo (demonstrações, troca de prestador, mudança de política, alteração de taxas). A ORDINÁRIA é anual, para as demonstrações contábeis.","ASSEMBLEIA ESPECIAL: reúne apenas os cotistas de UMA classe ou subclasse, para assuntos que só afetam aquela classe.","CICLO DA COTA: EMISSÃO (o fundo cria as cotas), SUBSCRIÇÃO (o investidor se compromete a adquirir), INTEGRALIZAÇÃO (paga efetivamente), RESGATE (o fundo devolve, só em classe aberta) e AMORTIZAÇÃO (devolução parcial a TODOS os cotistas, sem reduzir a quantidade de cotas, típica das fechadas).","TAXA MÁXIMA DE DISTRIBUIÇÃO: teto do que pode ser destinado à remuneração dos distribuidores, informado no regulamento. A CVM 175 exige que todas as taxas apareçam SEPARADAS.","ATIVOS NO EXTERIOR: os FIF podem investir fora do país, com limites definidos pela regulação e pelo público-alvo. Classes destinadas a investidores QUALIFICADOS e PROFISSIONAIS têm limites mais elevados que as do varejo.","RATING: nota de risco de CRÉDITO atribuída por agência classificadora ao emissor ou à emissão. Divide-se em GRAU DE INVESTIMENTO (risco baixo) e GRAU ESPECULATIVO (risco alto). Rating melhor significa juro menor.","POUPANÇA E SFH: a poupança é a principal fonte do Sistema Financeiro da Habitação. Parte relevante dos depósitos é DIRECIONADA por regulação ao crédito imobiliário, e é isso que faz a poupança financiar a casa própria no país.","RECOMPRA DE MOEDA ESTRANGEIRA: a instituição que vendeu moeda pode recomprá-la do cliente, seguindo as regras do BC e com o VET divulgado também na recompra."],"macete":"Resgate devolve e sai do fundo (aberta); amortização devolve e você continua cotista (fechada). Rating bom = juro baixo.","pegadinha":"A banca troca resgate por amortização. Na amortização a quantidade de cotas NÃO muda: o que cai é o valor de cada uma.","questoes":[{"q":"A devolução parcial de recursos a todos os cotistas, sem redução da quantidade de cotas, é denominada:","alts":["Resgate.","Amortização.","Integralização.","Subscrição."],"c":1,"exp":"Amortização é típica das classes fechadas: o cotista recebe parte e continua no fundo."},{"q":"A assembleia que reúne apenas os cotistas de uma classe específica é a:","alts":["Assembleia geral ordinária.","Assembleia especial de cotistas.","Assembleia geral extraordinária.","Assembleia de prestadores de serviço."],"c":1,"exp":"Assuntos que afetam só uma classe ou subclasse são tratados em assembleia especial."},{"q":"Um título classificado em grau ESPECULATIVO por agência de rating tende a:","alts":["Pagar juro menor, por ser mais seguro.","Pagar juro maior, pelo risco de crédito elevado.","Ser isento de imposto de renda na fonte.","Ter cobertura obrigatória do FGC."],"c":1,"exp":"Grau especulativo significa risco maior, e risco maior exige prêmio maior."},{"q":"REDENÇÃO: o momento em que o investidor efetivamente paga pelas cotas que se comprometeu a adquirir é a:","alts":["Emissão.","Subscrição.","Integralização.","Amortização."],"c":2,"exp":"Emissão cria, subscrição compromete, integralização paga."}]}],"boss":[{"q":"Um projeto de R$ 200.000 gera R$ 50.000 ao ano. O payback simples e a característica do descontado são:","alts":["4 anos, e o descontado seria menor.","4 anos, e o descontado seria maior ou igual.","5 anos, e o descontado seria igual.","3 anos, e o descontado seria menor."],"c":1,"exp":"200.000 / 50.000 = 4 anos. Trazendo os fluxos a valor presente, o prazo aumenta."},{"q":"Uma empresa avalia um projeto com retorno de 9% e tem CMPC de 12%. A decisão correta é:","alts":["Aceitar, pois o retorno é positivo.","Rejeitar, pois o projeto destrói valor.","Aceitar, se o payback for inferior a 3 anos.","Indiferente, pois o CMPC não é critério."],"c":1,"exp":"Retorno abaixo do custo do capital significa entregar menos do que sócios e credores exigem."},{"q":"Carteira com 50% em ativo de 8% esperado e 50% em ativo de 14%. O retorno esperado é:","alts":["11%","22%","6%","8%"],"c":0,"exp":"(0,5 × 8) + (0,5 × 14) = 11%."},{"q":"Para conter a alta do dólar sem consumir reservas, o Banco Central utiliza:","alts":["Swap cambial reverso.","Swap cambial tradicional.","Venda direta de dólares à vista.","Elevação do depósito compulsório."],"c":1,"exp":"Tradicional equivale a vender dólar futuro e é liquidado em reais."},{"q":"A Lei de Responsabilidade Fiscal e a Lei de Liberdade Econômica são, respectivamente:","alts":["LC 101/2000 e Lei 13.874/2019.","Lei 13.874/2019 e LC 101/2000.","LC 105/2001 e Lei 13.709/2018.","LC 179/2021 e LC 101/2000."],"c":0,"exp":"LC 101/2000 é a fiscal; 13.874/2019 é a econômica."},{"q":"Um investidor não consegue vender cotas de um fundo imobiliário por falta de comprador. O risco é de:","alts":["Crédito.","Mercado.","Liquidez.","Contraparte."],"c":2,"exp":"Há preço de referência, mas falta contraparte: risco de liquidez."},{"q":"A entidade que assume o risco de contraparte e garante a liquidação das operações é a:","alts":["Depositária central.","Contraparte central.","Entidade registradora.","Agência de rating."],"c":1,"exp":"A CCP se interpõe entre as pontas e concentra o risco, com margens e salvaguardas."},{"q":"Entre as instituições abaixo, NÃO capta recursos do público:","alts":["Sociedade de crédito imobiliário.","Agência de fomento.","Banco cooperativo.","Cooperativa de crédito."],"c":1,"exp":"Agência de fomento opera com recursos próprios e repasses. A SCMEPP também não capta."},{"q":"A assembleia que aprova as demonstrações financeiras de uma S/A ocorre:","alts":["Nos quatro primeiros meses seguintes, como AGO.","A qualquer tempo do ano, como AGE.","Semestralmente, sempre como AGO.","Somente por convocação dos minoritários."],"c":0,"exp":"AGO é anual e tem prazo de quatro meses após o encerramento do exercício social."},{"q":"O direito que permite ao controlador obrigar minoritários a vender junto é o:","alts":["Tag along.","Drag along.","Bônus de subscrição.","Direito de retirada."],"c":1,"exp":"Drag arrasta o minoritário; tag apenas permite que ele acompanhe."},{"q":"Em uma classe fechada, a devolução parcial de recursos sem alterar a quantidade de cotas é:","alts":["Resgate.","Amortização.","Subscrição.","Integralização."],"c":1,"exp":"Amortização: o valor da cota cai, mas o cotista permanece com a mesma quantidade."},{"q":"Uma LCI a 92% do CDI e um CDB a 100% do CDI, para pessoa física em dois anos. A comparação correta exige:","alts":["Olhar apenas a taxa bruta contratada.","Comparar no líquido, pois a LCI é isenta.","Preferir sempre o maior percentual do CDI.","Considerar apenas a cobertura do FGC."],"c":1,"exp":"O CDB paga 15% de IR aos dois anos; a LCI é isenta para PF. Só o líquido permite comparar."}]},{"id":"S","titulo":"Situacional: Atendimento na Prática","subtitulo":"Prospecção, comunicação e conduta no formato que a banca cobra","niveis":[{"id":"S.1","titulo":"Prospecção e Primeiro Contato","resumo":["Prospecção é o início do relacionamento: identificar potenciais clientes e abordar de forma CONSULTIVA — entender a pessoa antes de oferecer produto. Contato usando dados pessoais exige base legal (LGPD) e cessa diante da recusa do cliente. Insistência após o 'não' e uso de listas obtidas irregularmente são condutas vedadas.","Na prospecção não existe promessa: garantia de rentabilidade é vedada SEMPRE, inclusive verbal, inclusive 'só para fechar'. Material de divulgação segue o Código de Distribuição: informação verdadeira, completa e com o risco junto da vantagem."],"macete":"Prospectar é abrir porta, não empurrar produto: primeiro a pessoa, depois a necessidade, por último a oferta.","pegadinha":"A banca adora o assessor que 'garante' retorno para conquistar cliente novo. Garantia de rentabilidade é vedada em qualquer circunstância — promessa verbal de prospecção incluída.","questoes":[{"q":"Num evento, um potencial cliente diz que 'só investe em poupança'. A primeira atitude adequada do profissional é:","alts":["Perguntar sobre os objetivos e a relação dele com o dinheiro.","Apresentar de imediato um produto que rende mais que a poupança.","Explicar que poupança é investimento ultrapassado e errado.","Anotar o contato e enviar ofertas de CDB no dia seguinte."],"c":0,"exp":"Abordagem consultiva: entender objetivos e necessidades vem antes de qualquer oferta."},{"q":"Para atrair um cliente da concorrência, o profissional promete 1,5% ao mês 'no mínimo' num fundo multimercado. Essa conduta:","alts":["É vedada: caracteriza garantia de rentabilidade.","É aceitável, se o histórico do fundo sustentar a promessa.","É permitida por escrito, com assinatura do gerente.","É vedada apenas se o cliente vier a ter prejuízo."],"c":0,"exp":"Prometer retorno mínimo é garantia de rentabilidade — vedada sempre, com ou sem prejuízo posterior."},{"q":"O profissional obtém uma lista de telefones vazada e liga oferecendo produtos. Além da falha ética, ele viola diretamente:","alts":["A LGPD, por tratar dados pessoais sem base legal.","O Código de Ética da ANBIMA, apenas se o cliente reclamar.","A Lei de Lavagem de Dinheiro, pela origem da lista.","Nenhuma norma, pois telefone não é dado pessoal."],"c":0,"exp":"Telefone identifica a pessoa: é dado pessoal, e tratamento sem base legal viola a LGPD."},{"q":"Qual sequência resume a prospecção adequada?","alts":["Apresentar-se, ouvir necessidades e só então propor soluções.","Oferecer o produto da campanha em destaque, ouvir objeções e insistir.","Coletar dados, enviar ofertas em massa e aguardar retorno.","Propor a solução padrão da casa e ajustar depois da venda."],"c":0,"exp":"Diagnóstico antes da oferta: essa é a ordem da abordagem consultiva."}]},{"id":"S.2","titulo":"Identificação de Necessidades e Escuta Ativa","resumo":["O diagnóstico nasce de PERGUNTAS ABERTAS (objetivos, prazos, momento de vida) e se confirma com perguntas fechadas. Escuta ativa é reformular o que o cliente disse e validar o entendimento antes de propor. Tudo relevante vira registro: um objetivo com data (faculdade da filha, aposentadoria) define liquidez e prazo da alocação.","Cliente que já chega pedindo produto específico não dispensa o diagnóstico: a ordem se executa, mas o dever de verificar adequação permanece."],"macete":"Quem pergunta conduz: a aberta abre a conversa, a fechada confirma o que você entendeu.","pegadinha":"'O cliente pediu, eu só executei' não elimina o dever de adequação — pedido espontâneo também passa pelo filtro do perfil.","questoes":[{"q":"O cliente diz: 'quero algo que renda bem'. A pergunta mais eficaz para avançar no diagnóstico é:","alts":["'Render bem para quê, e em quanto tempo você precisa do dinheiro?'","'Você aceita assinar o termo de ciência de risco hoje mesmo?'","'Posso sugerir o fundo com melhor retorno dos últimos meses?'","'Prefere renda fixa ou renda variável, para eu filtrar a prateleira?'"],"c":0,"exp":"Pergunta aberta que transforma desejo vago em objetivo com prazo — a base do diagnóstico."},{"q":"Durante a conversa, o cliente menciona que a filha entra na faculdade em 2 anos. O profissional atento registra isso como:","alts":["Um objetivo com prazo definido, que pede liquidez na data.","Um comentário pessoal, sem relevância para a alocação da carteira.","Um motivo para concentrar tudo em renda variável.","Uma informação que só importa na declaração de IR."],"c":0,"exp":"Evento com data é objetivo financeiro: define prazo e necessidade de liquidez da alocação."},{"q":"Escuta ativa, na prática do atendimento, significa:","alts":["Confirmar com o cliente o que foi entendido antes de propor.","Deixar o cliente falar sem interromper até o fim da reunião.","Anotar tudo e responder somente por e-mail, com formalidade.","Concordar com as opiniões do cliente para gerar confiança."],"c":0,"exp":"Ouvir, reformular e validar o entendimento: escuta ativa é diálogo, não silêncio nem concordância."},{"q":"O cliente pede 'o CDB da campanha' de imediato. A conduta correta é:","alts":["Executar o pedido após verificar a adequação ao perfil.","Executar de imediato e sem análise, pois a ordem partiu do cliente.","Recusar a ordem até ele completar novo questionário.","Trocar por outro produto que o profissional prefira."],"c":0,"exp":"Ordem do cliente se executa, mas o dever de verificar adequação continua valendo."}]},{"id":"S.3","titulo":"Comunicação Eficaz e Transparência","resumo":["Comunicação eficaz é adequar a linguagem ao repertório de quem ouve, sem infantilizar e sem esconder atrás de jargão. Risco e custo aparecem junto da vantagem — omitir 'para não assustar' é falha de conduta, não técnica de venda.","Má notícia se comunica com contexto: o que causou a queda, o horizonte combinado e o plano. Minimizar perdas ('é só no papel') ou esperar o mercado recuperar para relatar são erros clássicos."],"macete":"Traduza sem infantilizar: o cliente decide bem quando entende risco, custo e prazo — nessa ordem de clareza.","pegadinha":"Omitir a taxa ou o risco para 'facilitar a venda' parece habilidade comercial; na prova, é violação do dever de transparência.","questoes":[{"q":"Ao explicar um fundo para um cliente iniciante, a comunicação correta é:","alts":["Falar em linguagem simples, incluindo riscos e custos.","Usar os termos técnicos exatos do regulamento do fundo.","Focar na rentabilidade passada, que é o que interessa.","Resumir ao máximo e enviar o regulamento por e-mail."],"c":0,"exp":"Linguagem adequada ao repertório, com risco e custo junto da vantagem: é isso que informa de verdade."},{"q":"A carteira do cliente caiu 8% no mês. A comunicação adequada da má notícia:","alts":["Contextualiza a queda, o horizonte e o plano traçado.","Espera o mercado recuperar para só então relatar o fato.","Minimiza: 'é só no papel, nem olhe o extrato este mês'.","Transfere o assunto para a ouvidoria da instituição."],"c":0,"exp":"Transparência com contexto: causa, horizonte e plano. Esconder ou minimizar corrói a confiança."},{"q":"Cliente questiona a taxa de administração. O profissional deve:","alts":["Informar o custo com clareza e o que ele remunera.","Dizer que a taxa é padrão de mercado e mudar de assunto.","Afirmar que o custo não afeta o retorno no longo prazo.","Sugerir que ele ignore custos e olhe só a rentabilidade."],"c":0,"exp":"Custo é informação essencial: clareza sobre quanto é e o que remunera."},{"q":"O que caracteriza comunicação eficaz com o investidor?","alts":["Informação completa, adequada ao repertório de quem ouve.","Volume de detalhes técnicos o maior possível por escrito.","Mensagens curtas para não tomar o tempo do cliente.","Entusiasmo com o produto para transmitir confiança."],"c":0,"exp":"Eficaz é o que o cliente compreende: completo no conteúdo, adequado na forma."}]},{"id":"S.4","titulo":"Atendimento, Suporte e Pós-venda","resumo":["A venda fecha um ciclo e abre outro: o pós-venda inclui acompanhamento periódico, revisão do perfil quando a vida do cliente muda e suporte a dúvidas — sem esperar reclamação.","Reclamação tem fluxo: acolher, registrar no atendimento/SAC com protocolo e prazo, e escalar à OUVIDORIA somente se os canais iniciais falharem. Ouvidoria é instância revisora, não primeiro balcão."],"macete":"Venda fecha um ciclo e abre outro: pós-venda é onde o cliente decide se fica.","pegadinha":"Ouvidoria não é o primeiro balcão: ela entra depois que atendimento e SAC falham — inverter essa ordem é erro clássico de prova.","questoes":[{"q":"Cliente reclama de cobrança que considera indevida. O fluxo correto começa por:","alts":["Registrar a reclamação no atendimento e dar prazo de resposta.","Encaminhar o caso diretamente à ouvidoria, que é a instância inicial.","Orientar o cliente a procurar o Banco Central de imediato.","Explicar que a cobrança está certa, encerrando o caso."],"c":0,"exp":"Atendimento e SAC primeiro, com protocolo e prazo; ouvidoria é a instância seguinte."},{"q":"Meses após a aplicação, o cliente muda de emprego e a renda cai. O pós-venda adequado:","alts":["Revisita perfil e alocação diante do novo momento.","Mantém tudo como está, pois o contrato foi assinado.","Sugere resgatar tudo e migrar para a poupança.","Aguarda o cliente pedir, para não parecer invasivo."],"c":0,"exp":"Mudança relevante de vida pede revisão de perfil e de alocação — proativamente."},{"q":"Qual atitude caracteriza um bom suporte contínuo?","alts":["Acompanhamento periódico mesmo sem novas vendas.","Contato somente nas campanhas de novos produtos.","Atendimento apenas quando o cliente reclama.","Relatórios automáticos sem qualquer leitura crítica."],"c":0,"exp":"Relacionamento se sustenta no acompanhamento constante, não no calendário de campanhas."},{"q":"A ouvidoria de uma instituição serve para:","alts":["Rever casos não resolvidos pelos canais de atendimento.","Registrar toda e qualquer solicitação feita pelos clientes.","Substituir o SAC nas reclamações mais urgentes.","Defender a instituição nas disputas com clientes."],"c":0,"exp":"Instância revisora e independente: atua quando atendimento e SAC não resolveram."}]},{"id":"S.5","titulo":"Autogestão e Agilidade","resumo":["Autogestão é organizar tempo, carteira e metas com disciplina própria — e resolver o conflito clássico da profissão: quando a meta comercial briga com o interesse do cliente, o interesse do cliente prevalece, sempre.","Agilidade é reagir bem à mudança: norma nova, produto novo, crise no mercado. A resposta profissional é estudar antes de orientar, manter-se atualizado (educação continuada) e adaptar o discurso sem improvisar sobre o que não domina."],"macete":"Meta é sua; a carteira é do cliente. Quando as duas brigam, a prova quer o lado do cliente.","pegadinha":"'Bater a meta do mês' nunca justifica recomendar produto inadequado — conflito de interesses se resolve a favor do cliente, sem exceção.","questoes":[{"q":"Fim de mês, meta apertada, e o produto da campanha não serve ao perfil do cliente da vez. O profissional:","alts":["Recomenda o que é adequado, ainda que fora da campanha.","Recomenda o da campanha, compensando na próxima visita.","Divide: metade no produto da campanha, metade no adequado.","Adia o atendimento do cliente para depois do fechamento."],"c":0,"exp":"Conflito entre meta e cliente se resolve pelo cliente: adequação não se negocia."},{"q":"Uma resolução muda a regra de um produto que o profissional domina. A postura ágil é:","alts":["Estudar a mudança antes de orientar os clientes afetados.","Seguir orientando pela regra antiga até alguém questionar.","Evitar o assunto com os clientes até a poeira baixar.","Repassar aos clientes o texto da norma, sem tradução."],"c":0,"exp":"Agilidade é atualizar-se rápido e traduzir a mudança para o cliente — não improvisar nem fugir."},{"q":"Sobre educação continuada, é correto dizer que ela:","alts":["Mantém o profissional apto diante de produtos e normas novas.","Só é exigida na primeira obtenção da certificação profissional.","Serve apenas para pontos em programas internos.","É opcional para quem já tem carteira consolidada."],"c":0,"exp":"Mercado muda o tempo todo; a aptidão se mantém com atualização constante."},{"q":"Autogestão, para o profissional de distribuição, significa:","alts":["Organizar tempo, carteira e metas com disciplina própria.","Trabalhar sem qualquer tipo de supervisão da instituição financeira.","Definir sozinho os produtos que a casa vai ofertar.","Priorizar os clientes de maior patrimônio da carteira."],"c":0,"exp":"Disciplina sobre o próprio trabalho — o que não elimina supervisão nem hierarquia."}]},{"id":"S.6","titulo":"Resolução de Problemas e Conflitos","resumo":["Erro operacional tem protocolo: ASSUMIR, CORRIGIR, COMUNICAR e REGISTRAR — sem demora e sem 'consertar por debaixo dos panos'. Ocultar erro que o cliente não percebeu é falha de conduta, mesmo com a correção feita.","Cliente exaltado se acolhe sem confronto: ouvir, focar na solução e, se o caso passa da alçada, escalar informando o prazo. Resolver bem inclui tratar a causa raiz para o problema não se repetir."],"macete":"Errou: assuma, corrija, comunique e registre — nessa ordem e sem demora.","pegadinha":"Corrigir o erro em silêncio antes que o cliente perceba parece zelo, mas é ocultação — a conduta correta inclui comunicar.","questoes":[{"q":"O profissional aplica R$ 10 mil no fundo errado. A conduta correta é:","alts":["Comunicar o erro, corrigir a operação e registrar o caso.","Corrigir em silêncio, aproveitando que o cliente não percebeu.","Aguardar o fechamento do mês para ajustar a posição.","Transferir o custo da correção para o próprio cliente."],"c":0,"exp":"Assumir, corrigir, comunicar e registrar: transparência mesmo quando o cliente não notou."},{"q":"Cliente exaltado no telefone, cobrando um prejuízo. A primeira resposta adequada:","alts":["Ouvir sem interromper e focar na solução possível.","Rebater no mesmo tom, para não perder autoridade.","Transferir imediatamente a ligação ao supervisor.","Encerrar a chamada e responder apenas por escrito."],"c":0,"exp":"Acolher sem confronto e conduzir para a solução: escalar só se o caso passar da alçada."},{"q":"Um pedido do cliente exige aprovação que está acima da alçada do profissional. Ele deve:","alts":["Escalar ao responsável e informar o prazo ao cliente.","Aprovar por conta própria para agilizar o atendimento.","Negar o pedido, evitando envolver outras áreas.","Pedir que o próprio cliente procure o setor competente."],"c":0,"exp":"Escalar é resolver: aciona quem pode aprovar e mantém o cliente informado do prazo."},{"q":"Resolver bem um problema no atendimento inclui, além da correção:","alts":["Tratar a causa raiz para o erro não se repetir.","Compensar o cliente com brinde institucional.","Trocar o funcionário envolvido de função.","Arquivar o caso tão logo o cliente se dê por satisfeito."],"c":0,"exp":"Correção resolve o caso; a causa raiz evita o próximo."}]}],"boss":[{"q":"Cliente conservador insiste em criptoativos após ver vídeos na internet. A conduta correta:","alts":["Alertar sobre a inadequação e documentar a decisão dele.","Recusar qualquer conversa sobre o tema com o cliente.","Executar sem ressalvas: o dinheiro é do cliente.","Executar em dobro, aproveitando o apetite do momento."],"c":0,"exp":"Alerta de desenquadramento com registro: o cliente decide, mas informado e documentado."},{"q":"O gerente pressiona: 'empurra o consórcio para todo mundo essa semana'. O profissional deve:","alts":["Oferecer o produto apenas a quem tiver perfil e necessidade.","Cumprir a ordem: a responsabilidade passa a ser do gerente.","Oferecer a todos, mas com desconto para compensar o risco.","Ignorar o produto por completo, mesmo para quem se encaixa."],"c":0,"exp":"Ordem superior não transfere o dever de adequação: oferta só a quem tem perfil."},{"q":"Um cliente idoso demonstra não entender o produto estruturado ofertado. O profissional:","alts":["Reexplica em linguagem simples e reavalia a adequação.","Colhe a assinatura no termo, que supre o entendimento.","Pede que um parente autorize a operação por telefone.","Prossegue, pois o questionário de perfil já foi assinado."],"c":0,"exp":"Assinatura não substitui compreensão: sem entendimento, reexplica-se e reavalia-se a oferta."},{"q":"Sobre prospecção com uso de dados pessoais, é correto:","alts":["Contato exige base legal e cessa diante da recusa.","Lista comprada pode ser usada se houver desconto real.","Basta o interesse comercial legítimo da instituição.","Recusa do cliente vale somente por trinta dias."],"c":0,"exp":"LGPD na prática comercial: base legal para tratar dados e respeito imediato à recusa."},{"q":"O cliente aceita a aplicação, mas pergunta: 'e se eu precisar do dinheiro antes?'. Isso revela:","alts":["Necessidade de liquidez a tratar antes de concluir.","Insegurança que o profissional deve contornar com otimismo.","Que a venda deve ser refeita com outro produto qualquer.","Que o perfil dele deve ser reclassificado para arrojado."],"c":0,"exp":"A pergunta expõe necessidade de liquidez: volta-se ao diagnóstico antes de fechar."},{"q":"A promessa de retorno feita na venda não se confirma e o cliente cobra. Se houve de fato promessa de rentabilidade, o caso configura:","alts":["Conduta vedada do profissional, passível de sanção.","Risco de mercado comum, sem qualquer irregularidade.","Problema exclusivo do gestor do fundo contratado.","Mera frustração de expectativa, sem consequências."],"c":0,"exp":"Garantir rentabilidade é vedado; a frustração da promessa expõe o profissional a sanção."},{"q":"Dois clientes com o mesmo perfil pedem orientação no mesmo dia de crise. Um é grande, outro pequeno. A autogestão correta:","alts":["Atende os dois com a mesma qualidade, priorizando urgências.","Atende primeiro o cliente maior, que representa mais receita à casa.","Atende só o maior e manda mensagem padrão ao menor.","Adia ambos até o mercado se acalmar por completo."],"c":0,"exp":"Tratamento equitativo: prioridade se define por urgência e necessidade, não por receita."},{"q":"O que autogestão, comunicação, agilidade e resolução de problemas têm em comum na prova?","alts":["São avaliados em situações práticas de atendimento.","Valem somente para cargos de liderança na instituição.","Aparecem apenas como definições teóricas decoradas.","Substituem o conhecimento técnico dos produtos."],"c":0,"exp":"As habilidades comportamentais aparecem aplicadas: a banca descreve a cena e cobra a conduta."}]}]},{id:"4",nome:'Inovação e Desenvolvimento',subtitulo:'ESG, blockchain, Open Finance e IA',peso:10,blocos:[{"id":"4.1","titulo":"ESG","subtitulo":"Ambiental, social e governança na decisão de investir","niveis":[{"id":"4.1.1","titulo":"Os Três Pilares do ESG","resumo":["ESG em inglês, ASG em português: Environmental, Social and Governance.","AMBIENTAL: consumo de água, emissão de gases de efeito estufa, gestão de resíduos, tecnologias limpas. Exemplo: montadora que lança linha elétrica.","SOCIAL: relação com funcionários, fornecedores, clientes e comunidades. Pagamento justo, diversidade, direitos trabalhistas, saúde e segurança, e a CADEIA DE FORNECIMENTO (evitar trabalho infantil ou análogo à escravidão).","GOVERNANÇA: estrutura de poder e tomada de decisão. Independência e diversidade do conselho, remuneração dos administradores, ética e transparência.","Por que importa ao investidor: ESG revela riscos que a análise tradicional não enxerga e sinaliza resiliência de longo prazo."],"macete":"Ambiental é o planeta, Social são as pessoas, Governança é o comando. Cadeia de fornecimento cai no S, não no G.","pegadinha":"A banca coloca a composição do conselho de administração no pilar Social. Conselho é GOVERNANÇA. Fornecedor e comunidade é que são Social.","questoes":[{"q":"A avaliação da independência e da diversidade do conselho de administração pertence ao pilar:","alts":["Ambiental, por envolver sustentabilidade.","Social, por tratar de pessoas.","Governança, por tratar da estrutura de poder.","Não integra os critérios ESG."],"c":2,"exp":"Conselho, remuneração de administradores e transparência são governança."},{"q":"Uma empresa de moda é autuada por jornada excessiva em oficinas terceirizadas. O pilar afetado é:","alts":["Ambiental.","Social.","Governança.","Regulatório."],"c":1,"exp":"Condições de trabalho na cadeia de fornecimento integram o pilar social."},{"q":"São exemplos do pilar ambiental, EXCETO:","alts":["Emissão de gases de efeito estufa.","Gestão de resíduos e consumo de água.","Adoção de tecnologias limpas.","Política de diversidade na contratação."],"c":3,"exp":"Diversidade é social. O ambiental trata do impacto sobre o planeta."},{"q":"REDENÇÃO: a sigla ESG corresponde, em português, a:","alts":["Ambiental, Social e Governança (ASG).","Econômico, Social e Governamental.","Ambiental, Sustentável e Global.","Ético, Social e Gerencial."],"c":0,"exp":"Environmental, Social and Governance, traduzido como ASG."}]},{"id":"4.1.2","titulo":"Riscos ESG e Riscos Climáticos","resumo":["RISCO SOCIAL: perdas por violação de direitos e garantias fundamentais ou atos lesivos a interesse comum. Exemplos: assédio, discriminação, trabalho análogo à escravidão, trabalho infantil.","RISCO AMBIENTAL: perdas por eventos ligados à DEGRADAÇÃO do meio ambiente, inclusive uso excessivo de recursos naturais. Exemplos: poluição ilegal do ar, água ou solo, e descumprimento de licenciamento. Caso emblemático: o rompimento da barragem em Mariana.","RISCO CLIMÁTICO DE TRANSIÇÃO: perdas ligadas ao processo de TRANSIÇÃO para economia de baixo carbono. Exemplo: montadora que não se prepara para a eletrificação.","RISCO CLIMÁTICO FÍSICO: perdas por intempéries frequentes e severas ou alterações ambientais de longo prazo. Exemplos: seca, enchente, ciclone, geada, incêndio florestal, aumento do nível do mar, desertificação."],"macete":"TRANSIÇÃO é a mudança de modelo econômico. FÍSICO é o evento da natureza batendo na porta.","pegadinha":"Confundir risco ambiental com risco climático físico. Ambiental é a empresa DEGRADANDO o meio ambiente; físico é o CLIMA causando perda à empresa.","questoes":[{"q":"Uma seguradora registra perdas crescentes com enchentes em determinada região. O risco é climático:","alts":["De transição, pela mudança de padrão econômico.","Físico, por evento climático extremo.","Ambiental, por degradação causada pela empresa.","Social, por afetar comunidades."],"c":1,"exp":"Evento climático extremo atingindo a instituição: risco climático físico."},{"q":"Uma montadora de veículos a combustão perde competitividade diante da eletrificação. Trata-se de risco climático:","alts":["De transição.","Físico.","Social.","Operacional."],"c":0,"exp":"Perda ligada ao processo de transição para uma economia de baixo carbono."},{"q":"O rompimento de barragem de rejeitos com contaminação de rios exemplifica risco:","alts":["Climático físico.","Ambiental.","Social.","De transição."],"c":1,"exp":"Degradação do meio ambiente causada pela atividade da empresa: risco ambiental."},{"q":"REDENÇÃO: casos de assédio e discriminação no ambiente de trabalho configuram risco:","alts":["Ambiental.","Social.","De governança.","Climático de transição."],"c":1,"exp":"Violação de direitos e garantias fundamentais integra o risco social."}]},{"id":"4.1.3","titulo":"Regulação ESG e os 6 Princípios do PRI","resumo":["CMN: norteia a gestão ESG dos regulados por meio da PRSAC (Política de Responsabilidade Social, Ambiental e Climática) e do GRSAC (diretrizes de Gestão de Riscos Social, Ambiental e Climático).","Instituições financeiras devem divulgar o RELATÓRIO GRSAC pelo menos UMA VEZ POR ANO, com data-base em 31/12. A Instrução Normativa BCB nº 153 define as tabelas padronizadas.","CVM: exige que fundos classificados como ESG detalhem critérios, metodologias e indicadores da estratégia.","ANBIMA: autorregulação, com padrões de conduta, transparência e comunicação.","PRI, Princípios para Investimento Responsável, apoiados pela ONU. São SEIS: 1) incorporar ESG na análise e decisão; 2) ser proprietário ativo; 3) buscar divulgação adequada pelas investidas; 4) promover a aceitação dos princípios no setor; 5) trabalhar em conjunto pela eficácia; 6) reportar atividades e progresso."],"macete":"PRSAC é a política, GRSAC é o relatório de risco. GRSAC: 1 vez ao ano, base 31/12, tabelas da IN BCB 153. PRI tem 6 princípios e é da ONU.","pegadinha":"A banca troca o número de princípios do PRI (são seis) ou atribui o GRSAC à CVM. A exigência do GRSAC vem do CMN, com tabelas do Banco Central.","questoes":[{"q":"O relatório GRSAC deve ser divulgado pelas instituições financeiras:","alts":["Trimestralmente, com base no último dia do trimestre.","No mínimo uma vez por ano, com data-base em 31/12.","Semestralmente, conforme decisão do conselho.","Somente quando houver evento de risco relevante."],"c":1,"exp":"Anual, base 31/12, com tabelas padronizadas pela Instrução Normativa BCB nº 153."},{"q":"Os Princípios para Investimento Responsável (PRI) são:","alts":["Quatro, apoiados pelo Banco Mundial.","Seis, apoiados pela Organização das Nações Unidas.","Nove, definidos pela ANBIMA.","Dez, estabelecidos pelo Conselho Monetário Nacional."],"c":1,"exp":"Seis princípios, com apoio da ONU, funcionando como selo de credibilidade junto a institucionais."},{"q":"A sigla PRSAC refere-se à:","alts":["Política de Responsabilidade Social, Ambiental e Climática.","Prestação de Relatórios Setoriais de Ativos Certificados.","Programa de Sustentabilidade e Análise Corporativa.","Padrão de Reporte Socioambiental Consolidado."],"c":0,"exp":"É a política exigida pelo CMN. O GRSAC é a gestão de riscos e o relatório correspondente."},{"q":"REDENÇÃO: o segundo princípio do PRI determina que o investidor deve:","alts":["Reportar o progresso na implementação dos princípios.","Ser proprietário ativo nas práticas de propriedade.","Trabalhar em conjunto para aumentar a eficácia.","Incorporar ESG na análise e na tomada de decisão."],"c":1,"exp":"Proprietário ativo é o princípio 2. Incorporar na análise é o 1 e reportar progresso é o 6."}]},{"id":"4.1.4","titulo":"Investimentos e Fundos ESG","resumo":["Investimento ESG: incorpora critérios ambientais, sociais e de governança na análise e na decisão, buscando conciliar retorno com impacto.","ESTRATÉGIAS mais usadas: EXCLUSÃO (vetar setores controversos como tabaco e armas), BEST IN CLASS (escolher os melhores de cada setor pelo desempenho ESG), INTEGRAÇÃO (embutir fatores ESG na análise financeira tradicional), TEMÁTICA (focar um tema, como energia limpa) e ENGAJAMENTO (usar o poder de voto para influenciar a investida).","FUNDOS IS (Investimento Sustentável): pela regra da CVM, só pode usar a designação o fundo que tenha o objetivo sustentável como propósito CENTRAL, comprovado por critérios, metodologia e indicadores no regulamento.","FUNDO QUE APENAS INTEGRA questões ESG: usa fatores ESG na análise, mas NÃO tem o impacto como objetivo principal. Não pode se apresentar como sustentável.","GREENWASHING: apresentar-se como sustentável sem lastro. É o risco que essas regras combatem."],"macete":"Fundo IS tem o sustentável como OBJETIVO. Fundo que integra ESG apenas USA os critérios. Só o primeiro pode se chamar sustentável.","pegadinha":"A banca chama de sustentável qualquer fundo que mencione ESG. Sem o objetivo central comprovado no regulamento, é apenas integração de fatores.","questoes":[{"q":"Um fundo utiliza fatores ESG na análise de risco, mas seu objetivo declarado é apenas superar o CDI. Ele:","alts":["Pode ser designado como fundo sustentável (IS).","Integra ESG, mas não é fundo sustentável.","Está descumprindo a regulação da CVM.","Deve alterar o regulamento para excluir ESG."],"c":1,"exp":"A designação IS exige o objetivo sustentável como propósito central, com metodologia e indicadores no regulamento."},{"q":"A estratégia que consiste em selecionar as empresas de melhor desempenho ESG dentro de cada setor é a de:","alts":["Exclusão.","Best in class.","Temática.","Engajamento."],"c":1,"exp":"Best in class compara dentro do setor. Exclusão simplesmente veta setores inteiros."},{"q":"Um gestor usa seu poder de voto em assembleia para pressionar a companhia a reduzir emissões. Essa estratégia é a de:","alts":["Integração.","Exclusão.","Engajamento.","Temática."],"c":2,"exp":"Engajamento é influenciar a investida, e conversa diretamente com o princípio 2 do PRI."},{"q":"REDENÇÃO: a prática de se apresentar como sustentável sem lastro real é conhecida como:","alts":["Greenwashing.","Best in class.","Engajamento ativo.","Integração ESG."],"c":0,"exp":"É justamente o que a exigência de critérios, metodologia e indicadores busca coibir."}]}],"boss":[{"q":"A gestão da cadeia de fornecimento para evitar trabalho análogo à escravidão integra o pilar:","alts":["Ambiental.","Social.","Governança.","Climático."],"c":1,"exp":"Relação com fornecedores e condições de trabalho pertencem ao pilar social."},{"q":"Uma empresa perde valor porque não se adaptou à economia de baixo carbono. O risco é:","alts":["Climático físico, por evento natural.","Climático de transição, por mudança econômica.","Ambiental, por degradação causada.","Social, por afetar comunidades locais."],"c":1,"exp":"Transição é a mudança do modelo econômico; físico é o evento natural."},{"q":"O relatório GRSAC tem data-base e periodicidade:","alts":["31/12 e anual.","30/06 e semestral.","31/03 e trimestral.","Data livre e bienal."],"c":0,"exp":"Anual, com base em 31 de dezembro, seguindo as tabelas da IN BCB 153."},{"q":"Os Princípios para Investimento Responsável totalizam:","alts":["Quatro princípios.","Seis princípios.","Nove princípios.","Dez princípios."],"c":1,"exp":"Seis, apoiados pela ONU. Os nove princípios são os do Código de Conduta da ANBIMA."},{"q":"A estratégia ESG que veta integralmente setores como armas e tabaco é a de:","alts":["Best in class.","Exclusão.","Integração.","Engajamento."],"c":1,"exp":"Exclusão elimina setores inteiros da carteira, sem comparar desempenho."},{"q":"Para um fundo receber a designação de sustentável, é necessário que:","alts":["Mencione ESG em seu material de divulgação.","Tenha o objetivo sustentável como propósito central e comprovado.","Invista ao menos 50% em empresas do setor de energia.","Seja gerido por signatário do PRI."],"c":1,"exp":"Critérios, metodologias e indicadores devem constar do regulamento."},{"q":"A poluição ilegal do solo por uma indústria caracteriza risco:","alts":["Climático físico.","Ambiental.","De governança.","De transição."],"c":1,"exp":"Degradação causada pela atividade: risco ambiental."},{"q":"A PRSAC e o GRSAC são exigências originadas:","alts":["Do Conselho Monetário Nacional.","Da Comissão de Valores Mobiliários.","Da ANBIMA, por autorregulação.","Do PRI, vinculado à ONU."],"c":0,"exp":"O CMN norteia a gestão ESG dos regulados, com o BC padronizando o relatório."}]},{"id":"4.2","titulo":"Blockchain, DeFi e Tokenização","subtitulo":"Como se transaciona sem intermediário","niveis":[{"id":"4.2.1","titulo":"Blockchain e Mineração","resumo":["BLOCKCHAIN: registro DISTRIBUÍDO e IMUTÁVEL que armazena dados em blocos encadeados, garantindo transparência sem intermediário.","Cada bloco recebe carimbo de tempo e referência ao bloco anterior, criando uma sequência que não pode ser alterada sem refazer toda a cadeia.","MINERADORES (ou validadores): coletam transações pendentes, verificam a validade por algoritmos e as reúnem em um bloco resolvendo desafios criptográficos baseados em HASH. Recebem recompensa em fração da própria moeda.","POOL de mineração: participantes unem poder computacional para elevar a chance de validar blocos.","HASH: código único que assegura a validade e a segurança do processo.","CUSTO da segurança: consumo elevado de energia e de recursos computacionais, o que encarece transações pequenas no Bitcoin."],"macete":"Distribuído e imutável são as duas palavras-chave. Hash é a impressão digital do bloco. Segurança vem do consumo de energia.","pegadinha":"A banca diz que o blockchain é impossível de fraudar. O material é mais preciso: seria necessário controlar simultaneamente diversos computadores no mundo, algo impraticável, mas não uma impossibilidade lógica.","questoes":[{"q":"A imutabilidade do blockchain decorre principalmente do fato de que:","alts":["Os dados ficam criptografados em servidor único.","Cada bloco referencia o anterior, exigindo refazer toda a cadeia.","Apenas o Banco Central pode validar as transações.","Os registros são apagados após a confirmação."],"c":1,"exp":"O encadeamento com referência ao bloco anterior é o que torna a alteração impraticável."},{"q":"O papel do minerador na rede é:","alts":["Emitir novas unidades por decisão própria.","Validar transações e resolver desafios criptográficos.","Custodiar as chaves privadas dos usuários da rede.","Definir o preço de mercado do criptoativo."],"c":1,"exp":"Validação e registro, remunerados por recompensa em fração da moeda."},{"q":"O código único que assegura a validade e a segurança de cada transação é o:","alts":["Token.","Hash.","Smart contract.","Endereço público."],"c":1,"exp":"Hash funciona como impressão digital do bloco e da transação."},{"q":"REDENÇÃO: o custo associado à segurança do modelo de mineração é:","alts":["A necessidade de aprovação prévia de um órgão central regulador.","O elevado consumo de energia e de recursos computacionais.","A obrigatoriedade de identificação completa dos usuários.","A limitação do número de participantes na rede."],"c":1,"exp":"É o que torna pequenas transações em Bitcoin caras e nem sempre práticas."}]},{"id":"4.2.2","titulo":"Smart Contracts e suas Aplicações","resumo":["SMART CONTRACT: programa AUTOEXECUTÁVEL que reside na blockchain e entra em vigor assim que determinadas condições são atendidas. Não depende de vontade das partes depois de implantado.","Três componentes: as CONDIÇÕES pré-definidas em código, o GATILHO que verifica se elas ocorreram, e a EXECUÇÃO automática da consequência.","A imutabilidade do código garante que as cláusulas não sejam alteradas depois, o que gera confiança entre partes que não se conhecem.","APLICAÇÕES: EMPRÉSTIMO (libera fundos quando a garantia digital é depositada e calcula juros automaticamente); IMOBILIÁRIO (retém o pagamento até a confirmação do registro, dispensando corretor e cartório); SEGUROS (apólice automatizada que paga a indenização quando o evento é comprovado por fonte externa, como um índice de chuva).","DEX, Exchange Descentralizada: negociação direta entre usuários, sem entidade central. Exige mais conhecimento técnico e traz maior risco regulatório.","DAO, Organização Autônoma Descentralizada: governança em que as decisões são tomadas por votação dos detentores de tokens e executadas por smart contracts, sem diretoria."],"macete":"Smart contract é o 'se isto, então aquilo' com dinheiro dentro. DEX negocia sem corretora; DAO decide sem diretoria.","pegadinha":"A banca diz que o smart contract pode ser renegociado pelas partes. Não pode: depois de implantado, o código executa sozinho e é imutável.","questoes":[{"q":"A característica que define o smart contract é:","alts":["Exigir homologação em cartório digital.","Executar-se automaticamente quando as condições são atendidas.","Permitir renegociação a qualquer tempo pelas partes.","Depender de validação prévia do Banco Central."],"c":1,"exp":"Autoexecutável e imutável: essa é a fonte da confiança entre desconhecidos."},{"q":"Uma organização em que as decisões são votadas pelos detentores de tokens e executadas por código, sem diretoria, é uma:","alts":["DEX.","DAO.","CBDC.","Stablecoin."],"c":1,"exp":"DAO, organização autônoma descentralizada. DEX é ambiente de negociação."},{"q":"Numa compra e venda de imóvel intermediada por smart contract, o pagamento:","alts":["É liberado no ato da assinatura do contrato.","Fica retido até a confirmação do registro de propriedade.","É dividido em parcelas definidas pelo comprador.","Depende de aprovação de um corretor credenciado."],"c":1,"exp":"A retenção condicionada embute a garantia no próprio protocolo, dispensando corretor e cartório."},{"q":"REDENÇÃO: uma exchange descentralizada (DEX) caracteriza-se por:","alts":["Custodiar os ativos dos usuários em nome próprio.","Permitir negociação direta, sem entidade central.","Exigir cadastro completo e comprovação de renda.","Ser regulada diretamente pelo Banco Central."],"c":1,"exp":"Sem intermediário, com mais liberdade, mais risco regulatório e exigência de conhecimento técnico."}]},{"id":"4.2.3","titulo":"DeFi x CeFi","resumo":["Nove aspectos comparados. Decore a tabela, ela cai inteira.","CONTROLE: CeFi nas instituições financeiras. DeFi nos contratos inteligentes.","INTERMEDIÁRIOS: CeFi necessários. DeFi eliminados (peer to peer).","SEGURANÇA: CeFi depende da solidez da empresa. DeFi baseada na arquitetura do blockchain.","PRIVACIDADE: CeFi exige identificação (KYC). DeFi anônimo ou pseudônimo, o que preocupa quanto à lavagem de dinheiro.","TRANSPARÊNCIA: CeFi limitada e definida por regulação. DeFi total, com registro público.","TAXAS: CeFi maiores. DeFi menores.","REGULAÇÃO: CeFi amplamente regulada. DeFi pouca ou nenhuma.","VELOCIDADE: CeFi pode ser lenta (Pix é rápido no país, mas remessa internacional leva dias). DeFi tende a ser rápida, em segundos ou minutos, sem fronteiras.","ACESSIBILIDADE: CeFi com restrições regulatórias. DeFi aberta a qualquer um com internet."],"macete":"DeFi ganha em taxa, velocidade, transparência e acesso. CeFi ganha em regulação e proteção. Privacidade é vantagem da DeFi e problema ao mesmo tempo.","pegadinha":"A banca diz que a DeFi tem menos transparência por ser anônima. São coisas diferentes: a IDENTIDADE é pseudônima, mas a TRANSAÇÃO é pública e total.","questoes":[{"q":"Sobre a transparência e a privacidade nas finanças descentralizadas, é CORRETO afirmar:","alts":["Transações e identidades são públicas e rastreáveis.","As transações são públicas, mas as identidades são pseudônimas.","Transações e identidades permanecem sigilosas.","As transações são sigilosas e as identidades, públicas."],"c":1,"exp":"Registro público total de operações, com endereços criptográficos no lugar de nomes."},{"q":"Comparando os dois modelos, a segurança na DeFi está ancorada:","alts":["Na solidez patrimonial da corretora.","Na arquitetura descentralizada e imutável do blockchain.","Na garantia do Fundo Garantidor de Créditos.","Na supervisão direta do Banco Central."],"c":1,"exp":"Na CeFi a segurança depende da empresa; na DeFi, da própria arquitetura da rede."},{"q":"A preocupação regulatória gerada pelo pseudonimato das transações em DeFi refere-se principalmente:","alts":["À volatilidade dos preços dos ativos.","Ao uso para lavagem de dinheiro.","À lentidão das liquidações internacionais.","Ao custo elevado das taxas de rede."],"c":1,"exp":"Ausência de identificação completa dificulta o KYC e favorece atividades ilícitas."},{"q":"REDENÇÃO: quanto a taxas e velocidade, o material aponta que a DeFi tende a apresentar:","alts":["Taxas maiores e velocidade menor.","Taxas menores e velocidade maior.","Taxas e velocidade equivalentes à CeFi.","Taxas menores e velocidade menor."],"c":1,"exp":"Sem intermediários, o custo cai e a liquidação ocorre em segundos ou minutos, sem fronteiras."}]},{"id":"4.2.4","titulo":"Tokenização e Tipos de Token","resumo":["TOKEN: código que representa valor ou direitos econômicos. Cada token corresponde a uma FRAÇÃO do ativo subjacente, registrada em blockchain e movimentada por smart contract.","TIPOS DE TOKEN: de PAGAMENTO (funciona como meio de troca, caso do Bitcoin); de UTILIDADE (dá acesso a um produto ou serviço da plataforma); LASTREADO EM ATIVO ou security token (representa um ativo real, como imóvel, ouro ou recebível, e tende a ser tratado como valor mobiliário); e NÃO FUNGÍVEL, o NFT (único e insubstituível).","FRACIONAMENTO: um imóvel de R$ 500.000 pode virar 50 tokens de R$ 10.000, abrindo o ativo a investidores de qualquer porte.","VANTAGEM EM CRÉDITO: no modelo tradicional o imóvel fica integralmente alienado. Tokenizado, o proprietário oferece só a FRAÇÃO necessária como garantia, liberando o restante.","QUATRO VANTAGENS: liquidez (ativos ilíquidos passam a girar), transparência e segurança (registro imutável), redução de custos (menos intermediários) e acessibilidade (frações acessíveis).","RISCOS E DESAFIOS: segurança (perda de chave privada, ataque a plataforma), regulação (enquadramento como valor mobiliário) e tecnologia (falha de código no smart contract)."],"macete":"Pagamento, Utilidade, Lastreado e NFT. O fracionamento é a chave: divide o ativo e libera a garantia parcial.","pegadinha":"A banca confunde token lastreado com NFT. O lastreado é FUNGÍVEL e representa fração de um ativo real; o NFT é ÚNICO e insubstituível.","questoes":[{"q":"Um imóvel de R$ 800.000 é tokenizado em 80 partes iguais. A principal vantagem para o proprietário que busca crédito é:","alts":["Obter juros menores por ter mais garantias.","Poder oferecer apenas a fração necessária como garantia.","Ficar isento de alienação fiduciária.","Dispensar a avaliação do imóvel pelo credor."],"c":1,"exp":"No modelo tradicional o bem inteiro fica alienado; tokenizado, apenas a fração necessária é comprometida."},{"q":"Um token que dá acesso a serviços dentro de uma plataforma é classificado como token:","alts":["De pagamento.","De utilidade.","Lastreado em ativo.","Não fungível."],"c":1,"exp":"Utility token dá acesso a produto ou serviço, sem representar meio de troca nem ativo real."},{"q":"São vantagens da tokenização apontadas no material, EXCETO:","alts":["Aumento da liquidez de ativos pouco negociáveis.","Registro transparente e imutável das operações.","Eliminação completa do risco de mercado do ativo.","Acesso a frações por investidores de menor porte."],"c":2,"exp":"Tokenizar muda a forma de negociar, não elimina a oscilação de preço do ativo subjacente."},{"q":"REDENÇÃO: entre os riscos da tokenização, o material destaca:","alts":["Segurança, regulação e tecnologia.","Inflação, câmbio e juros.","Liquidez, crédito e mercado.","Operacional, legal e de imagem."],"c":0,"exp":"Perda de chave e ataques (segurança), enquadramento regulatório e falha de código (tecnologia)."}]},{"id":"4.2.5","titulo":"Criptomoedas: negociação e custódia","resumo":["CRIPTOMOEDA: ativo digital que usa criptografia e NÃO depende de emissor centralizado. A criptografia garante três propriedades: CONFIDENCIALIDADE, INTEGRIDADE e AUTENTICIDADE.","Funções: meio de troca, reserva de valor e, em alguns casos, unidade de conta.","QUATRO FORMAS DE NEGOCIAÇÃO: EXCHANGE CENTRALIZADA (mais comum, boa liquidez, custódia da corretora, exposta a falência e ataque; se nacional, é regulada pelo Banco Central); EXCHANGE DESCENTRALIZADA (negociação direta, mais risco regulatório); P2P (direto entre pessoas, flexível e mais arriscado); e ATM DE CRIPTOMOEDAS (troca por dinheiro físico, ainda raros no Brasil).","CUSTÓDIA, da menos para a mais segura: NA EXCHANGE (mais simples e menos segura, sem controle direto dos ativos); HOT WALLET (software conectado à internet, boa para pequenas quantias e uso frequente, sujeita a invasão); COLD WALLET (dispositivo físico offline, tipo pen drive, maior segurança contra ataque cibernético).","CHAVE PRIVADA: funciona como a senha que assina as transações. Perder o controle dela equivale a perder os fundos."],"macete":"Quente está na internet e é prática; fria está offline e é segura. Quem tem a chave privada tem a moeda.","pegadinha":"A banca trata a custódia na exchange como a mais segura, por ser profissional. É a MENOS segura, porque o investidor não tem controle direto dos ativos.","questoes":[{"q":"A forma de custódia que oferece maior proteção contra ataques cibernéticos é:","alts":["A custódia na própria exchange.","A hot wallet com autenticação de dois fatores.","A cold wallet, dispositivo físico offline.","A negociação peer-to-peer."],"c":2,"exp":"Estar offline é o que protege. A custódia na exchange é a mais simples e a menos segura."},{"q":"As três propriedades asseguradas pela criptografia nas criptomoedas são:","alts":["Liquidez, rentabilidade e segurança.","Confidencialidade, integridade e autenticidade.","Transparência, anonimato e velocidade.","Emissão, custódia e liquidação."],"c":1,"exp":"Confidencialidade protege o dado, integridade impede alteração e autenticidade valida a origem."},{"q":"Sobre a exchange centralizada nacional, é CORRETO afirmar:","alts":["É regulada pelo Banco Central e mantém a custódia dos ativos.","É regulada pela CVM e o usuário mantém as chaves privadas.","Opera sem qualquer identificação dos usuários.","Dispensa o investidor de qualquer risco de contraparte."],"c":0,"exp":"Regulação pelo BC e custódia da corretora, o que expõe o investidor a falência e ataques."},{"q":"REDENÇÃO: perder o controle da chave privada significa:","alts":["Precisar solicitar nova senha à exchange.","Perder o acesso aos fundos custodiados.","Ter as transações revertidas automaticamente.","Bloquear temporariamente a carteira."],"c":1,"exp":"A chave privada assina as transações. Sem ela, não há recuperação possível."}]}],"boss":[{"q":"O componente que torna a alteração de um registro em blockchain impraticável é:","alts":["A criptografia da chave privada.","O encadeamento de cada bloco ao anterior.","A supervisão de um órgão regulador.","O uso de contratos inteligentes."],"c":1,"exp":"Alterar um bloco exigiria refazer toda a cadeia em diversos computadores simultaneamente."},{"q":"Na comparação DeFi x CeFi, a DeFi apresenta:","alts":["Taxas maiores e regulação ampla.","Taxas menores e pouca ou nenhuma regulação.","Taxas menores e regulação ampla.","Taxas maiores e nenhuma regulação."],"c":1,"exp":"Sem intermediário o custo cai, mas a proteção regulatória praticamente desaparece."},{"q":"Um contrato que libera automaticamente a indenização quando um índice de chuva atinge determinado nível é exemplo de:","alts":["Tokenização de ativo real.","Apólice automatizada por smart contract.","Exchange descentralizada.","Organização autônoma descentralizada."],"c":1,"exp":"Condição verificável mais execução automática: aplicação de smart contract em seguros."},{"q":"O token que representa fração de um ativo real, como um imóvel, é o token:","alts":["De utilidade, que dá acesso a serviços.","Lastreado em ativo, o security token.","De pagamento, usado como meio de troca.","Não fungível, único e insubstituível."],"c":1,"exp":"Também chamado de security token, tende a ser tratado como valor mobiliário."},{"q":"A custódia de criptoativos considerada menos segura é:","alts":["A cold wallet offline.","A custódia na exchange.","A hot wallet em celular.","A carteira em papel."],"c":1,"exp":"O usuário não tem controle direto dos ativos e fica exposto a falência e ataque à corretora."},{"q":"Uma DAO caracteriza-se por:","alts":["Negociar criptoativos sem entidade central.","Decidir por votação dos detentores de tokens.","Emitir moeda digital com lastro soberano.","Custodiar as chaves privadas de forma coletiva."],"c":1,"exp":"Governança descentralizada, sem diretoria, com execução por smart contract."},{"q":"O principal ganho da tokenização para o pequeno investidor é:","alts":["A isenção de imposto sobre o ganho.","O acesso a frações de ativos de alto valor.","A gar
