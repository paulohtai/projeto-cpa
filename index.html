<script>

const MODULOS=[{id:"1",nome:'Estrutura e Dinâmica do SFN',subtitulo:'Como a máquina do sistema financeiro gira',peso:20,blocos:[{"id":"1.1","titulo":"Macroeconomia e Indicadores","subtitulo":"Como a economia respira: PIB, juros, inflação e câmbio","niveis":[{"id":"1.1.1","titulo":"Fluxo Circular da Renda","resumo":["Modelo que mostra como dinheiro e bens circulam na economia. Lógica central: todo gasto de um agente é a renda de outro.","Famílias: fornecem trabalho e são as consumidoras finais. Base da geração de renda.","Empresas: transformam recursos e trabalho em bens e serviços, gerando renda com as vendas.","Governo: arrecada impostos e faz gastos públicos, redistribuindo renda e influenciando a atividade econômica.","Mercado: conecta os agentes, facilitando transações, crédito e investimentos, realocando recursos com eficiência."],"macete":"F.E.G.M.: Famílias trabalham, Empresas produzem, Governo redistribui, Mercado conecta.","pegadinha":"A banca troca os papéis: dirá que empresas fornecem trabalho ou que o governo é o consumidor final. O quarto agente aqui é o Mercado, que conecta e realoca, não produz nem consome.","questoes":[{"q":"Um indivíduo paga R$ 50 por um serviço de barbearia. Sob a ótica do fluxo circular da renda:","alts":["O valor sai do fluxo, pois foi consumido e deixa de circular.","O gasto do indivíduo é, ao mesmo tempo, renda do prestador.","A transação só integra o fluxo se houver recolhimento de tributos.","O pagamento é renda da família e gasto da empresa prestadora."],"c":1,"exp":"Cada gasto de um agente é a renda de outro. Nada sai do fluxo, tributo não é condição, e aqui a família gasta e o prestador recebe."},{"q":"Sobre os quatro agentes do fluxo circular da renda, é CORRETO afirmar:","alts":["As famílias fornecem capital às empresas e são as principais produtoras de bens.","O governo atua exclusivamente arrecadando impostos, sem influenciar a atividade econômica.","O mercado conecta os agentes, facilitando transações, crédito e investimentos, e realoca recursos com eficiência.","As empresas provêm trabalho em troca de renda, gasta em bens e serviços."],"c":2,"exp":"Função do mercado: conectar e realocar. Famílias fornecem trabalho, o governo também gasta, e quem provê trabalho em troca de renda são as famílias."},{"q":"O governo anuncia grande investimento em infraestrutura hospitalar. Pelo fluxo circular da renda, o efeito esperado é:","alts":["Redução do fluxo, pois gasto público retira recursos do consumo das famílias.","Geração de empregos cuja renda será gasta em outros setores, realimentando o fluxo.","Aumento de renda apenas no setor de saúde, sem transbordamento.","Substituição do papel do mercado pelo governo."],"c":1,"exp":"O gasto público gera empregos e essa renda é gasta em outros setores, mantendo o sistema fluindo."},{"q":"REDENÇÃO: no modelo do fluxo circular da renda, a base da geração de renda na economia é constituída:","alts":["Pelas empresas, que pagam salários.","Pelo governo, que redistribui renda via impostos.","Pelas famílias, fornecedoras de trabalho e consumidoras finais.","Pelo mercado, que processa os pagamentos."],"c":2,"exp":"A apostila é literal: as famílias são a base da geração de renda."}]},{"id":"1.1.2","titulo":"Mercado Financeiro e Subdivisões","resumo":["O mercado financeiro liga poupadores (excesso de recursos) a tomadores (necessidade de recursos) e se divide em quatro partes.","Monetário: curtíssimo prazo, negociação de liquidez entre bancos e o Banco Central (inclui o dinheiro circulando, como o PIX).","Crédito: empréstimos e financiamentos a indivíduos e empresas, promovendo consumo e produção.","Cambial: compra e venda de moedas estrangeiras, viabilizando comércio e investimento internacional.","Capitais: captações e investimentos de LONGO prazo via ações, debêntures e outros valores mobiliários."],"macete":"MO-CRE-CAM-CAP. Monetário é o mais curto, Capitais é o mais longo. Os extremos definem os prazos.","pegadinha":"A banca inverte prazos: dirá que o mercado de capitais é de curto prazo ou que o monetário financia projetos longos. Curtíssimo prazo = monetário. Longo prazo + valores mobiliários = capitais.","questoes":[{"q":"Um empreendedor sem capital obtém financiamento bancário para expandir o negócio. Essa operação ocorre no mercado:","alts":["Monetário.","De crédito.","De capitais.","Cambial."],"c":1,"exp":"Empréstimos e financiamentos a indivíduos e empresas são o núcleo do mercado de crédito."},{"q":"Assinale a associação CORRETA entre subdivisão e característica:","alts":["Mercado monetário: captações de longo prazo via debêntures.","Mercado cambial: negociação de liquidez entre bancos e o BC.","Mercado de capitais: instrumentos de longo prazo como ações e debêntures.","Mercado de crédito: troca de moedas para importação."],"c":2,"exp":"Capitais = longo prazo + valores mobiliários."},{"q":"Um importador precisa trocar reais por moeda estrangeira para pagar máquinas compradas no exterior. Ele recorre ao mercado:","alts":["De capitais.","Monetário.","De crédito.","Cambial."],"c":3,"exp":"Troca de moeda local por estrangeira para comércio internacional é a função do mercado cambial."},{"q":"REDENÇÃO: a negociação de liquidez no curtíssimo prazo entre bancos e o Banco Central caracteriza o mercado:","alts":["Monetário.","De crédito.","De capitais.","Cambial."],"c":0,"exp":"Curtíssimo prazo + liquidez + bancos e BC = mercado monetário."}]},{"id":"1.1.3","titulo":"PIB e Seus Componentes","resumo":["PIB: valor total de bens e serviços FINAIS produzidos DENTRO das fronteiras do país num período (geralmente um ano).","Ótica da demanda: PIB = C + I + G + NX, onde NX = exportações menos importações (X - M).","I é o investimento das empresas: formação bruta de capital fixo (fábricas, máquinas).","Ótica da produção: PIB = A + S + I (Agropecuária + Serviços + Indústria).","Tipos divulgados pelo IBGE: Nominal (valor corrente), Real (desconta a inflação) e per capita (dividido pela população).","Queda do PIB por dois trimestres seguidos = recessão técnica."],"macete":"Demanda: C + I + G + NX. Produção: A-S-I. Real = sem inflação.","pegadinha":"Três armadilhas: bens INTERMEDIÁRIOS não entram, só finais; 'I' é capital fixo produtivo, não aplicação financeira; recessão técnica exige DOIS trimestres seguidos de queda.","questoes":[{"q":"Pela ótica da demanda, compõe o cálculo do PIB:","alts":["A compra de ações da Petrobras por um investidor pessoa física.","A construção de uma nova linha de montagem por uma montadora.","A venda de aço de uma siderúrgica para uma montadora (insumo).","A produção de uma fábrica brasileira instalada no exterior."],"c":1,"exp":"Formação bruta de capital fixo é o componente I. Aplicação financeira não é produção, insumo é bem intermediário e produção fora das fronteiras não é PIB."},{"q":"Um país registra: C = 500, I = 200, G = 150, exportações = 120, importações = 170. O PIB pela ótica da demanda é:","alts":["1.140","800","850","900"],"c":1,"exp":"PIB = 500 + 200 + 150 + (120 - 170) = 850 - 50 = 800. NX negativo REDUZ o PIB."},{"q":"Sobre as medidas do PIB divulgadas pelo IBGE, é CORRETO afirmar:","alts":["O PIB Real é o valor produzido em termos correntes, sem ajustes.","O PIB per capita é o valor produzido descontada a inflação do período.","O PIB Nominal desconta a inflação para permitir comparação entre anos.","O PIB Real desconta a inflação do período do valor produzido no país."],"c":3,"exp":"Real = desconta inflação. Nominal = termos correntes. Per capita = dividido pelo número de habitantes."},{"q":"REDENÇÃO: pela ótica da produção, o PIB é obtido pela soma:","alts":["Consumo + Investimento + Gastos do governo.","Agropecuária + Serviços + Indústria.","Exportações + Importações + Consumo.","Salários + Lucros + Impostos."],"c":1,"exp":"Produção: PIB = A + S + I. C + I + G + NX é a ótica da DEMANDA."}]},{"id":"1.1.4","titulo":"Taxa de Desemprego","resumo":["Mede a porcentagem da população economicamente ativa SEM emprego mas em BUSCA ATIVA de ocupação. Calculada pelo IBGE.","Quem desistiu de procurar ou vive de outras rendas (aluguéis) NÃO conta como desempregado.","Desemprego alto: menor renda, menor consumo, menor investimento, menor produção, PIB desacelera.","Desemprego muito baixo: salários sobem para atrair mão de obra escassa, gerando pressão inflacionária.","Pleno emprego: taxa baixa, mas não tão baixa que dispare a inflação."],"macete":"Sem emprego + PROCURANDO = desempregado. Desistiu = invisível para a taxa. Desemprego baixo demais = inflação.","pegadinha":"A banca coloca quem desistiu de procurar como desempregado. Não é. E vai sugerir que desemprego baixíssimo é sempre bom: a apostila diz que gera pressão inflacionária.","questoes":[{"q":"Carlos, 35 anos, desistiu de procurar emprego há 8 meses e vive de aluguéis. Para a metodologia do IBGE, ele é:","alts":["Desempregado, pois está sem ocupação formal há mais de seis meses.","Desempregado de longa duração, por estar fora do mercado há meses.","Não contabilizado como desempregado, pois não procura trabalho.","Subempregado, pois obtém renda de fonte diferente do trabalho."],"c":2,"exp":"A taxa só conta quem está em idade ativa E procurando trabalho."},{"q":"Uma economia opera com taxa de desemprego extremamente baixa. O efeito esperado, segundo o material, é:","alts":["Queda generalizada de preços, pela maior oferta de mão de obra.","Redução do consumo das famílias, pela cautela com o emprego.","Desaceleração do PIB, pela escassez de trabalhadores disponíveis.","Alta de salários para atrair mão de obra escassa, pressionando preços."],"c":3,"exp":"Com pouca mão de obra disponível, empresas elevam salários, o que pode inflacionar preços."},{"q":"REDENÇÃO: o conceito de pleno emprego corresponde a:","alts":["Taxa de desemprego igual a zero.","Taxa baixa, mas não a ponto de causar inflação desenfreada.","Situação em que todos os desalentados voltam a procurar emprego.","Taxa definida internacionalmente em 5%."],"c":1,"exp":"Pleno emprego não é desemprego zero: é o equilíbrio sem disparar a inflação."}]},{"id":"1.1.5","titulo":"Índices de Inflação","resumo":["Inflação: variação média dos preços de bens e serviços ao longo do tempo. Mede o poder de compra da moeda.","IPCA (IBGE): índice OFICIAL, usado no sistema de metas. Baseado na POF, famílias de 1 a 40 salários mínimos. Apuração do dia 1 ao 30, divulgação até o dia 10 do mês seguinte.","IGP-M (FGV, privada): 60% IPA (atacado) + 30% IPC (consumidor) + 10% INCC (construção). Indexador clássico de aluguel.","IPC-FIPE: famílias de 1 a 10 salários mínimos, só na cidade de São Paulo."],"macete":"IGP-M = 60-30-10 (Atacado-Consumidor-Construção). IPCA = 1 a 40 SM, oficial. FIPE = 1 a 10 SM, SP.","pegadinha":"A banca troca as faixas de renda (1-40 do IPCA vs 1-10 do FIPE) e o calculador (IPCA é IBGE, IGP-M é FGV). O componente que domina o IGP-M é o IPA, com 60%.","questoes":[{"q":"Sobre o IPCA, assinale a CORRETA:","alts":["É apurado pelo IBGE com base na POF, para famílias de 1 a 10 salários mínimos.","É apurado pela FGV com base na POF, para famílias de 1 a 40 salários.","É apurado pelo IBGE com base na POF, para famílias de 1 a 40 salários.","É apurado pelo IBGE com base no IPA, para famílias de 1 a 40 salários."],"c":2,"exp":"IPCA: IBGE, oficial, POF, 1 a 40 SM. Divulgação até o dia 10 do mês SUBSEQUENTE."},{"q":"Um contrato de aluguel é reajustado pelo IGP-M. Num período de forte alta dos preços no atacado, o inquilino deve esperar:","alts":["Pouco impacto, pois o atacado pesa 10% no índice.","Reajuste pressionado, pois o IPA responde por 60% da composição do IGP-M.","Reajuste idêntico ao IPCA, pois ambos medem o consumidor.","Congelamento, pois o INCC anula o efeito do atacado."],"c":1,"exp":"IGP-M = 60% IPA + 30% IPC + 10% INCC. O atacado domina o índice."},{"q":"O índice que reflete a inflação de famílias com renda de 1 a 10 salários mínimos exclusivamente na cidade de São Paulo é:","alts":["Índice Nacional de Preços ao Consumidor Amplo (IPCA)","Índice Geral de Preços do Mercado (IGP-M)","Índice Nacional de Custo da Construção (INCC)","Índice de Preços ao Consumidor da Fipe (IPC-Fipe)"],"c":3,"exp":"IPC-FIPE: 1 a 10 SM, cidade de São Paulo."},{"q":"REDENÇÃO: a composição do IGP-M é:","alts":["60% IPC + 30% IPA + 10% INCC.","60% IPA + 30% IPC + 10% INCC.","50% IPA + 40% IPC + 10% INCC.","60% INCC + 30% IPA + 10% IPC."],"c":1,"exp":"Grave o 60-30-10 na ordem Atacado, Consumidor, Construção."}]},{"id":"1.1.6","titulo":"Câmbio: Nominal, Real, PTAX, Turismo e Comercial","resumo":["Taxa de câmbio: preço de uma moeda em relação a outra.","Nominal: o valor visto na mídia diariamente, sem ajuste por inflação.","Real: a nominal ajustada pela inflação dos dois países. Mostra o poder de compra relativo.","PTAX: calculada pelo Banco Central, referência oficial. Média das taxas de compra e venda do dólar no interbancário, apurada 4 vezes ao dia.","Turismo: transações individuais e pequenas, taxas menos favoráveis pela margem dos bancos. Comercial: importação e exportação, taxas mais competitivas.","Real valorizado: importar fica barato, exportar fica caro. Real desvalorizado: o oposto."],"macete":"PTAX = BC + média compra/venda + 4x ao dia. Turismo é caro, Comercial é competitivo.","pegadinha":"A banca atribui a PTAX à B3 ou diz que é apurada uma vez ao dia. Não: Banco Central, 4 vezes ao dia. E real VALORIZADO prejudica o EXPORTADOR.","questoes":[{"q":"Sobre a Taxa PTAX, é CORRETO afirmar:","alts":["Calculada pela B3, com base no câmbio turismo, uma vez ao dia.","Calculada pelo BC, com base no câmbio turismo, quatro vezes ao dia.","Calculada pelo BC, com base no interbancário, quatro vezes ao dia.","Calculada pelo BC, com base no interbancário, uma vez ao dia."],"c":2,"exp":"PTAX: BC, média de compra e venda no interbancário, 4 apurações diárias."},{"q":"O real se valoriza fortemente frente ao dólar. Para um exportador de café brasileiro, o efeito é:","alts":["Produtos mais competitivos no exterior.","Produtos mais caros lá fora, com possível queda nas vendas.","Aumento imediato da receita em reais.","Nenhum efeito, pois exportação usa câmbio turismo."],"c":1,"exp":"Real valorizado encarece o produto brasileiro no exterior. Exportação usa câmbio comercial."},{"q":"REDENÇÃO: a taxa de câmbio que ajusta a nominal pela inflação dos dois países, mostrando o poder de compra relativo, é a:","alts":["PTAX.","Taxa real.","Taxa comercial.","Taxa turismo."],"c":1,"exp":"Nominal = preço direto de troca. Real = ajustada pela inflação dos dois países."}]},{"id":"1.1.7","titulo":"Políticas Econômicas","resumo":["Política econômica: conjunto de ações do governo para influenciar o desempenho da economia. Três frentes.","Fiscal: arrecadação de impostos e gastos públicos. Mexe direto na renda disponível das famílias.","Monetária: conduzida pelo Banco Central. Controla oferta de moeda e taxa de juros.","Cambial: administra o valor da moeda nacional frente às estrangeiras, afetando comércio exterior e fluxo de capitais."],"macete":"FI-MO-CA: FIscal (impostos e gastos), MOnetária (moeda e juros, BC), CAmbial (valor da moeda).","pegadinha":"A banca mistura os responsáveis: dirá que a política fiscal é do Banco Central. Não: quem arrecada e gasta é o governo.","questoes":[{"q":"O governo eleva a alíquota do imposto de renda, reduzindo a renda disponível das famílias. Trata-se de instrumento de política:","alts":["Monetária.","Cambial.","Fiscal.","Creditícia."],"c":2,"exp":"Arrecadação de impostos e gastos públicos = política fiscal."},{"q":"O Banco Central reduz a taxa de juros, barateando o crédito e aumentando o dinheiro em circulação. O risco apontado pelo material é:","alts":["Deflação imediata, pela maior oferta de moeda em circulação.","Aumento da demanda, com possível alta geral de preços.","Queda do consumo das famílias, pelo encarecimento do crédito.","Valorização do real, pela entrada de capital estrangeiro."],"c":1,"exp":"Mais dinheiro circulando eleva a demanda, o que pode gerar inflação."},{"q":"REDENÇÃO: a política que administra o valor da moeda nacional em relação às estrangeiras é a:","alts":["Fiscal.","Monetária.","Cambial.","Tributária."],"c":2,"exp":"Definição literal de política cambial."}]},{"id":"1.1.8","titulo":"Política Fiscal","resumo":["Receitas do governo: tributos (IR, PIS, COFINS), concessões, dividendos de estatais e venda de ativos (receita NÃO recorrente).","Despesas: pessoal (servidores), sociais (Bolsa Família), manutenção de ativos e investimentos.","Resultado PRIMÁRIO = Receitas primárias menos Despesas primárias.","Resultado NOMINAL = Resultado primário menos o pagamento líquido de juros.","Dívida/PIB: indicador da saúde fiscal. Alta relação gera desconfiança e investidores exigem juros maiores."],"macete":"Primário ignora juros. Nominal = primário com juros descontados. Venda de ativos = dinheiro que entra UMA vez só.","pegadinha":"A pegadinha número um: incluir juros no resultado primário. Juros só entram no NOMINAL. E venda de ativos aparece como receita recorrente: é não recorrente.","questoes":[{"q":"Um governo arrecada R$ 10.000 em receitas primárias, gasta R$ 8.000 em despesas primárias e paga R$ 1.000 de juros. Os resultados primário e nominal são, respectivamente:","alts":["R$ 2.000 e R$ 1.000.","R$ 1.000 e R$ 2.000.","R$ 2.000 e R$ 3.000.","R$ 1.000 e R$ 1.000."],"c":0,"exp":"Primário = 10.000 - 8.000 = 2.000. Nominal = 2.000 - 1.000 = 1.000."},{"q":"São receitas do governo, EXCETO:","alts":["Dividendos recebidos de empresas como Petrobras e Banco do Brasil.","Concessão do direito de operar uma linha de metrô.","Pagamento de salários de professores e policiais.","Venda de participações em empresas."],"c":2,"exp":"Salário de servidor é DESPESA com pessoal."},{"q":"Um país apresenta relação dívida/PIB elevada. A consequência provável é:","alts":["Investidores exigem juros maiores para financiar o governo.","O Banco Central reduz a Selic para aliviar o custo da dívida.","O governo amplia sua capacidade de investir em infraestrutura.","A moeda nacional se valoriza, pela entrada de capital externo."],"c":0,"exp":"Dívida/PIB alta desperta desconfiança e os credores cobram mais juros."},{"q":"REDENÇÃO: a diferença entre o resultado primário e o resultado nominal é:","alts":["O primário considera receitas não recorrentes e o nominal não.","O nominal desconta os juros líquidos e o primário os ignora.","O primário é apurado mensalmente e o nominal, anualmente.","O nominal considera só tributos e o primário, todas as receitas."],"c":1,"exp":"Os juros são a única diferença entre os dois resultados."}]},{"id":"1.1.9","titulo":"Políticas Monetárias (Visão Geral)","resumo":["Conjunto de ações do Banco Central para controlar a quantidade de dinheiro em circulação e regular juros.","Os 4 instrumentos: Taxa Selic, Depósito Compulsório, Redesconto e Open Market.","EXPANSIONISTA (aumenta liquidez): reduz Selic, reduz compulsório, reduz redesconto, COMPRA títulos, reduz impostos.","RESTRITIVA (diminui liquidez): aumenta Selic, aumenta compulsório, aumenta redesconto, VENDE títulos, aumenta impostos."],"macete":"Expandir = encher a piscina de dinheiro (tudo cai, BC compra). Restringir = esvaziar (tudo sobe, BC vende).","pegadinha":"No open market a banca inverte o verbo: quando o BC COMPRA títulos, ele INJETA dinheiro. O BC paga na compra, logo o dinheiro vai para o mercado.","questoes":[{"q":"O Banco Central deseja adotar política monetária expansionista. Conjunto de ações coerente:","alts":["Aumentar a Selic, aumentar o compulsório e vender títulos públicos.","Reduzir a Selic, reduzir o compulsório e comprar títulos públicos.","Reduzir a Selic, aumentar o compulsório e vender títulos públicos.","Aumentar a Selic, reduzir o redesconto e comprar títulos públicos."],"c":1,"exp":"Expandir = aumentar liquidez: tudo cai e o BC compra títulos."},{"q":"São os quatro instrumentos de política monetária apresentados no material:","alts":["Selic, IPCA, câmbio e impostos.","Selic, compulsório, redesconto e open market.","Compulsório, PTAX, IGP-M e Selic.","Open market, concessões, dividendos e Selic."],"c":1,"exp":"Impostos são política FISCAL, câmbio é política CAMBIAL."},{"q":"REDENÇÃO: numa política monetária restritiva, o Banco Central, no open market, deve:","alts":["Comprar títulos públicos, injetando liquidez.","Vender títulos públicos, retirando dinheiro de circulação.","Suspender os leilões de títulos.","Comprar dólares das reservas."],"c":1,"exp":"Restringir = tirar dinheiro do mercado. O BC vende títulos."}]},{"id":"1.1.9.1","titulo":"Taxa Selic (Meta x Over)","resumo":["Selic: taxa básica de juros da economia. Custo primário do dinheiro, base para todas as outras taxas.","Selic META: definida pelo Copom (presidente do BC + diretores), que se reúne 8 vezes por ano, a cada 45 dias.","Protocolo: silêncio começa na quarta anterior; terça (dia 1) contextualização macro; quarta (dia 2) decisão APÓS o fechamento do mercado; ata na terça seguinte.","Selic OVER: taxa efetiva do mercado, média das compromissadas de UM DIA lastreadas em títulos públicos federais, ponderadas pelo volume. Historicamente 0,10% ABAIXO da Meta.","Selic sobe: crédito caro, consumo modera, inflação contida, PIB desacelera. Selic cai: o inverso."],"macete":"Copom: 8 reuniões x 45 dias. META é o alvo do governo, OVER é o que roda no mercado (0,10% abaixo). Ata sai na TERÇA seguinte.","pegadinha":"A banca chama a Selic Meta de taxa de mercado. Errado: a taxa de mercado é a Selic OVER. A Meta é a taxa máxima que o governo estaria disposto a pagar.","questoes":[{"q":"Sobre o funcionamento do Copom, assinale a CORRETA:","alts":["Reúne-se 12 vezes ao ano; decisão na quarta, após o fechamento.","Reúne-se 8 vezes ao ano; decisão na terça, após o fechamento.","Reúne-se 8 vezes ao ano; decisão na quarta, após o fechamento.","Reúne-se 8 vezes ao ano; decisão na quarta, antes da abertura."],"c":2,"exp":"8 reuniões anuais, ciclo de 45 dias, decisão na quarta após o fechamento. Composição: presidente do BC e seus diretores."},{"q":"A taxa média das operações compromissadas de um dia, lastreadas em títulos públicos federais e ponderadas pelo volume, corresponde à:","alts":["Selic Meta.","Selic Over.","Taxa PTAX.","Taxa Referencial (TR)."],"c":1,"exp":"Definição da Selic Over, taxa efetiva do mercado."},{"q":"O Copom eleva a Selic Meta. Pela cadeia descrita no material, espera-se:","alts":["Crédito mais barato, consumo maior e inflação em alta.","Crédito mais caro, consumo moderado e possível freio no PIB.","Crédito mais caro, consumo maior e aceleração imediata do PIB.","Crédito mais barato, consumo moderado e inflação contida."],"c":1,"exp":"Selic sobe, o custo do crédito sobe, o consumo modera e o PIB freia."},{"q":"REDENÇÃO: a relação histórica entre Selic Over e Selic Meta descrita no material é:","alts":["A Over fica exatamente 0,10% acima da Meta.","A Over fica 0,10% abaixo da Meta.","São sempre idênticas.","A Over é o dobro da Meta."],"c":1,"exp":"Historicamente a Selic Over fica 0,10% abaixo da Selic Meta."}]},{"id":"1.1.9.1.2","titulo":"Taxa DI","resumo":["Taxa DI: taxa média das operações interbancárias lastreadas em CDI, calculada e divulgada DIARIAMENTE pela B3.","CDI é o INSTRUMENTO (certificado privado emitido pelo banco). Taxa DI é o nome correto da TAXA. Falar '100% do CDI' está consolidado e não é considerado incorreto.","Com o Pix e o fim do float bancário, as operações com CDI despencaram. A B3 só calcula a Taxa DI pelas operações se houver, no dia, MAIS de 100 operações E soma SUPERIOR a R$ 30 bilhões.","Como as condições raramente são atingidas: Taxa DI = Selic Over do dia."],"macete":"Regra 100/30: mais de 100 operações E mais de R$ 30 bi. Não bateu as duas? DI = Selic Over. CDI é o papel, DI é a taxa.","pegadinha":"As condições são CUMULATIVAS (E, não OU). A banca troca por 'ou' para te derrubar. E quem calcula a Taxa DI é a B3, não o Banco Central.","questoes":[{"q":"Em determinado dia, ocorreram 80 operações com CDI somando R$ 45 bilhões. A Taxa DI divulgada pela B3 será:","alts":["A média das 80 operações, pois o volume superou R$ 30 bilhões.","Igual à Selic Over, pois faltou o mínimo de 100 operações.","Igual à Selic Meta, pois a B3 não apurou a taxa nesse dia.","A média das 80 operações, pois basta uma das duas condições."],"c":1,"exp":"Condições cumulativas: MAIS de 100 operações E MAIS de R$ 30 bi. Com 80 operações, falhou uma delas."},{"q":"Sobre a relação entre Taxa DI e CDI, é CORRETO afirmar:","alts":["CDI é a taxa e DI é o certificado emitido pelo banco.","DI é a taxa e CDI é o certificado emitido pelo banco.","DI e CDI são a mesma taxa, calculada pelo Banco Central.","CDI é a taxa e DI é o lastro em título público federal."],"c":1,"exp":"DI é a taxa, CDI é o instrumento. Quem calcula é a B3."},{"q":"REDENÇÃO: a origem da Selic Over e do CDI está em operações interbancárias. A diferença essencial é:","alts":["A Over vem de lastro em título público; o CDI é papel privado.","A Over vem de lastro em papel privado; o CDI, em título público.","Ambas vêm de operações lastreadas em títulos públicos federais.","Ambas vêm de certificados privados emitidos pelos bancos."],"c":0,"exp":"Lastro em título público = Selic Over. Certificado próprio (privado) = CDI."}]},{"id":"1.1.9.2","titulo":"Depósito Compulsório","resumo":["Parcela dos depósitos que os bancos são OBRIGADOS a manter no Banco Central, reduzindo sua capacidade de emprestar.","Exemplo: depósito de R$ 10.000 com compulsório de 20% permite emprestar só R$ 8.000.","NÃO é imposto nem pagamento ao BC. O dinheiro do compulsório pertence aos CLIENTES dos bancos.","BC quer reduzir liquidez: AUMENTA a alíquota. Quer estimular a economia: REDUZ a alíquota.","Também dá segurança ao sistema: se os saques dispararem, o banco resgata o compulsório no BC."],"macete":"Compulsório = freio do multiplicador bancário. Alíquota sobe, crédito encolhe. O dono do dinheiro é o CLIENTE.","pegadinha":"A banca dirá que o compulsório é receita do Banco Central ou tributo pago pelos bancos. Errado nos dois casos.","questoes":[{"q":"Você deposita R$ 10.000 num banco e a alíquota do compulsório é de 20%. O banco poderá emprestar:","alts":["R$ 10.000.","R$ 2.000.","R$ 8.000.","R$ 5.000."],"c":2,"exp":"20% (R$ 2.000) ficam retidos no BC. Sobram R$ 8.000 para o crédito."},{"q":"Sobre a natureza do depósito compulsório, é CORRETO afirmar:","alts":["É tributo pago pelos bancos ao Banco Central.","O valor retido passa a pertencer ao Banco Central.","Controla a liquidez e o dinheiro segue sendo dos clientes.","É receita recorrente do Tesouro, somada ao resultado primário."],"c":2,"exp":"Não é imposto nem receita de ninguém: o dinheiro é dos clientes."},{"q":"REDENÇÃO: em período de inflação alta, a ação esperada do BC sobre o compulsório é:","alts":["Reduzir a alíquota, ampliando a oferta de crédito na economia.","Aumentar a alíquota, reduzindo o dinheiro em circulação.","Zerar a alíquota, liberando as reservas dos bancos.","Manter a alíquota e elevar apenas a taxa de redesconto."],"c":1,"exp":"Inflação alta pede menos liquidez: alíquota sobe e os bancos emprestam menos."}]},{"id":"1.1.9.3","titulo":"Redesconto e Open Market","resumo":["Redesconto: linha de crédito EMERGENCIAL do Banco Central para bancos com falta de liquidez temporária. O 'empréstimo de última instância'.","Taxa de redesconto alta desencoraja o uso frequente; baixa alivia emergências extremas.","Open Market: BC compra ou vende títulos públicos para regular a liquidez. COMPRA = injeta dinheiro. VENDA = retira dinheiro.","Flexível: pode ocorrer qualquer dia, via leilões. Só participam bancos autorizados, os 'dealers'."],"macete":"Redesconto = salva-vidas. Open market: BC comprou, mercado encheu; BC vendeu, mercado secou. Dealers = únicos convidados do leilão.","pegadinha":"A banca chama o redesconto de linha de crédito comum entre bancos. Não: é do BANCO CENTRAL para o banco, e só em emergência.","questoes":[{"q":"Um banco sofre saques inesperados, esgota as opções no mercado interbancário e recorre a crédito emergencial do Banco Central. Esse instrumento é:","alts":["Open market.","Compulsório.","Redesconto.","CDI."],"c":2,"exp":"Crédito emergencial do BC quando tudo o mais falhou: redesconto."},{"q":"Sobre as operações de open market, assinale a CORRETA:","alts":["Quando o BC compra títulos, ele retira dinheiro de circulação.","Quando o BC vende títulos, sobra menos capital para o crédito.","Qualquer instituição financeira pode participar dos leilões.","Ocorrem apenas nos dias de reunião do Copom, a cada 45 dias."],"c":1,"exp":"Venda retira dinheiro. Compra injeta. Só os dealers participam dos leilões."},{"q":"REDENÇÃO: para AUMENTAR o dinheiro em circulação via open market, o Banco Central deve:","alts":["Vender títulos públicos federais aos bancos.","Comprar títulos públicos dos bancos.","Aumentar a taxa de redesconto.","Elevar o compulsório."],"c":1,"exp":"O BC compra, paga aos bancos, e esse dinheiro entra no sistema."}]},{"id":"1.1.10","titulo":"Política Cambial e Regimes","resumo":["Política cambial: ações do BC para controlar o valor da moeda nacional frente às estrangeiras.","4 regimes: FIXO (BC compra e vende para manter preço fixo, exige grandes reservas), BANDAS (limites máximo e mínimo, Brasil de 1994 a 1998), FLUTUANTE (só oferta e demanda, sem intervenção, não impacta reservas) e FLUTUANTE SUJO (oferta e demanda COM intervenções pontuais).","O Brasil adota o FLUTUANTE SUJO.","Reservas internacionais: ativos em moeda estrangeira geridos pelo BC, usados para estabilizar a moeda, regular o câmbio, garantir pagamentos externos e fortalecer a confiança dos investidores."],"macete":"Brasil = flutuante SUJO. Bandas = Plano Real 1994-1998. Fixo = reservas gigantes.","pegadinha":"A banca dirá que o Brasil adota câmbio flutuante PURO ou fixo. É flutuante sujo. E no flutuante puro, a cotação livre NÃO impacta as reservas.","questoes":[{"q":"O dólar dispara por crise política e o Banco Central vende dólares das reservas para conter a alta. Essa atuação caracteriza o regime:","alts":["Fixo.","Flutuante puro.","Flutuante sujo.","De bandas cambiais."],"c":2,"exp":"Oferta e demanda definem o preço, mas o BC intervém pontualmente: flutuante sujo."},{"q":"Sobre os regimes cambiais, assinale a CORRETA:","alts":["No regime de bandas, o câmbio é totalmente livre.","O Brasil operou sob bandas cambiais de 1994 a 1998, no início do Plano Real.","No regime fixo, o BC nunca utiliza reservas internacionais.","No flutuante puro, o BC intervém diariamente."],"c":1,"exp":"Bandas: limites definidos pelo BC, vigentes no Brasil de 1994 a 1998."},{"q":"Reservas internacionais, segundo o material, servem para:","alts":["Pagar a folha do funcionalismo público federal.","Estabilizar a moeda e garantir os pagamentos externos.","Financiar exclusivamente as linhas de crédito do BNDES.","Substituir a arrecadação de tributos em anos de déficit."],"c":1,"exp":"As quatro funções listadas na apostila."},{"q":"REDENÇÃO: no regime de câmbio flutuante (puro), é CORRETO afirmar:","alts":["O BC fixa limites máximo e mínimo para a cotação diária.","A cotação é livre e não há impacto sobre as reservas.","A cotação é livre, mas o BC intervém em momentos de crise.","O BC compra todo o excedente de dólares do mercado."],"c":1,"exp":"Flutuante puro: só o mercado atua e não há impacto nas reservas."}]},{"id":"1.1.11","titulo":"Sistema de Metas de Inflação","resumo":["Regime em que o BC busca manter a inflação dentro de meta estipulada pelo CMN.","Divisão de papéis: CMN DEFINE a meta, o Banco Central CUMPRE (principalmente via Selic), o IBGE MENSURA (IPCA).","Exemplo do material: meta de 3% com tolerância de 1,5 p.p., inflação ideal entre 1,5% e 4,5%.","Desde janeiro de 2025: META CONTÍNUA, avaliando a inflação acumulada em 12 meses.","Meta descumprida por 6 meses consecutivos: o presidente do BC escreve carta aberta ao Ministro da Fazenda explicando motivos, correções e prazo de retorno."],"macete":"CMN manda (define), BC executa (cumpre via Selic), IBGE mede (IPCA). 6 meses fora = carta aberta ao Ministro da Fazenda.","pegadinha":"A banca embaralha os papéis: dirá que o BC define a meta ou que o IPCA é medido pelo BC. Nunca.","questoes":[{"q":"No sistema de metas de inflação brasileiro, define a meta, cumpre a meta e mensura a inflação, respectivamente:","alts":["BC, CMN e IBGE.","CMN, BC e IBGE.","IBGE, BC e CMN.","CMN, IBGE e BC."],"c":1,"exp":"CMN define, BC cumpre, IBGE mensura com o IPCA."},{"q":"A meta é 3% com tolerância de 1,5 p.p. e a inflação acumulada em 12 meses fica fora do intervalo por 6 meses consecutivos. A consequência prevista é:","alts":["Demissão automática do presidente do Banco Central.","Carta aberta do presidente do BC ao Ministro da Fazenda.","Carta aberta do Ministro da Fazenda ao presidente do BC.","Revisão da meta pelo CMN, com novo intervalo de tolerância."],"c":1,"exp":"O rito é a carta aberta. Com meta 3% e tolerância 1,5, o intervalo é 1,5% a 4,5%."},{"q":"Sobre a sistemática adotada desde janeiro de 2025, é CORRETO afirmar:","alts":["A meta passou a ser avaliada no fechamento do ano-calendário.","Adotou-se meta contínua, com janela móvel de 12 meses.","A meta passou a ser definida pelo IBGE, e não pelo CMN.","O índice de referência passou do IPCA para o IGP-M."],"c":1,"exp":"Meta contínua desde jan/2025: janela móvel de 12 meses. O índice segue sendo o IPCA."},{"q":"REDENÇÃO: a principal ferramenta usada pelo BC para trazer a inflação de volta à meta é:","alts":["A alíquota do imposto de renda.","A taxa Selic.","A PTAX.","O salário mínimo."],"c":1,"exp":"Inflação subindo: BC eleva a Selic. Abaixo do desejado: Selic cai."}]},{"id":"1.1.12","titulo":"TR e TLP","resumo":["TR: definida pelo Banco Central, calculada a partir da TBF (Taxa Básica Financeira) com aplicação de um redutor. A TBF vem da média das negociações com LTN (título público PREFIXADO) no interbancário.","TR criada no início dos anos 1990 (pré-Plano Real) como correção monetária na hiperinflação. Segue viva em: poupança, FGTS, financiamento imobiliário e títulos de capitalização.","TLP: referência dos financiamentos do BNDES, baseada nas NTN-B, títulos públicos indexados ao IPCA.","TLP é distante do cotidiano: usada por empresas tomando crédito no BNDES, bancos repassadores e distribuidores dessas linhas."],"macete":"TR: TBF (LTN prefixada) menos redutor. Mora na Poupança, FGTS, Imobiliário e Capitalização. TLP: BNDES + NTN-B (IPCA).","pegadinha":"A banca cruza os lastros: dirá que a TR vem de título indexado ao IPCA ou que a TLP vem de prefixado. Inverso!","questoes":[{"q":"A TR é calculada a partir de qual base?","alts":["Da TBF, obtida das negociações com NTN-B, mais um redutor.","Da TBF, obtida das negociações com LTN, menos um redutor.","Da Selic Over do dia, acrescida do spread bancário médio.","Da variação mensal do IGP-M, apurada pela FGV."],"c":1,"exp":"TR = TBF (média das LTN prefixadas) menos o redutor."},{"q":"São produtos em que a TR ainda está presente, EXCETO:","alts":["Caderneta de poupança.","FGTS.","Financiamentos do BNDES.","Títulos de capitalização."],"c":2,"exp":"BNDES usa a TLP."},{"q":"REDENÇÃO: a TLP é referenciada em:","alts":["LTN, títulos públicos prefixados.","NTN-B, títulos públicos indexados ao IPCA.","LFT, títulos públicos pós-fixados indexados à Selic.","CDI, taxa dos depósitos interfinanceiros."],"c":1,"exp":"TLP = taxa do BNDES, referenciada nas NTN-B indexadas ao IPCA."}]}],"boss":[{"q":"O BC quer conter uma inflação acima do teto da meta. Conjunto de ações COERENTE:","alts":["Reduzir Selic, comprar títulos e reduzir compulsório.","Aumentar Selic, vender títulos no open market e aumentar o compulsório.","Aumentar Selic, comprar títulos e reduzir o redesconto.","Reduzir impostos e reduzir a Selic."],"c":1,"exp":"Política restritiva: tudo sobe e o BC VENDE títulos para secar a liquidez."},{"q":"C = 700, I = 300, G = 250, X = 200, M = 150. O PIB pela ótica da demanda é:","alts":["1.600","1.300","1.250","1.400"],"c":1,"exp":"700 + 300 + 250 + (200 - 150) = 1.300."},{"q":"Quem calcula, respectivamente, IPCA, IGP-M e Taxa DI:","alts":["IBGE, FGV e B3.","FGV, IBGE e BC.","IBGE, B3 e FGV.","BC, FGV e B3."],"c":0,"exp":"IPCA = IBGE. IGP-M = FGV. Taxa DI = B3."},{"q":"Num dia com 150 operações de CDI somando R$ 20 bilhões, a Taxa DI será:","alts":["Calculada pelas operações, pois passaram de 100.","Igual à Selic Over, pois o volume não superou R$ 30 bilhões.","Igual à Selic Meta.","Igual à TR."],"c":1,"exp":"Regra cumulativa 100/30. Falhou o volume, então DI = Selic Over."},{"q":"Governo arrecada R$ 500 bi em receitas primárias, gasta R$ 530 bi em despesas primárias e paga R$ 40 bi de juros:","alts":["Superávit primário de R$ 30 bi e déficit nominal de R$ 10 bi.","Déficit primário de R$ 30 bi e déficit nominal de R$ 70 bi.","Déficit primário de R$ 70 bi e superávit nominal de R$ 30 bi.","Superávit nominal de R$ 40 bi."],"c":1,"exp":"Primário = -30. Nominal = -30 - 40 = -70."},{"q":"O real se DESVALORIZA frente ao dólar. Efeitos esperados:","alts":["Importar fica mais barato e exportar menos vantajoso.","Importar fica mais caro e exportar se torna mais vantajoso.","Nenhum efeito sobre o comércio exterior.","Exportações e importações caem juntas."],"c":1,"exp":"Real fraco: exportar bomba, importado encarece."},{"q":"Associe corretamente instrumento e definição:","alts":["Redesconto: parcela dos depósitos retida no Banco Central.","Compulsório: crédito emergencial de última instância.","Open market: compra e venda de títulos públicos pelo BC.","Selic Over: taxa definida pelo Copom a cada 45 dias."],"c":2,"exp":"O Copom define a Meta, não a Over."},{"q":"Sobre o protocolo do Copom, a ata da reunião é divulgada:","alts":["Na própria quarta-feira da decisão.","Na terça-feira posterior à reunião.","30 dias após a decisão.","Junto com o IPCA do mês."],"c":1,"exp":"Decisão: quarta, após o fechamento. Ata: terça seguinte."},{"q":"Uma família de baixa renda em São Paulo sente forte alta no feijão. O índice que captura esse impacto com mais intensidade é:","alts":["IGP-M.","IPC-FIPE.","INCC.","PIB deflator."],"c":1,"exp":"IPC-FIPE: 1 a 10 salários mínimos, cidade de São Paulo."},{"q":"O Brasil, no regime cambial atual, se caracteriza por:","alts":["Câmbio fixo, com paridade mantida pelas reservas do BC.","Bandas cambiais, com teto e piso divulgados pelo CMN.","Flutuante puro, sem qualquer intervenção do Banco Central.","Flutuante sujo, com intervenções pontuais do BC."],"c":3,"exp":"Flutuante sujo. Bandas vigoraram de 1994 a 1998."},{"q":"Complete: o CMN define a meta, o BC a cumpre principalmente via ______ e o ______ mensura o resultado pelo ______:","alts":["PTAX / BC / IGP-M.","Selic / IBGE / IPCA.","compulsório / CMN / IPCA.","TR / IBGE / IPC-FIPE."],"c":1,"exp":"BC cumpre via Selic, IBGE mede pelo IPCA."},{"q":"Sobre TR e TLP, assinale a CORRETA:","alts":["A TR corrige o BNDES; a TLP, a poupança e o FGTS.","A TLP vem da TBF com redutor; a TR, das NTN-B.","A TR vem da TBF com redutor; a TLP, das NTN-B.","Ambas são definidas pelo Copom a cada 45 dias."],"c":2,"exp":"TR: LTN prefixada. TLP: NTN-B indexada ao IPCA."}]},{"id":"1.2","titulo":"Sistema Financeiro Nacional","subtitulo":"Quem manda, quem fiscaliza e quem opera","niveis":[{"id":"1.2.1","titulo":"Estrutura do SFN","resumo":["O SFN é dividido em TRÊS níveis: órgãos normativos, órgãos supervisores e órgãos operadores.","NORMATIVOS: estabelecem diretrizes e normas. Não operam no mercado. Aqui está o CMN, maior autoridade do SFN, responsável pelas diretrizes de política monetária, cambial e de crédito.","SUPERVISORES: fiscalizam o cumprimento das normas. São o Banco Central, a CVM, a SUSEP e a PREVIC.","OPERADORES: atuam efetivamente no mercado. Bancos, Caixa Econômica Federal, cooperativas de crédito, corretoras, distribuidoras, fintechs.","O CMN exige que trabalhadores de instituições financeiras tenham certificações que comprovem seu conhecimento técnico."],"macete":"Normativo MANDA (CMN), Supervisor FISCALIZA (BC, CVM, SUSEP, PREVIC), Operador FAZ (bancos, corretoras).","pegadinha":"A banca coloca o Banco Central como órgão normativo. Ele é SUPERVISOR.","questoes":[{"q":"Na estrutura do SFN apresentada, são órgãos SUPERVISORES:","alts":["CMN, CNSP e CNPC.","Banco Central, CVM, SUSEP e PREVIC.","Bancos, corretoras e fintechs.","Apenas o Banco Central."],"c":1,"exp":"Supervisores fiscalizam: BC, CVM, SUSEP e PREVIC. O CMN é normativo, bancos e corretoras são operadores."},{"q":"Sobre os órgãos normativos, é CORRETO afirmar:","alts":["Operam diretamente no mercado realizando intermediação.","Estabelecem as diretrizes e normas, sem operar diretamente no mercado.","Fiscalizam o cumprimento das regras criadas pelos supervisores.","São compostos exclusivamente por instituições privadas."],"c":1,"exp":"Normativos definem as regras do jogo, mas não jogam."},{"q":"REDENÇÃO: a exigência de certificações para quem trabalha em instituições financeiras parte de qual órgão?","alts":["Da ANBIMA, entidade que emite e aplica as certificações.","Do Banco Central, que supervisiona os bancos.","Do Conselho Monetário Nacional, órgão normativo.","Da CVM, que fiscaliza o mercado de capitais."],"c":2,"exp":"É o CMN que exige as certificações. A ANBIMA emite algumas delas, mas a exigência vem do CMN."}]},{"id":"1.2.2","titulo":"Conselho Monetário Nacional (CMN)","resumo":["Criado pela Lei 4.595/1964. Órgão deliberativo MÁXIMO do SFN.","Composição (3 membros): Ministro da Fazenda (PRESIDE), Ministro do Planejamento e Orçamento e Presidente do Banco Central.","Missão: formular a política de moeda e crédito, garantindo a estabilidade da moeda e o desenvolvimento econômico e social.","Deliberações: coordenar políticas orçamentária, fiscal e da dívida pública; fixar diretrizes da política cambial (inclusive compra e venda de ouro); orientar a aplicação dos recursos das instituições financeiras; zelar pela liquidez e solvência das instituições; aperfeiçoar instrumentos financeiros; disciplinar o crédito em todas as modalidades.","Seus atos normativos se chamam RESOLUÇÕES, publicadas no site do Banco Central."],"macete":"CMN = 3 cabeças: Fazenda (preside), Planejamento e BC. Seu instrumento é a RESOLUÇÃO.","pegadinha":"A banca coloca o presidente do BC presidindo o CMN. Quem preside é o Ministro da Fazenda. E o CMN não executa política monetária, ele a formula.","questoes":[{"q":"A composição do Conselho Monetário Nacional é:","alts":["Presidente do BC, Ministro da Fazenda e presidente da CVM.","Ministros da Fazenda e do Planejamento e presidente do BC.","Presidente da República, Ministro da Fazenda e presidente do BC.","Presidente do BC e oito diretores aprovados pelo Senado."],"c":1,"exp":"Três membros, presididos pelo Ministro da Fazenda. Nove membros é a composição do BC."},{"q":"Os atos normativos pelos quais o CMN exerce sua atividade regulatória são denominados:","alts":["Circulares.","Instruções.","Resoluções.","Deliberações normativas."],"c":2,"exp":"O CMN publica RESOLUÇÕES, divulgadas no site do Banco Central."},{"q":"É atribuição do CMN, segundo o material:","alts":["Executar a política monetária para cumprir a meta.","Autorizar o funcionamento das instituições financeiras.","Zelar pela liquidez e solvência das instituições.","Fiscalizar analistas e administradores de carteira."],"c":2,"exp":"Executar a política monetária e autorizar funcionamento são do BC. Fiscalizar analistas é da CVM."},{"q":"REDENÇÃO: o CMN foi criado por qual norma e ocupa qual posição no SFN?","alts":["Lei 10.214/2001, órgão supervisor.","Lei 4.595/1964, órgão deliberativo máximo do SFN.","Lei Complementar 179/2021, órgão operador.","Instrução CVM 30, órgão autorregulador."],"c":1,"exp":"Lei 4.595/1964, autoridade máxima do Sistema Financeiro Nacional."}]},{"id":"1.2.3","titulo":"Banco Central do Brasil","resumo":["Responsável pela regulação e supervisão do sistema financeiro. Missão principal: assegurar a ESTABILIDADE DE PREÇOS.","Também deve garantir a estabilidade e eficiência do sistema financeiro, promover o pleno emprego e suavizar as flutuações da atividade econômica (Lei Complementar 179, de 2021).","Atribuições: autorizar o funcionamento das instituições financeiras; executar as políticas monetárias para cumprir a meta do CMN; controlar o crédito e os capitais estrangeiros; ser depositário das reservas oficiais de ouro e moeda; fiscalizar e punir instituições financeiras; executar o meio circulante e gerir o SPB e o SPI.","Estrutura COLEGIADA: 9 membros (presidente + 8 diretores), mandato de 4 anos com uma recondução, escolhidos pelo presidente da República e aprovados pelo Senado.","O mandato do presidente do BC começa no TERCEIRO ano do mandato presidencial. Desligamento só por inabilidade técnica ou descumprimento dos objetivos."],"macete":"BC: 9 membros, 4 anos, mandato começa no 3º ano do presidencial. Autoriza, executa, fiscaliza. Não cria a meta, CUMPRE.","pegadinha":"A banca dirá que o BC define a meta de inflação (é o CMN) ou que tem 8 membros. São 9: presidente + 8 diretores.","questoes":[{"q":"A estrutura do Banco Central do Brasil é:","alts":["Colegiada, com 9 membros e mandato de 4 anos.","Colegiada, com 5 membros e mandato de 4 anos.","Colegiada, com 9 membros e mandato de 2 anos.","Unipessoal, sob comando exclusivo do presidente."],"c":0,"exp":"Nove membros, mandato de 4 anos, uma recondução, aprovados pelo Senado. Presidente + 4 diretores é a CVM."},{"q":"É atribuição do Banco Central, EXCETO:","alts":["Autorizar o funcionamento das instituições financeiras.","Ser depositário das reservas oficiais de ouro e moeda.","Definir a meta de inflação a ser perseguida.","Gerir o SPB e o SPI."],"c":2,"exp":"Quem define a meta é o CMN. O BC executa a política monetária para cumpri-la."},{"q":"A abordagem que passou a exigir do BC o equilíbrio entre controle da inflação e estabilidade econômica e social foi determinada:","alts":["Pela Lei 4.595/1964.","Pela Lei Complementar 179, em 2021.","Pelo Acordo de Basileia III.","Pela Lei 10.214/2001."],"c":1,"exp":"Lei Complementar 179/2021: além da estabilidade de preços, o BC deve zelar pelo pleno emprego."},{"q":"REDENÇÃO: o mandato do presidente do Banco Central começa:","alts":["No primeiro ano do mandato presidencial.","No terceiro ano do mandato presidencial.","Simultaneamente ao do presidente da República.","Na data de aprovação pelo Senado, sem prazo fixo."],"c":1,"exp":"Começa no terceiro ano do mandato presidencial, assegurando independência técnica."}]},{"id":"1.2.4","titulo":"Comissão de Valores Mobiliários (CVM)","resumo":["Autarquia federal responsável pela regulação e fiscalização do mercado de VALORES MOBILIÁRIOS.","Objetivo principal: proteger os investidores e garantir transparência e integridade no mercado de capitais.","Divisão de território: o BC supervisiona crédito, câmbio e monetário; a CVM foca no MERCADO DE CAPITAIS.","Atribuições: proteger investidores; estimular a poupança e seu investimento em valores mobiliários; fiscalizar o cumprimento das normas; investigar e punir descumprimentos; zelar pelo funcionamento eficiente do mercado de capitais; fiscalizar bolsas de valores, mercado de balcão e bolsas de mercadorias e futuros; fiscalizar assessores de investimentos, analistas, administradores de carteira e consultores; assegurar acesso do público a informações de qualidade.","Estrutura: presidente e QUATRO diretores, nomeados pelo presidente da República e aprovados pelo Senado."],"macete":"CVM = mercado de CAPITAIS + proteção do investidor. Estrutura 1 + 4. BC cuida de banco, CVM cuida de bolsa.","pegadinha":"A banca joga atribuições do BC no colo da CVM e vice-versa. E confunde a estrutura: CVM tem 5 (1+4), BC tem 9 (1+8).","questoes":[{"q":"Sobre a divisão de competências, é CORRETO afirmar:","alts":["A CVM supervisiona crédito, câmbio e mercado monetário.","O BC fiscaliza as bolsas de valores e o balcão organizado.","A CVM cuida do mercado de capitais; o BC, dos demais.","Ambos supervisionam integralmente os mesmos mercados."],"c":2,"exp":"Divisão literal do material."},{"q":"A estrutura organizacional da CVM é composta por:","alts":["Presidente e mais oito diretores, aprovados pelo Senado.","Presidente e quatro diretores, aprovados pelo Senado.","Presidente e quatro diretores, indicados pelo CMN.","Três membros indicados pelo Ministério da Fazenda."],"c":1,"exp":"Presidente + 4 diretores, todos com aprovação do Senado."},{"q":"É atribuição expressa da CVM:","alts":["Fiscalizar assessores, analistas e consultores de valores.","Executar os serviços do meio circulante do país.","Fixar as características gerais dos contratos de seguro.","Regular a previdência complementar do regime fechado."],"c":0,"exp":"Meio circulante é do BC, contratos de seguro são do CNSP e previdência fechada é do CNPC."},{"q":"REDENÇÃO: a natureza jurídica da CVM é:","alts":["Sociedade anônima de capital aberto.","Autarquia federal.","Entidade autorreguladora privada.","Departamento do Banco Central."],"c":1,"exp":"A CVM é uma autarquia federal."}]},{"id":"1.2.5","titulo":"CNSP e SUSEP","resumo":["CNSP: fixa as DIRETRIZES e NORMAS da política de seguros privados. É o normativo do setor.","Funções do CNSP: regular constituição, organização, funcionamento e fiscalização dos que atuam no sistema nacional de seguros privados; fixar as características gerais dos contratos de seguro, previdência privada ABERTA, capitalização e resseguro; estabelecer diretrizes de resseguro; prescrever critérios de constituição das seguradoras e resseguradoras; disciplinar a corretagem e a profissão de corretor.","SUSEP: entidade EXECUTIVA que regula e fiscaliza seguros, previdência complementar ABERTA, capitalização e resseguros, executando a política traçada pelo CNSP.","Atribuições da SUSEP: promover desenvolvimento e concorrência; promover estabilidade; zelar pela liquidez e solvência; fiscalizar a constituição e operação das sociedades; proteger a captação de poupança popular; defender os interesses dos consumidores."],"macete":"CNSP traça o caminho, SUSEP garante que ele seja seguido. SUSEP está para os seguros como a CVM está para a bolsa.","pegadinha":"A banca troca ABERTA por FECHADA. SUSEP e CNSP cuidam da previdência complementar ABERTA. Fechada é CNPC e PREVIC.","questoes":[{"q":"A entidade executiva responsável por fiscalizar seguros, previdência complementar aberta, capitalização e resseguros é:","alts":["O CNSP.","A SUSEP.","A PREVIC.","A CVM."],"c":1,"exp":"SUSEP executa; o CNSP é o normativo que traça as diretrizes."},{"q":"É função do CNSP:","alts":["Fiscalizar no dia a dia a operação das seguradoras.","Fixar as características gerais dos contratos de seguro.","Regular a previdência complementar do regime fechado.","Autorizar o funcionamento dos bancos comerciais."],"c":1,"exp":"O CNSP fixa características gerais dos contratos. A fiscalização do dia a dia é da SUSEP."},{"q":"REDENÇÃO: a previdência complementar ABERTA é regulada e fiscalizada por:","alts":["CNPC e PREVIC.","CNSP e SUSEP.","CMN e Banco Central.","CVM e ANBIMA."],"c":1,"exp":"Aberta = CNSP (normativo) e SUSEP (supervisor)."}]},{"id":"1.2.6","titulo":"CNPC e PREVIC","resumo":["CNPC: órgão colegiado da estrutura do Ministério da Previdência Social. Regula o regime de previdência complementar FECHADO, ou seja, os fundos de pensão restritos a grupos específicos.","PREVIC: autarquia vinculada ao Ministério da Previdência Social, responsável pela fiscalização e supervisão das entidades fechadas de previdência (EFPC).","Atribuições da PREVIC: zelar pela liquidez e solvência; apurar infrações e aplicar penalidades administrativas; estabelecer procedimentos para aplicação das normas; autorizar constituição e funcionamento, bem como fusões, cisões e reorganizações; harmonizar atividades; INTERVIR e LIQUIDAR entidades; nomear administrador especial de plano de benefícios; mediar e conciliar entre entidades, participantes, assistidos, patrocinadores ou instituidores."],"macete":"FECHADA tem C e P de CNPC e PREVIC. Fundo de pensão de empresa = mundo fechado.","pegadinha":"A banca inverte aberta e fechada, e atribui à PREVIC a regulação (que é do CNPC). PREVIC fiscaliza, intervém e liquida.","questoes":[{"q":"O órgão que regula o regime de previdência complementar fechado é:","alts":["A PREVIC.","O CNPC.","A SUSEP.","O CNSP."],"c":1,"exp":"CNPC regula o regime fechado. A PREVIC fiscaliza e supervisiona as EFPC."},{"q":"É atribuição da PREVIC:","alts":["Fixar as características dos contratos de capitalização.","Intervir e liquidar entidades fechadas de previdência.","Definir a meta de inflação aplicável ao regime fechado.","Autorizar o funcionamento dos bancos de investimento."],"c":1,"exp":"A PREVIC pode intervir, liquidar e nomear administrador especial."},{"q":"REDENÇÃO: um fundo de pensão exclusivo para funcionários de uma multinacional é supervisionado por:","alts":["SUSEP.","PREVIC.","CVM.","Banco Central."],"c":1,"exp":"Fundo restrito a um grupo = entidade fechada (EFPC) = PREVIC."}]},{"id":"1.2.7","titulo":"Instituições Financeiras","resumo":["Banco COMERCIAL: sociedade anônima, pública ou privada. Capta por depósito à vista (conta corrente) e a prazo (CDB, Letra Financeira), abre crédito em conta (cheque especial), faz crédito rural, câmbio e comércio internacional, e presta serviços.","Depósito À VISTA: disponível a qualquer momento, inclusive no mesmo dia. Depósito A PRAZO: tem prazo para devolução, somado a rendimentos.","CAIXA ECONÔMICA FEDERAL: funciona como banco comercial, mas com a missão distinta de implementar políticas públicas.","COOPERATIVA DE CRÉDITO: associação de pessoas, SEM fins lucrativos, presta serviços EXCLUSIVAMENTE aos associados, que são ao mesmo tempo donos e usuários.","BANCO DE INVESTIMENTO: concede crédito a MÉDIO e LONGO prazo. Deve conter a expressão 'Banco de Investimento' na denominação social. Capta por depósito a prazo, administra fundos, faz IPO e underwriting, subscreve e distribui valores mobiliários.","FINANCEIRAS: crédito para quem não é atendido por bancos tradicionais.","BANCO DE DESENVOLVIMENTO: controlado pelos governos ESTADUAIS, financia a médio e longo prazo projetos do respectivo Estado.","CTVM e DTVM: hoje NÃO há diferença entre elas. Promovem a intermediação de títulos e valores mobiliários.","SOCIEDADE DE ARRENDAMENTO MERCANTIL: realiza o leasing. CORRETORA DE CÂMBIO: atua EXCLUSIVAMENTE no mercado de câmbio.","BANCO MÚLTIPLO: opera múltiplas carteiras, sendo que uma delas deve OBRIGATORIAMENTE ser comercial ou de investimento."],"macete":"Comercial = depósito À VISTA. Investimento = médio e longo prazo + nome obrigatório. Múltiplo = precisa ter comercial ou investimento. Desenvolvimento = ESTADUAL.","pegadinha":"Três clássicas: banco de investimento NÃO capta depósito à vista; CTVM e DTVM são idênticas hoje; banco de desenvolvimento é dos governos ESTADUAIS.","questoes":[{"q":"Sobre o banco múltiplo, é CORRETO afirmar:","alts":["Opera várias carteiras, sem exigência de nenhuma específica.","Opera várias carteiras, uma comercial ou de investimento.","Opera apenas as carteiras comercial e de crédito imobiliário.","Opera várias carteiras e é controlado por governo estadual."],"c":1,"exp":"Múltiplas carteiras, com pelo menos uma sendo comercial ou de investimento."},{"q":"A captação de recursos por depósito à vista é característica típica:","alts":["Do banco de investimento.","Da sociedade de arrendamento mercantil.","Do banco comercial.","Da corretora de câmbio."],"c":2,"exp":"Depósito à vista é do banco comercial. O de investimento capta por depósito a prazo."},{"q":"Sobre CTVM e DTVM, o material afirma que:","alts":["A CTVM opera em bolsa e a DTVM atua só no balcão.","Hoje não há diferença entre elas na intermediação.","A DTVM distribui apenas cotas de fundos de investimento.","Ambas são órgãos supervisores do sistema financeiro."],"c":1,"exp":"Não há mais distinção entre CTVM e DTVM."},{"q":"REDENÇÃO: cooperativa de crédito caracteriza-se por:","alts":["Sociedade anônima com fins lucrativos, aberta ao público.","Instituição sem fins lucrativos, exclusiva para associados.","Instituição sem fins lucrativos, aberta ao público em geral.","Instituição controlada pelo governo do respectivo estado."],"c":1,"exp":"Sem fins lucrativos, exclusiva para associados."}]},{"id":"1.2.8","titulo":"Seguradoras e Resseguradoras","resumo":["SEGURADORAS: instituições financeiras que assumem e gerenciam riscos financeiros. Supervisionadas pela SUSEP.","RESSEGURADORAS: redistribuem PARTE dos riscos assumidos pelas seguradoras, criando uma camada adicional de segurança. Cobrem uma parcela do risco, não a totalidade.","CORRETORAS DE SEGUROS: no Brasil, os produtos de seguro NÃO são vendidos diretamente pelas seguradoras ao consumidor final. A intermediação cabe às corretoras.","A seguradora gerencia os contratos, recebe prêmios e paga sinistros. O cliente interage principalmente com a corretora.","Toda a estrutura é supervisionada pela SUSEP, conforme as diretrizes do CNSP."],"macete":"Seguradora assume o risco, resseguradora divide UMA PARTE dele, corretora vende. Quem fiscaliza todos: SUSEP.","pegadinha":"A banca dirá que a resseguradora assume TODO o risco (é apenas uma parcela) ou que a seguradora vende direto ao consumidor final.","questoes":[{"q":"Sobre o papel da resseguradora, é CORRETO afirmar:","alts":["Assume integralmente os riscos aceitos pela seguradora.","Redistribui parte dos riscos assumidos pela seguradora.","Vende apólices diretamente ao consumidor final.","Substitui a SUSEP na fiscalização das seguradoras."],"c":1,"exp":"A resseguradora cobre apenas uma parcela do risco."},{"q":"No mercado brasileiro, a venda de produtos de seguro ao consumidor final é feita:","alts":["Diretamente pelas seguradoras, sem intermediação.","Pelas corretoras de seguros, que intermediam a relação.","Pela SUSEP, que homologa cada apólice emitida.","Pelas resseguradoras, que assumem parte do risco."],"c":1,"exp":"A intermediação cabe às corretoras."},{"q":"REDENÇÃO: seguradoras, resseguradoras e corretoras de seguros são supervisionadas por:","alts":["Banco Central, conforme as diretrizes do CMN.","CVM, conforme as diretrizes do CMN.","SUSEP, conforme as diretrizes do CNSP.","PREVIC, conforme as diretrizes do CNPC."],"c":2,"exp":"SUSEP supervisiona esse ecossistema, seguindo as diretrizes do CNSP."}]},{"id":"1.2.9","titulo":"B3 S/A e Mercado de Balcão","resumo":["B3: bolsa de valores oficial do Brasil. Negocia ações, derivativos, renda fixa privada, commodities e moedas, além de REGISTRAR, COMPENSAR e LIQUIDAR operações.","A bolsa busca a melhor formação de preços com transparência ANTERIOR e POSTERIOR à negociação: divulga em tempo real ofertas de compra e venda e as operações realizadas.","Diferença bolsa x balcão: a bolsa oferece preços em tempo real (mais liquidez e transparência); o balcão não tem a mesma liquidez e transparência.","Negociados na BOLSA: ações, BDR, cotas de fundos e derivativos.","Negociados no BALCÃO: captação bancária, títulos privados, cotas de fundos e derivativos de balcão."],"macete":"Cotas de fundos e derivativos aparecem NAS DUAS listas. Só na bolsa: ações e BDR. Só no balcão: captação bancária e títulos privados.","pegadinha":"A banca pergunta onde se negocia debênture: mercado de BALCÃO (título privado).","questoes":[{"q":"São ativos negociados no mercado de balcão, segundo o material:","alts":["Ações e BDR, negociados em ambiente eletrônico.","Captação bancária, títulos privados e derivativos.","Apenas ações de companhias de capital fechado.","Exclusivamente títulos públicos federais e LFT."],"c":1,"exp":"Ações e BDR são exclusivos da bolsa."},{"q":"A principal diferença entre a bolsa de valores e o mercado de balcão está:","alts":["Na obrigatoriedade de registro, exigida só na bolsa.","Na liquidez e na transparência dos preços em tempo real.","No fato de o mercado de balcão não ser regulado.","Na proibição de negociar cotas de fundos no balcão."],"c":1,"exp":"A bolsa dá preços em tempo real; o balcão não tem a mesma liquidez e transparência."},{"q":"REDENÇÃO: além de ambiente de negociação, a B3 também é responsável por:","alts":["Definir a taxa Selic Meta.","Registrar, compensar e liquidar operações.","Autorizar o funcionamento de corretoras e distribuidoras.","Fiscalizar seguradoras."],"c":1,"exp":"A B3 registra, compensa e liquida operações."}]},{"id":"1.2.10","titulo":"BSM e o Mecanismo de Ressarcimento (MRP)","resumo":["BSM: entidade AUTORREGULADORA vinculada à B3. Supervisiona, fiscaliza e previne irregularidades nas negociações nos ambientes da bolsa.","Atuações: linha de frente na integridade das negociações; monitora manipulação de preços, uso de informação privilegiada e fraudes operacionais; garante transparência e conformidade; embora independente, atua em coordenação com a CVM quando identifica indícios de infração.","MRP: mantido pela B3 e ADMINISTRADO pela BSM. Ressarce até R$ 200 MIL por prejuízos comprovadamente causados por erros ou omissões de participantes (corretoras e distribuidoras), seus administradores ou prepostos, na intermediação de operações de bolsa e serviços de custódia."],"macete":"MRP: R$ 200 mil, mantido pela B3, administrado pela BSM, e só para operações de BOLSA.","pegadinha":"A banca troca o valor (R$ 200 mil, não R$ 250 mil, que é o FGC) e quem administra. O MRP cobre erro ou omissão do participante, não perda por queda de preço.","questoes":[{"q":"Sobre o Mecanismo de Ressarcimento de Prejuízos (MRP), é CORRETO afirmar:","alts":["Mantido pela CVM e administrado pela B3, cobre até R$ 250 mil.","Mantido pela B3 e administrado pela BSM, cobre até R$ 200 mil.","Mantido pela B3 e administrado pela BSM, cobre até R$ 250 mil.","Mantido pela ANBIMA, cobre operações de balcão até R$ 200 mil."],"c":1,"exp":"B3 mantém, BSM administra, teto de R$ 200 mil, cobertura para erro ou omissão do participante."},{"q":"A BSM caracteriza-se como:","alts":["Órgão normativo do SFN, ao lado do CMN.","Autarquia federal vinculada ao Ministério da Fazenda.","Entidade autorreguladora vinculada à B3.","Departamento interno da CVM, com poder de polícia."],"c":2,"exp":"Autorreguladora vinculada à B3, independente, mas coordenada com a CVM."},{"q":"REDENÇÃO: entre as práticas monitoradas pela BSM estão:","alts":["Manipulação de preços e uso de informação privilegiada.","Sonegação de tributos federais, municipais e estaduais.","Descumprimento das metas de inflação pelo BC.","Irregularidades em contratos de seguro e capitalização."],"c":0,"exp":"A BSM é a linha de frente da integridade das negociações na bolsa."}]},{"id":"1.2.11","titulo":"ANBIMA","resumo":["ANBIMA: entidade de AUTORREGULAÇÃO formada por instituições participantes do setor. Estabelece códigos de conduta, boas práticas e regras ADICIONAIS às regulamentações oficiais.","As quatro frentes: EDUCAR (educação financeira e emissão de certificações), INFORMAR (dados confiáveis sobre a indústria de investimentos), REPRESENTAR (defende os associados perante reguladores e legisladores) e AUTORREGULAR (cria processos de melhores práticas entre associados e aderentes)."],"macete":"E-I-R-A: Educar, Informar, Representar, Autorregular.","pegadinha":"A banca coloca a ANBIMA como órgão regulador oficial. Ela é AUTORREGULADORA e privada: cria regras ADICIONAIS às oficiais.","questoes":[{"q":"As quatro frentes de trabalho da ANBIMA são:","alts":["Fiscalizar, punir, autorizar registros e liquidar.","Educar, Informar, Representar e Autorregular.","Regular, supervisionar, operar e certificar.","Emitir, distribuir, custodiar e liquidar."],"c":1,"exp":"Educar (certificações), Informar (dados), Representar (perante reguladores) e Autorregular."},{"q":"Sobre a natureza da ANBIMA, é CORRETO afirmar:","alts":["Autarquia federal, com poder de polícia sobre o mercado.","Entidade privada que cria regras adicionais às oficiais.","Entidade privada que substitui a CVM na fiscalização.","Órgão normativo do SFN, subordinado ao CMN."],"c":1,"exp":"Autorregulação privada, com códigos que somam às normas oficiais."},{"q":"REDENÇÃO: a emissão de certificações profissionais está associada a qual frente da ANBIMA?","alts":["Representar.","Informar.","Educar.","Autorregular."],"c":2,"exp":"Educar: promove educação financeira e emite certificações."}]},{"id":"1.2.12","titulo":"Demais Entidades de Mercado","resumo":["Entidades de mercado representam, organizam e desenvolvem categorias de profissionais, promovendo certificações, boas práticas e capacitação. NÃO são reguladoras.","PLANEJAR: responsável pela certificação CFP no Brasil, voltada a planejadores financeiros pessoais. A FPSB gerencia e controla o uso da marca CFP em diversos países.","ANCORD: certificadora dos Assessores de Investimentos.","APIMEC: certificadora dos analistas de valores mobiliários (CNPI)."],"macete":"PLANEJAR = CFP (planejador). ANCORD = assessor. APIMEC = analista (CNPI).","pegadinha":"A banca troca as siglas entre si. ANCORD tem C de Corretoras e certifica quem trabalha nelas; APIMEC tem A de Analista.","questoes":[{"q":"A entidade certificadora dos Assessores de Investimentos é:","alts":["APIMEC.","PLANEJAR.","ANCORD.","ANBIMA."],"c":2,"exp":"ANCORD certifica assessores. APIMEC certifica analistas (CNPI), PLANEJAR cuida do CFP."},{"q":"A certificação CFP no Brasil é responsabilidade da:","alts":["ANCORD, que certifica os assessores de investimentos.","PLANEJAR, com a marca gerida pela FPSB.","APIMEC, que também concede o CNPI.","CVM, que registra os planejadores financeiros."],"c":1,"exp":"PLANEJAR responde pelo CFP no Brasil; a FPSB gerencia a marca em diversos países."},{"q":"REDENÇÃO: o profissional certificado com o CNPI é o:","alts":["Planejador financeiro pessoal.","Assessor de investimentos.","Analista de valores mobiliários.","Administrador de carteiras."],"c":2,"exp":"CNPI é a certificação do analista, concedida pela APIMEC."}]}],"boss":[{"q":"Classifique: CMN, Banco Central e corretora de valores são, respectivamente, órgãos:","alts":["Supervisor, normativo e operador.","Normativo, supervisor e operador.","Normativo, operador e supervisor.","Operador, normativo e supervisor."],"c":1,"exp":"CMN normatiza, BC supervisiona, corretora opera."},{"q":"Quem preside o CMN e quantos membros ele tem?","alts":["Presidente do BC, 9 membros.","Ministro da Fazenda, 3 membros.","Presidente da República, 5 membros.","Ministro do Planejamento, 3 membros."],"c":1,"exp":"Ministro da Fazenda preside; os outros são Planejamento e presidente do BC."},{"q":"Uma instituição deseja captar por depósito à vista e oferecer cheque especial. Ela deve ser:","alts":["Banco de investimento.","Banco comercial.","Corretora de câmbio.","Sociedade de arrendamento mercantil."],"c":1,"exp":"Depósito à vista e crédito em conta corrente são funções do banco comercial."},{"q":"Um investidor sofre prejuízo por erro de execução de sua corretora numa operação de bolsa. O mecanismo e o limite são:","alts":["FGC, até R$ 250 mil.","MRP, até R$ 200 mil.","MRP, até R$ 250 mil.","FGCOOP, até R$ 200 mil."],"c":1,"exp":"MRP: mantido pela B3, administrado pela BSM, teto de R$ 200 mil."},{"q":"Sobre o Banco Central, assinale a CORRETA:","alts":["Define a meta de inflação e a persegue via Selic.","Tem 9 membros e o mandato do presidente começa no 3º ano.","Tem 9 membros e o mandato do presidente começa no 1º ano.","É composto por presidente e quatro diretores."],"c":1,"exp":"Quem define a meta é o CMN. Presidente + 4 diretores é a CVM."},{"q":"Previdência complementar ABERTA e FECHADA são supervisionadas, respectivamente, por:","alts":["PREVIC e SUSEP.","SUSEP e PREVIC.","CNSP e CNPC.","CVM e SUSEP."],"c":1,"exp":"Aberta = SUSEP. Fechada = PREVIC."},{"q":"Sobre banco de investimento, é CORRETO afirmar:","alts":["Capta por depósito à vista e empresta no curtíssimo prazo.","Empresta a médio e longo prazo e capta por depósito a prazo.","Empresta a médio e longo prazo e é controlado pelos estados.","Atua exclusivamente na intermediação de câmbio."],"c":1,"exp":"Nome obrigatório, captação a prazo e crédito de médio e longo prazo."},{"q":"Debêntures e captação bancária são negociadas:","alts":["Exclusivamente na bolsa de valores.","No mercado de balcão.","Somente no Tesouro Direto.","No SELIC."],"c":1,"exp":"Títulos privados e captação bancária são do mercado de balcão."},{"q":"A entidade que estabelece códigos de conduta adicionais às regulamentações oficiais, sem ser reguladora estatal, é:","alts":["A CVM.","A ANBIMA.","O CMN.","A PREVIC."],"c":1,"exp":"ANBIMA: autorregulação privada com quatro frentes."},{"q":"Assinale a associação CORRETA entre entidade e certificação:","alts":["APIMEC e CFP.","ANCORD e CNPI.","PLANEJAR e CFP.","ANBIMA e CNPI."],"c":2,"exp":"PLANEJAR responde pelo CFP. ANCORD certifica assessores, APIMEC certifica analistas."},{"q":"Sobre a CVM, é CORRETO afirmar:","alts":["Autarquia federal, com presidente e quatro diretores.","Autarquia federal, com presidente e oito diretores.","Entidade autorreguladora vinculada à B3, como a BSM.","Órgão normativo que fixa as regras dos contratos de seguro."],"c":0,"exp":"Autarquia federal, mercado de capitais, estrutura 1 + 4."},{"q":"Cooperativa de crédito e banco de desenvolvimento diferem porque:","alts":["A cooperativa tem fins lucrativos e o de desenvolvimento não.","A cooperativa atende só associados; o outro é estadual.","O de desenvolvimento atende só associados; a cooperativa é estadual.","Ambos são controlados diretamente pelo governo federal."],"c":1,"exp":"Cooperativa: sem fins lucrativos, exclusiva para associados. Desenvolvimento: controle estadual."}]},{"id":"1.3","titulo":"Matemática Financeira e HP12C","subtitulo":"Juros, fluxo de caixa e as teclas da HP12C","niveis":[{"id":"1.3.1","titulo":"Princípios de Matemática Financeira","resumo":["Estuda as relações entre dinheiro e tempo: calcula o valor do dinheiro no passado, presente e futuro considerando juros.","Uma quantia hoje não equivale ao mesmo montante no futuro por dois fatores: a INFLAÇÃO e a PREFERÊNCIA TEMPORAL pelo consumo. Os juros são o prêmio por esperar.","As quatro variáveis: C (Capital, Valor Presente/PV), M (Montante, Valor Futuro/FV), i (Taxa) e n (Tempo).","REGRA DE OURO: o período (n) deve estar na MESMA unidade de tempo da taxa. Taxa mensal exige tempo em meses.","Exemplo do material: R$ 10.000 por 30 dias a 2% ao mês. Na HP12C: f CLX, 10000 Enter, 2 %, visor 200 (juros), 10000 +, visor 10.200 (montante)."],"macete":"Casar a taxa com o prazo é o primeiro passo de QUALQUER questão. Taxa ao mês, prazo em meses.","pegadinha":"A banca dá taxa mensal e prazo em dias esperando que você calcule sem converter. Converta SEMPRE antes de tocar na calculadora.","questoes":[{"q":"Um capital de R$ 10.000 é aplicado por 30 dias a uma taxa de 2% ao mês. Os juros e o montante são, respectivamente:","alts":["R$ 20 e R$ 10.020.","R$ 200 e R$ 10.200.","R$ 600 e R$ 10.600.","R$ 2.000 e R$ 12.000."],"c":1,"exp":"30 dias = 1 mês, então n = 1. 2% de 10.000 = 200 de juros, montante 10.200. HP12C: 10000 Enter, 2 %, 10000 +."},{"q":"A correspondência entre taxa e período é obrigatória porque:","alts":["É uma exigência formal imposta pela CVM às instituições.","Garante a exatidão: taxa mensal exige prazo em meses.","O descasamento só afeta o regime de capitalização simples.","Evita a incidência do imposto de renda sobre o rendimento."],"c":1,"exp":"Unidade incompatível gera resultado errado."},{"q":"REDENÇÃO: os dois fatores que fazem uma quantia hoje não equivaler ao mesmo montante no futuro são:","alts":["Imposto de renda e taxa de administração.","Inflação e preferência temporal pelo consumo.","Risco de crédito e risco de mercado.","Spread bancário e IOF."],"c":1,"exp":"A inflação corrói o poder de compra e o agente valoriza mais o consumo imediato, exigindo compensação para esperar."}]},{"id":"1.3.2","titulo":"Regimes de Capitalização","resumo":["SIMPLES: juros incidem apenas sobre o capital INICIAL. Crescimento LINEAR. VF = VP × (1 + i × n).","Exemplo: R$ 1.000 a 2% a.m. por 12 meses = 1.000 × (1 + 0,02 × 12) = R$ 1.240.","COMPOSTA: juros incidem sobre o capital ACUMULADO. Crescimento EXPONENCIAL. VF = VP × (1 + i)^n.","Mesmo exemplo: 1.000 × (1,02)^12 = R$ 1.268,24.","Na HP12C: f CLX, 1000 CHS PV, 2 i, 12 n, FV → 1.268,24. O CHS é obrigatório porque entrada e saída têm sinais opostos."],"macete":"Simples soma sempre a mesma parcela; composta multiplica. A diferença entre 1.240 e 1.268,24 é o preço dos juros sobre juros.","pegadinha":"Esquecer o CHS na HP12C gera erro. E a banca pergunta em qual regime o montante é maior: no COMPOSTO, para prazos maiores que um período.","questoes":[{"q":"R$ 1.000 aplicados a 2% ao mês por 12 meses. Os montantes em capitalização simples e composta são:","alts":["R$ 1.240,00 e R$ 1.268,24.","R$ 1.268,24 e R$ 1.240,00.","R$ 1.240,00 e R$ 1.240,00.","R$ 1.200,00 e R$ 1.268,24."],"c":0,"exp":"Simples: 1.000 × 1,24 = 1.240. Composta: 1.000 × 1,02^12 = 1.268,24."},{"q":"Na HP12C, para encontrar o valor futuro de R$ 1.000 a 2% ao mês em 12 meses, a sequência correta é:","alts":["1000 PV, 2 i, 12 n, FV.","1000 CHS PV, 2 i, 12 n, FV.","1000 FV, 2 i, 12 n, PV.","1000 CHS FV, 12 i, 2 n, PV."],"c":1,"exp":"O CHS inverte o sinal do PV, porque a aplicação é saída de caixa."},{"q":"A característica que define a capitalização simples é:","alts":["Os juros incidem sobre o capital acumulado, gerando crescimento exponencial.","Os juros incidem exclusivamente sobre o capital inicial, gerando crescimento linear.","A taxa muda a cada período.","O prazo é sempre inferior a um ano."],"c":1,"exp":"Simples = base fixa = crescimento linear."},{"q":"REDENÇÃO: em capitalização composta, R$ 1.000 a 1% ao mês por 6 meses resultam em:","alts":["R$ 1.060,00","R$ 1.061,52","R$ 1.006,00","R$ 1.100,00"],"c":1,"exp":"1.000 × 1,01^6 = 1.061,52. O regime simples daria 1.060."}]},{"id":"1.3.3","titulo":"Equivalência de Taxas","resumo":["Igualar os efeitos financeiros de taxas aplicadas em períodos diferentes para poder comparar.","SIMPLES: taxa PROPORCIONAL, relação linear. Capitalizar: i × n (2% a.m. × 12 = 24% a.a.). Descapitalizar: i ÷ n (18% a.a. ÷ 4 = 4,5% ao trimestre).","COMPOSTA: taxa EQUIVALENTE, cálculo exponencial: [(1 + i)^(q/t) - 1], onde q é o prazo que se QUER e t o prazo que se TEM.","Ex.: 2% a.m. → anual: (1,02)^12 - 1 = 26,82%. Compare com os 24% do simples.","Descapitalização composta: 18% a.a. → trimestral: (1,18)^(1/4) - 1 = 4,22%. Compare com os 4,5% do simples.","Regra do material: ao capitalizar, o composto gera taxa MAIOR; ao descapitalizar, o simples gera taxa proporcional SUPERIOR à equivalente composta."],"macete":"Fórmula única: (1 + i) elevado a QUER/TEM, menos 1. Subindo, o composto ganha; descendo, o simples fica por cima.","pegadinha":"A banca coloca a resposta do regime errado entre as alternativas. Leia se é PROPORCIONAL (simples) ou EQUIVALENTE (composta).","questoes":[{"q":"Uma taxa de 2% ao mês em capitalização composta equivale, ao ano, a:","alts":["24,00%","26,82%","12,00%","22,50%"],"c":1,"exp":"(1,02)^12 - 1 = 26,82%. Os 24% seriam a proporcional do regime simples."},{"q":"Uma taxa de 18% ao ano convertida para o trimestre, nos regimes simples e composto, respectivamente:","alts":["4,50% e 4,22%.","4,22% e 4,50%.","4,50% e 4,50%.","6,00% e 4,22%."],"c":0,"exp":"Simples: 18 ÷ 4 = 4,5%. Composto: (1,18)^(1/4) - 1 = 4,22%."},{"q":"Na fórmula da taxa equivalente [(1 + i)^(q/t) - 1], os termos q e t representam:","alts":["Quantidade de capital e tempo total.","O prazo que se quer dividido pelo prazo que se tem.","Quociente de juros e taxa de tributação.","Quantidade de parcelas e total de períodos."],"c":1,"exp":"Mensal para anual: 12/1. Anual para trimestral: 1/4."},{"q":"REDENÇÃO: uma aplicação rende 1% ao mês em regime composto. A taxa anual equivalente é aproximadamente:","alts":["12,00%","12,68%","10,00%","13,50%"],"c":1,"exp":"(1,01)^12 - 1 = 12,68%."}]},{"id":"1.3.3.1","titulo":"Programando a HP12C","resumo":["A programação acelera o cálculo de taxas equivalentes, mas a apostila alerta: domine também o cálculo manual, pois a programação pode se perder ou você pode precisar de outra calculadora.","Sequência: f [P/R] → f [PRGM] → 1 → RCL i → % → + → X<>y → RCL n → ÷ → y^x → 1 → − → EEX → 2 → × → g GTO 0 → f [P/R].","Uso: insira a taxa que você TEM no campo i, o prazo que ela representa no campo n, digite o prazo que você QUER e pressione R/S.","Exemplo do material: 3% ao mês. Insira 3 em i, 1 em n, digite 12 e R/S → 42,58% ao ano."],"macete":"i recebe a taxa que TENHO, n recebe o prazo dela, digito o prazo que QUERO e aperto R/S.","pegadinha":"Confundir a ordem: n não é o prazo desejado, é o prazo da taxa que você já tem.","questoes":[{"q":"Com a HP12C programada, para converter 3% ao mês em taxa anual você deve:","alts":["Inserir 3 em i, 12 em n e pressionar R/S.","Inserir 3 em i, 1 em n, digitar 12 e pressionar R/S.","Inserir 12 em i, 3 em n e pressionar R/S.","Inserir 3 em PV, 12 em n e pressionar FV."],"c":1,"exp":"i recebe a taxa (3), n o prazo dela (1 mês), e o prazo desejado (12) é digitado antes do R/S."},{"q":"O resultado da conversão de 3% ao mês para taxa anual, em regime composto, é:","alts":["36,00%","42,58%","40,00%","34,39%"],"c":1,"exp":"(1,03)^12 - 1 = 42,58%. Os 36% seriam a proporcional simples."},{"q":"REDENÇÃO: a advertência do material sobre a programação da HP12C é que:","alts":["A programação é proibida durante a aplicação do exame.","Programar dispensa a compreensão dos conceitos envolvidos.","É essencial dominar também o cálculo manual da taxa.","A HP12C não permite armazenar rotinas programadas."],"c":2,"exp":"A comodidade da programação não substitui a compreensão dos conceitos."}]},{"id":"1.3.4","titulo":"Fluxo de Caixa","resumo":["Resumo das entradas e saídas ao longo do tempo. No diagrama, o eixo horizontal é o tempo e o vertical o valor.","PONTO DE VISTA INVERTE TUDO: para o CREDOR, o empréstimo é saída inicial e as parcelas são entradas. Para o TOMADOR, é entrada inicial seguida de saídas.","REGULARES: entradas ou saí
