 abrir capital."},{"q":"REDENÇÃO: em ambas as estruturas (Ltda e S/A), a responsabilidade dos sócios é:","alts":["Ilimitada, alcançando o patrimônio pessoal.","Limitada ao valor das cotas ou das ações que possuem.","Solidária entre todos os sócios.","Definida caso a caso pela CVM."],"c":1,"exp":"Ltda limita ao valor das cotas; S/A limita ao valor das ações."}]},{"id":"2.2.3","titulo":"Tipos de Ações: ON, PN e Units","resumo":["Ação: menor fração do capital social de uma S/A. Quem compra vira SÓCIO.","ORDINÁRIA (ON): dá direito a VOTO nas assembleias.","PREFERENCIAL (PN): NÃO dá voto, mas dá PREFERÊNCIA no recebimento dos lucros. Se a empresa ficar 3 ANOS CONSECUTIVOS sem distribuir lucros, a PN passa a ter direito a voto. Em caso de liquidação, tem precedência no reembolso de capital.","Vantagens ELETIVAS da PN (eletiva vem de escolha, não é obrigatório, mas é comum): dividendo de no mínimo 25% do lucro líquido por ação; dividendo pelo menos 10% MAIOR do que o atribuído a cada ON; ou ser incluída no Tag Along.","Tag Along: direito do acionista de vender suas ações em função da troca de controle da companhia. Proteção do minoritário.","UNITS: pacotes que combinam ON e PN. Tickers: ON termina em 3 (PETR3), PN em 4 (PETR4), Units em 5 ou 11 (SANB11)."],"macete":"3 = Ordinária (ON vota). 4 = Preferencial. 11 = Unit. Três anos sem dividendo e a PN ganha voto.","pegadinha":"A banca afirma que a PN NUNCA vota. Vota sim, depois de 3 anos consecutivos sem distribuição de lucros. E as vantagens da PN são ELETIVAS, ou seja, a companhia escolhe qual conceder.","questoes":[{"q":"Uma companhia deixa de distribuir lucros por três anos consecutivos. A consequência para os acionistas preferenciais é:","alts":["Perdem a preferência no recebimento de dividendos.","Passam a ter direito a voto na assembleia.","São obrigados a vender suas ações.","Recebem tag along de 100% automaticamente."],"c":1,"exp":"Três anos consecutivos sem distribuição e a PN adquire direito a voto."},{"q":"São vantagens eletivas atribuíveis às ações preferenciais, EXCETO:","alts":["Dividendo de no mínimo 25% do lucro líquido por ação.","Dividendo pelo menos 10% maior do que o atribuído a cada ação ordinária.","Ser incluída no tag along.","Direito permanente a dois votos por ação na assembleia."],"c":3,"exp":"Voto duplo não existe entre as vantagens eletivas. A PN, em regra, não vota."},{"q":"O ticker SANB11 identifica:","alts":["Uma ação ordinária, com direito a voto.","Uma ação preferencial, sem direito a voto.","Uma unit, que combina ordinárias e preferenciais.","Um BDR não patrocinado, lastreado no exterior."],"c":2,"exp":"Final 3 é ON, 4 é PN, e 5 ou 11 identificam units."},{"q":"REDENÇÃO: o tag along é definido no material como:","alts":["Comprar novas ações antes da oferta ao público.","Vender as ações em caso de troca de controle.","Receber ações adicionais sem qualquer custo.","Fiscalizar a gestão por meio do conselho fiscal."],"c":1,"exp":"Tag along protege o minoritário na venda do controle. Comprar antes do público é direito de subscrição; receber ações sem custo é bonificação."}]},{"id":"2.2.3.1","titulo":"BDR — Brazilian Depositary Receipt","resumo":["Certificado negociado no Brasil que REPRESENTA ações ou outros ativos estrangeiros. O investidor não compra a ação diretamente, compra o recibo.","Funcionamento: as ações da empresa ficam custodiadas em um banco de investimentos, que emite o recibo lastreado nelas. Esse recibo é negociado no mercado brasileiro.","NÍVEL 1: NÃO requer registro na CVM e opera no mercado de BALCÃO.","NÍVEL 2: exige registro na CVM, negociado em BOLSA, com informações periódicas da empresa.","NÍVEL 3: exige registro na CVM, negociado em bolsa e é objeto de OFERTA PÚBLICA.","NÃO PATROCINADO: emitido sem o envolvimento direto da empresa emissora.","Vantagens: acesso facilitado a ativos globais sem abrir conta no exterior, e diversificação da carteira."],"macete":"Nível 1 é o único sem registro na CVM e o único no balcão. Nível 3 é o único com oferta pública.","pegadinha":"A banca troca os níveis. Grave a escada: 1 = balcão sem registro; 2 = bolsa com registro; 3 = bolsa com registro E oferta pública.","questoes":[{"q":"O BDR que NÃO requer registro na CVM e é negociado no mercado de balcão é o:","alts":["Nível 1.","Nível 2.","Nível 3.","Não patrocinado, exclusivamente."],"c":0,"exp":"Nível 1: sem registro na CVM, mercado de balcão. Níveis 2 e 3 exigem registro e são negociados em bolsa."},{"q":"A característica exclusiva do BDR Nível 3 é:","alts":["Dispensar o registro na CVM e negociar no balcão.","Exigir registro na CVM e negociar em bolsa.","Exigir registro na CVM, negociar em bolsa e ter oferta pública.","Ser emitido sem o envolvimento da empresa estrangeira."],"c":2,"exp":"A oferta pública é o que diferencia o Nível 3 do Nível 2. Emissão sem envolvimento da empresa caracteriza o não patrocinado."},{"q":"REDENÇÃO: ao comprar um BDR, o investidor adquire:","alts":["A ação estrangeira, registrada em seu nome no exterior.","Um certificado que representa o ativo estrangeiro.","Uma cota de fundo de investimento internacional.","Um contrato de derivativo referenciado na ação."],"c":1,"exp":"BDR é recibo lastreado em ações custodiadas no exterior, negociado na bolsa brasileira."}]},{"id":"2.2.4","titulo":"IPO, Follow-on e OPA","resumo":["Para vender ações no mercado, a empresa contrata uma instituição financeira (banco de investimento, corretora, distribuidora) que estrutura a Oferta Pública.","IPO (Initial Public Offering): primeira venda de ações da empresa e início da negociação em bolsa. Os ativos são distribuídos pelo CONSÓRCIO DE DISTRIBUIÇÃO e os investidores compram no MERCADO PRIMÁRIO.","Consórcio de distribuição: bancos e corretoras que alocam lotes a seus clientes, ampliam a divulgação e garantem distribuição geográfica e de perfis, reduzindo concentração e promovendo liquidez.","Quatro pontos do processo: BOOKBUILDING (coleta de intenções para precificação), COLETA DE INTENÇÃO (possível a partir do registro na CVM e da publicação do prospecto preliminar), RISCO DE RATEIO (demanda maior que a oferta gera rateio proporcional) e CRONOGRAMA DE OFERTA (registro por meio do prospecto, com todas as informações da empresa).","GARANTIA FIRME: os bancos coordenadores se comprometem a comprar as ações não vendidas ao mercado, assegurando o capital pretendido. Foi o caso do IPO da Smart Fit em 2021, com captação aproximada de R$ 2,3 bilhões e o Itaú como coordenador líder.","FOLLOW-ON: nova oferta pública de uma empresa JÁ listada, para captar mais recursos ou permitir a venda por acionistas existentes. Tende a ter MENOR volatilidade de precificação que o IPO, pois há histórico de negociação.","OPA (Oferta Pública de Aquisição): proposta formal de compra de ações JÁ em circulação, para assumir o controle ou retirar a empresa da bolsa. Os acionistas decidem vender ou manter: NÃO há obrigação de venda."],"macete":"IPO = estreia (primário). Follow-on = bis. OPA = alguém quer comprar o que já circula. Garantia firme = o banco fica com o encalhe.","pegadinha":"A banca diz que na OPA o acionista é obrigado a vender. Não é. E confunde follow-on com OPA: no follow-on a EMPRESA oferta ações; na OPA alguém quer COMPRAR ações que já circulam.","questoes":[{"q":"Uma empresa já listada em bolsa realiza nova oferta pública de ações para captar recursos. Trata-se de:","alts":["IPO.","Follow-on.","OPA.","Bookbuilding."],"c":1,"exp":"Follow-on é a oferta subsequente. O IPO é a primeira. A OPA é oferta de COMPRA de ações em circulação."},{"q":"No IPO da Smart Fit, os bancos coordenadores se comprometeram a comprar as ações não vendidas ao mercado. Esse mecanismo é chamado de:","alts":["Melhores esforços.","Garantia firme.","Lote suplementar.","Rateio proporcional."],"c":1,"exp":"Garantia firme: o coordenador assume o risco de encalhe e assegura o capital pretendido pela empresa."},{"q":"Sobre a OPA, é CORRETO afirmar:","alts":["É a primeira venda de ações no mercado primário.","É proposta de compra de ações já em circulação.","É proposta de compra que obriga o minoritário a vender.","Só pode ser feita por empresas de capital fechado."],"c":1,"exp":"Compra de ações em circulação, com adesão voluntária. Não há obrigação de venda."},{"q":"REDENÇÃO: no IPO, os investidores compram as ações no:","alts":["Mercado secundário, comprando de outros investidores.","Mercado primário, pelo consórcio de distribuição.","Mercado de balcão não organizado, via corretora.","Leilão da Secretaria do Tesouro Nacional."],"c":1,"exp":"IPO acontece no mercado primário: o dinheiro vai para a empresa. No secundário o dinheiro vai de um investidor para outro."}]},{"id":"2.2.4.1","titulo":"Bookbuilding, Rateio e Lotes","resumo":["BOOKBUILDING: coleta de intenções de investimento junto a investidores INSTITUCIONAIS, para medir a demanda e definir o preço das ações antes da oferta. O banco faz rodadas com gestores de fundos, apresenta os dados financeiros e colhe a que preço comprariam. O processo NÃO É VINCULANTE: é coleta de intenções, não ordem de compra.","RATEIO: distribuição proporcional das ações entre os investidores quando a procura supera a quantidade ofertada.","LOTE ADICIONAL: quantidade extra limitada a 25% da oferta original, que a empresa pode emitir sem nova autorização da CVM, para aproveitar o excesso de demanda e ampliar a captação.","LOTE SUPLEMENTAR: quantidade extra de até 15%, disponibilizada para que o FORMADOR DE MERCADO possa estabilizar o preço do papel recém-listado.","Formador de mercado (market maker): se há muitos compradores e poucos vendedores, ele VENDE para conter a alta; se há muitos vendedores e poucos compradores, ele COMPRA para sustentar o preço.","Todos esses mecanismos valem para qualquer oferta pública de valores mobiliários, incluindo FII, debêntures, CRI e CRA."],"macete":"AdiCional = 25% (o A vem antes e é o maior). Suplementar = 15%, e é do market maker. Bookbuilding não vincula ninguém.","pegadinha":"A troca dos percentuais é a pegadinha número um: adicional 25%, suplementar 15%. E a banca afirma que o bookbuilding é uma ordem firme de compra: não é, é coleta de intenções.","questoes":[{"q":"Os limites do lote adicional e do lote suplementar são, respectivamente:","alts":["15% e 25%.","25% e 15%.","20% e 20%.","25% e 25%."],"c":1,"exp":"Lote adicional: até 25% da oferta original, para aproveitar demanda. Lote suplementar: até 15%, destinado à estabilização pelo formador de mercado."},{"q":"Sobre o bookbuilding, é CORRETO afirmar:","alts":["É a ordem de compra definitiva dos institucionais.","É a coleta não vinculante de intenções dos institucionais.","É a distribuição proporcional em caso de excesso de demanda.","É a atuação do formador de mercado no secundário."],"c":1,"exp":"Coleta de intenções, não vinculante. Distribuição proporcional é rateio."},{"q":"Um papel recém-listado sofre com excesso de vendedores e o preço despenca. A atuação esperada do formador de mercado é:","alts":["Vender ações para aumentar a liquidez.","Comprar ações para sustentar o preço.","Suspender a negociação do papel.","Solicitar novo lote adicional à CVM."],"c":1,"exp":"Muitos vendedores e poucos compradores: o market maker compra. No cenário inverso, ele vende para conter a alta."},{"q":"REDENÇÃO: os mecanismos de bookbuilding, rateio e lotes aplicam-se:","alts":["Exclusivamente a IPOs de ações em bolsa.","A qualquer oferta pública de valores mobiliários.","Somente a ofertas superiores a R$ 1 bilhão.","Apenas às negociações do mercado secundário."],"c":1,"exp":"O material é explícito: qualquer oferta pública de valores mobiliários pode envolver esses elementos."}]},{"id":"2.2.5","titulo":"Direitos dos Acionistas","resumo":["VOTO na assembleia: um voto por ação para os ordinaristas. Preferencialistas adquirem o voto após 3 anos consecutivos sem distribuição de dividendos.","PARTICIPAÇÃO NOS LUCROS: direito aos dividendos, condicionado à política e à saúde financeira da empresa.","PARTICIPAÇÃO NO ACERVO em caso de liquidação: os acionistas recebem o que sobrar após o pagamento de todas as dívidas. São os ÚLTIMOS da fila, depois de credores como bancos e funcionários.","PREFERÊNCIA DE SUBSCRIÇÃO: comprar as novas ações emitidas ANTES de serem oferecidas ao público, evitando a diluição da participação.","RETIRAR-SE DA SOCIEDADE: vender as ações no mercado a qualquer momento.","FISCALIZAR a gestão: eleger conselho fiscal em assembleia e acessar os documentos financeiros, públicos no caso de companhia aberta, disponíveis no site de Relações com Investidores (RI)."],"macete":"Na liquidação, o acionista é o ÚLTIMO da fila. Subscrição protege contra diluição. Fiscalização se faz pelo conselho fiscal e pelo site de RI.","pegadinha":"A banca coloca o acionista recebendo antes dos credores na liquidação. Nunca: primeiro os credores, depois o que sobrar vai aos sócios.","questoes":[{"q":"Na liquidação de uma companhia, os acionistas:","alts":["Recebem antes dos credores, por serem os donos.","Recebem só depois de quitadas todas as dívidas.","Recebem em igualdade com os credores quirografários.","Têm garantia do FGC até o limite de R$ 250 mil."],"c":1,"exp":"Sócio é o último da fila: recebe o que sobrar depois de bancos, funcionários e demais credores."},{"q":"O direito que permite ao acionista comprar novas ações antes de serem oferecidas ao público, evitando a diluição de sua participação, é:","alts":["Tag along.","Preferência de subscrição.","Bonificação.","Direito de retirada."],"c":1,"exp":"Subscrição protege a participação proporcional em novas emissões."},{"q":"REDENÇÃO: o órgão que os acionistas podem eleger em assembleia para fiscalizar a gestão da empresa é:","alts":["O conselho de administração.","O conselho fiscal.","O comitê de auditoria da CVM.","A diretoria executiva."],"c":1,"exp":"O conselho fiscal atua em nome dos acionistas na fiscalização da gestão."}]},{"id":"2.2.6","titulo":"Remuneração dos Acionistas","resumo":["GANHO DE CAPITAL: lucro obtido na venda por preço superior ao de compra. Vem exclusivamente do mercado, da oferta e demanda.","DIVIDENDOS: parcela do LUCRO distribuída aos acionistas, decidida pelo conselho de administração. O percentual obrigatório é o que consta no ESTATUTO. Se o estatuto for OMISSO, o mínimo é 50% do lucro líquido. Se a assembleia quiser incluir um percentual no estatuto em caso de omissão, o mínimo a ser incluído é 25%.","JUROS SOBRE CAPITAL PRÓPRIO (JCP): pago em dinheiro como os dividendos, ocorre quando a empresa retém parte do lucro para reinvestir.","BONIFICAÇÃO: a empresa aumenta o capital social emitindo novas ações e concede ações adicionais SEM CUSTO aos acionistas, para manter a participação proporcional. Ocorre ao capitalizar reservas ou incorporá-las ao capital social."],"macete":"Estatuto omisso = 50%. Assembleia querendo fixar um percentual para o caso de omissão = mínimo 25%. Bonificação é ação de graça; subscrição é ação com preferência de compra.","pegadinha":"Os dois números (50% e 25%) são trocados o tempo todo pela banca. Omissão pura leva a 50%. O 25% é o piso do que a assembleia pode inserir no estatuto.","questoes":[{"q":"O estatuto de uma companhia é omisso quanto ao percentual de dividendos obrigatórios. O percentual mínimo aplicável é:","alts":["25% do lucro líquido.","50% do lucro líquido.","10% do lucro líquido.","Não há dividendo obrigatório nesse caso."],"c":1,"exp":"Estatuto omisso: 50% do lucro líquido. Os 25% são o piso que a assembleia pode incluir no estatuto para reger o caso de omissão."},{"q":"A empresa concede aos acionistas ações adicionais sem qualquer custo, ao capitalizar reservas. Trata-se de:","alts":["Dividendo.","Juros sobre capital próprio.","Bonificação.","Desdobramento."],"c":2,"exp":"Bonificação: ações novas sem custo para manter a participação proporcional. O desdobramento não aumenta o capital social, apenas divide as ações existentes."},{"q":"REDENÇÃO: o ganho obtido pela venda de uma ação comprada por R$ 10 e vendida por R$ 20 é classificado como:","alts":["Dividendo.","Juros sobre capital próprio.","Ganho de capital.","Bonificação."],"c":2,"exp":"Ganho de capital vem exclusivamente do mercado: compra barato, vende caro."}]},{"id":"2.2.7","titulo":"Eventos Societários","resumo":["AGRUPAMENTO (INPLIT): combina várias ações em uma única de valor proporcionalmente maior. REDUZ a quantidade de ações e AUMENTA o preço de cada uma. Objetivo: minimizar o RISCO DE MERCADO (uma ação de R$ 0,10 oscila 10% ao virar R$ 0,11).","DESDOBRAMENTO (SPLIT): o inverso. AUMENTA a quantidade de ações e REDUZ o preço de cada uma. Objetivo: minimizar o RISCO DE LIQUIDEZ, tornando o lote padrão acessível. Exemplo: uma ação de R$ 100 vira 10 ações de R$ 10.","Nem o inplit nem o split alteram o patrimônio da empresa ou do cliente: mudam apenas a quantidade de ações.","Na B3 negocia-se lote padrão de 100 ações (mais liquidez) ou o fracionário de 1 a 99, identificado pela letra F no ticker (ex.: PETR3F).","TAG ALONG: se os majoritários venderem o controle, os minoritários podem vender nas mesmas condições. Por LEI, as ações ORDINÁRIAS têm tag along de no mínimo 80% do valor pago aos majoritários."],"macete":"InPlit = Preço sobe, quantidade cai, combate risco de MERCADO. SPlit = Preço cai, quantidade sobe, combate risco de LIQUIDEZ. Tag along legal da ON: 80%.","pegadinha":"Split e inplit são invertidos o tempo todo, e a banca associa o objetivo errado. Fixe o par: inplit combate risco de mercado, split combate risco de liquidez.","questoes":[{"q":"Uma ação cotada a R$ 100 é transformada em 10 ações de R$ 10. Esse evento é um:","alts":["Agrupamento de ações (inplit), para reduzir o risco de mercado.","Desdobramento (split), para reduzir o risco de liquidez.","Bonificação, pois o acionista recebe mais ações.","Grupamento, para reduzir o número de acionistas."],"c":1,"exp":"Split aumenta a quantidade e reduz o preço, tornando o lote padrão acessível e combatendo o risco de liquidez. Não confunda com bonificação: aqui não há aumento de capital social."},{"q":"O tag along mínimo garantido por lei às ações ordinárias é de:","alts":["100% do valor pago aos majoritários.","80% do valor pago aos majoritários.","70% do valor de mercado.","Não há garantia legal, apenas estatutária."],"c":1,"exp":"Por lei, ON tem no mínimo 80%. Os 100% aparecem nos segmentos de governança Nível 2 e Novo Mercado."},{"q":"O objetivo do agrupamento (inplit) é:","alts":["Elevar a liquidez do papel dentro do lote padrão.","Reduzir a quantidade de ações e o risco de mercado.","Distribuir parte dos lucros aos acionistas.","Diluir a participação relativa dos acionistas minoritários."],"c":1,"exp":"Ações de centavos oscilam percentualmente demais. O inplit eleva o preço unitário e reduz essa volatilidade."},{"q":"REDENÇÃO: sobre o efeito patrimonial de split e inplit:","alts":["Ambos aumentam o patrimônio do acionista.","Nenhum altera o patrimônio: muda só a quantidade.","O split reduz o patrimônio do acionista pela metade.","O inplit aumenta o capital social da companhia."],"c":1,"exp":"É pura alteração na quantidade de ações. O bolo é o mesmo, muda o número de fatias."}]},{"id":"2.2.8","titulo":"Governança Corporativa","resumo":["Conjunto de mecanismos de incentivo e controle que assegura decisões alinhadas aos objetivos de longo prazo. Mecanismos destacados: conselho de administração ativo e independente; maioria obrigatória de conselheiros independentes com boa reputação e experiência; comitê de auditoria composto EXCLUSIVAMENTE por membros independentes.","NÍVEL 1: free float mínimo de 20% (regra geral) ou 15% (regra alternativa); mínimo de 3 conselheiros, dos quais pelo menos 20% independentes, mandato unificado de até 2 anos; calendário de eventos corporativos; tag along de 80% para ON.","NÍVEL 2: tudo do Nível 1; mínimo de 5 conselheiros com pelo menos 20% independentes; demonstrações financeiras traduzidas para o INGLÊS; 100% de tag along para ON E PN.","NOVO MERCADO: tudo do Nível 2; SOMENTE ações ON; mínimo de 3 conselheiros, dos quais pelo menos 2 ou 20% (o que for maior) independentes; demonstrações conforme legislação; 100% de tag along para ON.","Regra alternativa de free float (15%): se o ADTV (volume de negociação diária) for igual ou superior a R$ 20 milhões nos últimos 12 meses; ou no ingresso simultâneo ao IPO, quando a oferta superar R$ 2 bilhões, ou ficar entre R$ 1 bilhão e R$ 2 bilhões com as contrapartidas do regulamento. Nesse caso o free float pode ficar em 15% por 18 meses, e ao final o ADTV deve atingir R$ 20 milhões consistentes por 6 meses.","Bovespa Mais e Bovespa Mais Nível 2: para empresas que ainda não abriram capital, mas se preparam para isso."],"macete":"Nível 1: 3 conselheiros, tag along 80%. Nível 2: 5 conselheiros, inglês, 100% para ON e PN. Novo Mercado: só ON, 100% de tag along.","pegadinha":"A pegadinha estrela do Novo Mercado: como só existem ações ON, o tag along de 100% é para ON. E cuidado com o número de conselheiros: 3 no Nível 1, 5 no Nível 2, e de volta a 3 no Novo Mercado.","questoes":[{"q":"O segmento de listagem que admite SOMENTE ações ordinárias é:","alts":["Nível 1.","Nível 2.","Novo Mercado.","Bovespa Mais Nível 2."],"c":2,"exp":"Novo Mercado exige capital composto exclusivamente por ações ON, com 100% de tag along."},{"q":"A exigência de demonstrações financeiras traduzidas para o inglês e de 100% de tag along para ON e PN caracteriza o:","alts":["Nível 1.","Nível 2.","Novo Mercado.","Bovespa Mais."],"c":1,"exp":"Tradução para o inglês e tag along de 100% para os dois tipos de ação são marcas do Nível 2. O Novo Mercado não tem PN."},{"q":"O número mínimo de membros do conselho de administração no Nível 1 e no Nível 2 é, respectivamente:","alts":["3 e 5.","5 e 3.","3 e 3.","5 e 7."],"c":0,"exp":"Nível 1 exige 3; Nível 2 exige 5. Em ambos, pelo menos 20% devem ser independentes, com mandato unificado de até 2 anos."},{"q":"REDENÇÃO: a regra alternativa de free float de 15% pode ser aplicada quando:","alts":["O ADTV for de R$ 20 milhões nos últimos 12 meses.","A empresa tiver mais de 1.000 acionistas na base.","O tag along oferecido for de 100% para as ordinárias.","A empresa migrar do Novo Mercado para o Nível 1."],"c":0,"exp":"ADTV de R$ 20 milhões em 12 meses, ou ingresso junto ao IPO com oferta acima de R$ 2 bilhões (ou entre R$ 1 e 2 bilhões com contrapartidas)."}]},{"id":"2.2.9","titulo":"Índices de Ações","resumo":["Índices de mercado são CARTEIRAS TEÓRICAS de ações usadas para medir o desempenho médio de um grupo de empresas listadas.","IBOVESPA: mais importante indicador do desempenho médio das cotações na B3. Formado pelas ações com maior VOLUME negociado nos últimos meses. Reavaliado a cada QUATRO MESES. Composto por ações e units que atendem à metodologia, correspondendo a cerca de 85% do número de negócios e do volume financeiro. PENNY STOCKS são excluídas.","Penny stocks: ações com valor abaixo de R$ 1,00.","IBrX 100: desempenho médio dos 100 ativos de maior negociabilidade e representatividade. IBrX 50: os 50 ativos de maior negociabilidade e representatividade.","Os índices são medidos em PONTOS, o que permite comparações globais sem a interferência das flutuações monetárias locais."],"macete":"Ibovespa: reavaliado a cada 4 meses, cerca de 85% dos negócios, sem penny stock. IBrX vem em duas versões: 100 e 50.","pegadinha":"A banca diz que o Ibovespa é reavaliado anualmente ou trimestralmente. É quadrimestral, a cada quatro meses. E não esqueça: penny stocks (abaixo de R$ 1,00) ficam de fora.","questoes":[{"q":"A periodicidade de reavaliação da carteira teórica do Ibovespa é:","alts":["Mensal, no último pregão de cada mês.","Trimestral, a cada três meses.","Quadrimestral, a cada quatro meses.","Anual, no fechamento do exercício."],"c":2,"exp":"A cada quatro meses. O índice representa cerca de 85% do número de negócios e do volume financeiro do mercado."},{"q":"São excluídas da carteira do Ibovespa:","alts":["As units de bancos e holdings.","As ações preferenciais emitidas sem direito a voto.","As penny stocks, cotadas abaixo de R$ 1,00.","As ações de empresas do Novo Mercado."],"c":2,"exp":"Penny stocks ficam de fora. Units, ao contrário, compõem o índice."},{"q":"REDENÇÃO: o IBrX 50 mede:","alts":["As 50 empresas de maior valor de mercado do país.","Os 50 ativos de maior negociabilidade do mercado.","As 50 ações de menor cotação negociadas na bolsa.","As 50 empresas listadas no segmento Novo Mercado."],"c":1,"exp":"O critério é negociabilidade e representatividade, não valor de mercado."}]},{"id":"2.2.10","titulo":"Tributação: Swing Trade e Day Trade","resumo":["SWING TRADE / BUY AND HOLD (compra e venda em dias diferentes): alíquota de 15% sobre o lucro. Recolhimento pelo PRÓPRIO INVESTIDOR via DARF, apurado no mês da negociação e recolhido até o ÚLTIMO DIA ÚTIL DO MÊS SUBSEQUENTE.","A corretora retém na fonte 0,005% sobre o VALOR TOTAL DA ALIENAÇÃO, o famoso 'dedo duro', que informa a Receita sobre a movimentação. Dispensado se o valor for igual ou inferior a R$ 1,00.","ISENÇÃO: investidor PF que vende, dentro do mesmo mês, até R$ 20.000, está isento de IR. Vale só para swing trade.","Exemplo do material: compra de R$ 100.000, venda por R$ 120.000. Lucro de R$ 20.000. Retenção na fonte: 0,005% de 120.000 = R$ 6. DARF: 15% de 20.000 = R$ 3.000, menos os R$ 6 retidos, resultando em R$ 2.994 a recolher.","DAY TRADE (compra e venda no MESMO dia): alíquota de 20%. Também recolhido via DARF pelo investidor, no mesmo prazo. O dedo duro aqui é de 1% sobre o LUCRO. NÃO tem o benefício de isenção até R$ 20.000.","COMPENSAÇÃO DE PERDAS: só entre operações da MESMA NATUREZA. Prejuízo de day trade compensa lucro de day trade; swing compensa swing. Pode ser feita a qualquer tempo, desde que informada na declaração anual.","Toda operação no mercado de ações é LIVRE DE IOF."],"macete":"Swing: 15%, dedo duro 0,005% sobre a VENDA, isenção de R$ 20 mil/mês. Day: 20%, dedo duro 1% sobre o LUCRO, sem isenção.","pegadinha":"Duas armadilhas mortais: aplicar a isenção de R$ 20 mil no day trade (não existe) e trocar as bases do dedo duro (0,005% incide sobre a VENDA TOTAL; o 1% incide sobre o LUCRO).","questoes":[{"q":"Um investidor PF vende ações no mesmo dia da compra, com lucro. A alíquota de IR e a base do imposto retido na fonte são, respectivamente:","alts":["15% e 0,005% sobre o valor da venda.","20% e 1% sobre o lucro.","20% e 0,005% sobre o valor da venda.","15% e 1% sobre o lucro."],"c":1,"exp":"Day trade: 20% sobre o lucro e dedo duro de 1% sobre o lucro. O 0,005% sobre a venda é do swing trade."},{"q":"Um investidor PF vende R$ 18.000 em ações no mês, com lucro de R$ 4.000, em operações de swing trade. O IR devido é:","alts":["R$ 600, correspondente a 15% do lucro.","Zero, pois as vendas no mês não ultrapassaram R$ 20.000.","R$ 800, correspondente a 20% do lucro.","R$ 2.700, correspondente a 15% do valor da venda."],"c":1,"exp":"A isenção considera o VALOR DAS VENDAS no mês (até R$ 20.000), não o lucro. Como vendeu R$ 18.000, está isento."},{"q":"Um investidor teve prejuízo de R$ 5.000 em day trade em janeiro e lucro de R$ 8.000 em swing trade em março. Sobre a compensação:","alts":["Pode compensar tudo, pagando IR sobre R$ 3.000.","Não pode: só se compensa dentro da mesma natureza.","Pode compensar metade do prejuízo apurado.","Só pode compensar se ambos ocorrerem no mesmo mês."],"c":1,"exp":"Day trade compensa day trade; swing compensa swing. A compensação pode ser feita a qualquer tempo, mas nunca entre naturezas diferentes."},{"q":"REDENÇÃO: o prazo para recolhimento do IR sobre ganhos em ações é:","alts":["Retido na fonte pela corretora, sem ação do investidor.","Via DARF, até o último dia útil do mês seguinte.","Via DARF, até 30 de abril, na declaração anual.","Via DARF, no mesmo dia útil da venda das ações."],"c":1,"exp":"O investidor apura no mês da negociação e recolhe via DARF até o último dia útil do mês seguinte."}]},{"id":"2.2.10.1","titulo":"Tributação de Dividendos e JCP","resumo":["Até novembro de 2025 os dividendos eram integralmente isentos, sem qualquer teto.","REGRA VIGENTE DESDE 1º DE JANEIRO DE 2026: limite de isenção de R$ 50.000 POR MÊS, POR EMPRESA. Recebendo acima disso de uma única companhia, há retenção de IR na fonte de 10% SOBRE TODO O VALOR.","O limite NÃO se acumula entre emissores diferentes. Exemplo do material: R$ 60.000 de uma companhia e R$ 40.000 de outra faz apenas a primeira ser tributada.","Outro exemplo: em março de 2026, R$ 55.000 da companhia A, R$ 30.000 da B e R$ 25.000 da C. Só a companhia A gera retenção.","JCP: é despesa financeira para a companhia, reduzindo a base do IR corporativo. Para o investidor há retenção na fonte de 17,5%, INDEPENDENTEMENTE do valor. A retenção é automática, e o investidor recebe já líquido."],"macete":"Dividendo: R$ 50 mil por mês por empresa é o teto da isenção; passou disso, 10% sobre tudo. JCP: 17,5% sempre, sem teto e sem escapatória.","pegadinha":"Duas armadilhas: somar os dividendos de empresas diferentes para comparar com o teto (não se acumula) e aplicar os 10% só sobre o excedente (incide sobre TODO o valor).","questoes":[{"q":"Em 2026, um investidor recebe R$ 60.000 de dividendos da empresa A e R$ 40.000 da empresa B no mesmo mês. A tributação será:","alts":["Retenção de 10% sobre o total de R$ 100.000, pois ultrapassa o teto.","Retenção de 10% apenas sobre os R$ 60.000 da empresa A; os R$ 40.000 da B permanecem isentos.","Retenção de 10% sobre os R$ 10.000 que excedem o teto na empresa A.","Isenção total, pois cada valor considerado isoladamente é inferior a R$ 100.000."],"c":1,"exp":"O teto é por empresa e não se acumula. Ultrapassado o limite, os 10% incidem sobre TODO o valor recebido daquela companhia, não só sobre o excedente."},{"q":"A tributação do JCP na esfera do investidor é:","alts":["Isenta até R$ 50.000 por mês, por empresa.","Retenção na fonte de 17,5%, independentemente do valor.","Retenção de 10% sobre o valor que exceder R$ 50.000.","Tributação pela tabela regressiva conforme o prazo."],"c":1,"exp":"JCP tem retenção automática de 17,5% sobre o valor bruto, sem teto. O investidor recebe líquido."},{"q":"A diferença contábil essencial entre dividendo e JCP para a companhia é:","alts":["O dividendo reduz a base do IR corporativo e o JCP não.","O JCP é despesa financeira e reduz a base do IR.","Ambos reduzem a base de cálculo do IR corporativo.","Nenhum dos dois afeta a apuração fiscal da companhia."],"c":1,"exp":"É por isso que muitas empresas preferem o JCP: economizam imposto na pessoa jurídica."},{"q":"REDENÇÃO: um investidor recebe R$ 45.000 de dividendos de uma única empresa em março de 2026. A tributação será:","alts":["Retenção de 10% na fonte sobre o valor recebido.","Isenção, pois está abaixo de R$ 50.000 no mês.","Retenção de 17,5% na fonte sobre o valor recebido.","Tributação pela tabela regressiva conforme o prazo."],"c":1,"exp":"Abaixo do teto de R$ 50 mil por mês por empresa, a isenção permanece. Os 17,5% são do JCP."}]}],"boss":[{"q":"Assinale a alternativa que descreve corretamente a ação preferencial:","alts":["Dá voto permanente e preferência nos dividendos.","Não vota em regra, mas adquire o voto após 3 anos.","Não vota em regra e só adquire o voto após 5 anos.","Tem tag along legal obrigatório de 80% do valor."],"c":1,"exp":"O tag along legal de 80% é da ON, e o Novo Mercado só admite ON."},{"q":"Uma empresa realiza IPO e a demanda supera a oferta. Para ampliar a captação sem nova autorização da CVM, pode emitir lote adicional de até:","alts":["15%","20%","25%","30%"],"c":2,"exp":"Lote adicional: até 25%. O suplementar, de 15%, serve à estabilização pelo formador de mercado."},{"q":"Investidor PF vende R$ 25.000 em ações no mês (swing trade) com lucro de R$ 5.000. O IR devido é:","alts":["Zero, pela isenção mensal.","R$ 750, correspondente a 15% do lucro.","R$ 1.000, correspondente a 20% do lucro.","R$ 3.750, correspondente a 15% da venda."],"c":1,"exp":"As vendas ultrapassaram R$ 20.000 no mês, então a isenção não se aplica. 15% sobre o lucro de R$ 5.000 = R$ 750."},{"q":"O BDR negociado em bolsa, com registro na CVM e objeto de oferta pública, é o:","alts":["Nível 1.","Nível 2.","Nível 3.","Não patrocinado."],"c":2,"exp":"A oferta pública é a marca do Nível 3."},{"q":"Um agrupamento (inplit) tem por objetivo:","alts":["Aumentar a quantidade de ações e a liquidez do papel.","Reduzir a quantidade de ações e o risco de mercado.","Distribuir ações gratuitas aos atuais acionistas.","Aumentar o capital social por subscrição pública."],"c":1,"exp":"Inplit: menos ações, preço maior, menos oscilação percentual."},{"q":"No Novo Mercado, o tag along e o tipo de ação admitido são:","alts":["80% e apenas ON.","100% e apenas ON.","100% para ON e PN.","80% para ON e 100% para PN."],"c":1,"exp":"Novo Mercado: 100% de tag along e somente ações ordinárias. O tag along de 100% para ON e PN é do Nível 2."},{"q":"Em 2026, um investidor recebe R$ 80.000 de dividendos de uma única empresa em um mês. O imposto retido será:","alts":["Zero, pois os dividendos seguem isentos.","10% sobre R$ 30.000, apenas o valor excedente.","10% sobre os R$ 80.000, pois o teto foi superado.","17,5% sobre os R$ 80.000 recebidos no mês."],"c":2,"exp":"Ultrapassado o teto de R$ 50 mil, a retenção de 10% incide sobre TODO o valor. Os 17,5% são do JCP."},{"q":"O processo não vinculante de coleta de intenções junto a investidores institucionais para precificar uma oferta é o:","alts":["Rateio.","Bookbuilding.","Follow-on.","Underwriting de melhores esforços."],"c":1,"exp":"Bookbuilding define o preço da oferta a partir das intenções colhidas com os institucionais."},{"q":"Sobre o Ibovespa, é CORRETO afirmar:","alts":["É anual e reúne todas as ações listadas na B3.","É quadrimestral e exclui as penny stocks.","É quadrimestral e reúne só ordinárias do Novo Mercado.","É quadrimestral e mede as 100 de maior negociabilidade."],"c":1,"exp":"As 100 de maior negociabilidade formam o IBrX 100, não o Ibovespa."},{"q":"O estatuto de uma companhia estabelece dividendo obrigatório de 30% do lucro líquido. Nesse caso:","alts":["Prevalece o mínimo legal de 50%.","Prevalece o percentual do estatuto: 30%.","Prevalece o mínimo de 25%.","A companhia fica dispensada de distribuir dividendos."],"c":1,"exp":"O percentual obrigatório é o que consta no estatuto. Os 50% só valem quando o estatuto é omisso."},{"q":"Uma sociedade limitada deseja captar recursos emitindo ações. Isso é:","alts":["Possível, desde que registre a oferta pública na CVM.","Impossível: a Ltda tem cotas e não emite ações.","Possível apenas no segmento Bovespa Mais.","Possível se converter suas cotas em units."],"c":1,"exp":"Emitir ações exige S/A. A Ltda teria que se transformar em sociedade anônima antes."},{"q":"Um investidor detém ações ordinárias e o controlador vende o controle da companhia. O direito que permite ao minoritário vender nas mesmas condições é:","alts":["Preferência de subscrição.","Tag along.","Bonificação.","Direito de retirada por dissidência."],"c":1,"exp":"Tag along: por lei, no mínimo 80% do valor pago aos majoritários para as ON."}]},{"id":"2.3","titulo":"COE","subtitulo":"Renda fixa, variável e derivativos no mesmo pacote","niveis":[{"id":"2.3.1","titulo":"COE: introdução e derivativos","resumo":["COE (Certificado de Operações Estruturadas): solução que integra características de vários produtos financeiros, dando acesso a ações, moedas, índices e commodities sem negociar diretamente esses ativos.","DERIVATIVOS: contratos financeiros cujo valor está associado a um ATIVO SUBJACENTE. Usados principalmente para PROTEÇÃO (hedge) e ALAVANCAGEM.","Exemplo do material: em vez de desembolsar R$ 30.000 para comprar 1.000 ações da Petrobras a R$ 30, o investidor adquire um contrato de derivativo por R$ 1.000 que lhe garante o direito de comprar por R$ 30 no futuro. Se a ação for a R$ 33, o lucro se realiza com capital inicial muito menor.","O COE aproveita a lógica dos derivativos: o retorno é baseado no desempenho de um ativo ou conjunto de ativos, sem que o investidor os compre diretamente."],"macete":"Derivativo deriva de outra coisa. Dois usos: hedge (proteção) e alavancagem (fazer mais com menos capital).","pegadinha":"A banca apresenta o derivativo apenas como instrumento especulativo. O material lista DOIS usos principais: proteção e alavancagem.","questoes":[{"q":"Derivativos são definidos no material como:","alts":["Títulos de dívida corporativa emitidos por empresas não financeiras.","Contratos cujo valor está associado a um ativo subjacente.","Cotas de fundos que replicam índices de referência.","Certificados que representam ações estrangeiras."],"c":1,"exp":"Ativo subjacente é a chave. Certificados de ações estrangeiras são BDR; cotas que replicam índices são ETF."},{"q":"Ao investir em um COE, o investidor:","alts":["Compra diretamente as ações, moedas ou commodities.","Obtém retorno do desempenho dos ativos sem comprá-los.","Adquire cotas de um fundo de investimento imobiliário.","Empresta recursos ao Tesouro Nacional por prazo fixo."],"c":1,"exp":"O COE entrega a exposição ao desempenho sem a compra direta dos ativos."},{"q":"REDENÇÃO: os dois usos principais dos derivativos, conforme o material, são:","alts":["Arbitragem e securitização.","Proteção (hedge) e alavancagem.","Custódia e liquidação.","Isenção fiscal e portabilidade."],"c":1,"exp":"Hedge e alavancagem. E na alavancagem, o capital inicial exigido é bem menor."}]},{"id":"2.3.1.1","titulo":"COE: modalidades e tributação","resumo":["O COE mescla elementos de renda fixa, renda variável e derivativos. Com alavancagem via derivativos, pode prometer ganhos superiores: se o S&P 500 sobe 10%, um COE pode oferecer de 20% a 30%, conforme a estrutura.","Mas a alavancagem corta dos dois lados: também amplia o impacto negativo se o ativo subjacente for mal.","CAPITAL NOMINAL PROTEGIDO: o investidor não corre risco de perder o investimento. Na pior hipótese, resgata 100% do valor investido ao final, SEM QUALQUER CORREÇÃO.","CAPITAL NOMINAL EM RISCO: o investidor pode perder tudo ou parte do que investiu, se a estratégia não for vencedora.","TRIBUTAÇÃO: o COE segue a TABELA REGRESSIVA de IR da renda fixa, INDEPENDENTEMENTE do que esteja dentro dele."],"macete":"Protegido devolve o valor nominal sem correção (você perde para a inflação, não o principal). Em risco pode devolver menos. E a tributação é sempre a regressiva da renda fixa.","pegadinha":"A banca diz que o capital protegido devolve o valor CORRIGIDO. Não devolve: é 100% do nominal, sem correção. E tenta aplicar 15% de renda variável porque o COE tem ações dentro: a tabela é a regressiva.","questoes":[{"q":"Um COE de capital nominal protegido tem desempenho negativo do ativo subjacente. Ao final, o investidor:","alts":["Perde parte do capital, proporcionalmente à queda.","Resgata 100% do valor investido, sem qualquer correção.","Resgata o valor investido corrigido pelo CDI.","Recebe ações do ativo subjacente."],"c":1,"exp":"Protegido devolve o nominal integral, mas sem correção. Ou seja, o custo é o de oportunidade e a inflação do período."},{"q":"A tributação de um COE cujo ativo subjacente é uma cesta de ações internacionais segue:","alts":["Alíquota fixa de 15%, como na renda variável.","A tabela regressiva da renda fixa, qualquer que seja o lastro.","Isenção de imposto de renda para a pessoa física.","Alíquota fixa de 20%, como no day trade."],"c":1,"exp":"Não importa o que há dentro: o COE é tributado pela tabela regressiva."},{"q":"REDENÇÃO: a modalidade de COE em que o investidor pode perder tudo ou parte do investido é a de:","alts":["Capital nominal protegido.","Capital nominal em risco.","Capital garantido pelo FGC.","Capital com garantia real."],"c":1,"exp":"Capital nominal em risco: se a estratégia não vencer, há prejuízo."}]}],"boss":[{"q":"Sobre a tributação do COE, é CORRETO afirmar:","alts":["Segue a alíquota aplicável ao ativo subjacente do COE.","Segue a tabela regressiva da renda fixa, sempre.","É isento de imposto para a pessoa física.","Tem alíquota fixa de 17,5% na fonte."],"c":1,"exp":"Sempre a tabela regressiva, qualquer que seja a estrutura interna."},{"q":"As duas modalidades de COE são:","alts":["Capital protegido e capital garantido pelo FGC.","Capital nominal protegido e capital nominal em risco.","Alavancado e conservador.","Prefixado e pós-fixado."],"c":1,"exp":"Protegido devolve o nominal; em risco pode devolver menos."},{"q":"Um investidor aplica R$ 10.000 num COE de capital nominal protegido com prazo de 3 anos. O ativo subjacente cai 40%. Ele resgatará:","alts":["R$ 6.000.","R$ 10.000, sem correção.","R$ 10.000 corrigidos pelo IPCA.","Zero."],"c":1,"exp":"Protegido garante o nominal: R$ 10.000. Sem correção alguma pelo período."},{"q":"A alavancagem em um COE, segundo o material:","alts":["Elimina o risco assumido pelo investidor.","Amplia os ganhos, mas também amplia as perdas.","É proibida pela CVM em certificados estruturados.","Só é permitida na modalidade de capital protegido."],"c":1,"exp":"A alavancagem multiplica nos dois sentidos."},{"q":"O valor de um derivativo está associado:","alts":["Ao patrimônio líquido do emissor.","A um ativo subjacente.","À taxa Selic Meta.","Ao índice de Basileia da instituição."],"c":1,"exp":"Ativo subjacente é a definição essencial de derivativo."},{"q":"O COE dá ao investidor acesso a classes de ativos como:","alts":["Apenas títulos públicos federais e privados.","Ações, moedas, índices e commodities, sem comprá-los.","Exclusivamente ativos isentos de imposto de renda.","Somente ativos negociados no mercado brasileiro."],"c":1,"exp":"É essa integração de classes que caracteriza o certificado estruturado."}]},{"id":"2.4","titulo":"Fundos de Investimento","subtitulo":"Condomínio de dinheiro sob gestão profissional","niveis":[{"id":"2.4.1","titulo":"Conceito de Fundo de Investimento","resumo":["Definição formal: comunhão de recursos constituída sob a forma de CONDOMÍNIO DE NATUREZA ESPECIAL, destinada à aplicação em ativos financeiros, bens e direitos. Regulados pela CVM 175.","É uma PRESTAÇÃO DE SERVIÇO, também chamada de veículo de investimento. O investidor delega a escolha dos ativos a um gestor profissional e recebe COTAS.","Características: gestão profissional; prestação fiduciária; prestadores que representam o fundo; registro na CVM; natureza jurídica própria (CNPJ), de modo que o patrimônio do fundo é SEPARADO do patrimônio do banco ou da gestora; regras no regulamento; estruturação em cotas e subcotas.","TRÊS DOCUMENTOS presentes em todo fundo: REGULAMENTO (define tudo: onde o gestor pode investir, benchmarks, taxas), LÂMINA DE INFORMAÇÕES BÁSICAS (resumo com aplicação mínima, risco e taxas) e TERMO DE ADESÃO (assinado na primeira aplicação, atestando ciência de direitos e obrigações).","Todos os cotistas têm os MESMOS DIREITOS, independentemente da quantidade de cotas.","Vantagens: acessibilidade ao mercado de capitais, diversificação, gestão de risco, gestão profissional e liquidez."],"macete":"Regulamento é a lei do fundo, lâmina é o resumo, termo de adesão é a assinatura. E o CNPJ próprio blinda o patrimônio: quebra do banco não leva o fundo junto.","pegadinha":"A banca diz que cotista com mais cotas tem mais direitos. Não tem: os direitos são iguais, muda só a proporção financeira. E o fundo não é regulado pelo BC, e sim pela CVM (Resolução 175).","questoes":[{"q":"O documento que o investidor assina ao aplicar pela primeira vez em um fundo, declarando ciência de direitos e obrigações, é:","alts":["O regulamento.","A lâmina de informações básicas.","O termo de adesão.","O prospecto definitivo."],"c":2,"exp":"Termo de adesão. O regulamento define as regras e a lâmina resume as informações essenciais."},{"q":"O fato de o fundo de investimento possuir CNPJ próprio significa que:","alts":["Ele paga imposto de renda como pessoa jurídica.","O patrimônio dele é separado do da gestora e do banco.","Ele pode emitir ações no mercado de capitais.","Ele fica dispensado do registro junto à CVM."],"c":1,"exp":"Segregação patrimonial: se a gestora quebrar, o patrimônio do fundo não é alcançado."},{"q":"Sobre os direitos dos cotistas de um mesmo fundo, é CORRETO afirmar:","alts":["Quem tem mais cotas tem mais votos por cota.","Todos têm os mesmos direitos, tenham quantas cotas tiverem.","Só investidores qualificados podem votar em assembleia.","Os direitos variam conforme o valor total aplicado."],"c":1,"exp":"Ao comprar cotas, o investidor aceita as regras e passa a ter os mesmos direitos dos demais."},{"q":"REDENÇÃO: os fundos de investimento são regulados por qual norma?","alts":["Lei 4.595/1964.","Resolução CVM 175.","Lei Complementar 179/2021.","Instrução CVM 30."],"c":1,"exp":"CVM 175 é o marco regulatório dos fundos. A Instrução CVM 30 trata da classificação de investidores."}]},{"id":"2.4.2","titulo":"Classe de Cotas: Aberta e Fechada","resumo":["Cota é a FRAÇÃO IDEAL do fundo. O saldo total dos recursos é o PATRIMÔNIO LÍQUIDO (PL), dividido em cotas. Quem detém cotas é o cotista.","Um mesmo fundo pode ter CLASSES e SUBCLASSES diferentes, com direitos e obrigações distintos. O administrador deve constituir PATRIMÔNIO SEGREGADO para cada classe.","Por que criar classes: flexibilizar o investimento mínimo e adaptar as taxas. Uma classe pode exigir aporte alto com taxa reduzida; outra aceita aporte menor com taxa de administração mais alta.","COTA ABERTA: o regulamento admite RESGATE. Aplicação e resgate a qualquer momento, conforme as regras do fundo. Não tem data de vencimento.","COTA FECHADA: o regulamento NÃO admite resgate antes do encerramento do fundo. O dinheiro só volta no vencimento ou na liquidação. Mas PODE ter LIQUIDEZ no mercado secundário: o investidor vende a cota a outro investidor.","No caso de classe de cota fechada, o regulamento deve conter PATRIMÔNIO INICIAL MÍNIMO.","CLASSE E SUBCLASSE RESTRITA: destinada exclusivamente a investidores qualificados e profissionais."],"macete":"Aberta tem RESGATE (o fundo devolve). Fechada não tem resgate, mas pode ter LIQUIDEZ (outro investidor compra de você).","pegadinha":"A banca trata 'sem resgate' como 'sem saída'. A cota fechada pode ter liquidez no secundário. E patrimônio inicial mínimo é exigência da FECHADA.","questoes":[{"q":"Um investidor quer sair de um fundo de cotas FECHADAS antes do encerramento. Ele pode:","alts":["Solicitar resgate ao administrador a qualquer momento.","Vender suas cotas a outro investidor no mercado secundário.","Exigir a liquidação antecipada do fundo.","Nada: fica obrigatoriamente até o vencimento sem qualquer alternativa."],"c":1,"exp":"Na cota fechada não há resgate, mas pode haver liquidez: o próprio investidor vende a cota a outro."},{"q":"A finalidade de criar diferentes classes e subclasses de cotas em um mesmo fundo é:","alts":["Alterar a estratégia de gestão para cada grupo.","Flexibilizar o aporte mínimo e adaptar as taxas.","Permitir que o gestor mude o benchmark por cliente.","Separar os investidores por faixa etária."],"c":1,"exp":"Classes diferentes ajustam aporte mínimo e taxas. A estratégia de gestão permanece uniforme, e cada classe tem patrimônio segregado."},{"q":"A exigência de patrimônio inicial mínimo previsto em regulamento aplica-se à classe de cotas:","alts":["Aberta.","Fechada.","Restrita apenas.","Ambas, indistintamente."],"c":1,"exp":"É requisito da classe de cota fechada."},{"q":"REDENÇÃO: uma classe restrita destina-se exclusivamente a:","alts":["Investidores de varejo com aporte mínimo de R$ 1.000.","Investidores qualificados e profissionais.","Pessoas jurídicas.","Investidores não residentes."],"c":1,"exp":"Classes e subclasses restritas atendem só a qualificados e profissionais."}]},{"id":"2.4.3","titulo":"Política de Investimento x Objetivo","resumo":["OBJETIVO é o DESTINO: o parâmetro de desempenho que o gestor deve perseguir, sempre atrelado a um BENCHMARK (índice de referência).","POLÍTICA DE INVESTIMENTO é a ROTA: o conjunto de diretrizes sobre quais ativos podem entrar, quais estratégias podem ser usadas, e quais são as limitações e riscos.","Principal benchmark da renda fixa: o CDI. Mas o fundo pode usar Ibovespa, IBrX, IPCA, Dow Jones ou qualquer indicador previsto no regulamento. O benchmark deve refletir fielmente o universo de ativos explorado, para que a comparação seja justa.","FUNDO PASSIVO: apenas REPLICA a composição e o desempenho de um índice, sem decisões ativas. Rentabilidade muito próxima ao índice, com pequenas diferenças por custos e taxas.","FUNDO ATIVO: o gestor busca SUPERAR o índice de referência, escolhendo ativamente os ativos.","Fundos ativos de ações têm maior volatilidade esperada que fundos passivos de renda fixa, o que exige maior tolerância a oscilações."],"macete":"Objetivo = destino. Política = rota. Passivo persegue o índice; ativo tenta ultrapassar.","pegadinha":"A banca inverte objetivo e política, e afirma que fundo passivo entrega exatamente o índice. Entrega quase: custos e taxas geram pequena diferença.","questoes":[{"q":"Um fundo de ações declara que pretende superar o Ibovespa e detalha o mix de setores e a metodologia de seleção de empresas. Nessa descrição:","alts":["Superar o Ibovespa é a política e o mix de setores é o objetivo.","Superar o Ibovespa é o objetivo e o mix de setores é a política de investimento.","Ambos são componentes do objetivo.","Ambos são componentes da política."],"c":1,"exp":"Objetivo é o destino (superar o índice); política é a rota (como o gestor pretende chegar lá)."},{"q":"Sobre o fundo passivo, é CORRETO afirmar:","alts":["Busca superar o índice com seleção ativa de ativos.","Replica o índice, com pequena diferença por custos.","Não possui benchmark definido em regulamento.","Pode cobrar taxa de performance sobre o excedente."],"c":1,"exp":"Passivo replica. E taxa de performance é privilégio dos fundos ATIVOS."},{"q":"REDENÇÃO: o benchmark de um fundo deve:","alts":["Ser sempre o CDI, o principal índice de referência do mercado.","Refletir o universo de ativos que o fundo explora.","Ser definido pela CVM no início de cada semestre.","Ser trocado sempre que o desempenho for ruim."],"c":1,"exp":"O índice precisa ser coerente com a carteira, sob pena de a avaliação da gestão ficar distorcida."}]},{"id":"2.4.4","titulo":"Prestadores de Serviços","resumo":["ADMINISTRADOR e GESTOR são os prestadores ESSENCIAIS e responsáveis legais do fundo, EM IGUALDADE de responsabilidades, com atribuições diferentes.","O ADMINISTRADOR contrata, se necessário: TESOURARIA (caixa do fundo), ESCRITURAÇÃO DE COTAS (o custodiante) e AUDITORIA INDEPENDENTE (contratação OBRIGATÓRIA).","Atribuições do administrador: supervisionar as operações do gestor; fazer o APREÇAMENTO dos ativos; manter registros, atas e livros; observar o regulamento; cumprir as deliberações da assembleia; manter atualizada junto à CVM a lista de prestadores.","O GESTOR contrata, se necessário: DISTRIBUIDOR, CLASSIFICADORA DE RISCO e COGESTÃO.","Atribuições do gestor: comprar e vender os ativos (investimento e desinvestimento); observar os LIMITES DE COMPOSIÇÃO E CONCENTRAÇÃO; fornecer material de divulgação aos distribuidores; comunicar à CVM o fechamento de cotas para resgate; EXERCER O DIREITO DE VOTO dos ativos detidos pela classe.","A GESTÃO DO RISCO DE LIQUIDEZ é feita pelo administrador EM CONJUNTO com o gestor.","DISTRIBUIDOR vende as cotas. TESOURARIA cuida do caixa. CUSTODIANTE registra as transações e guarda a posição. AUDITOR INDEPENDENTE audita as demonstrações contábeis, e sua contratação é obrigatória."],"macete":"Administrador supervisiona e apreça; gestor compra, vende e vota. Risco de liquidez é responsabilidade CONJUNTA dos dois.","pegadinha":"Duas armadilhas: dizer que o administrador escolhe os ativos (quem escolhe é o gestor) e atribuir o risco de liquidez a um só. É conjunto. E quem exerce o direito de voto das ações da carteira é o GESTOR.","questoes":[{"q":"A gestão do risco de liquidez do fundo é responsabilidade:","alts":["Exclusiva do administrador do fundo.","Exclusiva do gestor de recursos.","Do administrador em conjunto com o gestor.","Exclusiva do custodiante dos ativos."],"c":2,"exp":"É uma das poucas atribuições expressamente conjuntas. Cai com frequência."},{"q":"O fundo detém ações de uma companhia e a assembleia de acionistas dessa empresa vai deliberar sobre uma fusão. Quem exerce o direito de voto?","alts":["O administrador, como responsável legal.","O gestor, representando o interesse da classe.","O custodiante, que guarda os ativos.","Cada cotista, proporcionalmente."],"c":1,"exp":"Exercer o direito de voto decorrente dos ativos detidos pela classe é atribuição do gestor."},{"q":"A contratação obrigatória entre os prestadores contratados pelo administrador é a de:","alts":["Tesouraria.","Escrituração de cotas.","Auditoria independente.","Classificadora de risco."],"c":2,"exp":"Auditoria independente é obrigatória. Tesouraria e escrituração aparecem como 'se necessário', e a classificadora de risco é contratada pelo GESTOR."},{"q":"REDENÇÃO: o apreçamento dos ativos que compõem a carteira é atribuição:","alts":["Do gestor.","Do administrador.","Do distribuidor.","Do auditor independente."],"c":1,"exp":"Apreçamento é do administrador. O gestor compra e vende; o administrador supervisiona e precifica."}]},{"id":"2.4.5","titulo":"Taxas e a Linha d'Água","resumo":["TAXA DE ADMINISTRAÇÃO: fixa, expressa em percentual ao ANO, cobrada e deduzida DIARIAMENTE do PL da classe. Afeta o valor da cota e é cobrada INDEPENDENTEMENTE da rentabilidade. A rentabilidade divulgada pelos fundos é sempre LÍQUIDA de taxa de administração.","TAXA DE PERFORMANCE: percentual sobre o resultado que EXCEDER 100% do benchmark. Cobrada após a dedução de todas as despesas. Somente FUNDOS ATIVOS podem adotá-la. Apurada, no mínimo, em intervalos de 180 DIAS.","LINHA D'ÁGUA: a metodologia de cobrança. Exemplo do material: cota comprada a R$ 10 sobe para R$ 12 e supera o benchmark, então há cobrança. Depois cai para R$ 11: não há cobrança. Sobe para R$ 11,90: ainda não há cobrança, porque não superou a linha d'água de R$ 12.","TAXA DE GESTÃO: remunera o gestor e os prestadores por ele contratados que não sejam encargos do fundo. Em geral está EMBUTIDA na taxa de administração.","TAXA DE DISTRIBUIÇÃO: montante total para remuneração dos distribuidores.","ACORDOS DE REMUNERAÇÃO: rebate pago pela classe investida às classes investidoras, com base nas taxas de administração, performance ou gestão.","TAXA DE INGRESSO: paga pelo cotista ao patrimônio da classe ao APLICAR. TAXA DE SAÍDA: paga ao RESGATAR. Ambas pouco utilizadas.","A Resolução CVM 175 obriga que as taxas sejam mostradas de maneira SEPARADA e especificadas ao investidor."],"macete":"Administração: sempre, diária, sobre o PL. Performance: só fundo ativo, só acima de 100% do benchmark, mínimo a cada 180 dias, respeitando a linha d'água.","pegadinha":"A banca cobra performance sobre a valorização da cota mesmo quando ela ainda está abaixo do pico anterior. A linha d'água impede isso. E fundo PASSIVO não pode cobrar performance.","questoes":[{"q":"Um fundo cobrou taxa de performance quando a cota atingiu R$ 12. Depois a cota caiu para R$ 11 e subiu novamente para R$ 11,90. Sobre a nova valorização:","alts":["Haverá cobrança de taxa de performance sobre a alta de R$ 11 para R$ 11,90.","Não haverá cobrança, pois a cota não superou a linha d'água de R$ 12.","Haverá cobrança em dobro, para compensar o período negativo.","A cobrança dependerá apenas do benchmark, não do valor da cota."],"c":1,"exp":"A linha d'água é a régua: só se cobra performance acima do pico anterior E acima do benchmark."},{"q":"Sobre a taxa de administração, é CORRETO afirmar:","alts":["É cobrada só quando a rentabilidade é positiva.","É fixa ao ano, deduzida diariamente do patrimônio.","É cobrada uma única vez, no ato da aplicação.","Só pode ser cobrada pelos fundos ativos."],"c":1,"exp":"Cobrada independentemente do desempenho e já descontada na rentabilidade divulgada."},{"q":"A taxa de performance pode ser cobrada:","alts":["Por qualquer fundo, em intervalos mensais.","Por fundos ativos, sobre o que exceder o benchmark.","Por fundos passivos que superem o índice por acaso.","Sobre o patrimônio líquido, qualquer que seja o resultado."],"c":1,"exp":"Fundo ativo, excedente ao benchmark, apuração mínima semestral, depois de deduzidas todas as despesas."},{"q":"REDENÇÃO: a taxa paga pelo cotista ao patrimônio da classe no momento do RESGATE é a taxa de:","alts":["Ingresso.","Saída.","Distribuição.","Performance."],"c":1,"exp":"Taxa de saída incide no resgate; a de ingresso incide na aplicação. Ambas são pouco utilizadas."}]},{"id":"2.4.6","titulo":"Investimento por Conta e Ordem","resumo":["Modelo em que os distribuidores atuam EM NOME DE e PARA seus clientes junto ao administrador.","Problema que resolve: sem esse modelo, o investidor com cotas em fundos de vários administradores teria que manter cadastro em TODOS eles. Com conta e ordem, ele se relaciona apenas com o DISTRIBUIDOR.","Exemplo do material: o JP Morgan administra fundos mas não faz atendimento de varejo, então contrata uma corretora, e os clientes acessam o fundo por meio dela.","Nesse contexto, o ADMINISTRADOR NÃO TEM RELACIONAMENTO com o investidor. Ele envia as informações ao distribuidor, que tem a obrigação de repassar ao cotista.","Atribuições do distribuidor: manter REGISTRO COMPLEMENTAR de cotistas, específico para cada classe e subclasse com subscrição por conta e ordem; e comparecer e VOTAR nas assembleias representando os interesses de seus clientes.","O registro das cotas deve ser SEGREGADO do patrimônio do distribuidor, permitindo identificar o cotista."],"macete":"Conta e ordem: um cadastro só, no distribuidor. O administrador fala com o distribuidor, e o distribuidor fala com você.","pegadinha":"A banca afirma que na conta e ordem o administrador continua se comunicando diretamente com o cotista. Não continua: quem repassa é o distribuidor. E o distribuidor PODE votar em assembleia representando os clientes.","questoes":[{"q":"Na distribuição por conta e ordem, a comunicação com o cotista é feita:","alts":["Diretamente pelo administrador do fundo.","Pelo distribuidor, que recebe do administrador e repassa.","Pela CVM, por meio do sistema de registro.","Pelo custodiante que guarda os ativos da carteira."],"c":1,"exp":"O administrador não tem relacionamento com o investidor nesse modelo."},{"q":"São atribuições do distribuidor no modelo de conta e ordem:","alts":["Apreçar os ativos e auditar as demonstrações.","Manter registro complementar e votar em assembleia.","Escolher os ativos que compõem a carteira.","Definir a política de investimento da classe."],"c":1,"exp":"Registro complementar e representação em assembleia. Apreçamento é do administrador; escolha de ativos é do gestor."},{"q":"REDENÇÃO: o registro das cotas na distribuição por conta e ordem deve ser:","alts":["Confundido com o patrimônio do distribuidor, para simplificar a operação.","Segregado do patrimônio do distribuidor, permitindo a identificação do cotista.","Mantido apenas pelo administrador.","Dispensado quando o cotista for investidor qualificado."],"c":1,"exp":"Segregação é o que protege o cotista em caso de problemas com o distribuidor."}]},{"id":"2.4.7","titulo":"Tipificação de Cotas: as 6 modalidades","resumo":["A CVM tipifica as classes de cotas conforme a composição da carteira e o risco dos ativos, em SEIS modalidades: Renda Fixa, Cambial, Multimercados, Ações, Incentivados em Infraestrutura e Garantia de Locação Imobiliária.","RENDA FIXA: principal fator de risco é a variação de taxa de juros, índice de preços ou ambos. Aloca no MÍNIMO 80% do patrimônio em ativos de renda fixa.","CAMBIAL: no MÍNIMO 80% do PL em ativos cujo principal fator de risco seja o CÂMBIO.","MULTIMERCADO: NÃO há restrição quanto aos mercados nem percentual mínimo por ativo. O percentual de cada mercado consta apenas no regulamento.","AÇÕES: no MÍNIMO 67% do PL em ativos cujo fator de risco seja a variação de preços de ações em mercado organizado. Contam: ações e certificados de depósito de ações, bônus e recibos de subscrição, cotas de classes tipificadas como Ações, ETF de ações e BDR-Ações.","FI INFRA (Incentivado em Infraestrutura): no MÍNIMO 85% do PL em DEBÊNTURES INCENTIVADAS. Tecnicamente é renda fixa, mas ganha classificação própria por ter natureza tributária diferente.","GARANTIA DE LOCAÇÃO IMOBILIÁRIA: o locatário oferece suas cotas como garantia do aluguel e não pode resgatá-las durante a locação. A garantia precisa estar prevista no regulamento da classe."],"macete":"80% renda fixa, 80% cambial, 67% ações, 85% FI Infra, multimercado sem limite. Os números 80-67-85 caem sempre.","pegadinha":"O 67% do fundo de ações é o número mais trocado da prova (a banca oferece 80% ou 95%). E o multimercado NÃO tem percentual mínimo por mercado.","questoes":[{"q":"Os percentuais mínimos de alocação para fundos de Renda Fixa, Ações e Incentivado em Infraestrutura são, respectivamente:","alts":["80%, 67% e 85%.","67%, 80% e 95%.","80%, 80% e 80%.","95%, 67% e 85%."],"c":0,"exp":"Renda fixa 80%, ações 67%, FI Infra 85% em debêntures incentivadas."},{"q":"Sobre o fundo Multimercado, é CORRETO afirmar:","alts":["Deve alocar no mínimo 80% em cada mercado.","Não há restrição de mercados nem percentual mínimo.","Só pode investir em renda fixa e em câmbio.","Deve manter no mínimo 67% do PL em ações."],"c":1,"exp":"Multimercado é o coringa: aloca em diversos fatores de risco sem compromisso de concentração."},{"q":"Contam para o limite de 67% de um fundo de ações, EXCETO:","alts":["ETF de ações.","BDR-Ações.","Bônus e recibos de subscrição admitidos à negociação em mercado organizado.","Debêntures incentivadas de empresas listadas."],"c":3,"exp":"Debênture é renda fixa, mesmo emitida por empresa listada. Se passar de 85% do PL, o fundo vira FI Infra."},{"q":"REDENÇÃO: o fundo destinado à garantia de locação imobiliária funciona da seguinte forma:","alts":["O fundo compra o imóvel e depois o aluga ao cotista.","O locatário dá as cotas em garantia e não as resgata.","O fundo paga o aluguel ao locador todos os meses.","O fundo substitui obrigatoriamente o seguro fiança."],"c":1,"exp":"As cotas ficam bloqueadas como garantia. Se o aluguel não for pago, elas honram a dívida."}]},{"id":"2.4.7.1","titulo":"Subcategorias de Renda Fixa e Crédito Privado","resumo":["CURTO PRAZO (critério CVM): prazo médio da carteira INFERIOR A 60 DIAS e prazo máximo de vencimento do título de 375 DIAS.","REFERENCIADO: investe no MÍNIMO 95% do PL em ativos que tenham como benchmark o indexador da cota.","SIMPLES: no MÍNIMO 95% da carteira em títulos públicos federais de baixo risco de mercado (LFT) ou em ativos privados cujo emissor tenha classificação de crédito IGUAL OU MELHOR que a do governo. DISPENSA assinatura no termo de adesão.","DÍVIDA EXTERNA: no MÍNIMO 80% do PL em ativos de responsabilidade do governo federal EMITIDOS FORA DO PAÍS.","CRÉDITO PRIVADO: a classe de Renda Fixa, Multimercado ou Cambial que aporta MAIS DE 50% do PL em ativos de renda fixa cujo emissor seja uma EMPRESA (incluindo banco) deve: incluir o sufixo 'Crédito Privado' na denominação E incluir no termo de adesão o alerta sobre a possível concentração em créditos privados."],"macete":"Referenciado e Simples: 95%. Dívida externa: 80%. Crédito privado: mais de 50%. Só o SIMPLES dispensa o termo de adesão.","pegadinha":"A banca confunde o curto prazo da CVM (60 dias de prazo médio, título até 375 dias) com o da Receita Federal (prazo médio até 365 dias). São critérios DIFERENTES para finalidades diferentes.","questoes":[{"q":"A subcategoria de renda fixa que dispensa a assinatura do termo de adesão é a:","alts":["Curto Prazo.","Referenciado.","Simples.","Dívida Externa."],"c":2,"exp":"O fundo Simples, por sua carteira ultraconservadora (95% em LFT ou emissores com crédito igual ou melhor que o do governo), dispensa a assinatura."},{"q":"Um fundo multimercado aplica 60% do PL em debêntures e CDBs. Ele deve obrigatoriamente:","alts":["Ser reclassificado como fundo de renda fixa.","Incluir o sufixo 'Crédito Privado' e o alerta no termo.","Reduzir de imediato a exposição a 50% do PL.","Obter autorização especial junto ao Banco Central."],"c":1,"exp":"Mais de 50% em crédito privado exige o sufixo na denominação e o alerta de risco no termo de adesão."},{"q":"Pelo critério da CVM, um fundo de renda fixa de curto prazo deve ter:","alts":["Prazo médio abaixo de 60 dias e título até 375 dias.","Prazo médio igual ou inferior a 365 dias.","95% do patrimônio em títulos públicos federais.","80% do patrimônio em ativos emitidos no exterior."],"c":0,"exp":"60 e 375 são os números da CVM. Os 365 dias são o critério da Receita Federal para fins de tributação."},{"q":"REDENÇÃO: o fundo Referenciado deve investir no mínimo:","alts":["80% do PL em ativos que sigam o indexador da cota.","95% do PL em ativos que sigam o indexador da cota.","67% do PL em ações negociadas em bolsa.","50% do PL em ativos de crédito privado."],"c":1,"exp":"95% é o piso do Referenciado, o mesmo do Simples."}]},{"id":"2.4.7.2","titulo":"Socioambiental, Fundo de Cotas e Classes Restritas","resumo":["FUNDO SOCIOAMBIENTAL: objetiva beneficiar fatores ambientais, sociais e de governança (ASG/ESG). O REGULAMENTO deve estabelecer quais os benefícios esperados e como a política de investimento busca alcançá-los. Pode combinar com qualquer tipificação (renda fixa socioambiental, multimercado socioambiental etc.).","FUNDO DE INVESTIMENTO EM COTAS: classes que compram cotas de outros fundos. REGRA: devem adquirir classes DO MESMO TIPO que a sua. EXCEÇÃO: as classes tipificadas como MULTIMERCADO podem investir em cotas de QUALQUER tipo, justamente por não terem regra de concentração.","CLASSES RESTRITAS: classe ou subclasse destinada exclusivamente a investidores QUALIFICADOS e PROFISSIONAIS."],"macete":"Fundo de cotas compra igual ao seu tipo. Só o multimercado pode comprar de tudo, porque ele mesmo não tem limite de concentração.","pegadinha":"A banca inverte a exceção, dizendo que o fundo de ações pode comprar cotas de qualquer tipo. Só o multimercado tem esse passe livre.","questoes":[{"q":"Uma classe de cotas tipificada como 'Ações' que investe em cotas de outros fundos deve adquirir:","alts":["Cotas de qualquer tipificação, à escolha do gestor do FIC.","Cotas de classes do mesmo tipo, ou seja, de Ações.","Apenas cotas de fundos de gestão passiva.","Apenas cotas de classes restritas a qualificados."],"c":1,"exp":"A regra é comprar do mesmo tipo. A exceção é o multimercado, que pode comprar de qualquer tipo."},{"q":"No fundo socioambiental, os benefícios esperados e a forma de alcançá-los devem constar:","alts":["Na lâmina de informações básicas apenas.","No regulamento.","No termo de adesão apenas.","Em comunicado anual à CVM."],"c":1,"exp":"O regulamento é o documento que estabelece os benefícios ASG esperados e como a política busca alcançá-los."},{"q":"REDENÇÃO: a exceção que permite investir em cotas de qualquer tipificação aplica-se às classes tipificadas como:","alts":["Renda Fixa.","Ações.","Multimercado.","Cambial."],"c":2,"exp":"Multimercado não tem regra de concentração, então pode comprar cotas de renda fixa, ações, câmbio, o que for."}]},{"id":"2.4.8","titulo":"Limites de Concentração e Conflito de Interesse","resumo":["LIMITES POR EMISSOR: Governo Federal, ATÉ 100% (sem limite). Instituição financeira (títulos bancários), ATÉ 20%. Companhia aberta / emissor corporativo, ATÉ 10%. PESSOA FÍSICA, ATÉ 5%.","Exemplo do material: fundo de R$ 100 milhões pode aplicar até R$ 20 milhões em CDBs do Banco A, R$ 20 milhões do Banco B, e assim por diante.","CONFLITO DE INTERESSE: a CVM exige a 'muralha da China' (Chinese wall) para garantir que as decisões de investimento sejam tomadas de forma independente. A responsabilidade pela implantação da segregação é da ÁREA DE CONTROLES INTERNOS.","A raiz do conflito: na intermediação, o banco quer o MAIOR SPREAD possível, pagando a menor taxa ao captar. Na gestão de recursos de terceiros, precisa entregar a MAIOR RENTABILIDADE possível, aplicando à maior taxa. São interesses opostos dentro da mesma instituição.","SPREAD BANCÁRIO: diferença entre a taxa cobrada dos tomadores de crédito e a taxa paga aos depositantes."],"macete":"100 / 20 / 10 / 5: Governo, Banco, Empresa, Pessoa Física. Quanto menor o emissor, menor o limite.","pegadinha":"A banca troca os limites de banco (20%) e empresa (10%), ou coloca limite no governo federal (não há). E a responsabilidade da muralha da China é dos CONTROLES INTERNOS, não da auditoria externa.","questoes":[{"q":"Os limites de concentração por emissor para títulos públicos federais, instituições financeiras, companhias abertas e pessoas físicas são, respectivamente:","alts":["100%, 20%, 10% e 5%.","100%, 10%, 20% e 5%.","80%, 20%, 10% e 5%.","100%, 20%, 5% e 10%."],"c":0,"exp":"Governo sem limite (100%), banco 20%, empresa 10%, pessoa física 5%."},{"q":"Um fundo com PL de R$ 200 milhões deseja concentrar em CDBs de um único banco. O valor máximo permitido é:","alts":["R$ 200 milhões.","R$ 40 milhões.","R$ 20 milhões.","R$ 10 milhões."],"c":1,"exp":"20% de R$ 200 milhões = R$ 40 milhões. O limite de 20% é por emissor instituição financeira."},{"q":"A responsabilidade pela implantação da segregação de funções (muralha da China) para evitar conflito de interesse é:","alts":["Do auditor independente.","Da área de controles internos.","Do distribuidor.","Da CVM."],"c":1,"exp":"Controles internos implanta a segregação. O auditor verifica as demonstrações contábeis."},{"q":"REDENÇÃO: spread bancário é definido no material como:","alts":["A taxa de administração cobrada pelo fundo.","A diferença entre o juro cobrado e o juro pago.","A diferença entre o valor da cota e o patrimônio.","O percentual de performance acima do benchmark."],"c":1,"exp":"Diferença entre o que o banco cobra para emprestar e o que paga para captar."}]},{"id":"2.4.9","titulo":"Responsabilidade Limitada e Ilimitada dos Cotistas","resumo":["FUNDO ALAVANCADO: utiliza capital emprestado (frequentemente via derivativos) para aumentar o potencial de retorno, amplificando também os riscos.","RESPONSABILIDADE ILIMITADA: os cotistas podem ser chamados a APORTAR RECURSOS ADICIONAIS para cobrir prejuízos. Exemplo do material: aplicação de R$ 100.000 que vira R$ 125.000 e depois um saldo NEGATIVO de R$ 37.900, que o cotista tem obrigação de cobrir.","RESPONSABILIDADE LIMITADA: o comprometimento do cotista é restrito ao valor investido. Perdas além disso recaem sobre o ADMINISTRADOR do fundo, não sobre os cotistas.","OBRIGAÇÕES DO ADMINISTRADOR quando um fundo de responsabilidade limitada fica com PL negativo: fechar para resgates e não amortizar cotas; não realizar novas subscrições; comunicar o PL negativo ao gestor; divulgar FATO RELEVANTE; cancelar os pedidos de resgate pendentes de conversão; apresentar em ATÉ 20 DIAS um plano de recuperação com as causas e circunstâncias do prejuízo; e convocar ASSEMBLEIA para votar o plano."],"macete":"Limitada: a perda máxima é o que você aplicou. Ilimitada: pode ter que colocar mais dinheiro. Plano de recuperação: 20 dias e assembleia.","pegadinha":"A banca troca o prazo do plano de recuperação (são 20 dias) e diz que a assembleia é dispensável. Não é: o plano precisa ser votado.","questoes":[{"q":"Em um fundo com responsabilidade LIMITADA que apresenta patrimônio líquido negativo, as perdas que excedem o valor investido recaem sobre:","alts":["Os cotistas, proporcionalmente às suas cotas.","O administrador do fundo.","O custodiante.","O Fundo Garantidor de Créditos."],"c":1,"exp":"Na responsabilidade limitada, o cotista perde no máximo o que aplicou. O excedente é do administrador."},{"q":"O prazo para o administrador apresentar o plano de recuperação de PL negativo é de:","alts":["5 dias.","20 dias.","30 dias.","60 dias."],"c":1,"exp":"Até 20 dias, com as causas e circunstâncias do prejuízo, seguido de convocação de assembleia para votação."},{"q":"São providências obrigatórias do administrador diante de PL negativo em fundo de responsabilidade limitada, EXCETO:","alts":["Fechar para resgates e não realizar amortização de cotas.","Divulgar fato relevante.","Realizar novas subscrições de cotas para recompor o patrimônio.","Cancelar os pedidos de resgate pendentes de conversão."],"c":2,"exp":"Justamente o contrário: NÃO se realizam novas subscrições. Seria captar dinheiro novo para um fundo quebrado."},{"q":"REDENÇÃO: um fundo alavancado caracteriza-se por:","alts":["Investir exclusivamente em títulos públicos federais.","Usar capital emprestado para ampliar retorno e risco.","Ter sempre responsabilidade limitada ao aporte.","Ser vedado aos investidores qualificados."],"c":1,"exp":"Alavancagem amplia ganhos e perdas, e é o cenário típico em que a responsabilidade ilimitada aparece."}]},{"id":"2.4.10","titulo":"Tributação em Fundos (FIF)","resumo":["IOF: incide em resgates antes de 30 dias, seguindo a mesma regra da renda fixa. O IR é cobrado sobre o rendimento LÍQUIDO de IOF.","CLASSIFICAÇÃO DA RECEITA FEDERAL (para tributação): CURTO PRAZO é o fundo com prazo médio da carteira IGUAL OU INFERIOR a 365 dias. LONGO PRAZO é o com prazo médio SUPERIOR a 365 dias.","LONGO PRAZO (no resgate): até 180 dias 22,5%; de 181 a 360 dias 20%; de 361 a 720 dias 17,5%; acima de 720 dias 15%.","CURTO PRAZO (no resgate): até 180 dias 22,5%; acima de 180 dias 20%. A alíquota para nos 20%, não desce mais.","ATENÇÃO: as tabelas aplicam-se SOMENTE ao resgate.","FUNDOS DE AÇÕES: alíquota ÚNICA de 15% sobre o ganho no resgate, independentemente do prazo de permanência.","FUNDOS DE INFRAESTRUTURA: ISENTOS de tributação para o investidor pessoa física.","Não confunda os dois critérios de 'curto prazo': o da CVM (prazo médio inferior a 60 dias e título até 375 dias) e o da Receita Federal (prazo médio até 365 dias)."],"macete":"Curto prazo da Receita para em 20%. Longo prazo desce até 15%. Fundo de ações: 15% fixos. FI Infra: isento para PF.","pegadinha":"A pegadinha número um é aplicar 15% num fundo multimercado de curto prazo mantido por 3 anos. No curto prazo a alíquota mínima é 20%, não importa quanto tempo você fique.","questoes":[{"q":"Um investidor resgata, após 800 dias, cotas de um fundo multimercado classificado como CURTO PRAZO pela Receita Federal. A alíquota de IR será:","alts":["15%","17,5%","20%","22,5%"],"c":2,"exp":"Na tabela de curto prazo só existem duas faixas: 22,5% até 180 dias e 20% acima disso. Ficar mais tempo não reduz além dos 20%."},{"q":"A alíquota de IR de um fundo de AÇÕES no resgate é:","alts":["Definida pela tabela regressiva conforme o prazo.","15% sobre o ganho, independentemente do prazo de permanência.","20% sobre o ganho.","Isenta para pessoa física."],"c":1,"exp":"Alíquota única de 15%. E fundo de ações não tem come-cotas."},{"q":"Pelo critério da Receita Federal, um fundo é classificado como LONGO PRAZO quando:","alts":["O prazo médio da carteira é superior a 365 dias.","O prazo médio da carteira é superior a 60 dias.","O prazo máximo de cada título é superior a 375 dias.","O investidor permanece mais de 720 dias."],"c":0,"exp":"Receita Federal: prazo médio superior a 365 dias. Os 60 e 375 dias são o critério da CVM para o fundo Curto Prazo."},{"q":"REDENÇÃO: sobre a tributação dos fundos incentivados de infraestrutura para pessoa física:","alts":["Seguem a tabela regressiva de longo prazo.","São isentos de tributação.","Pagam alíquota única de 15%.","Pagam 20% no come-cotas."],"c":1,"exp":"Isenção para PF é justamente o incentivo que dá nome ao fundo."}]},{"id":"2.4.10.1","titulo":"Come-Cotas","resumo":["Os fundos NÃO têm vencimento: o que vence são os ativos da carteira, substituídos pelo gestor. Como o investidor pode ficar o tempo que quiser, a Receita criou uma ANTECIPAÇÃO SEMESTRAL do IR.","Ocorre nos ÚLTIMOS DIAS ÚTEIS DE MAIO E NOVEMBRO, em classes de RENDA FIXA, CAMBIAL e MULTIMERCADO. Não atinge fundos de ações.","ALÍQUOTA FIXA: 20% para fundos de CURTO prazo e 15% para fundos de LONGO prazo. O prazo de permanência do investidor NÃO altera a alíquota do come-cotas.","Recolhido pelo ADMINISTRADOR, independentemente de haver resgate.","Exemplo do material: 10 cotas compradas a R$ 100 (total R$ 1.000). O fundo rende 10% e a cota vai a R$ 110, totalizando R$ 1.100. Rendimento de R$ 100. Come-cotas de longo prazo: 15% de R$ 100 = R$ 15. Saldo de R$ 1.085, que dividido por R$ 110 resulta em 9,86 cotas.","O nome vem daí: o imposto COME a quantidade de cotas do investidor."],"macete":"Maio e Novembro, último dia útil. 15% longo, 20% curto, sempre. Fundo de ações não tem come-cotas.","pegadinha":"A banca aplica a alíquota da tabela regressiva no come-cotas. Nunca: são sempre 15% ou 20%, fixos. E a diferença até a alíquota final é ajustada apenas no resgate.","questoes":[{"q":"O come-cotas é cobrado:","alts":["No último dia útil de maio e novembro, a 15% ou 20%.","No último dia útil de dezembro, pela tabela regressiva.","A cada resgate solicitado pelo investidor no ano.","Mensalmente, inclusive nos fundos de ações."],"c":0,"exp":"Maio e novembro, alíquota fixa, recolhida pelo administrador independentemente de resgate."},{"q":"Um investidor tem 10 cotas de R$ 100 num fundo de longo prazo. O fundo rende 10% e chega o come-cotas. Após o recolhimento, ele terá aproximadamente:","alts":["10 cotas de R$ 110.","9,86 cotas de R$ 110.","9 cotas de R$ 110.","10 cotas de R$ 108,50."],"c":1,"exp":"Rendimento de R$ 100, imposto de 15% = R$ 15. Saldo de R$ 1.085 dividido por R$ 110 = 9,86 cotas. O valor da cota não muda: some a quantidade."},{"q":"NÃO sofrem come-cotas as classes tipificadas como:","alts":["Renda Fixa.","Cambial.","Multimercado.","Ações."],"c":3,"exp":"Fundos de ações ficam fora do come-cotas e são tributados só no resgate, a 15%."},{"q":"REDENÇÃO: o prazo de permanência do investidor no fundo afeta a alíquota do come-cotas?","alts":["Sim, seguindo a tabela regressiva de 22,5% a 15%.","Não: a alíquota é fixa, 15% ou 20%, conforme o fundo.","Sim, mas apenas nas classes tipificadas como cambial.","Sim: cai 2,5 pontos percentuais a cada semestre."],"c":1,"exp":"O come-cotas ignora o prazo do investidor. Ele olha apenas a classificação do fundo."}]},{"id":"2.4.12","titulo":"Fundo de Investimento Imobiliário (FII)","resumo":["Fundos FECHADOS destinados à aplicação em empreendimentos imobiliários, o que inclui direitos reais sobre imóveis E títulos do mercado imobiliário, como LCI e CRI.","Categorias: DESENVOLVIMENTO (financia construções, normalmente com prazo determinado), LAJES CORPORATIVAS, SHOPPINGS, CENTROS LOGÍSTICOS e AGÊNCIAS BANCÁRIAS.","Ambiente de negociação: BOLSA DE VALORES (prazo indeterminado de duração) ou MERCADO DE BALCÃO (os chamados fundos cetipados).","FUNDO DE TIJOLO: aloca em direitos reais sobre bens imóveis, ou seja, investe diretamente em propriedades físicas. FUNDO DE PAPEL: aloca em ativos de renda fixa lastreados na construção civil e no crédito imobiliário (LCI, CRI, LIG).","Retornos vêm de duas fontes: GANHO DE CAPITAL (vender a cota mais caro) e PROVENTOS (aluguéis distribuídos).","RISCOS: LIQUIDEZ (não há resgate; é preciso encontrar comprador no mercado); MERCADO (variação do preço da cota); CRÉDITO (presente nos fundos de PAPEL, pelos títulos em carteira); VACÂNCIA (presente nos fundos de TIJOLO, quando as unidades ficam vazias e não geram aluguel).","Fundos MONO-INQUILINO dependem de um único locatário; MULTI-INQUILINO diluem esse risco."],"macete":"Tijolo sofre de VACÂNCIA. Papel sofre de CRÉDITO. Todo FII é fechado, então o risco de liquidez existe sempre.","pegadinha":"A banca associa risco de crédito ao fundo de tijolo e vacância ao de papel. É o contrário. E FII é fundo FECHADO: não existe resgate, só venda no mercado.","questoes":[{"q":"O risco de VACÂNCIA está presente sobretudo em:","alts":["Fundos de papel, pela inadimplência dos CRI.","Fu
