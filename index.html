const EXEMPLOS={"1.1.1":["Você compra pão na esquina e paga R$ 12.","Esses R$ 12 saem do seu bolso (família) e entram como receita da padaria (empresa). Parte volta ao governo como imposto e parte irriga o mercado. O mesmo dinheiro nunca sai do circuito, só troca de mãos."],"1.1.2":["Uma padaria quer trocar o forno, e o dono avalia três caminhos.","Pedir empréstimo no banco é mercado de crédito. Importar o forno da Itália exige mercado cambial. Se a empresa fosse grande e emitisse debênture, seria mercado de capitais. O caixa do banco girando de um dia para o outro é o monetário."],"1.1.3":["Uma fábrica de tênis vende R$ 300 mil, tendo comprado R$ 120 mil de couro.","Só os R$ 300 mil do tênis entram no PIB. O couro é bem intermediário e já está embutido no preço final. Contar os dois seria somar a mesma coisa duas vezes."],"1.1.4":["Dois vizinhos estão sem trabalho: um manda currículo toda semana, o outro parou de procurar há um ano.","Só o primeiro aparece na taxa de desemprego. O segundo saiu da população economicamente ativa e virou invisível para a estatística, ainda que continue sem renda."],"1.1.5":["O aluguel do seu ponto comercial é reajustado pelo IGP-M, e o supermercado subiu pouco no ano.","O reajuste pode vir alto mesmo assim, porque 60% do IGP-M é atacado (IPA), não a prateleira. O que você sente na compra do mês está mais perto do IPCA."],"1.1.6":["Você troca R$ 6.000 por dólares na casa de câmbio antes de viajar.","Recebe pela taxa turismo, com a margem do banco embutida. Um importador comprando US$ 2 milhões no mesmo dia paga a comercial, bem mais barata. A PTAX é a referência oficial do BC, não o preço do seu balcão."],"1.1.7":["O governo anuncia três medidas na mesma semana.","Reduzir o IPI é fiscal (arrecadação). Baixar a Selic é monetária, e é do BC. Vender dólares para segurar a cotação é cambial. Três frentes, três instrumentos."],"1.1.8":["Um município arrecada R$ 500 mil, gasta R$ 450 mil e paga R$ 80 mil de juros da dívida.","O primário é superavitário em R$ 50 mil. O nominal é deficitário em R$ 30 mil, porque só ele enxerga os juros. Dá para ter superávit primário e continuar afundando."],"1.1.9":["A inflação disparou e o BC quer esfriar o consumo.","Ele sobe a Selic, sobe o compulsório, sobe o redesconto e vende títulos. Tudo empurrado para o mesmo lado: menos dinheiro na rua. Se quisesse aquecer, faria o inverso e compraria títulos."],"1.1.9.1":["Numa quarta-feira de Copom, o mercado fica quieto até o fim da tarde.","A decisão só sai depois do fechamento, justamente para não provocar oscilação no pregão. Na terça seguinte vem a ata, explicando os votos. O número anunciado é a Meta; o que rendeu de fato no CDI foi a Over."],"1.1.9.1.2":["Num dia de feriado bancário parcial, houve apenas 40 operações de CDI no interbancário.","Faltou o mínimo de 100, então a B3 não apura a taxa pelas operações: a Taxa DI do dia sai igual à Selic Over. Seu CDB de '100% do CDI' rendeu, na prática, a Selic Over."],"1.1.9.2":["Você deposita R$ 50 mil e o compulsório está em 20%.","O banco guarda R$ 10 mil no BC e empresta R$ 40 mil. Quem receber esses R$ 40 mil e depositar em outro banco gera novo recolhimento. Cada rodada encolhe, e é assim que o compulsório freia o multiplicador."],"1.1.9.3":["Um banco médio sofre saques em massa por um boato nas redes.","Primeiro tenta o interbancário. Se ninguém emprestar, corre ao redesconto no BC, o último recurso. Já o open market não é socorro: é o BC ajustando a liquidez do sistema todo, comprando ou vendendo títulos com os dealers."],"1.1.10":["O dólar sobe 4% em dois dias por tensão eleitoral e o BC entra vendendo.","Isso é flutuante sujo, o regime brasileiro: o preço é de mercado, mas o BC aparece quando a oscilação incomoda. Se houvesse um teto anunciado que ele fosse obrigado a defender, seria banda cambial."],"1.1.11":["A inflação em 12 meses fecha em 5,2%, acima do teto de 4,5%.","Quem definiu a meta foi o CMN, quem tem que trazê-la de volta é o BC, e quem mediu foi o IBGE. Persistindo o estouro por seis meses, o presidente do BC escreve a carta aberta ao Ministro da Fazenda."],"1.1.12":["Você olha o extrato da poupança e do financiamento do apartamento.","Nos dois aparece TR, que nasce da TBF (média das LTN prefixadas) menos um redutor. Se fosse crédito no BNDES para a empresa, o indexador seria TLP, ligada às NTN-B e ao IPCA."],"1.2.1":["Três siglas aparecem no mesmo processo de abertura de uma corretora.","O CMN escreve a norma (normativo), o BC ou a CVM autoriza e fiscaliza (supervisor), e a corretora atende o cliente (operador). Ninguém acumula os três papéis."],"1.2.2":["Uma nova regra de crédito rural é publicada no site do BC como Resolução.","Resolução é o instrumento do CMN, o conselho de três membros presidido pelo Ministro da Fazenda. O BC publica e executa, mas a caneta que assinou a diretriz foi a do CMN."],"1.2.3":["Uma fintech pede autorização para funcionar e depois é multada por descumprir uma norma.","As duas coisas passam pelo BC: ele autoriza o funcionamento e ele pune. O que ele não faz é escolher a meta de inflação, que vem do CMN."],"1.2.4":["Um influenciador recomenda ações sem registro e é investigado.","Quem apura é a CVM, porque o tema é mercado de capitais e atuação de quem opina sobre valores mobiliários. Se o caso fosse cobrança abusiva de tarifa em conta corrente, o dono do assunto seria o BC."],"1.2.5":["Uma seguradora atrasa sistematicamente o pagamento de sinistros de automóvel.","Quem fiscaliza e pune é a SUSEP. As regras gerais do contrato de seguro, porém, foram fixadas antes pelo CNSP. Um traça o caminho, o outro cobra o cumprimento."],"1.2.6":["Os funcionários de uma estatal têm um fundo de pensão exclusivo deles.","Fundo restrito a um grupo é entidade fechada: as regras vêm do CNPC e a fiscalização é da PREVIC. Se fosse um PGBL vendido a qualquer pessoa no banco, cairia em CNSP e SUSEP."],"1.2.7":["Você quer abrir conta corrente para receber salário e o gerente oferece produtos.","Só banco comercial (ou múltiplo com carteira comercial) e cooperativa podem captar depósito à vista. Um banco de investimento não abre essa conta: ele trabalha com prazo, IPO e fundos."],"1.2.8":["Uma usina contrata seguro de R$ 800 milhões contra incêndio.","A seguradora assina a apólice, mas repassa parte do risco a uma resseguradora, para não quebrar num sinistro único. E a venda ao cliente passou por uma corretora, não pela seguradora direto."],"1.2.9":["Você compra ações pelo home broker e um CDB na mesma tela do app.","A ação foi negociada em bolsa, com preço visível em tempo real. O CDB foi fechado no balcão, por preço negociado, sem essa vitrine. Debênture, CRI e CRA seguem o mesmo caminho do CDB."],"1.2.10":["A corretora registra sua ordem de venda com o preço errado e você perde R$ 90 mil.","O MRP cobre até R$ 200 mil por erro ou omissão do participante, e é administrado pela BSM. Se a perda fosse por queda do papel, não haveria ressarcimento: risco de mercado é do investidor."],"1.2.11":["Você precisa da certificação para trabalhar e faz o exame da ANBIMA.","A ANBIMA está no papel de Educar. Quando ela publica dados da indústria de fundos, é Informar. Quando negocia com a CVM em nome dos associados, é Representar. Quando cria código de conduta, é Autorregular."],"1.2.12":["Três colegas fizeram provas diferentes no mesmo ano.","Quem virou assessor passou pela ANCORD. Quem virou analista tirou o CNPI na APIMEC. Quem quer planejar a vida financeira do cliente busca o CFP, pela PLANEJAR."],"1.3.1":["O gerente oferece uma aplicação a 1,2% ao mês por 45 dias.","Antes de qualquer tecla, converta: 45 dias são 1,5 mês. Usar n = 45 com taxa mensal produz um número absurdo. Casar taxa e prazo é o passo zero."],"1.3.2":["Duas propostas para os mesmos R$ 20 mil por 2 anos a 1% ao mês.","No simples você soma 24 parcelas de 1% e chega a 24%. No composto, cada mês rende sobre o saldo já corrigido e o total passa de 26,9%. A diferença é só juro sobre juro, e ela cresce com o prazo."],"1.3.3":["Um título rende 0,8% ao mês e você quer comparar com um CDB de 10% ao ano.","Suba a mensal para anual pelo composto: 1,008 elevado a 12, menos 1, dá cerca de 10,03%. Multiplicar por 12 daria 9,6% e faria você recusar a melhor oferta."],"1.3.3.1":["Você precisa converter 2,5% ao mês em taxa anual no meio de um atendimento.","Com a rotina gravada, joga 2,5 em i, 1 em n, digita 12 e aperta R/S. O n guarda o prazo da taxa que você TEM, nunca o que você quer. Trocar a ordem inverte o resultado."],"1.3.4":["O banco empresta R$ 50 mil a um cliente em 12 parcelas.","Para o cliente, entra R$ 50 mil hoje e saem 12 parcelas. Para o banco, sai R$ 50 mil e entram 12. O mesmo contrato tem dois diagramas de sinais opostos, e errar o lado inverte o cálculo."],"1.3.5":["Uma padaria avalia comprar uma máquina de R$ 80 mil que economiza R$ 25 mil por ano em cinco anos.","Se a TMA do dono é 12% ao ano, traga os cinco fluxos a valor presente. VPL positivo e TIR acima de 12% liberam a compra. E se um ano não gerar economia, esse período entra como zero, nunca é pulado."],"1.3.6":["Você tem R$ 30 mil em recebíveis de cartão para 90 dias e precisa do dinheiro hoje.","O banco aplica desconto por fora, sobre o valor de face, e a mordida é maior. Se você estivesse comprando um prefixado que vale R$ 30 mil no vencimento, o cálculo seria por dentro, e o desconto sairia menor."],"1.3.7":["Financiamento de R$ 240 mil em 20 anos, com o gerente oferecendo Price ou SAC.","No Price a prestação é sempre igual, mais fácil de encaixar no orçamento apertado. No SAC começa mais alta e vai caindo, e o total de juros pagos é menor. Quem tem folga hoje escolhe SAC."],"1.3.8":["Seu salário subiu 6% e a inflação do ano foi 4,5%.","O ganho real não é 1,5%: é 1,06 dividido por 1,045, menos 1, ou seja, cerca de 1,44%. A subtração simples sempre exagera o ganho, e a banca conta com isso."],"1.3.9":["Dois títulos vencem em 2032: um paga cupom semestral, o outro só no final.","O que paga cupom devolve pedaços do capital antes, então sua duration é menor e ele oscila menos quando o juro sobe. O sem cupom tem duration igual ao prazo e é o mais sensível dos dois."],"1.4.2":["Você faz um Pix de R$ 300 no domingo à noite e uma TED de R$ 40 mil na terça de manhã.","O Pix passou pelo SPI, o Pix nunca passa pelo SPB. A TED passou pelo SPB. Os dois liquidam em tempo real (LBTR), mas moram em infraestruturas diferentes."],"1.4.3":["Você compra Tesouro IPCA+ pelo app da corretora e um fundo compra LFT no atacado.","A sua operação é custodiada na clearing da B3, porque veio pelo Tesouro Direto. A do fundo vai para o SELIC, o sistema do mercado institucional. Mesmo tipo de título, custódias distintas."],"1.4.4":["Um banco grande dá sinais de insolvência e o mercado interbancário travа.","Entram os escudos: o BC pode abrir linha de liquidez (LLI no curto prazo, LLT no médio), o COMEF monitora o contágio, o compulsório regula a liquidez e Basileia já exigia capital para absorver a perda."],"1.4.5":["Um banco brasileiro tem R$ 10 bilhões em ativos ponderados pelo risco.","Pela regra internacional bastaria 8% de capital. No Brasil, o Índice de Basileia exigido é 11%, então ele precisa de R$ 1,1 bilhão, não R$ 800 milhões. Nossa régua é mais dura."],"1.4.6":["Dois clientes assinam declaração: um tem R$ 1,4 milhão aplicado, outro R$ 14 milhões.","O primeiro é qualificado e assina o Anexo B. O segundo é profissional, assina o Anexo A e, por consequência, também é qualificado. O caminho de volta não existe."],"2.1.1":["Um Tesouro IPCA+ 2035 foi emitido a R$ 1.000 e hoje aparece a R$ 3.900 na tela.","O valor corrigido pela inflação acumulada é o VNA. O preço que o mercado paga hoje, que pode estar acima ou abaixo dele, é o PU. Ágio e deságio são exatamente a diferença entre os dois."],"2.1.1.1":["Você aplica R$ 20 mil num CDB e precisa resgatar no 25º dia, com R$ 400 de rendimento.","Ainda pega IOF, porque não completou 30 dias, e o cálculo é o menor entre 1% ao dia sobre o resgate e o limite da tabela sobre o rendimento. Só depois de descontar o IOF é que os 22,5% de IR incidem."],"2.1.2":["Um cliente quer receber uma renda semestral e outro quer só juntar até 2040.","Para o primeiro, NTN-F (prefixada com cupom) ou NTN-B com cupom. Para o segundo, NTN-B Principal, que apesar do nome de Nota não paga cupom e entrega tudo no vencimento."],"2.1.2.1":["Um banco arremata lote de LTN num leilão do Tesouro e depois revende a um fundo.","O leilão da STN é mercado primário, restrito aos dealers do Tesouro. A revenda ao fundo é secundário, mercado institucional. Se fosse você comprando pelo app, seria Tesouro Direto."],"2.1.2.3":["Você tem R$ 8 mil no Tesouro Selic e R$ 40 mil no Tesouro IPCA+.","A taxa de custódia de 0,20% não incide sobre os R$ 8 mil, porque a isenção de até R$ 10 mil vale só para LFT. Sobre os R$ 40 mil do IPCA+ ela é cobrada integralmente."],"2.1.3":["Um banco quer captar R$ 100 milhões e escolhe entre CDB e LCI.","Com CDB o dinheiro entra livre, para qualquer uso. Com LCI ele precisa ter carteira de crédito imobiliário para dar lastro. A letra é mais barata para o banco porque é isenta ao cliente, mas vem carimbada."],"2.1.3.1":["Uma pessoa tem R$ 200 mil em CDB de um banco e R$ 200 mil numa cooperativa.","Se o banco quebrar, o FGC paga R$ 200 mil e consome esse valor do teto de R$ 1 milhão por quatro anos. Se a cooperativa quebrar, quem paga é o FGCOOP, sem teto agregado e sem prazo de renovação."],"2.1.3.2":["Você precisa vender uma aplicação antes do vencimento e o banco não recompra.","Se for CDB, dá para negociar no secundário e achar comprador. Se for RDB ou RDC, não existe essa porta: você depende do emissor ou espera o vencimento."],"2.1.3.3":["Um cliente quer isenção de IR e pode deixar o dinheiro parado por 8 meses.","LCI ou LCA servem, pois exigem 6 meses. LCD não serve: o prazo mínimo dela é 12 meses. Nas três há FGC e garantia real, mas o prazo é o que elimina a opção."],"2.1.4":["O gerente diz que a debênture do cliente é 'garantida'.","Pode ter garantia real do próprio ativo da empresa, mas FGC não tem, e nunca terá. Nenhum título corporativo tem: FGC é coisa de banco, e quem emitiu foi uma companhia."],"2.1.4.1":["Uma construtora quebra devendo a três debenturistas diferentes.","Quem tem garantia real recebe do bem separado. O quirografário entra na fila junto com os demais credores. O subordinado só vê dinheiro se sobrar algo depois de todos. Mesma empresa, três destinos."],"2.1.4.2":["Um banco tem R$ 2 bilhões em financiamentos imobiliários de 25 anos e quer o dinheiro agora.","Vende a carteira à securitizadora, que paga à vista com deságio. A securitizadora emite CRI no mercado para se financiar. O banco antecipou o caixa e o investidor ficou com o risco da carteira."],"2.1.5":["A Selic está em 10,5% ao ano e você deposita na poupança dia 20.","Acima de 8,5%, a regra é fixa: 0,5% ao mês mais TR. E o rendimento só cai no dia 20 do mês seguinte, sobre o menor saldo do período. Sacar no dia 19 apaga o rendimento daquele valor."],"2.1.6":["Você compra pelo app da corretora um CDB de um banco pequeno que paga 118% do CDI.","A corretora é apenas distribuidora. O risco de crédito é do banco emissor, e é a ele que o limite de R$ 250 mil do FGC se refere. Se o emissor quebrar, a corretora não devolve nada."],"2.1.6.1":["Você quer trocar de corretora, mas tem um CDB de 3 anos com taxa excelente.","Não precisa resgatar: pede portabilidade e leva o título com a mesma taxa, prazo e contagem de IR. Se fosse poupança, não daria, porque ela é depósito à vista e não um título transferível."],"2.2.1":["Você compra um CDB e uma ação no mesmo dia, com R$ 10 mil em cada.","No CDB você é credor, tem data e taxa combinadas, e o IR cai pela tabela regressiva. Na ação você é sócio, não há prazo nem taxa, e o IR é alíquota fixa. São mundos jurídicos diferentes."],"2.2.2":["Uma empresa familiar Ltda quer captar com investidores externos e listar na bolsa.","Antes de qualquer coisa precisa se transformar em S/A, porque cota não se negocia em bolsa e Ltda não emite ação. É uma mudança de estrutura, não uma formalidade."],"2.2.3":["Você olha PETR3, PETR4 e SANB11 na tela.","O 3 é ordinária e vota. O 4 é preferencial, não vota em regra, mas tem preferência nos lucros. O 11 é unit, um pacote com os dois tipos. E se a empresa passar três anos sem distribuir, a PN ganha voto."],"2.2.3.1":["Você quer investir na Apple sem abrir conta no exterior.","Compra um BDR na B3, um recibo lastreado nas ações custodiadas fora. Se ele estiver em bolsa e tiver oferta pública, é Nível 3. Se estiver no balcão sem registro na CVM, é Nível 1."],"2.2.4":["Uma varejista estreia na bolsa em março e faz nova emissão em novembro.","Março foi IPO, dinheiro novo para a empresa no mercado primário. Novembro foi follow-on. Se em dezembro um fundo anunciasse compra das ações que já circulam para assumir o controle, seria OPA."],"2.2.4.1":["Uma oferta de 100 milhões de ações recebe pedidos de 400 milhões.","Há rateio proporcional entre os investidores. A empresa pode emitir até 25% a mais como lote adicional para aproveitar a demanda, e ainda há 15% de lote suplementar reservado à estabilização pelo formador de mercado."],"2.2.5":["Uma companhia é liquidada devendo a bancos, funcionários e acionistas.","Funcionários e bancos recebem primeiro. O acionista fica com o que sobrar, e muitas vezes não sobra. Ser dono significa maior retorno potencial e o último lugar na fila."],"2.2.6":["Uma empresa lucra R$ 100 milhões e o estatuto nada diz sobre dividendo obrigatório.","Nesse silêncio, o mínimo é 50% do lucro líquido. Se a assembleia quisesse inserir um percentual no estatuto para reger a omissão, o piso passaria a ser 25%. Os dois números existem e não são intercambiáveis."],"2.2.7":["Uma ação de R$ 0,08 é agrupada e outra de R$ 180 é desdobrada.","A de centavos vira, por exemplo, R$ 8,00: menos ações, preço maior, e um centavo de variação deixa de valer 12%. A de R$ 180 vira R$ 18, e o lote de 100 fica acessível. Em nenhum dos dois o patrimônio muda."],"2.2.8":["Três empresas estão em segmentos diferentes e o controle de uma é vendido.","No Nível 1, o minoritário com ON tem 80% do preço pago ao controlador. No Nível 2, ON e PN têm 100%. No Novo Mercado só existe ON, com 100%. O segmento decide quanto você leva."],"2.2.9":["Uma ação sobe muito, mas é cotada a R$ 0,60 e negocia pouco.","Ela não entra no Ibovespa: penny stock está fora, e o critério é volume negociado, revisado a cada quatro meses. Estar entre as 100 mais negociáveis seria assunto do IBrX 100, não do Ibovespa."],"2.2.10":["Você vende R$ 15 mil em ações no mês com lucro de R$ 3 mil e, em outro dia, faz um day trade lucrativo.","O swing de R$ 15 mil fica isento, porque não passou de R$ 20 mil de vendas no mês. O day trade paga 20% sobre o lucro, sem isenção nenhuma. E o prejuízo de um não abate o lucro do outro."],"2.2.10.1":["Em abril você recebe R$ 52 mil de dividendos de uma empresa e R$ 48 mil de JCP de outra.","Os R$ 52 mil passaram do teto mensal por empresa, então há 10% sobre o valor inteiro, não sobre o excedente. O JCP não tem teto: são 17,5% retidos, mesmo sendo menor que o outro valor."],"2.3.1":["Você quer ganhar com a alta da Petrobras, mas só tem R$ 2 mil.","Comprar 1.000 ações exigiria R$ 30 mil. Um derivativo pode dar direito a comprar nesse preço futuro por uma fração disso: é alavancagem. O mesmo instrumento, usado por um produtor para travar preço, seria hedge."],"2.3.1.1":["Você aplica R$ 50 mil num COE de capital protegido por 4 anos e o índice cai 30%.","Você recebe os R$ 50 mil de volta, sem um centavo de correção. O principal está salvo, mas quatro anos de inflação e de CDI foram perdidos. E o IR sai pela tabela regressiva, mesmo o COE tendo ações dentro."],"2.4.1":["Um banco que administra seu fundo entra em liquidação.","O fundo tem CNPJ próprio e patrimônio segregado, então ele não vira massa falida do banco: outro administrador assume. É por isso que fundo não precisa de FGC."],"2.4.2":["Você tem cotas de um FII e de um fundo de renda fixa e precisa de dinheiro amanhã.","No fundo de renda fixa você pede resgate e o próprio fundo devolve. No FII, que é fechado, não existe resgate: você precisa achar comprador na bolsa, pelo preço que o mercado der."],"2.4.3":["Dois fundos de ações prometem seguir o Ibovespa, e um cobra taxa de performance.","Só o ativo pode cobrar performance, porque ele tenta superar o índice. O passivo apenas replica, e sua rentabilidade fica levemente abaixo do índice por causa dos custos. Cobrar performance em passivo é irregular."],"2.4.4":["Uma empresa da carteira do fundo convoca assembleia para aprovar uma fusão.","Quem vota é o gestor, que escolhe os ativos. O administrador não vota: ele supervisiona, precifica a carteira e responde pelos registros. E o risco de liquidez do fundo é dos dois juntos."],"2.4.5":["Sua cota valia R$ 15, subiu para R$ 18 (com cobrança de performance), caiu para R$ 16 e voltou a R$ 17,80.","Não há nova cobrança: a linha d'água ficou em R$ 18, e a subida de R$ 16 para R$ 17,80 é só recuperação. O gestor volta a ganhar performance depois de ultrapassar os R$ 18 e o benchmark."],"2.4.6":["Você tem fundos de cinco gestoras diferentes, todos comprados na mesma corretora.","Graças à conta e ordem, você tem um cadastro só. Os administradores não falam com você: mandam as informações para a corretora, e ela é obrigada a repassar. Em assembleia, a corretora representa seus interesses."],"2.4.7":["Um fundo diz ser de ações, mas tem 55% em ações e 45% em CDB.","Não pode se chamar de ações: o piso é 67%. Com essa composição ele é, na prática, um multimercado, que é o único sem exigência de concentração."],"2.4.7.1":["Um fundo de renda fixa tem 60% da carteira em CDB e debêntures de empresas.","Passou de 50% em crédito privado, então precisa carregar o sufixo 'Crédito Privado' no nome e o alerta de concentração no termo de adesão. É um aviso de risco, não um detalhe de marketing."],"2.4.7.2":["Um fundo de ações quer comprar cotas de um fundo de renda fixa para carregar caixa.","Não pode: fundo de cotas compra do mesmo tipo. Só o multimercado tem passe livre para comprar cotas de qualquer tipificação, justamente porque ele mesmo não tem regra de concentração."],"2.4.8":["Um fundo de R$ 400 milhões quer concentrar em ativos de poucos emissores.","Pode ir a 100% em títulos do governo, mas só R$ 80 milhões num único banco (20%), R$ 40 milhões numa companhia (10%) e R$ 20 milhões num emissor pessoa física (5%). Quanto menor o emissor, mais curta a corda."],"2.4.9":["Um fundo alavancado com derivativos fecha o mês com patrimônio negativo.","Se a responsabilidade for limitada, você perde no máximo o que aplicou e o resto sobra para o administrador, que tem 20 dias para apresentar plano de recuperação à assembleia. Se for ilimitada, podem te chamar para aportar mais."],"2.4.10":["Você fica três anos num fundo multimercado classificado como curto prazo pela Receita.","A alíquota final é 20%, não 15%. Na tabela de curto prazo só existem duas faixas, e ela para nos 20% por mais tempo que você fique. Paciência não compra desconto nesse caso."],"2.4.10.1":["Você tem 200 cotas de R$ 50 num fundo de renda fixa longo prazo e chega maio.","O come-cotas leva 15% do rendimento acumulado em forma de cotas: o valor de cada cota continua R$ 50, mas você passa a ter menos cotas. Se fosse fundo de ações, nada aconteceria."],"2.4.12":["Dois FII na sua carteira: um dono de galpões logísticos, outro com carteira de CRI.","O de galpões sofre se um inquilino sair e o imóvel ficar vazio: risco de vacância. O de CRI sofre se um devedor parar de pagar: risco de crédito. E os dois têm risco de liquidez, porque FII não tem resgate."],"2.4.12.1":["Você recebe R$ 900 de aluguéis do FII no mês e vende cotas com R$ 12 mil de lucro.","Os R$ 900 podem ser isentos, se o fundo é listado, tem mais de 100 cotistas e você tem menos de 10% das cotas. Os R$ 12 mil de ganho pagam 20% via DARF, sem exceção."],"2.4.13":["Você quer exposição às 100 ações mais negociadas sem comprar uma por uma.","Um ETF de índice resolve: cota negociada em bolsa como ação, mas fundo aberto e passivo, que replica a carteira do índice. Ele nunca vai tentar superar o índice, e é isso que mantém o custo baixo."],"2.5.1":["Dois irmãos ganham igual: um declara pelo completo e tem muitas deduções, o outro usa o simplificado.","Para o primeiro, PGBL: abate até 12% da renda hoje e paga IR sobre tudo depois. Para o segundo, VGBL: nada a abater agora, mas o IR futuro só morde o rendimento."],"2.5.2":["Sua base de cálculo anual fica em R$ 70 mil, na faixa de 27,5%.","Não pague 27,5% de R$ 70 mil. Aplique a alíquota e subtraia a parcela a deduzir de R$ 10.740,98. Esquecer a dedução infla o imposto em mais de dez mil reais no papel."],"2.5.3":["Um cliente de 62 anos pensa em converter o PGBL em renda mensal.","Antes de assinar, ele precisa entender que a titularidade passa à seguradora e não há mais resgate nem volta. Enquanto está no diferimento, ele pode sacar, portar e indicar beneficiários, e o dinheiro não entra em inventário."],"2.5.4":["Um cliente de 65 anos, casado e com filho pequeno, escolhe a modalidade de renda.","Vitalícia pura paga mais por mês, mas acaba com ele. Temporária de 15 anos também não reverte. Se ele quer proteger a família, precisa de prazo certo, prazo mínimo garantido ou reversível ao cônjuge, aceitando parcela menor."],"2.5.5":["Um cliente de 30 anos e outro de 58 vão começar hoje um plano.","O de 30 tende ao regressivo: em mais de 10 anos a alíquota cai a 10%. O de 58, que talvez saque em 5 anos, pegaria 25% no regressivo e provavelmente sai melhor no progressivo, com retenção de 15% e ajuste na declaração."],"2.5.6":["Dois planos cobram 4% de carregamento: um na entrada, outro na saída.","Prefira o da saída. Na entrada, o aporte já começa menor e rende menos por todo o período. Na saída, o valor cheio trabalhou para você e a taxa só morde no final."],"2.5.7":["Um cliente insatisfeito com a taxa quer levar o PGBL para outra instituição no nome do filho.","A portabilidade não paga IR e preserva o tempo para a tabela regressiva, mas exige mesmo CPF nas duas pontas e mesmo tipo de plano. Passar para o filho é doação, não portabilidade."],"2.6.1":["Um cliente com score 900 na Serasa tem o crédito negado no banco onde tem conta.","Score é reputação de mercado; rating é a nota interna daquele banco, que pode ter registro de atraso antigo. E o SCR, do BC, mostra ao banco o endividamento total dele no sistema."],"2.6.2":["Fatura de R$ 8 mil e o cliente paga R$ 2 mil.","Os R$ 6 mil caem no rotativo, a juros altíssimos, com teto de 100% da dívida. Pedir o refinanciamento no mesmo dia troca isso por parcelas com taxa menor e prazo maior: quase sempre a melhor saída."],"2.6.3":["Limite de cheque especial de R$ 20 mil e o cliente fica R$ 800 negativo por 6 dias.","Os juros incidem só sobre os R$ 800, em capitalização simples, respeitando o teto de 8% ao mês. Mesmo se o banco der carência de juros, o IOF é cobrado proporcionalmente."],"2.6.4":["Um servidor e um celetista de empresa privada pedem consignado.","Os dois pagam menos que no crédito pessoal, porque desconta em folha. Mas o celetista carrega o risco de demissão, e nesse caso cerca de 30% da rescisão vai para quitar ou amortizar a dívida."],"2.6.5":["Um cliente quer R$ 60 mil: um pede livre na conta, outro para comprar um carro.","O livre é empréstimo e sai mais caro, porque a garantia é só o CPF. O do carro é financiamento com alienação fiduciária: o bem responde pela dívida, então a taxa cai e o prazo alonga."],"2.6.6":["Um casal compra um apartamento de R$ 500 mil.","Precisa de R$ 100 mil a R$ 150 mil de entrada, pode usar FGTS, financia em até 420 meses e paga dois seguros: DFI se o prédio sofrer dano, MIP se um deles falecer ou ficar inválido, quitando a dívida."],"2.6.7":["Uma indústria tem contratos assinados, mas precisa pagar fornecedores antes de receber.","Capital de giro resolve, e não exige dizer no que será gasto. Se ela oferecer recebíveis ou imóvel em garantia, a taxa cai bastante. Só o aval do sócio ajuda menos, mas ainda melhora a negociação."],"2.6.8":["Duas propostas para R$ 40 mil em 24 meses: uma a 1,6% ao mês com TAC alta, outra a 1,9% sem tarifa.","Compare o CET, não a taxa do anúncio. Se a TAC e o seguro saem do valor liberado, você recebe menos e paga a mesma parcela, o que empurra a taxa real bem acima de 1,6%. A oferta 'mais barata' pode custar mais."],"2.6.9":["Um cliente sem crédito aprovado quer trocar de carro em dois anos.","O consórcio aceita a entrada dele sem análise de crédito, que só vem na contemplação. Não há juros, mas há taxa de administração sobre o valor total da carta, fundo de reserva e seguro. Não é de graça, é sem juros."],"2.7.1":["Um cliente tem conta numa fintech e outra num banco tradicional.","Na fintech ele faz Pix e paga boletos, mas o saldo não tem FGC e ele não tem cheque especial. No banco tem FGC, tem crédito e o banco recolhe compulsório sobre aquele depósito."],"2.7.2":["Uma empresa precisa mandar R$ 200 mil às 17h30 de uma quinta.","Se for TED, passou do corte das 17h e liquida no dia seguinte. Pix resolveria na hora, mas para a empresa há tarifa, ao contrário da pessoa física. Se fosse entre contas do mesmo banco, seria TEF."],"2.7.3":["Um cliente quer levar R$ 300 mil para investir nos Estados Unidos e outro só quer manter dinheiro na conta lá.","Quem investe paga 1,1% de IOF. Quem apenas transfere para a própria conta no exterior paga 3,5%. Simplesmente estacionar o dinheiro fora custa mais do que aplicar."],"2.7.4":["Uma empresa quer remeter US$ 700 mil ao exterior e liga para a corretora de câmbio.","A corretora não pode: o limite dela é US$ 500 mil por operação. Só banco comercial, banco de investimento ou a Caixa operam sem teto. E, em qualquer caso, o VET tem que ser informado."],"2.7.5":["Uma pessoa sem conta chega à agência às 15h30 em São Paulo para pagar um boleto.","Se o atendimento é das 10h às 16h, ela deve ser atendida, e o fato de não ser cliente não muda nada: pagar boleto é serviço à comunidade. O mínimo legal são cinco horas ininterruptas em dias úteis."],"2.7.6":["Você passa o cartão na padaria e a compra é aprovada em dois segundos.","A maquininha é do adquirente, que captura e manda para a bandeira, que consulta o banco emissor, que aprova pelo seu limite. No fim do prazo, quem credita a padaria é o adquirente, descontada a taxa que os quatro dividem."],"2.8.1":["Você paga R$ 180 por mês de seguro, bate o carro e recebe R$ 45 mil.","Os R$ 180 são o prêmio, que sai do seu bolso. A batida é o sinistro. Os R$ 45 mil são a indenização, que sai do bolso da seguradora. O contrato que diz tudo isso é a apólice."],"2.8.2":["Um cliente financia um carro e contrata dois seguros.","O de automóvel cobre colisão, roubo e responsabilidade civil a terceiros: protege o bem e quem ele atropelar. O prestamista não protege o carro nem a pessoa: ele quita a dívida se o cliente morrer, ficar inválido ou perder o emprego."],"2.8.3":["Um motoboy de 32 anos e um empresário de 55 procuram seguro de vida.","Para o motoboy, acidentes pessoais faz sentido pelo risco da atividade, mas cobre só acidente: morte por doença fica fora. O empresário, que quer deixar patrimônio garantido para sempre, olha vida inteira."],"3.1.1":["Dois clientes querem 100% em ações: um tem 26 anos, outro 57.","Para o de 26, faz sentido: se der errado, sobram décadas para recuperar. Para o de 57, a dez anos da aposentadoria, o mesmo movimento pode ser irreversível. A idade não muda o produto, muda a consequência do erro."],"3.1.2":["Uma família recebe R$ 9 mil de salário e R$ 30 mil de PLR uma vez ao ano.","O salário sustenta a prestação do imóvel. A PLR não: ela pode não vir no ano seguinte, e a dívida vem. Receita esporádica serve para abater dívida ou reforçar reserva, não para assumir compromisso fixo."],"3.1.3":["Um cliente tem casa própria de R$ 700 mil, um apartamento alugado de R$ 400 mil e R$ 300 mil de financiamento.","Patrimônio líquido de R$ 800 mil. Mas só o apartamento alugado é bem de não uso, o único que produz dinheiro. A casa própria, por mais valiosa, apenas consome IPTU e manutenção."],"3.1.4":["Um médico autônomo gasta R$ 12 mil por mês e ganha entre R$ 15 mil e R$ 40 mil.","A reserva dele deve ficar perto de R$ 144 mil, doze meses de despesa, pela instabilidade da renda. Um servidor com a mesma despesa poderia parar em seis meses. A conta é sobre despesa, nunca sobre renda."],"3.1.5":["Um cliente tem R$ 15 mil no rotativo, R$ 30 mil de consignado disponível e um carro quitado.","A recomendação é trocar a dívida: puxar o consignado, com desconto em folha e taxa muito menor, para matar o rotativo. Ele continua devendo, mas passa a pagar uma fração dos juros."],"3.1.6":["Um cliente pede na primeira reunião um plano para comprar uma casa em três anos.","Ainda não há plano a dar: você acabou de estabelecer o relacionamento. Falta coletar renda, dívidas e objetivos, e analisar se três anos são viáveis. Recomendar antes de diagnosticar é inverter o método."],"3.1.7":["Um cliente traz três informes: salário, CDB e LCI.","O salário entra como tributável e vai ao ajuste anual. O CDB é tributação exclusiva: pagou na fonte e não se mexe mais. A LCI é isenta. Três linhas diferentes na mesma declaração."],"3.2.1":["Um cliente de perfil conservador liga e manda comprar uma ação que viu no noticiário.","Você pode executar, porque a ordem é dele e não houve recomendação sua. O que você não pode é sugerir esse papel a ele sem perfil compatível e atualizado."],"3.2.2":["Três clientes recusam prejuízo de formas diferentes.","Quem não tolera ver a cota cair e quer saque em 24 horas é perfil 1. Quem aceita colocar uma parte em multimercado, mantendo o resto seguro, é perfil 2. Quem topa perder 30% em busca de 60% é perfil 3."],"3.2.3":["Um empresário com R$ 20 milhões aplicados faz a API e sai conservador.","As duas classificações convivem: ele é investidor profissional pelo patrimônio, e conservador pela tolerância a risco. Ter acesso a produtos restritos não obriga ninguém a usá-los."],"3.3.1":["Uma gestora convida você para um fim de semana em resort, no mês da campanha de captação dos fundos dela.","O princípio em jogo é independência e imparcialidade: o benefício pode contaminar sua recomendação. O caminho é recusar ou registrar formalmente e levar ao compliance, nunca decidir sozinho e no silêncio."],"3.3.2":["Um colega passou na prova e criou um grupo para 'ajudar' os próximos candidatos com as questões que caíram.","Isso é fraude ao processo de certificação, não colaboração. E se ele já estiver se apresentando como certificado antes de sair o resultado oficial, comete outra infração."],"3.3.3":["Um material de venda destaca 'garantido pelo FGC' em letras grandes e compara o CDB com um multimercado.","Duas violações: o FGC não pode ser elemento de destaque para pautar a decisão, e a comparação exige produtos de mesma natureza, com períodos e métricas equivalentes."],"3.3.4":["Um cliente pergunta quanto você ganha para vender aquele fundo.","Você deve poder responder: a política completa fica em área específica do site, e na aplicação se informa valor ou percentual, ou uma estimativa. Ao fim do trimestre ele recebe o extrato da remuneração, salvo se for investidor profissional."],"3.3.5":["Um cliente com R$ 6 milhões financeiros pede atendimento diferenciado.","Ele atende o mínimo de R$ 5 milhões do private. Mas a instituição só pode oferecer esse segmento se tiver comunicado a ANBIMA e mantiver 75% dos gerentes com CFP, além de estrategista, analista de risco e economista."],"3.3.6":["No meio de uma conversa sobre renda fixa, o cliente comenta que a filha vai fazer intercâmbio no ano que vem.","Ele não pediu nada, mas revelou uma necessidade implícita: liquidez em moeda estrangeira num prazo curto. Escuta ativa é sair da reunião com isso anotado, e não com mais um CDB vendido."],"3.3.7":["Um sistema fora do ar impede o registro de ordens, um cliente processa a instituição e o caso viraliza.","São três riscos encadeados: o operacional foi a falha do sistema, o legal é a ação judicial e o de imagem é a repercussão. Se além disso houver descumprimento de norma da CVM, entra o regulatório."],"3.4.1":["Uma loja de joias de alto padrão movimenta grandes valores em espécie.","Ela está sujeita à lei de lavagem, como imobiliárias e empresários de atletas. E, por não ter regulador setorial próprio, quem a regula nesse tema é o COAF, diferente de um banco, que responde ao BC."],"3.4.2":["Dinheiro de origem ilícita percorre três etapas em dezoito meses.","Entra no sistema por depósitos fracionados numa loja de fachada: colocação. Vira criptomoeda e passa por offshore: ocultação. Volta como três apartamentos no nome do próprio dono, incompatíveis com a renda: integração."],"3.4.3":["Um cliente quer sacar R$ 70 mil em espécie e pede para o funcionário separar o dinheiro para amanhã.","Não dá: saque igual ou superior a R$ 50 mil exige provisionamento com três dias úteis. E, no ato, é preciso registrar CPF do portador e do proprietário, além de origem e destino."],"3.4.4":["Um banco é multado por falhas de controle e um dos envolvidos é processado criminalmente.","Na esfera administrativa, a multa é o dobro do lucro, limitada a R$ 20 milhões, com inabilitação de até 10 anos. Na criminal, a pena é de 3 a 10 anos, e ali a multa não tem teto: o juiz fixa."],"3.4.5":["Um funcionário comenta com o cunhado o saldo de um cliente conhecido da cidade.","Ele violou o sigilo bancário da LC 105/2001, com pena de 1 a 4 anos, e ainda expôs dado pessoal, o que alcança a instituição pela LGPD, com multa de até 2% do faturamento e teto de R$ 50 milhões por infração."],"3.4.6":["Três condutas apuradas no mesmo processo da CVM.","Combinar negócios para inflar o preço de um papel é manipulação: 1 a 8 anos. Comprar antes do anúncio de fusão é uso de informação privilegiada: 1 a 5 anos. Gerir carteira de amigos sem registro, mesmo de graça, é exercício irregular: detenção de 6 a 24 meses."],"3.4.7":["Quatro operadores agem de formas diferentes no mesmo dia.","Um coloca uma ordem gigante e falsa e a cancela: spoofing. Outro monta várias ordens escalonadas simulando muitos compradores: layering. Um terceiro gira a carteira do cliente por corretagem: churning. O quarto compra para si antes da ordem grande do cliente: front running."],"R.1":["Uma reforma na loja custa R$ 90 mil e deve gerar R$ 30 mil por ano de lucro extra.","O payback simples dá 3 anos. Descontando os fluxos a 10% ao ano, passa de 3,7 anos. E nenhum dos dois diz nada sobre o que a loja vai gerar no ano 8, por isso a decisão final é do VPL."],"R.2":["Uma empresa se financia 60% com capital próprio (custo de 15%) e 40% com dívida (custo de 10%).","O CMPC fica em torno de 13%, e cai um pouco mais porque o juro da dívida abate imposto. Qualquer projeto que renda menos que isso destrói valor, mesmo tendo lucro contábil."],"R.3":["Uma carteira tem 40% num fundo com 6% esperado e 60% em ações com 15% esperado.","O retorno esperado é 11,4%, média ponderada pelos pesos. Somar 6 com 15 e dividir por dois daria 10,5% e mentiria sobre a carteira, porque ignora que a maior fatia está no ativo mais agressivo."],"R.4":["O dólar sobe forte e o BC quer agir sem queimar reservas.","Ele oferece swap cambial tradicional: assume a variação do dólar e recebe juros em reais, o que equivale a vender dólar futuro. O mercado se protege, a pressão alivia e o estoque de dólares fica intacto."],"R.5":["Um prefeito quer criar um auxílio permanente no último ano de mandato.","A LRF exige indicar de onde sai o dinheiro de forma duradoura, e respeitar os limites de pessoal e de dívida. Já se o tema fosse o preço livre de um serviço não regulado, a lei aplicável seria a de Liberdade Econômica."],"R.6":["Três clientes perdem dinheiro no mesmo mês, por motivos distintos.","Um vendeu Tesouro IPCA+ com prejuízo após alta dos juros: risco de mercado. Outro tinha debênture de empresa que quebrou: risco de crédito. O terceiro não conseguiu vender cotas de um FII pequeno pelo preço justo: risco de liquidez."],"R.7":["Você compra ações de alguém que você nunca vai conhecer.","Não precisa confiar nele: a contraparte central se coloca no meio e garante a liquidação. Os papéis ficam no depositário central, que controla a titularidade. Operações que não são depositadas ficam anotadas numa entidade registradora."],"R.8":["Um pequeno produtor, um microempreendedor e uma família comprando casa buscam crédito.","O produtor pode recorrer a uma agência de fomento estadual, que não capta do público. O microempreendedor tem a SCMEPP, que também não capta. A família pode ir a uma SCI, que capta poupança, ou a uma companhia hipotecária, que não capta nem depósito nem poupança."],"R.9":["O controlador vende 70% de uma companhia e quer entregar 100% ao comprador.","Com drag along previsto, ele arrasta os minoritários e obriga a venda. Se só houvesse tag along, cada minoritário decidiria se vai ou fica. Um protege o negócio, o outro protege o pequeno."],"R.10":["Um fundo fechado vende um imóvel e devolve parte do dinheiro aos cotistas.","Isso é amortização: o valor da cota cai, mas você continua com a mesma quantidade e segue cotista. Resgate seria você sair do fundo, e em fundo fechado ele não existe."],"4.1.1":["Uma empresa é criticada em três frentes no mesmo relatório.","Emissão acima do limite é Ambiental. Oficina terceirizada com jornada abusiva é Social. Conselho formado só por parentes do dono, sem independentes, é Governança. Uma denúncia, três pilares."],"4.1.2":["Uma cervejaria enfrenta dois problemas de clima em anos seguidos.","A seca que reduz a safra de cevada e encarece o insumo é risco climático físico. A nova regra que taxa a emissão da fábrica e obriga trocar a caldeira é risco climático de transição."],"4.1.3":["Você quer saber se o banco onde trabalha leva ESG a sério.","Procure o relatório GRSAC dele, publicado uma vez por ano com base em 31/12, no formato das tabelas do BC. Se a gestora dos fundos for signatária do PRI, há mais um selo, mas o PRI é compromisso voluntário, não regulação."],"4.1.4":["Dois fundos falam de sustentabilidade na lâmina.","Um tem no regulamento o objetivo sustentável, com metodologia e indicadores: pode se chamar de sustentável. O outro só usa fatores ESG na análise de risco, buscando bater o CDI: integra ESG, mas anunciar-se como sustentável seria greenwashing."],"4.2.1":["Alguém tenta alterar uma transação de dois anos atrás na rede do Bitcoin.","Teria que recalcular aquele bloco e todos os seguintes, em milhares de computadores simultaneamente. É essa dificuldade, paga em energia e poder computacional, que substitui a figura do banco como fiador da verdade."],"4.2.2":["Um aluguel de temporada é fechado entre desconhecidos de países diferentes.","Um smart contract pode retê o pagamento e liberá-lo ao anfitrião só quando a chave digital for usada. Ninguém precisa confiar em ninguém, porque a regra está no código e ele executa sozinho."],"4.2.3":["Você transfere valor para um amigo no Japão de duas formas.","Pelo banco, há identificação completa, tarifa maior e alguns dias de espera, com todo o aparato regulatório protegendo você. Pela rede descentralizada, chega em minutos, custa pouco e é público, mas não há a quem reclamar se algo der errado."],"4.2.4":["Um imóvel de R$ 1 milhão é dividido em 100 tokens.","Dez pessoas podem entrar com R$ 10 mil cada, algo impossível antes. E o dono, se precisar de crédito, oferece só 20 tokens em garantia, mantendo o resto livre, em vez de alienar o imóvel inteiro."],"4.2.5":["Um investidor deixa R$ 200 mil em bitcoin na exchange e outro guarda numa carteira física.","O primeiro depende da solidez e da segurança da corretora: se ela for hackeada ou quebrar, o problema é dele. O segundo está protegido de ataque online, mas se perder as palavras de recuperação, ninguém no mundo devolve o dinheiro."],"4.3.1":["Um cliente quer exposição a bitcoin, mas se recusa a lidar com senhas e carteiras.","Um ETF de bitcoin resolve: ele compra a cota na B3, como uma ação, e acompanha a variação sem custodiar nada. Se ele quisesse apenas parar valor em dólar dentro do mundo cripto, o instrumento seria uma stablecoin."],"4.3.2":["Um banco emite uma debênture tokenizada e um artista vende uma obra digital.","A debênture continua tendo cupom, prazo e rating: só o registro e a liquidação mudaram para o blockchain. A obra é um NFT, única e insubstituível, e o contrato pode pagar royalties ao artista em cada revenda futura."],"4.3.3":["Você usa um título público como garantia de um empréstimo pela plataforma do DREX.","O token do título é bloqueado por smart contract e liberado ao credor se você não pagar, sem etapas manuais. É tokenização, mas dentro de um livro centralizado do Banco Central, com garantia soberana, não numa rede sem dono."],"4.4.1":["Um cliente de 12 anos de relacionamento quer taxa melhor em outro banco.","Pelo Open Finance ele autoriza o compartilhamento do histórico e leva sua reputação para o novo banco, que pode ofertar juro menor. O prazo e o alcance dessa autorização são decisão dele, não do banco."],"4.4.2":["Uma instituição usa IA em três frentes no mesmo dia.","Redigir o resumo da carta ao cliente é generativa, e exige revisão humana. Barrar uma compra suspeita no cartão em tempo real é regenerativa. Projetar a inadimplência do próximo trimestre é modelo preditivo."],"4.4.3":["Uma startup quer lançar um seguro por assinatura totalmente digital.","Em vez de esperar anos por autorização plena, entra no sandbox: testa com um grupo restrito, por prazo definido, reportando erros e reclamações. Ao final o regulador libera, ajusta a norma ou encerra o projeto."],"4.4.4":["Uma fintech com 3 milhões de contas nunca teve agência.","Ela emite conta de pagamento, autorizada pelo BC, sem FGC e sem compulsório. Se quiser emprestar, precisa ser SCD ou SEP. E o que a colocou em pé de igualdade com os grandes foi o Open Finance dando acesso ao histórico do cliente."],"S.1":["Numa feira de negócios, um empresário comenta que 'banco é tudo igual' e deixa o caixa da empresa parado na conta.","Abertura consultiva: em vez de sacar um produto, o profissional pergunta como funciona o fluxo de caixa e quando o dinheiro fica ocioso. A oferta só vem depois do diagnóstico — e sem prometer rendimento algum."],"S.2":["Cliente de 58 anos quer 'multiplicar rápido' o dinheiro da rescisão para se aposentar em 3 anos.","As perguntas certas expõem a contradição: prazo curto e dependência daquele dinheiro pedem preservação, não multiplicação. O diagnóstico reformula o objetivo junto com o cliente antes de qualquer produto aparecer."],"S.3":["O relatório mensal chegou 5% negativo e o cliente ligou assustado.","Comunicação eficaz: reconhecer a queda, explicar a causa, situar no horizonte combinado e reapresentar o plano — sem minimizar com 'é só no papel' e sem esconder custo ou risco."],"S.4":["O cliente vê no app uma tarifa que julga indevida e ameaça 'ir direto ao Banco Central'.","O fluxo correto: registrar no atendimento/SAC com protocolo e prazo; persistindo o problema, ouvidoria. E o profissional acompanha o protocolo em vez de sumir do cliente."],"S.5":["Última semana do trimestre, meta de previdência em 60%, e o dinheiro do cliente da vez é a reserva de emergência dele.","Autogestão com ética: reserva de emergência não vai para produto de longo prazo por causa de meta. Oferece-se o adequado a esse cliente e busca-se a meta em quem tem o perfil certo."],"S.6":["Por erro de digitação, a aplicação foi para um fundo com carência — e o cliente pode precisar do dinheiro.","Assumir, corrigir, comunicar e registrar: avisar o cliente, acionar a correção da operação, documentar o caso e revisar o processo para o erro não se repetir."]};// =====================================================================
// GLOSSÁRIO — significado dos termos técnicos, na linguagem do mercado.
// Aparece SÓ no conteúdo das pílulas: o termo fica sublinhado e, ao ser
// tocado, abre a caixinha com o significado. Nunca em questões,
// alternativas ou explicações, para não entregar gabarito.
//
// Regra de escrita: uma frase que explique, uma segunda só se agregar o
// detalhe que a prova cobra. Sem circularidade ("benchmark é o benchmark
// do fundo") e sem jargão novo dentro da definição.
// =====================================================================
const GLOSSARIO={// --- mercado, taxas e indicadores ---
"benchmark":"Índice usado como referência para comparar o desempenho de um investimento. Se um fundo tem o CDI como benchmark, render menos que o CDI significa que ele ficou abaixo da própria referência.","spread":"Diferença entre o que o banco paga a quem empresta dinheiro a ele e o que cobra de quem toma emprestado. É de onde sai boa parte do lucro da intermediação financeira.","CDI":"Taxa dos empréstimos que os bancos fazem entre si, de um dia para o outro. Anda coladíssima na Selic e é a régua da renda fixa: 'rende 100% do CDI' quer dizer que acompanha essa taxa.","Selic":"A taxa básica de juros da economia, definida pelo Copom a cada 45 dias. É o ponto de partida de todas as outras taxas do país.","Selic Meta":"O alvo de juros anunciado pelo Copom. A taxa efetiva que o mercado pratica (a Selic Over) fica bem próxima dela, um pouco abaixo.","Selic Over":"A taxa que de fato se pratica nas operações com títulos públicos de um dia. Costuma ficar 0,10 ponto percentual abaixo da Selic Meta.","IPCA":"O índice oficial de inflação do Brasil, medido pelo IBGE. É a régua da meta de inflação e corrige os títulos públicos indexados a preços.","IGP-M":"Índice de inflação calculado pela FGV, muito usado em contratos de aluguel. Sofre mais influência dos preços no atacado, por isso oscila mais que o IPCA.","INPC":"Índice de inflação do IBGE voltado às famílias de renda mais baixa. Serve de referência para reajustes salariais.","TR":"Taxa Referencial, um índice de correção que hoje rende muito pouco ou zero. Aparece na poupança e em financiamentos imobiliários.","TLP":"Taxa de Longo Prazo, o custo dos financiamentos do BNDES. Substituiu a antiga TJLP e acompanha os juros de mercado dos títulos públicos.","PTAX":"A taxa de câmbio oficial divulgada pelo Banco Central ao fim do dia. Serve de referência para contratos que dependem do dólar.","PIB":"Soma de tudo que o país produz de bens e serviços num período. É o termômetro do tamanho e do crescimento da economia.","taxa livre de risco":"O retorno que se consegue sem correr risco de calote, representado no Brasil pelos títulos do governo. Tudo que tem risco precisa render mais que ela para valer a pena.","prêmio de risco":"O retorno a mais que um investimento precisa oferecer, acima da taxa livre de risco, para compensar o risco que ele carrega.",// --- renda fixa ---
"renda fixa":"Investimento em que as regras de remuneração são conhecidas desde a aplicação: uma taxa fixa, um índice ou uma combinação dos dois. Você empresta dinheiro e sabe como o retorno será calculado.","prefixado":"Título cuja taxa é definida na aplicação e não muda: você sabe exatamente quanto vai receber no vencimento, em reais.","pós-fixado":"Título cujo rendimento acompanha um indicador, como a Selic ou o CDI. Você conhece a regra, mas só sabe o valor final no resgate.","híbrido":"Título que combina uma taxa fixa com um índice, tipicamente 'IPCA mais 6% ao ano'. Protege da inflação e ainda entrega um ganho real.","juro real":"O que sobra do rendimento depois de descontada a inflação. É o ganho que de fato aumenta o poder de compra.","CDB":"Certificado de Depósito Bancário: você empresta dinheiro ao banco e recebe juros. Tem cobertura do FGC e paga imposto pela tabela regressiva.","RDB":"Recibo de Depósito Bancário, parecido com o CDB, mas inegociável: não pode ser transferido nem vendido antes do prazo.","LCI":"Letra de Crédito Imobiliário, emitida por bancos com lastro em crédito imobiliário. É isenta de imposto de renda para pessoa física e tem FGC.","LCA":"Letra de Crédito do Agronegócio, mesma lógica da LCI, mas lastreada em crédito rural. Isenta de IR para pessoa física e coberta pelo FGC.","LCD":"Letra de Crédito do Desenvolvimento, título bancário voltado a projetos de desenvolvimento, também isento de imposto de renda para pessoa física.","CRI":"Certificado de Recebíveis Imobiliários: título emitido por securitizadora, lastreado em pagamentos futuros de imóveis. Isento de IR para PF e SEM cobertura do FGC.","CRA":"Certificado de Recebíveis do Agronegócio, o equivalente do CRI para o agro. Isento de IR para pessoa física e sem FGC.","LIG":"Letra Imobiliária Garantida, título bancário com dupla garantia: o banco emissor e uma carteira de créditos separada do patrimônio dele. Isenta de IR para PF.","LF":"Letra Financeira, título de bancos para captar dinheiro de longo prazo. Tem valor mínimo alto e não conta com o FGC.","debênture":"Título de dívida emitido por empresa não financeira para captar recursos. Quem compra vira credor da empresa, não sócio.","debênture incentivada":"Debênture de projeto de infraestrutura que dá isenção de imposto de renda à pessoa física, como incentivo do governo ao setor.","cupom":"Pagamento periódico de juros que alguns títulos fazem antes do vencimento, em vez de deixar tudo para o final.","LTN":"Título público prefixado que não paga cupom: você compra com desconto e recebe R$ 1.000 no vencimento. No Tesouro Direto é o Tesouro Prefixado.","NTN-B":"Título público que paga IPCA mais uma taxa fixa. No Tesouro Direto é o Tesouro IPCA+, o clássico para objetivos de longo prazo.","NTN-F":"Título público prefixado que paga cupons semestrais de juros. No Tesouro Direto é o Tesouro Prefixado com Juros Semestrais.","LFT":"Título público pós-fixado atrelado à Selic, o de menor oscilação de preço. No Tesouro Direto é o Tesouro Selic.","duration":"O prazo médio em que o dinheiro do título efetivamente volta ao investidor, considerando todos os pagamentos. Quanto maior a duration, mais o preço balança quando os juros mudam.","marcação a mercado":"Reavaliar todo dia quanto vale o título pelo preço que ele teria se fosse vendido hoje. É o que faz a cota oscilar mesmo em fundos de renda fixa.","FGC":"Fundo Garantidor de Créditos: devolve até R$ 250 mil por CPF e por instituição, com teto global de R$ 1 milhão a cada 4 anos, se o banco quebrar.",// --- renda variável ---
"renda variável":"Investimento sem retorno combinado: o resultado depende do desempenho do ativo e do humor do mercado. Ações são o exemplo típico.","ação":"Menor pedaço do capital de uma empresa. Quem compra vira sócio e participa dos lucros e dos riscos do negócio.","ordinária":"Ação que dá direito a voto nas assembleias. É a classe com poder de decisão sobre os rumos da companhia.","preferencial":"Ação sem direito a voto, em regra, mas com preferência no recebimento de dividendos e no reembolso de capital.","unit":"Pacote que junta ações de tipos diferentes num único papel negociado, geralmente uma ordinária mais preferenciais.","dividendo":"Parte do lucro da empresa distribuída aos acionistas em dinheiro. Desde 2026 a isenção vale até R$ 50 mil por mês por empresa; acima disso há retenção de 10% sobre todo o valor recebido daquela companhia.","JCP":"Juros sobre Capital Próprio: outra forma de a empresa remunerar o acionista. É despesa financeira para a companhia, que abate imposto, e sofre retenção na fonte de 17,5% para quem recebe, sem teto de isenção.","bonificação":"Ações novas distribuídas de graça aos acionistas, a partir de reservas de lucro da empresa.","subscrição":"Direito de comprar novas ações antes do mercado, num aumento de capital, para não ter sua participação diluída.","bônus de subscrição":"Título que dá ao dono o direito de subscrever ações da empresa no futuro, por preço e prazo definidos.","split":"Desdobramento: a empresa divide cada ação em várias, o que baixa o preço unitário e facilita a negociação. O valor total do investidor não muda.","inplit":"Grupamento: várias ações viram uma só, elevando o preço unitário. Usado para tirar o papel da faixa de centavos.","tag along":"Proteção do acionista minoritário: se o controle da empresa é vendido, ele tem o direito de vender as ações dele também, por no mínimo 80% do preço pago ao controlador.","drag along":"O contrário do tag along: cláusula que obriga o minoritário a vender junto quando o controlador vende, para viabilizar a venda de 100% do negócio.","free float":"A fatia das ações que circula livremente na bolsa, fora das mãos dos controladores. Quanto maior, melhor a liquidez do papel.","IPO":"Oferta pública inicial: a primeira vez que uma empresa vende ações ao público e passa a ser negociada em bolsa.","mercado primário":"Onde o papel é emitido pela primeira vez e o dinheiro vai para o caixa da empresa emissora.","mercado secundário":"Onde os investidores negociam entre si papéis já emitidos. Dá liquidez ao mercado, mas não leva dinheiro novo à empresa.","penny stock":"Ação negociada por centavos, tipicamente abaixo de R$ 1,00. Costuma ter pouca liquidez e risco alto.","blue chip":"Ação de empresa grande, conhecida e muito negociada, com liquidez alta no dia a dia da bolsa.","lote padrão":"Quantidade padronizada de negociação na bolsa, normalmente 100 ações. Abaixo disso a negociação é no mercado fracionário.","home broker":"A plataforma pela internet em que o investidor envia ordens de compra e venda à corretora.","day trade":"Comprar e vender o mesmo ativo no mesmo dia. Tem imposto de renda de 20% sobre o ganho, sem a isenção mensal do varejo.","circuit breaker":"Interrupção automática dos negócios na bolsa quando o índice cai demais, para esfriar o mercado e conter o pânico.",// --- fundos ---
"cota":"A menor fração do patrimônio de um fundo: quem investe compra cotas, e o valor de cada uma sobe ou desce com a carteira. Numa sociedade limitada, cota é a fração do capital que cabe a cada sócio.","cotista":"O investidor dono de cotas do fundo. É ele quem assume os riscos e recebe os resultados da carteira.","administrador":"Quem responde legalmente pelo fundo perante a CVM: contrata prestadores, cuida das informações e do cumprimento das regras.","gestor":"Quem decide o que comprar e vender dentro da carteira do fundo, dentro da política de investimento definida.","custodiante":"Quem guarda os ativos do fundo e mantém o registro de quem é o dono de cada papel.","come-cotas":"Antecipação semestral do imposto de renda em alguns fundos, feita em maio e novembro pela alíquota menor da faixa. Em vez de dinheiro, o fisco leva cotas.","chamada de capital":"Compromisso em que o investidor entra com o dinheiro aos poucos, conforme o fundo precisa investir. Comum em fundos de participações.","taxa de administração":"Percentual anual sobre o patrimônio, cobrado para remunerar a gestão do fundo. Já está descontado na cota que você vê.","taxa de performance":"Cobrança extra sobre o que o fundo render acima do benchmark. Só pode ser cobrada respeitando a linha d'água.","linha d'água":"A regra que impede cobrar performance duas vezes sobre o mesmo ganho: o fundo precisa primeiro recuperar a queda anterior antes de voltar a cobrar.","fundo aberto":"Fundo em que dá para aplicar e resgatar a qualquer momento, respeitando os prazos do regulamento.","fundo fechado":"Fundo com número fixo de cotas e sem resgate: para sair antes do fim, o cotista vende suas cotas a outro investidor no mercado.","FII":"Fundo de Investimento Imobiliário: aplica em imóveis ou em papéis do setor e distribui os rendimentos mensalmente, isentos de IR para PF que cumpra as condições legais.","FIDC":"Fundo que compra direitos creditórios, ou seja, recebíveis de empresas, como duplicatas e parcelas de cartão.","FIP":"Fundo de Investimento em Participações: compra participação em empresas, geralmente fechadas, para influenciar a gestão e vender depois com ganho.","ETF":"Fundo de índice negociado em bolsa como se fosse uma ação, que replica a carteira de um índice de referência.","gestão passiva":"Estratégia que busca apenas acompanhar o índice de referência, sem tentar superá-lo. Costuma ter custo menor.","gestão ativa":"Estratégia em que o gestor escolhe os ativos tentando render mais que o benchmark, o que também eleva o custo e o risco.","patrimônio líquido":"O que o fundo tem, menos o que ele deve. Dividido pelo número de cotas, dá o valor da cota.",// --- previdência e seguros ---
"PGBL":"Plano de previdência que permite deduzir as contribuições até 12% da renda bruta tributável, para quem declara no modelo completo. Na saída, o IR incide sobre o valor total resgatado.","VGBL":"Plano de previdência sem dedução na declaração, indicado para quem usa o modelo simplificado ou já atingiu o limite. Na saída, o IR incide só sobre o rendimento.","tabela regressiva":"Regime de imposto em que a alíquota cai conforme o dinheiro fica mais tempo aplicado, chegando a 10% acima de dez anos na previdência.","tabela progressiva":"Regime de imposto em que a alíquota cresce conforme o valor recebido, seguindo a mesma tabela do salário.","portabilidade":"Transferir o saldo de um plano de previdência para outro, sem resgatar e sem pagar imposto na troca.","carência":"Prazo mínimo que precisa ser cumprido antes de poder resgatar ou movimentar o dinheiro.","renda vitalícia":"Forma de recebimento em que a seguradora paga uma renda mensal até o fim da vida do beneficiário.","FIE":"Fundo em que o dinheiro dos planos de previdência é efetivamente investido. As taxas do plano são cobradas nele.","sinistro":"O evento coberto pelo seguro quando ele de fato acontece: o roubo, o acidente, o incêndio.","indenização":"O valor que a seguradora paga ao segurado quando o sinistro coberto ocorre.","franquia":"A parte do prejuízo que fica por conta do segurado. A seguradora só paga o que passar desse valor.","capitalização":"Produto que junta poupança programada e sorteios. Não é investimento: parte do dinheiro custeia os prêmios dos sorteios.",// --- crédito e serviços bancários ---
"cheque especial":"Limite de crédito pré-aprovado na conta corrente, com juros altos, cobrados só sobre o valor e os dias efetivamente usados.","rotativo":"O crédito que se forma quando o cliente não paga a fatura inteira do cartão. Tem os juros mais caros do mercado e duração limitada a um mês.","CET":"Custo Efetivo Total: a taxa que reúne juros, tarifas, tributos e seguros de uma operação de crédito. É o número que permite comparar propostas de verdade.","amortização":"A parte da parcela que efetivamente abate o valor devido. O resto da parcela é juros.","SAC":"Sistema de Amortização Constante: a amortização é sempre igual e os juros vão caindo, então a prestação começa alta e diminui. Atenção: no atendimento ao cliente, a mesma sigla significa Serviço de Atendimento ao Consumidor.","Price":"Sistema de amortização com prestações iguais do começo ao fim: no início paga-se mais juros e menos principal.","leasing":"Arrendamento mercantil: a instituição compra o bem e aluga ao cliente, que pode ficar com ele ao fim do contrato pagando o valor residual.","factoring":"Empresa que compra recebíveis de outras empresas com desconto. Não é instituição financeira e não pode captar dinheiro do público.","penhor":"Empréstimo com garantia de um bem móvel entregue ao credor, como joias na Caixa Econômica Federal.","alienação fiduciária":"Garantia em que o bem financiado fica em nome do credor até a quitação. É o que permite juros menores em veículos e imóveis.","score":"Nota que estima a chance de um cliente pagar em dia, calculada por birôs de crédito a partir do histórico dele.","rating":"Nota de risco de crédito atribuída por agências classificadoras a empresas, bancos e países. Quanto pior o rating, maior o juro exigido.","SCR":"Sistema de Informações de Créditos do Banco Central, que reúne o endividamento dos clientes no sistema financeiro.","conta de pagamento":"Conta oferecida por instituição de pagamento, para receber e movimentar dinheiro. Não tem FGC nem crédito direto como a conta corrente.","adquirente":"A empresa que captura a transação do cartão no lojista e repassa o dinheiro a ele. A bandeira é quem define as regras da rede.","custódia":"Serviço de guarda dos ativos do investidor, com registro de titularidade em nome dele.","clearing":"Câmara que registra, compensa e liquida as operações, garantindo que quem comprou receba e quem vendeu seja pago.","tesouraria":"A área do banco que administra o caixa e as posições próprias da instituição, casando o que entra e o que sai.",// --- sistema financeiro e regulação ---
"CMN":"Conselho Monetário Nacional, o órgão máximo do sistema financeiro: define as regras, mas não executa nem fiscaliza.","Copom":"Comitê do Banco Central que define a Selic a cada 45 dias, olhando a meta de inflação.","CVM":"Autarquia que regula e fiscaliza o mercado de capitais: valores mobiliários, fundos, companhias abertas e quem distribui esses produtos.","SUSEP":"Autarquia que fiscaliza seguros, previdência complementar aberta e capitalização.","PREVIC":"Autarquia que fiscaliza os fundos de pensão, ou seja, a previdência complementar fechada.","ANBIMA":"Associação do mercado que faz autorregulação e certificação. Cria códigos com regras adicionais às oficiais e aplica os exames como a CPA.","B3":"A bolsa brasileira, onde se negociam ações, derivativos e outros ativos, com suas próprias câmaras de registro e liquidação.","COAF":"Órgão que recebe e analisa as comunicações de operações suspeitas de lavagem de dinheiro.","autorregulação":"Regras que o próprio mercado cria para si, acima do mínimo exigido pela lei. Vale para quem adere e é fiscalizada pela entidade, não pelo Estado.","SPB":"Sistema de Pagamentos Brasileiro: o conjunto de regras e sistemas que fazem o dinheiro circular entre instituições com segurança.","compulsório":"Parcela dos depósitos que os bancos são obrigados a deixar parada no Banco Central. Mexer nele aumenta ou reduz o dinheiro disponível para crédito.","redesconto":"Empréstimo de curtíssimo prazo que o Banco Central faz aos bancos para socorrer a liquidez deles.","open market":"Compra e venda de títulos públicos pelo Banco Central para regular a quantidade de dinheiro em circulação.","política monetária":"O conjunto de instrumentos que o Banco Central usa para controlar a inflação, com destaque para a Selic.","política fiscal":"As decisões do governo sobre arrecadar impostos e gastar. Afeta a dívida pública e, indiretamente, os juros.","política cambial":"As ações que afetam a relação do real com as moedas estrangeiras e o fluxo de capitais.","LRF":"Lei de Responsabilidade Fiscal: impõe limites de gasto e endividamento aos governos, especialmente com pessoal.",// --- conduta, ética e prevenção ---
"suitability":"Dever de verificar se o produto é adequado ao perfil, aos objetivos e à situação financeira do cliente antes de recomendá-lo.","API":"Análise do Perfil do Investidor: o questionário que classifica o cliente em conservador, moderado ou arrojado. Em tecnologia, a mesma sigla designa a conexão que faz dois sistemas conversarem, como no Open Finance.","investidor qualificado":"Quem tem mais de R$ 1 milhão em investimentos e atesta essa condição por escrito, além de profissionais certificados quanto aos próprios recursos.","investidor profissional":"Quem tem mais de R$ 10 milhões declarados, além de instituições financeiras, seguradoras, fundos e investidores não residentes. Todo profissional também é qualificado.","chinese wall":"Separação obrigatória entre as áreas de uma instituição para que informações de uma não contaminem as decisões da outra, como gestão de recursos próprios e de terceiros.","insider trading":"Usar informação privilegiada, ainda não pública, para ganhar dinheiro no mercado. É crime.","front running":"Executar a ordem própria antes da ordem do cliente, para se aproveitar do efeito dela no preço. É crime.","churning":"Girar a carteira do cliente sem necessidade só para gerar corretagem. Prática abusiva e vedada.","conflito de interesses":"Situação em que o ganho do profissional ou da instituição pode se opor ao interesse do cliente. Resolve-se informando e priorizando o cliente.","PLDFT":"Prevenção à Lavagem de Dinheiro e ao Financiamento do Terrorismo: o conjunto de deveres de conhecer o cliente, monitorar e comunicar suspeitas.","KYC":"Conheça Seu Cliente: procedimentos de identificação e conhecimento do cliente, base de toda a prevenção à lavagem de dinheiro.","lavagem de dinheiro":"Processo de dar aparência lícita a recursos de origem criminosa, em três fases: colocação, ocultação e integração.","LGPD":"Lei Geral de Proteção de Dados: define como dados pessoais podem ser coletados e usados, exigindo base legal e finalidade clara.","sigilo bancário":"Dever de não revelar informações financeiras do cliente, com quebra apenas nas hipóteses previstas em lei.",// --- finanças pessoais e análise ---
"reserva de emergência":"Dinheiro guardado em aplicação de liquidez imediata e baixo risco, para cobrir imprevistos sem precisar resgatar investimentos de longo prazo.","liquidez":"A facilidade de transformar um investimento em dinheiro sem perder valor. Poupança tem liquidez imediata; imóvel, quase nenhuma.","volatilidade":"O tamanho do sobe e desce do preço de um ativo. Quanto maior, mais o valor oscila no caminho.","diversificação":"Distribuir o dinheiro entre ativos diferentes para que o resultado não dependa de um só. Reduz o risco sem exigir abrir mão do retorno na mesma proporção.","payback":"O tempo que um investimento leva para devolver o valor aplicado. Simples de calcular, mas ignora o que acontece depois e o valor do dinheiro no tempo.","VPL":"Valor Presente Líquido: traz todos os fluxos futuros para hoje e desconta o investimento inicial. Positivo, o projeto cria valor.","TIR":"Taxa Interna de Retorno: a taxa que zera o VPL do projeto. Serve para comparar com o custo do dinheiro.","TMA":"Taxa Mínima de Atratividade: o retorno mínimo que o investidor exige para topar um projeto, dado o que ele conseguiria em outra aplicação.","CMPC":"Custo Médio Ponderado de Capital, o WACC: quanto custa, na média, o dinheiro que a empresa usa, somando capital próprio e de terceiros conforme o peso de cada um.","alavancagem":"Usar dinheiro de terceiros para ampliar o resultado. Multiplica o ganho quando dá certo e o prejuízo quando dá errado.","custo de oportunidade":"O que você deixa de ganhar na melhor alternativa descartada ao escolher um caminho.","orçamento":"O planejamento de quanto entra e quanto sai por período. É a base de qualquer plano financeiro pessoal.","balanço patrimonial":"A fotografia do que a pessoa tem e do que ela deve num momento. A diferença é o patrimônio líquido dela.",// --- derivativos e câmbio ---
"derivativo":"Contrato cujo valor deriva de outro ativo, como dólar, juros ou uma ação. Serve para proteger, arbitrar ou especular.","ativo subjacente":"O ativo de referência do qual o derivativo tira o valor: o dólar de um contrato futuro de dólar, por exemplo.","hedge":"Proteção: montar uma posição que compensa o prejuízo de outra se o mercado virar contra você.","swap":"Contrato de troca de rentabilidades entre duas partes, como trocar uma taxa prefixada pela variação do dólar.","cupom cambial":"O juro em dólar praticado no Brasil: quanto rende, em dólar, aplicar aqui dentro. Mostra o quanto o país paga para atrair capital externo.","termo":"No mercado de derivativos, contrato de compra e venda com preço fixado hoje e liquidação numa data futura combinada. Cuidado: no dia a dia bancário, 'termo' também aparece no sentido comum de documento, como no termo de adesão de um fundo.","opção":"Contrato que dá o direito, não a obrigação, de comprar ou vender um ativo por um preço determinado até certa data. Em outros contextos a palavra aparece no sentido comum de escolha, como na opção de compra ao fim de um leasing.","prêmio":"No seguro, o valor que o segurado paga à seguradora pela proteção contratada — não confunda com a indenização, que é o que a seguradora paga quando ocorre o sinistro. Em investimentos, 'prêmio' também designa o retorno extra exigido por correr mais risco.","COE":"Certificado de Operações Estruturadas: mistura renda fixa e variável num único produto, com cenários de retorno definidos. Pode ter capital protegido ou em risco.",// --- inovação, ESG e tecnologia ---
"ESG":"Sigla de ambiental, social e governança: os três critérios usados para avaliar a sustentabilidade e a conduta de uma empresa, além do resultado financeiro.","greenwashing":"Vender como sustentável algo que não é, maquiando o discurso ambiental sem prática que o sustente.","blockchain":"Registro digital distribuído em que cada bloco de informação é encadeado ao anterior. Ninguém precisa confiar num intermediário para validar a informação.","token":"Representação digital de um direito ou ativo dentro de uma rede blockchain.","tokenização":"Transformar um ativo do mundo real, como um imóvel ou um recebível, em tokens negociáveis digitalmente.","smart contract":"Programa que roda na blockchain e executa sozinho o que foi combinado, quando as condições acontecem.","DeFi":"Finanças descentralizadas: serviços financeiros que funcionam por programas na blockchain, sem banco no meio.","stablecoin":"Criptoativo que busca manter valor estável, geralmente atrelado ao dólar, para servir de meio de troca.","CBDC":"Moeda digital emitida pelo próprio banco central de um país. No Brasil, o projeto é o Drex.","Open Finance":"Sistema em que o cliente autoriza o compartilhamento dos próprios dados financeiros entre instituições. O dono do dado é o cliente.","fintech":"Empresa que usa tecnologia para oferecer serviços financeiros, geralmente com estrutura mais enxuta que a dos bancos tradicionais.","sandbox":"Ambiente controlado em que o regulador autoriza testar um produto inovador com público limitado e por prazo definido.","criptoativo":"Ativo digital registrado em blockchain, sem emissor central garantindo valor. Não tem curso legal no Brasil."};// =====================================================================

const CSS=`

.cx-mus-h{display:flex;align-items:center;gap:12px}
.cx-mus-h .tt{font-size:16px;font-weight:900;letter-spacing:-.02em;line-height:1.2}
.cx-mus-h .sub{font-size:12px;color:var(--mut);font-weight:700;margin-top:2px}
.cx-play{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:0;cursor:pointer;font-size:17px;

.cx-play:hover{filter:brightness(1.08)}
.cx-play.stop{background:var(--no);box-shadow:0 3px 10px rgba(229,72,77,.3)}
.cx-letra{margin-top:14px;display:grid;gap:3px}
.cx-verso{font-size:15.5px;line-height:1.5;padding:7px 11px;border-radius:9px;color:var(--ink2);

.cx-verso.ativa{background:var(--roxo-l);color:var(--ink);transform:translateX(5px);font-weight:900;

.cx-mus .dica{margin-top:12px;font-size:13px;line-height:1.55;color:var(--ink2);
  background:var(--azul-l);border-left:4px solid var(--azul);border-radius:10px;padding:11px}

.cx-tema{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 15px;margin-bottom:10px;
  box-shadow:0 1px 3px rgba(31,32,51,.04)}
.cx-tema h5{margin:0 0 9px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--azul);font-weight:900}
.cx-tema .lin{display:flex;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13.5px;line-height:1.4}
.cx-tema .lin:last-child{border-bottom:0}
.cx-tema .lin span:first-child{flex:1;color:var(--ink2)}
.cx-tema .lin b{white-space:nowrap;font-variant-numeric:tabular-nums;text-align:right}
