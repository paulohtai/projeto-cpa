ndos de tijolo, quando as unidades ficam vazias.","Fundos de desenvolvimento, durante as obras.","Todos os FII, na mesma intensidade."],"c":1,"exp":"Vacância é imóvel vazio, portanto risco do fundo de tijolo. O de papel sofre risco de crédito."},{"q":"Sobre a estrutura dos fundos de investimento imobiliário, é CORRETO afirmar:","alts":["São fundos abertos, com resgate a qualquer momento.","São fundos fechados, negociados em bolsa ou no mercado de balcão, sem resgate.","São fundos abertos negociados exclusivamente em bolsa.","São fundos fechados sem qualquer possibilidade de negociação."],"c":1,"exp":"Fechados e negociáveis. Em bolsa têm prazo indeterminado; no balcão são os cetipados."},{"q":"Um FII que investe em LCI, CRI e LIG é classificado como:","alts":["Fundo de tijolo.","Fundo de papel.","Fundo de desenvolvimento.","Fundo mono-inquilino."],"c":1,"exp":"Papel investe em títulos lastreados no mercado imobiliário; tijolo investe em imóveis físicos."},{"q":"REDENÇÃO: as duas fontes de retorno de um FII são:","alts":["Juros periódicos e amortização do principal.","Ganho de capital e proventos dos aluguéis.","Dividendos e juros sobre capital próprio.","Cupom semestral e devolução do principal."],"c":1,"exp":"Valorização da cota mais a distribuição dos aluguéis."}]},{"id":"2.4.12.1","titulo":"Tributação em FII","resumo":["GANHO DE CAPITAL (venda da cota com lucro): alíquota FIXA de 20%, independentemente de ser PF ou PJ e do tempo de permanência. Recolhido pelo PRÓPRIO INVESTIDOR, apurado mensalmente e pago via DARF até o último dia útil do mês seguinte.","RENDIMENTOS (aluguéis distribuídos): imposto de renda de 20% RETIDO NA FONTE.","ISENÇÃO dos rendimentos para PESSOA FÍSICA, desde que cumpridas TRÊS condições cumulativas: o fundo ser negociado em MERCADOS ORGANIZADOS; o investidor ter MENOS DE 10% das cotas; e o fundo ter NO MÍNIMO 100 COTISTAS."],"macete":"Ganho de capital: 20% sempre, via DARF, sem isenção. Rendimento: pode ser isento para PF se passar no teste 'organizado, menos de 10%, 100 cotistas'.","pegadinha":"A pegadinha campeã é estender a isenção ao ganho de capital. A isenção vale só para os RENDIMENTOS. Vendeu a cota com lucro, paga 20%. E as três condições são cumulativas.","questoes":[{"q":"Um investidor PF vende cotas de FII com lucro de R$ 10.000. O imposto devido é:","alts":["Isento, pois a pessoa física é isenta em FII.","R$ 2.000, ou 20% do ganho, via DARF pelo investidor.","R$ 1.500, ou 15% do ganho, via DARF pelo investidor.","R$ 2.000, ou 20% do ganho, retidos pela corretora."],"c":1,"exp":"Ganho de capital em FII: 20% fixos, sem isenção, recolhidos pelo investidor via DARF até o último dia útil do mês seguinte."},{"q":"São condições cumulativas para a isenção de IR sobre os RENDIMENTOS de FII para pessoa física:","alts":["Mercado organizado, menos de 10% das cotas e 100 cotistas.","Mercado organizado, com menos de 20% das cotas e 50 cotistas.","Apenas que o investidor seja pessoa física residente.","Ser fundo de tijolo com prazo mínimo de 24 meses."],"c":0,"exp":"As três condições precisam ser atendidas ao mesmo tempo. Falhando uma, a retenção de 20% se aplica."},{"q":"Um investidor PF detém 15% das cotas de um FII listado em bolsa com 500 cotistas. Sobre os rendimentos distribuídos:","alts":["Haverá isenção, pois o fundo é negociado em mercado organizado e tem mais de 100 cotistas.","Haverá retenção de 20% na fonte, pois ele detém mais de 10% das cotas.","Haverá retenção de 15% na fonte.","Haverá isenção porque é pessoa física."],"c":1,"exp":"Uma das três condições falhou (menos de 10% das cotas), então a isenção não se aplica."},{"q":"REDENÇÃO: a alíquota sobre os rendimentos distribuídos por um FII, quando não há isenção, é:","alts":["15% retidos na fonte.","20% retidos na fonte.","22,5% pela tabela regressiva.","17,5% retidos na fonte."],"c":1,"exp":"20% na fonte, o mesmo percentual do ganho de capital, mas com forma de recolhimento diferente."}]},{"id":"2.4.13","titulo":"ETF — Exchange Traded Fund","resumo":["Fundos cujas cotas são NEGOCIADAS EM BOLSA, como se fossem ações. Buscam REPLICAR o desempenho de um índice de referência.","São fundos ABERTOS e PASSIVOS: replicam passivamente o índice sem buscar superá-lo. Um ETF de Ibovespa investe nas ações do índice, na mesma proporção em que elas aparecem nele.","Não se restringem a ações: existem ETFs que replicam índices de renda fixa, como a taxa Selic ou o IMA-B, índice da ANBIMA.","Vantagens: diversificação sem precisar comprar individualmente cada ativo do índice, liquidez, e custos geralmente mais baixos que fundos tradicionais.","O material registra que o tema ETF não é cobrado nesta etapa da prova, mas prepara o terreno para investimentos alternativos."],"macete":"ETF é aberto, passivo e negociado em bolsa. Ele persegue o índice, nunca tenta vencê-lo.","pegadinha":"A banca chama o ETF de fundo fechado (como o FII) ou de fundo ativo. É aberto e passivo, mesmo tendo cotas negociadas em bolsa.","questoes":[{"q":"Sobre a natureza dos ETFs, é CORRETO afirmar:","alts":["São fundos fechados e de gestão ativa.","São fundos abertos e passivos, negociados em bolsa.","São fundos abertos e ativos, que superam o índice.","São certificados que representam ações estrangeiras."],"c":1,"exp":"Abertos, passivos e negociados em bolsa. Certificados de ações estrangeiras são BDR."},{"q":"Um ETF que replica o Ibovespa investe:","alts":["Nas ações que compõem o índice, na mesma proporção em que aparecem nele.","Apenas nas cinco maiores ações do índice.","Em derivativos referenciados no índice, sem comprar as ações.","Em títulos públicos federais indexados ao índice."],"c":0,"exp":"Replicação passiva: a carteira segue de perto a composição do índice."},{"q":"REDENÇÃO: além de índices de ações, os ETFs podem replicar:","alts":["Somente índices de bolsas internacionais.","Índices de renda fixa, como a Selic e o IMA-B.","Apenas o Ibovespa e os índices IBrX.","Apenas carteiras de fundos imobiliários."],"c":1,"exp":"Existem ETFs de renda fixa referenciados na Selic e no IMA-B."}]}],"boss":[{"q":"Os percentuais mínimos de Renda Fixa, Ações, Cambial e FI Infra são, respectivamente:","alts":["80%, 67%, 80% e 85%.","80%, 80%, 67% e 95%.","67%, 80%, 80% e 85%.","95%, 67%, 80% e 85%."],"c":0,"exp":"Renda fixa e cambial 80%, ações 67%, FI Infra 85% em debêntures incentivadas."},{"q":"Um fundo multimercado de curto prazo (critério da Receita) é resgatado após 3 anos. A alíquota de IR é:","alts":["15%","17,5%","20%","22,5%"],"c":2,"exp":"Na tabela de curto prazo a alíquota mínima é 20%, por mais tempo que o investidor permaneça."},{"q":"A taxa de performance só pode ser cobrada:","alts":["Por fundos passivos, sobre a rentabilidade total.","Por fundos ativos, acima do benchmark e da linha d'água.","Por qualquer fundo, em apuração mensal.","Apenas por fundos tipificados como Ações."],"c":1,"exp":"Fundo ativo, excedente ao benchmark, semestral no mínimo, com linha d'água."},{"q":"Um fundo com PL de R$ 500 milhões quer comprar debêntures de uma única companhia aberta. O limite é:","alts":["R$ 500 milhões.","R$ 100 milhões.","R$ 50 milhões.","R$ 25 milhões."],"c":2,"exp":"Emissor corporativo: 10% do PL. 10% de 500 milhões = R$ 50 milhões."},{"q":"O come-cotas incide sobre classes tipificadas como:","alts":["Ações, renda fixa e cambial.","Renda fixa, cambial e multimercado.","Todas as classes, sem exceção.","Apenas fundos de longo prazo."],"c":1,"exp":"Fundos de ações ficam de fora e são tributados só no resgate, a 15%."},{"q":"Uma pessoa física detém 5% das cotas de um FII listado em bolsa com 300 cotistas. Sobre os rendimentos distribuídos:","alts":["Retenção de 20% na fonte sobre os rendimentos.","Isenção, pois as três condições foram atendidas.","Retenção de 15% na fonte sobre os rendimentos.","Tributação pela tabela regressiva conforme o prazo."],"c":1,"exp":"Mercado organizado, menos de 10% das cotas e mais de 100 cotistas: isenção sobre os rendimentos. O ganho de capital continua a 20%."},{"q":"Assinale a atribuição do ADMINISTRADOR:","alts":["Comprar e vender os ativos da carteira.","Exercer o voto das ações detidas pela classe.","Apreçar os ativos e supervisionar o gestor.","Contratar a agência classificadora de risco."],"c":2,"exp":"As outras três são atribuições do gestor."},{"q":"Uma classe de cotas FECHADA caracteriza-se por:","alts":["Permitir o resgate a qualquer momento pelo cotista.","Não admitir resgate, mas ter liquidez no secundário.","Ser destinada apenas a investidores profissionais.","Não ter benchmark definido no regulamento."],"c":1,"exp":"Sem resgate, mas com possível liquidez, e com patrimônio inicial mínimo previsto."},{"q":"Um fundo de renda fixa aplica 55% do PL em CDBs e debêntures. Ele deve:","alts":["Ser reclassificado como fundo multimercado.","Incluir o sufixo 'Crédito Privado' e o alerta no termo.","Reduzir a exposição para no máximo 20% do PL.","Obter aprovação prévia da assembleia de cotistas."],"c":1,"exp":"Mais de 50% em ativos de emissores empresariais (inclusive bancos) exige o sufixo e o alerta."},{"q":"Em fundo de responsabilidade LIMITADA com PL negativo, o administrador deve apresentar plano de recuperação em até:","alts":["10 dias.","20 dias.","30 dias.","45 dias."],"c":1,"exp":"20 dias, com causas e circunstâncias, seguido de assembleia para votação do plano."},{"q":"O fundo SIMPLES de renda fixa caracteriza-se por:","alts":["95% em LFT ou emissor tão bom quanto o governo.","80% em ativos emitidos fora do país pelo governo.","Prazo médio da carteira inferior a 60 dias.","Cobrança obrigatória de taxa de performance."],"c":0,"exp":"É a única subcategoria que dispensa a assinatura do termo de adesão."},{"q":"Sobre a distribuição por conta e ordem, é CORRETO afirmar:","alts":["O administrador se relaciona diretamente com cada cotista.","O cotista tem cadastro só no distribuidor, que repassa.","O distribuidor não pode votar nas assembleias.","As cotas ficam no patrimônio do distribuidor."],"c":1,"exp":"Um cadastro só. E o registro das cotas é segregado do patrimônio do distribuidor."}]},{"id":"2.5","titulo":"Previdência Complementar","subtitulo":"PGBL, VGBL e a escolha da tabela certa","niveis":[{"id":"2.5.1","titulo":"PGBL x VGBL","resumo":["Previdência complementar: investimento de LONGO PRAZO para formar reserva que complemente a aposentadoria oficial, com benefícios fiscais e flexibilidade (permite resgates antes da aposentadoria).","PGBL (Plano Gerador de Benefício Livre): produto PREVIDENCIÁRIO com DIFERIMENTO FISCAL. Permite abater até 12% da RENDA BRUTA TRIBUTÁVEL na declaração. Exige declaração pelo MODELO COMPLETO e ser contribuinte de algum regime de previdência oficial.","No PGBL, o IR no resgate ou na renda incide sobre TODO O VALOR RECEBIDO, não apenas sobre os rendimentos.","VGBL (Vida Gerador de Benefício Livre): produto SECURITÁRIO, SEM diferimento fiscal. Não há abatimento na contratação, mas o IR incide APENAS SOBRE O RENDIMENTO. Escolha típica de quem declara pelo MODELO SIMPLIFICADO."],"macete":"PGBL: abate 12% agora, paga IR sobre TUDO depois. VGBL: não abate nada, mas paga IR só sobre o RENDIMENTO. Completo pede PGBL; simplificado pede VGBL.","pegadinha":"A banca inverte as bases de cálculo do IR, e sugere PGBL para quem declara pelo simplificado. Sem declaração completa e sem contribuição ao regime oficial, o PGBL perde todo o sentido.","questoes":[{"q":"Um cliente declara IR pelo modelo simplificado e não contribui para regime oficial de previdência. O produto adequado e a base de incidência do IR são:","alts":["PGBL, com IR sobre todo o valor resgatado.","VGBL, com IR incidindo apenas sobre o rendimento.","PGBL, com IR apenas sobre o rendimento.","VGBL, com abatimento de 12% da renda bruta tributável."],"c":1,"exp":"Sem declaração completa, o benefício do PGBL não se aproveita. O VGBL cobra IR só sobre o rendimento."},{"q":"O limite de abatimento da renda bruta tributável proporcionado pelo PGBL é de:","alts":["10%","12%","15%","20%"],"c":1,"exp":"Até 12% da renda bruta tributável, desde que o contribuinte declare pelo modelo completo e contribua para regime oficial."},{"q":"Sobre a natureza dos produtos, é CORRETO afirmar:","alts":["PGBL é securitário e VGBL é previdenciário.","PGBL é previdenciário e VGBL é securitário.","Ambos são produtos securitários sem diferimento.","Ambos permitem abater 12% da renda tributável."],"c":1,"exp":"PGBL previdenciário com diferimento; VGBL securitário sem diferimento."},{"q":"REDENÇÃO: no PGBL, o imposto de renda no resgate incide sobre:","alts":["Apenas o rendimento obtido.","Todo o valor recebido, incluindo o principal aportado.","Apenas o valor que exceder 12% da renda bruta.","Apenas os aportes, sem os rendimentos."],"c":1,"exp":"É a contrapartida do abatimento feito lá atrás: o imposto foi adiado, não perdoado."}]},{"id":"2.5.2","titulo":"Declaração Anual de Ajuste de IR","resumo":["Documento em que a PF informa à Receita todos os rendimentos, bens, direitos e despesas do ano anterior, ajustando o que já foi descontado na fonte com o que é efetivamente devido.","TRÊS TIPOS DE RENDIMENTO: TRIBUTÁVEL (sujeito a ajuste na declaração, como salário e aluguel); TRIBUTAÇÃO EXCLUSIVA/DEFINITIVA (sem ajuste na declaração, como CDB e título público); ISENTO (livre de IR, como poupança, LCI e LCA).","MODELO SIMPLIFICADO: desconto padrão de 20% sobre a base de cálculo, com LIMITADOR (R$ 16.754,34 no material), dispensando a comprovação detalhada de despesas.","MODELO COMPLETO: permite deduzir despesas efetivamente realizadas, como saúde, educação e previdência.","Tabela progressiva ANUAL: até R$ 26.963,20 isento; até R$ 33.919,80 alíquota de 7,5% (deduz R$ 2.022,64); até R$ 45.012,60 alíquota de 15% (deduz R$ 4.566,23); até R$ 55.976,16 alíquota de 22,5% (deduz R$ 7.942,17); acima disso 27,5% (deduz R$ 10.740,98).","Simulação do material: salário de R$ 100.000. No simplificado, base de R$ 83.245,66 e IR de R$ 12.151,58. No completo com PGBL de R$ 12.000 mais INSS, saúde, educação e dependentes, base de R$ 62.863,42 e IR de R$ 6.546,46. A economia é o benefício fiscal na prática."],"macete":"Cálculo do IR: (base × alíquota) menos a parcela a deduzir. Nunca esqueça de subtrair a parcela dedutível.","pegadinha":"A banca esquece a parcela a deduzir de propósito e oferece o resultado bruto como alternativa. E confunde 'tributação exclusiva' com 'isento': exclusiva paga imposto, só não entra no ajuste.","questoes":[{"q":"Um contribuinte tem base de cálculo anual de R$ 83.245,66. Aplicando a tabela progressiva (27,5% com parcela a deduzir de R$ 10.740,98), o IR devido é:","alts":["R$ 22.892,56","R$ 12.151,58","R$ 10.740,98","R$ 16.754,34"],"c":1,"exp":"27,5% de 83.245,66 = 22.892,56. Menos a parcela a deduzir de 10.740,98 = R$ 12.151,58."},{"q":"Os rendimentos de um CDB são classificados na declaração como:","alts":["Rendimento tributável, sujeito ao ajuste anual obrigatório.","Rendimento de tributação exclusiva, sem ajuste.","Rendimento isento de imposto de renda.","Rendimento dispensado de declaração."],"c":1,"exp":"CDB e título público têm tributação exclusiva na fonte, sem ajuste. Isentos são poupança, LCI e LCA. Tributável é salário e aluguel."},{"q":"O modelo SIMPLIFICADO de declaração caracteriza-se por:","alts":["Permite deduzir saúde, educação e previdência.","Aplica desconto padrão de 20%, com limitador.","Isenta quem ganha até R$ 55.976,16 por ano.","É obrigatório para quem contrata um PGBL."],"c":1,"exp":"Desconto padrão de 20% com teto. Deduzir despesas reais é característica do modelo completo, que é o que viabiliza o benefício do PGBL."},{"q":"REDENÇÃO: são exemplos de rendimentos ISENTOS, segundo o material:","alts":["Salário e aluguel.","CDB e título público federal.","Caderneta de poupança, LCI e LCA.","Ganho de capital em ações."],"c":2,"exp":"Poupança, LCI e LCA são isentos para PF. CDB e TPF são tributação exclusiva; salário e aluguel são tributáveis."}]},{"id":"2.5.3","titulo":"Fases do Produto","resumo":["FASE DE DIFERIMENTO (acumulação): o participante faz contribuições que são aplicadas e rentabilizadas ao longo do tempo.","Características do diferimento: contribuições FLEXÍVEIS (pode aumentar, diminuir ou pausar); PERMITE RESGATES, com carência mínima de 60 DIAS; NÃO ENTRA EM INVENTÁRIO na sucessão; permite indicar BENEFICIÁRIOS, com repasse rápido sem burocracia; permite PORTABILIDADE de planos.","A ausência de inventário torna a previdência uma ferramenta atrativa de PLANEJAMENTO SUCESSÓRIO.","FASE DE BENEFÍCIOS: o saldo acumulado passa a ser usado para pagamento de renda ou resgates, conforme a forma escolhida.","Características dos benefícios: recebimento de RENDA; NÃO HÁ RESGATES; em caso de falecimento, pode ou não haver continuidade aos herdeiros, dependendo da modalidade escolhida.","Ao converter em renda, o participante TRANSFERE A TITULARIDADE do patrimônio à seguradora. A partir daí não há possibilidade de resgate nem reversão ao estado de aplicação."],"macete":"Diferimento: entra dinheiro, pode sacar, carência de 60 dias, sem inventário. Benefício: sai renda, não tem mais resgate, e a titularidade virou da seguradora.","pegadinha":"A banca afirma que é possível resgatar depois de convertido em renda. Não é: a conversão é uma porta de mão única. E a carência mínima para resgate no diferimento é de 60 dias.","questoes":[{"q":"Após converter o saldo acumulado em renda mensal, o participante:","alts":["Pode resgatar o saldo remanescente quando quiser.","Transfere a titularidade à seguradora, sem resgate.","Mantém a titularidade e pode voltar a acumular.","Passa a poder fazer novos aportes no plano."],"c":1,"exp":"A conversão é definitiva. A seguradora assume a obrigação de pagar conforme o contrato."},{"q":"A carência mínima para resgate durante a fase de diferimento é de:","alts":["30 dias.","60 dias.","90 dias.","180 dias."],"c":1,"exp":"60 dias é a carência mínima. Ela reaparece na portabilidade, cuja carência vai de 60 a 180 dias."},{"q":"A característica que torna a previdência complementar uma ferramenta de planejamento sucessório é:","alts":["A isenção total de imposto de renda no resgate.","O fato de não entrar em inventário na sucessão.","A cobertura do FGC até o limite de R$ 250 mil.","A possibilidade de portabilidade entre instituições."],"c":1,"exp":"Sem inventário e com beneficiários indicados, os recursos chegam rapidamente a filhos e dependentes."},{"q":"REDENÇÃO: na fase de BENEFÍCIOS, é CORRETO afirmar que:","alts":["As contribuições continuam flexíveis.","Há recebimento de renda e não há resgates.","É possível fazer portabilidade para outra instituição.","Não é possível indicar beneficiários em nenhuma modalidade."],"c":1,"exp":"Renda sim, resgate não. E a continuidade aos herdeiros depende da modalidade contratada."}]},{"id":"2.5.4","titulo":"Modalidades de Renda","resumo":["PAGAMENTO ÚNICO: resgate total da reserva em uma única parcela.","RENDA MENSAL VITALÍCIA: paga enquanto o participante estiver vivo. Seguradora e investidor compartilham o RISCO DE LONGEVIDADE. NÃO HÁ reembolso aos herdeiros: o contrato se encerra com o falecimento.","RENDA MENSAL TEMPORÁRIA: paga por período determinado, mesmo que o participante viva além dele. Se falecer antes do prazo, o saldo remanescente NÃO é revertido a beneficiários.","RENDA MENSAL POR PRAZO CERTO: paga por prazo fixo, COM continuidade aos beneficiários em caso de falecimento.","RENDA MENSAL VITALÍCIA COM PRAZO MÍNIMO GARANTIDO: vitalícia, mas assegura repasses aos beneficiários por um período mínimo em caso de falecimento precoce.","RENDA MENSAL VITALÍCIA COM REVERSÃO AO BENEFICIÁRIO INDICADO: vitalícia ao participante e depois revertida ao beneficiário. A seguradora considera a expectativa de vida das DUAS pessoas, o que em geral REDUZ o valor da parcela.","RENDA MENSAL VITALÍCIA REVERSÍVEL PARA CÔNJUGES COM CONTINUIDADE AOS MENORES: reverte ao cônjuge e, na ausência dele, aos dependentes menores até a maioridade ou a idade prevista em contrato."],"macete":"Temporária e vitalícia pura morrem com o titular. Prazo certo, prazo mínimo garantido e as reversíveis continuam para alguém.","pegadinha":"Temporária x Prazo Certo é a confusão preferida da banca. Ambas têm prazo, mas só a de PRAZO CERTO continua para os beneficiários.","questoes":[{"q":"Um participante escolhe renda mensal TEMPORÁRIA de 15 anos e falece no ano 8. O saldo remanescente:","alts":["É revertido aos beneficiários até completar os 15 anos.","Não é revertido a beneficiários: os pagamentos se encerram.","É pago em parcela única aos herdeiros.","Retorna à fase de acumulação."],"c":1,"exp":"Temporária não reverte. Quem continua para os beneficiários é a renda por PRAZO CERTO."},{"q":"Na renda mensal vitalícia com reversão ao beneficiário indicado, o valor da parcela tende a ser:","alts":["Maior que a vitalícia simples, pela garantia extra.","Menor que a vitalícia simples, por cobrir duas vidas.","Idêntico ao da renda vitalícia individual.","Definido apenas no momento do falecimento."],"c":1,"exp":"Dois beneficiários potenciais significam obrigação mais longa, e a seguradora reduz a parcela para compensar."},{"q":"A modalidade em que a seguradora absorve o saldo não utilizado se o beneficiário falecer precocemente e arca com as parcelas extras se ele viver muito é a:","alts":["Renda mensal por prazo certo.","Renda mensal vitalícia.","Renda mensal temporária.","Pagamento único."],"c":1,"exp":"É o compartilhamento do risco de longevidade, característico da renda vitalícia pura."},{"q":"REDENÇÃO: a modalidade que paga por prazo fixo e CONTINUA para os beneficiários em caso de falecimento é a renda mensal:","alts":["Temporária.","Por prazo certo.","Vitalícia.","Vitalícia com reversão ao cônjuge."],"c":1,"exp":"Prazo certo: o prazo é cumprido até o fim, com o titular vivo ou não."}]},{"id":"2.5.5","titulo":"Regimes de Tributação","resumo":["PROGRESSIVO (COMPENSÁVEL): segue a mesma lógica do IR sobre salários, calculado sobre o valor do RENDIMENTO MENSAL. Tabela mensal: até R$ 2.428,00 isento; 7,5% (deduz R$ 182,16); 15% (deduz R$ 394,16); 22,5% (deduz R$ 675,49); acima de R$ 4.664,68, 27,5% (deduz R$ 908,73).","É chamado de compensável porque o IR retido vai para a DECLARAÇÃO ANUAL, somando-se às demais rendas tributáveis. O contribuinte pode pagar mais ou ser restituído.","REGRA-CHAVE DO PROGRESSIVO: em caso de RESGATE total ou parcial, retém-se na fonte SOMENTE 15% de IR, independentemente do valor, a título de ANTECIPAÇÃO. O ajuste final acontece na declaração.","REGRESSIVO (DEFINITIVO): calculado pelo TEMPO DE PERMANÊNCIA no plano. Até 2 anos 35%; de 2 a 4 anos 30%; de 4 a 6 anos 25%; de 6 a 8 anos 20%; de 8 a 10 anos 15%; ACIMA DE 10 ANOS 10%.","O IR retido no regressivo é DEFINITIVO: não há ajuste na declaração anual.","Em caso de FALECIMENTO do titular durante a fase de diferimento, a alíquota MÁXIMA de IR será de 25%.","A ESCOLHA do regime é feita no PRIMEIRO RESGATE ou na conversão em renda. Até lá é possível contratar sem definir. Longo prazo favorece o regressivo; curto a médio prazo favorece o progressivo."],"macete":"Regressivo começa em 35% e só chega aos 10% depois de 10 anos. Progressivo retém 15% no resgate e acerta as contas na declaração. Falecimento no diferimento: teto de 25%.","pegadinha":"Duas armadilhas: confundir a tabela regressiva da PREVIDÊNCIA (35% a 10%) com a da renda fixa (22,5% a 15%); e esquecer que no progressivo a retenção no resgate é de 15% fixos, e não a alíquota da tabela.","questoes":[{"q":"Um participante no regime REGRESSIVO resgata seu plano após 11 anos de permanência. A alíquota de IR será:","alts":["15%","10%","20%","22,5%"],"c":1,"exp":"Acima de 10 anos: 10%. Cuidado para não usar a tabela da renda fixa, que para em 15%."},{"q":"No regime PROGRESSIVO, ao solicitar um resgate, a retenção na fonte será de:","alts":["A alíquota da tabela progressiva, conforme o valor.","15% fixos, como antecipação, com ajuste na declaração.","35%, por se tratar de resgate antecipado.","Zero, pois o ajuste é todo feito na declaração."],"c":1,"exp":"15% fixos como antecipação. Depois o contribuinte pode pagar mais ou ser restituído."},{"q":"O titular de um plano falece durante a fase de diferimento. A alíquota MÁXIMA de IR aplicável é:","alts":["35%","27,5%","25%","10%"],"c":2,"exp":"Teto de 25% em caso de falecimento na fase de diferimento."},{"q":"REDENÇÃO: a escolha do regime de tributação deve ser feita:","alts":["No momento da contratação do plano, de forma irreversível.","No primeiro resgate ou na conversão em renda.","Anualmente, na declaração de ajuste.","Pela seguradora, conforme o perfil do cliente."],"c":1,"exp":"Dá para contratar sem definir. A decisão se materializa no primeiro resgate ou na conversão."}]},{"id":"2.5.6","titulo":"Custos da Previdência","resumo":["TAXA DE CARREGAMENTO: percentual cobrado sobre cada APORTE. Pode incidir na ENTRADA e/ou na SAÍDA. Só pode ser cobrada sobre o valor APLICADO, NUNCA sobre o rendimento. A SUSEP determina o máximo de 10%.","Comparação do material (aporte de R$ 10.000, taxa de 5%, rentabilidade de 10%): na ENTRADA, aplica-se R$ 9.500, que rende R$ 950, resultando em R$ 10.450. Na SAÍDA, aplica-se R$ 10.000, que rende R$ 1.000, e depois se deduz R$ 500, resultando em R$ 10.500.","Conclusão: se houver taxa de carregamento, o IDEAL é que seja cobrada no RESGATE, pois o montante total tem mais tempo para render.","TAXA DE ADMINISTRAÇÃO: percentual fixo ao ano, deduzido diariamente sobre o patrimônio total (aporte mais rendimento).","TAXA DE PERFORMANCE: cobrada sobre o resultado que superar o benchmark, com a mesma lógica dos fundos.","IMPORTANTE: o PLANO em si cobra apenas a taxa de CARREGAMENTO. Administração e performance são cobradas pelo FIE (o fundo), embora todos os custos acabem repassados ao contribuinte."],"macete":"Carregamento é do PLANO, sobre o APORTE, teto de 10%. Administração e performance são do FIE, sobre o patrimônio e sobre o excedente ao benchmark.","pegadinha":"A banca cobra carregamento sobre o rendimento. Nunca: só sobre o valor aplicado. E diz que carregamento na entrada é melhor: é o contrário, na saída o dinheiro rende mais tempo.","questoes":[{"q":"Dois investidores aportam R$ 10.000 com rentabilidade de 10%. No plano A a taxa de carregamento de 5% é cobrada na entrada; no plano B, na saída. Os saldos finais são, respectivamente:","alts":["R$ 10.450 e R$ 10.500.","R$ 10.500 e R$ 10.450.","R$ 10.450 e R$ 10.450.","R$ 11.000 e R$ 10.500."],"c":0,"exp":"Entrada: aplica 9.500, rende 950, total 10.450. Saída: aplica 10.000, rende 1.000, deduz 500, total 10.500. Cobrança na saída é melhor para o cliente."},{"q":"Sobre a taxa de carregamento, é CORRETO afirmar:","alts":["Pode incidir sobre o rendimento, se previsto em contrato.","Incide só sobre o aporte, com teto de 10% pela SUSEP.","É cobrada diariamente sobre o patrimônio total.","É cobrada pelo FIE sobre o excedente ao benchmark."],"c":1,"exp":"Só sobre o aporte, teto de 10%. Cobrança diária sobre o patrimônio é a taxa de administração."},{"q":"As taxas de administração e de performance em um plano de previdência são cobradas:","alts":["Pelo próprio plano de previdência contratado na seguradora.","Pelo FIE, o fundo, e repassadas ao contribuinte.","Pela SUSEP, que fiscaliza o mercado de seguros.","Pela Receita Federal, junto com o imposto."],"c":1,"exp":"O plano cobra carregamento. Administração e performance são prerrogativa do FIE."},{"q":"REDENÇÃO: o limite máximo da taxa de carregamento determinado pela SUSEP é de:","alts":["5%","10%","12%","20%"],"c":1,"exp":"Máximo de 10% sobre o valor aportado."}]},{"id":"2.5.7","titulo":"Portabilidade em Previdência","resumo":["Transferência dos recursos de um plano para outro, na MESMA instituição (portabilidade interna) ou para OUTRA (externa), SEM incidência de IR no momento da transferência.","REGRAS: não há IR, pois não há resgate; somente entre planos do MESMO CPF, sem transferir para outra pessoa; somente VGBL para VGBL e PGBL para PGBL; PODE haver cobrança de taxa de carregamento; carência MÍNIMA de 60 DIAS e MÁXIMA de 180 DIAS.","Não há limite para o NÚMERO de portabilidades, desde que respeitado o período de carência."],"macete":"Mesmo CPF, mesmo tipo de plano, sem IR, carência de 60 a 180 dias e portabilidades ilimitadas.","pegadinha":"A banca permite portabilidade de PGBL para VGBL. Proibido. E sugere incidência de IR na transferência: não há, porque não existe resgate.","questoes":[{"q":"Um cliente deseja portar seu PGBL para um VGBL em outra instituição. Isso é:","alts":["Permitido, desde que respeitados os 60 dias de carência.","Vedado: só se porta entre planos do mesmo tipo.","Permitido apenas na portabilidade dentro da instituição.","Permitido, mediante pagamento de IR sobre o rendimento."],"c":1,"exp":"Tipos diferentes têm tratamentos fiscais distintos, então a troca entre eles é vedada."},{"q":"Sobre a tributação na portabilidade de previdência, é CORRETO afirmar:","alts":["Incide IR de 15% na transferência.","Não há incidência de IR, pois não há resgate de recursos.","Incide IOF se a transferência ocorrer antes de 30 dias.","Incide a alíquota da tabela regressiva conforme o tempo de permanência."],"c":1,"exp":"Sem resgate, sem fato gerador. O tempo de permanência para a tabela regressiva também é preservado."},{"q":"As carências mínima e máxima da portabilidade são, respectivamente:","alts":["30 e 90 dias.","60 e 180 dias.","90 e 360 dias.","Não há carência definida."],"c":1,"exp":"Mínima de 60 dias e máxima de 180 dias, sem limite para o número de portabilidades."},{"q":"REDENÇÃO: um cliente quer portar seu plano para o nome do filho. Isso é:","alts":["Permitido, se o filho for dependente declarado.","Vedado: as duas pontas devem ser do mesmo CPF.","Permitido apenas em caso de falecimento do titular.","Permitido, mediante pagamento da taxa de carregamento."],"c":1,"exp":"Mesmo CPF nas duas pontas. Portabilidade não é doação nem sucessão."}]}],"boss":[{"q":"Um cliente declara pelo modelo completo e contribui para o INSS. O produto recomendado e o limite de abatimento são:","alts":["VGBL, com abatimento de 12% da renda bruta tributável.","PGBL, com abatimento de até 12% da renda bruta tributável.","PGBL, com abatimento de até 20% da renda líquida.","VGBL, sem qualquer abatimento, mas com IR sobre todo o valor."],"c":1,"exp":"PGBL exige modelo completo e contribuição a regime oficial. Abatimento de até 12%."},{"q":"Resgate no regime REGRESSIVO após 7 anos de permanência. A alíquota é:","alts":["25%","20%","15%","10%"],"c":1,"exp":"De 6 a 8 anos: 20%."},{"q":"No regime PROGRESSIVO, ao fazer um resgate parcial de R$ 200.000, a retenção na fonte será de:","alts":["27,5%, pela faixa da tabela.","15%, a título de antecipação, com ajuste na declaração anual.","35%, por ser resgate antecipado.","Zero, pois o progressivo só tributa a renda mensal."],"c":1,"exp":"Retenção fixa de 15% no resgate, independentemente do valor, com acerto posterior."},{"q":"Aporte de R$ 20.000 com taxa de carregamento de 5% na entrada e rentabilidade de 10%. O saldo final é:","alts":["R$ 22.000","R$ 20.900","R$ 21.000","R$ 20.500"],"c":1,"exp":"Aplica-se 19.000 (20.000 menos 1.000). Rende 10% = 1.900. Total: R$ 20.900."},{"q":"A modalidade de renda que NÃO reverte nada aos beneficiários em caso de falecimento é:","alts":["Renda mensal por prazo certo.","Renda mensal vitalícia com prazo mínimo garantido.","Renda mensal temporária.","Renda vitalícia reversível ao cônjuge."],"c":2,"exp":"Temporária e vitalícia pura encerram com o falecimento. As demais listadas preveem continuidade."},{"q":"Em caso de falecimento do titular durante a fase de DIFERIMENTO, a alíquota máxima de IR é:","alts":["35%","27,5%","25%","15%"],"c":2,"exp":"Teto de 25%, regra específica para falecimento no diferimento."},{"q":"São regras da portabilidade em previdência, EXCETO:","alts":["Não há incidência de IR na transferência.","Deve ser feita pelo mesmo CPF em ambas as pontas.","É permitida de PGBL para VGBL desde que na mesma instituição.","A carência é de no mínimo 60 e no máximo 180 dias."],"c":2,"exp":"Troca entre tipos diferentes é vedada, dentro ou fora da mesma instituição."},{"q":"A base de incidência do IR no VGBL e no PGBL é, respectivamente:","alts":["Todo o valor e apenas o rendimento.","Apenas o rendimento e todo o valor recebido.","Apenas o rendimento em ambos.","Todo o valor em ambos."],"c":1,"exp":"VGBL tributa só o rendimento; PGBL tributa tudo, porque o aporte foi abatido lá atrás."},{"q":"Sobre a taxa de carregamento, assinale a CORRETA:","alts":["Incide diariamente sobre o patrimônio total.","Incide só sobre os aportes, com teto de 10%.","É cobrada pelo FIE sobre o excedente ao benchmark.","É vedada nos planos do tipo VGBL."],"c":1,"exp":"Só sobre o aporte, teto de 10%, e melhor na saída para o dinheiro render mais tempo."},{"q":"Na fase de DIFERIMENTO, é CORRETO afirmar:","alts":["Não é possível resgatar nem indicar beneficiários.","Aportes flexíveis, resgate com 60 dias e sem inventário.","A titularidade já pertence integralmente à seguradora.","O participante já recebe a renda mensal contratada."],"c":1,"exp":"Diferimento é a fase de acumulação: flexível, resgatável e fora do inventário."},{"q":"Um contribuinte tem base de cálculo anual de R$ 62.863,42, alíquota de 27,5% e parcela a deduzir de R$ 10.740,98. O IR devido é:","alts":["R$ 17.287,44","R$ 6.546,46","R$ 10.740,98","R$ 12.151,58"],"c":1,"exp":"27,5% de 62.863,42 = 17.287,44, menos 10.740,98 = R$ 6.546,46."},{"q":"Assinale a associação CORRETA entre tipo de rendimento e exemplo:","alts":["Isento: salário e renda de aluguel.","Exclusiva: caderneta de poupança e LCI.","Tributável: salário; exclusiva: CDB; isento: poupança.","Tributável: LCI e LCA; isento: CDB e título público."],"c":2,"exp":"Essa tríade cai direto na prova. Exclusiva paga imposto, só não entra no ajuste anual."}]},{"id":"2.6","titulo":"Produtos de Crédito","subtitulo":"Do rotativo ao consórcio, com o CET no meio","niveis":[{"id":"2.6.1","titulo":"Princípios para Disponibilização de Crédito","resumo":["SCORE SERASA: pontuação de 0 a 1.000 calculada por bureaus de crédito, indicando a probabilidade de o cliente pagar em dia com base em informações de MERCADO.","RATING DE CRÉDITO: nota atribuída pela PRÓPRIA INSTITUIÇÃO, com base no histórico de relacionamento, capacidade de pagamento e critérios internos. Bom score externo não impede uma restrição interna.","SCR (Sistema de Informações de Crédito): base de dados do BANCO CENTRAL que consolida operações de crédito acima de R$ 200 em todo o sistema financeiro, revelando o endividamento total do cliente.","OS CINCO Cs DO CRÉDITO: Capital, Capacidade, Colateral, Condições e Caráter.","EMPRÉSTIMO: crédito SEM destinação específica. FINANCIAMENTO: destinado à aquisição de bem específico, com o valor liberado ao vendedor e garantia do próprio bem (alienação fiduciária), o que reduz os juros.","LEASING: arrendamento mercantil, parecido com aluguel, com opção de compra ao final. A empresa arrendatária NÃO tem a posse do bem: paga pelo uso, o que vira DESPESA e reduz a base de cálculo do imposto, e não precisa DEPRECIAR o bem."],"macete":"Score é de fora (Serasa), rating é de dentro (o banco), SCR é do Banco Central. Cinco Cs: Capital, Capacidade, Colateral, Condições, Caráter.","pegadinha":"A banca troca score por rating, e coloca o SCR como base da Serasa. SCR é do BANCO CENTRAL, e o piso de registro é R$ 200.","questoes":[{"q":"A base de dados do Banco Central que consolida operações de crédito acima de R$ 200 em todo o sistema financeiro é:","alts":["O Score Serasa.","O Rating de Crédito.","O SCR (Sistema de Informações de Crédito).","O Cadastro Positivo da instituição."],"c":2,"exp":"SCR: Banco Central, operações acima de R$ 200, visão do endividamento total do cliente."},{"q":"Um cliente tem excelente score na Serasa, mas o banco nega o crédito por conta de histórico de relacionamento problemático naquela instituição. Esse critério interno é o:","alts":["Score de mercado do cliente.","Rating de crédito.","SCR.","Colateral."],"c":1,"exp":"Rating é a nota interna da instituição, baseada no relacionamento e em critérios próprios."},{"q":"Os cinco Cs do crédito são:","alts":["Capital, capacidade, colateral, condições e caráter.","Crédito, cobrança, cadastro, custo e contrato.","Capital, custo, cobertura, contrato e caráter.","Capacidade, cobrança, condições, colateral e crédito."],"c":0,"exp":"Capital, Capacidade, Colateral, Condições e Caráter."},{"q":"REDENÇÃO: a vantagem contábil do leasing para uma empresa é:","alts":["O bem entra no ativo e pode ser depreciado.","O pagamento vira despesa e não há depreciação.","A operação de leasing é isenta de IOF.","O bem é adquirido sem contrapartida financeira."],"c":1,"exp":"Sem posse do bem, o pagamento vira despesa dedutível e não há depreciação a fazer."}]},{"id":"2.6.2","titulo":"Cartão de Crédito e Rotativo","resumo":["Meio de pagamento com LIMITE PRÉ-APROVADO para compras e saques, com possibilidade de pagamento total ou parcial da fatura. O limite é definido pelo perfil financeiro (renda e histórico).","CRÉDITO ROTATIVO: acontece quando o cliente paga apenas parte da fatura. Exemplo: fatura de R$ 5.000 com pagamento de R$ 1.000 deixa R$ 4.000 no rotativo, com juros altos.","Os juros do rotativo são elevados porque o risco para o emissor é maior: não há garantia de pagamento. Existe um TETO LEGAL de 100% DO VALOR DA DÍVIDA no rotativo.","REFINANCIAMENTO DE FATURA: parcelamento do saldo devedor com nova taxa e prazo definidos pelo banco. Costuma ser mais econômico do que permanecer no rotativo, com juros menores e prazos mais longos.","ANUIDADE: cobrada conforme os benefícios oferecidos (programas de fidelidade, milhas, salas VIP).","Melhor prática: pagar o valor total da fatura dentro do vencimento para não cair no rotativo."],"macete":"Teto do rotativo: 100% da dívida. Refinanciar é quase sempre melhor que rotativo, porque a taxa cai e o prazo alonga.","pegadinha":"A banca troca o teto do rotativo por outro percentual, ou apresenta rotativo e refinanciamento como sinônimos. Rotativo é automático; refinanciamento é uma renegociação com nova taxa e prazo.","questoes":[{"q":"O teto legal para os juros do crédito rotativo é de:","alts":["50% do valor total da dívida.","100% do valor da dívida.","8% ao mês.","Não há teto definido."],"c":1,"exp":"Teto de 100% do valor da dívida no rotativo. Os 8% ao mês são o limite do cheque especial."},{"q":"Uma fatura de R$ 5.000 é paga parcialmente, no valor de R$ 1.000. Sobre os R$ 4.000 restantes:","alts":["A dívida é automaticamente parcelada com juros reduzidos.","O saldo entra automaticamente no crédito rotativo, com juros elevados.","Não incide juros até o vencimento seguinte.","O cartão é bloqueado imediatamente."],"c":1,"exp":"Pagamento parcial ativa o rotativo automaticamente. Para sair dele é preciso pedir o refinanciamento."},{"q":"REDENÇÃO: a razão apontada pelo material para os juros do rotativo serem elevados é:","alts":["A cobrança de anuidade pelo banco emissor.","O risco maior, pois o cliente não oferece garantias.","A incidência de IOF sobre o valor da fatura.","A obrigatoriedade do seguro prestamista."],"c":1,"exp":"Sem garantia, o risco sobe e o preço do dinheiro acompanha."}]},{"id":"2.6.3","titulo":"Cheque Especial","resumo":["Limite de crédito VINCULADO À CONTA CORRENTE, usado AUTOMATICAMENTE quando o saldo fica negativo, com juros e IOF proporcionais ao valor e ao tempo de uso.","Origem histórica: evitar a devolução de cheques emitidos sem fundos, quando o cheque era o meio de pagamento comum (função hoje ocupada pelo Pix).","TETO DE JUROS estabelecido pelo Banco Central: 8% AO MÊS.","Os juros incidem apenas sobre o valor UTILIZADO, não sobre o limite. Exemplo: limite de R$ 10.000 com uso de R$ 500 gera juros só sobre os R$ 500.","O cálculo é feito em CAPITALIZAÇÃO SIMPLES. Muitas instituições oferecem até 10 dias sem juros, mas o IOF continua sendo cobrado proporcionalmente."],"macete":"Cheque especial: 8% ao mês de teto, juros SIMPLES, só sobre o que foi usado. E o IOF vem mesmo nos dias de carência.","pegadinha":"A banca cobra juros sobre o limite total em vez do valor utilizado, ou aplica capitalização composta. É simples, e só sobre o usado.","questoes":[{"q":"O teto de juros do cheque especial estabelecido pelo Banco Central é de:","alts":["8% ao ano.","8% ao mês.","100% da dívida.","2% ao mês."],"c":1,"exp":"8% ao mês. Os 100% da dívida são o teto do rotativo do cartão."},{"q":"Um cliente tem limite de cheque especial de R$ 10.000 e utiliza R$ 500. Os juros incidirão sobre:","alts":["R$ 10.000, o limite total contratado.","R$ 500, o valor usado, em capitalização simples.","R$ 500, o valor usado, em capitalização composta.","Zero, pois há isenção de juros até R$ 1.000."],"c":1,"exp":"Só sobre o valor usado, com juros simples."},{"q":"REDENÇÃO: durante o período de carência de juros oferecido por algumas instituições no cheque especial:","alts":["Nenhum encargo é cobrado do correntista.","O IOF segue sendo cobrado proporcionalmente.","Os juros são adiados e cobrados em dobro depois.","O limite do cheque especial é cancelado."],"c":1,"exp":"A carência alcança os juros, não o IOF."}]},{"id":"2.6.4","titulo":"Crédito Consignado","resumo":["Empréstimo com desconto das parcelas DIRETAMENTE da folha de pagamento ou do benefício. O pagamento é automático e prioritário, antes de o dinheiro chegar ao tomador, o que reduz drasticamente o risco de inadimplência.","Consequência: menor risco para o credor, taxas de juros MAIS BAIXAS para o tomador.","MARGEM CONSIGNÁVEL: limite legal da renda que pode ser comprometido com as parcelas.","APOSENTADOS E PENSIONISTAS: podem contar com SEGURO PRESTAMISTA, que quita a dívida em caso de falecimento, acidente ou desemprego.","SETOR PRIVADO: há risco associado à demissão. Nesse caso, parte da indenização por rescisão pode ser usada para quitar ou amortizar a dívida, normalmente 30% da indenização.","CARTÃO CONSIGNADO: voltado especialmente a aposentados. Se a fatura não for paga, o valor é automaticamente descontado do benefício."],"macete":"Consignado desconta na folha, então o risco cai e a taxa cai junto. Demissão no privado: até 30% da rescisão vai para a dívida.","pegadinha":"A banca troca o percentual da rescisão (são normalmente 30%) e sugere que não há limite de comprometimento. Existe: é a margem consignável, definida por lei.","questoes":[{"q":"A razão pela qual o crédito consignado apresenta taxas de juros mais baixas é:","alts":["A exigência de garantia real na contratação.","O desconto em folha, que reduz a inadimplência.","A isenção de IOF concedida a essa modalidade.","O prazo máximo reduzido de pagamento."],"c":1,"exp":"O pagamento é automático e prioritário. Menos risco, menos juros."},{"q":"Um trabalhador do setor privado com crédito consignado é demitido. Sobre a dívida:","alts":["Ela é automaticamente perdoada pelo credor.","Cerca de 30% da rescisão pode quitar ou amortizar.","O saldo é integralmente descontado do FGTS.","O seguro prestamista quita a dívida de imediato."],"c":1,"exp":"Normalmente 30% da indenização. O seguro prestamista aparece com destaque para aposentados e pensionistas."},{"q":"O limite legal da renda que pode ser comprometido com parcelas de consignado é chamado de:","alts":["Margem consignável.","Colateral.","Custo efetivo total.","Margem de contribuição."],"c":0,"exp":"Margem consignável é o teto de comprometimento da renda definido por lei."},{"q":"REDENÇÃO: no cartão consignado, se a fatura não for paga:","alts":["O cartão é cancelado imediatamente.","O valor é automaticamente descontado do benefício.","A dívida entra no crédito rotativo comum.","O seguro prestamista quita o saldo."],"c":1,"exp":"É o mesmo mecanismo do consignado: desconto direto na fonte de renda."}]},{"id":"2.6.5","titulo":"Crédito Direto ao Consumidor (CDC)","resumo":["Modalidade em que o banco concede um valor ao cliente, para uso livre ou para aquisição de bens e serviços, com contrato definido, pagamento parcelado e taxas previamente acordadas.","DUAS CONFIGURAÇÕES: EMPRÉSTIMO (valor depositado na conta, sem destinação) e FINANCIAMENTO (valor direcionado à compra de um bem, pago diretamente ao vendedor).","Cenário de financiamento de veículo: o carro fica ALIENADO FIDUCIARIAMENTE como garantia. Até a quitação, o carro pertence ao banco. Essa garantia permite juros menores e prazos mais longos.","A PRINCIPAL VARIÁVEL que determina o custo do CDC é a PRESENÇA OU AUSÊNCIA DE GARANTIAS. Com garantia real, juros mais baixos. Sem garantia, a única segurança é a análise do CPF, e os juros sobem."],"macete":"CDC com garantia real é barato; CDC sem garantia é caro. É a mesma lógica de sempre: risco define preço.","pegadinha":"A banca afirma que no CDC o bem financiado já pertence ao cliente desde a compra. Na alienação fiduciária, o bem pertence ao BANCO até a quitação.","questoes":[{"q":"Num CDC para financiamento de veículo, a propriedade do carro até a quitação das parcelas é:","alts":["Do comprador, com o banco apenas registrando gravame.","Do banco, por alienação fiduciária, até a quitação.","Compartilhada entre o banco e o comprador.","Da concessionária, até a última parcela paga."],"c":1,"exp":"Alienação fiduciária: o bem serve de garantia e pertence ao banco até o fim do contrato."},{"q":"A principal variável que determina o custo de um CDC é:","alts":["O prazo de pagamento.","A presença ou ausência de garantias.","O valor da entrada.","A modalidade de amortização escolhida."],"c":1,"exp":"Com garantia real, juros baixos. Sem garantia, a análise recai só sobre o CPF e o preço sobe."},{"q":"REDENÇÃO: as duas configurações possíveis do CDC são:","alts":["Crédito rotativo e refinanciamento de fatura.","Empréstimo, com valor livre, e financiamento de bem.","Consignado em folha e não consignado.","Leasing operacional e alienação fiduciária."],"c":1,"exp":"Uso livre na conta ou pagamento direto ao vendedor do bem."}]},{"id":"2.6.6","titulo":"Crédito Imobiliário","resumo":["Financiamento para aquisição, construção ou reforma de imóveis, com pagamento parcelado e GARANTIA REAL.","O imóvel é dado em ALIENAÇÃO FIDUCIÁRIA até a quitação, permanecendo em nome do banco como garantia. É isso que faz o crédito imobiliário ter uma das MENORES taxas de juros do mercado.","Serve para imóveis novos ou usados, residenciais ou comerciais, e também para quitar outro financiamento imobiliário (portabilidade).","Pode-se usar o FGTS para dar entrada e para amortizações periódicas. Normalmente é necessária entrada de 20% a 30% do valor do imóvel.","PRAZO máximo de parcelamento: até 420 MESES (35 anos).","SEGUROS OBRIGATÓRIOS: DFI (Danos Físicos ao Imóvel), que cobre danos estruturais; e MIP (Morte e Invalidez Permanente), que quita a dívida em caso de falecimento ou invalidez do contratante."],"macete":"420 meses, entrada de 20% a 30%, FGTS liberado, e dois seguros: DFI para o tijolo, MIP para a pessoa.","pegadinha":"A banca troca as siglas dos seguros. DFI protege o IMÓVEL; MIP protege a VIDA do contratante e quita a dívida. E o prazo máximo é 420 meses, não 360.","questoes":[{"q":"Os seguros obrigatórios no crédito imobiliário e suas coberturas são:","alts":["DFI para morte e invalidez; MIP para o imóvel.","DFI para o imóvel; MIP para morte e invalidez.","Apenas o MIP, que cobre as duas situações.","Apenas o seguro prestamista da operação."],"c":1,"exp":"DFI cuida do imóvel; MIP cuida do contratante e quita a dívida em caso de falecimento ou invalidez."},{"q":"O prazo máximo de parcelamento do crédito imobiliário mencionado no material é de:","alts":["240 meses.","360 meses.","420 meses.","480 meses."],"c":2,"exp":"420 meses, ou 35 anos."},{"q":"O motivo pelo qual o crédito imobiliário apresenta uma das menores taxas de juros do mercado é:","alts":["A isenção de IOF concedida a essa modalidade.","A alienação fiduciária do imóvel como garantia real.","A obrigatoriedade do uso do saldo do FGTS.","O prazo longo, que dilui o risco no tempo."],"c":1,"exp":"Garantia real forte significa risco baixo, e risco baixo significa juros baixos."},{"q":"REDENÇÃO: o saldo do FGTS pode ser utilizado no crédito imobiliário para:","alts":["Apenas quitar integralmente o financiamento.","Dar entrada no imóvel e realizar amortizações periódicas.","Pagar os seguros DFI e MIP.","Nenhuma dessas finalidades."],"c":1,"exp":"Entrada e amortizações periódicas. A entrada usual fica entre 20% e 30% do valor do imóvel."}]},{"id":"2.6.7","titulo":"Capital de Giro","resumo":["Linha de crédito EXCLUSIVA PARA EMPRESAS, voltada a necessidades operacionais: pagamento de fornecedores, salários e reposição de estoque. NÃO exige destinação a um bem específico.","É disponibilizado por empréstimos que caem diretamente na conta da empresa, com ou sem garantias.","COM GARANTIAS reais (imóveis, recebíveis): juros mais baixos, pelo menor risco.","SEM GARANTIAS: juros mais altos.","AVAL: o sócio assume a responsabilidade pela dívida. Não é tão robusto quanto a garantia real, mas ajuda a negociar condições melhores.","Mesmo empresas com caixa saudável podem contratar capital de giro: é um elemento ESTRATÉGICO de gestão financeira, que dá liquidez e permite aproveitar oportunidades."],"macete":"Capital de giro é para o dia a dia da empresa, sem destinação. Escada de garantia: real, aval, nada. Quanto mais forte a garantia, menor o juro.","pegadinha":"A banca diz que o capital de giro exige destinação específica. Não exige, e é essa versatilidade que o define. E o aval não equivale a garantia real.","questoes":[{"q":"Sobre o capital de giro, é CORRETO afirmar:","alts":["Exige destinação a um bem, como o financiamento.","É exclusivo para empresas e não tem destinação fixa.","É oferecido apenas a pessoas físicas empresárias.","Não admite nenhum tipo de garantia real."],"c":1,"exp":"Exclusivo para empresas e sem carimbo de destinação: fornecedores, salários, estoque."},{"q":"No capital de giro, o AVAL do sócio:","alts":["Equivale à garantia real e reduz o juro ao mínimo.","É garantia menos robusta que a real, mas ajuda.","É obrigatório em todas as operações da modalidade.","Substitui a análise de crédito feita na empresa."],"c":1,"exp":"Aval é o sócio assumindo a responsabilidade. Ajuda, mas não vale tanto quanto imóvel ou recebível."},{"q":"REDENÇÃO: uma empresa com caixa saudável contrata capital de giro. Segundo o material, isso:","alts":["Indica má gestão financeira da empresa.","Pode ser estratégia de liquidez e oportunidade.","É vedado pela regulação do Banco Central.","Só é possível mediante garantia real."],"c":1,"exp":"Capital de giro vai além da emergência: é ferramenta estratégica de liquidez."}]},{"id":"2.6.8","titulo":"Custo Efetivo Total (CET)","resumo":["A taxa anunciada não reflete o custo real. O CET é a medida abrangente que engloba TODOS os custos da operação.","COMPONENTES: taxa de juros, TAC (tarifa de abertura de crédito), seguros e IOF.","O Banco Central determinou que, para o cálculo do CET ANUAL, considera-se o ano calendário de 365 DIAS.","Por que o CET importa: uma linha de 1,5% ao mês com TAC alta e seguro obrigatório pode chegar a um CET de 2,5% ao mês, enquanto uma de 2% ao mês com poucos encargos pode ter CET de 2,1%. A menor taxa contratual pode ser a mais cara.","EXEMPLO A (TAC e IOF pagos à vista): financiamento de R$ 30.000, 36 meses, 1,5% a.m. → PMT = R$ 1.084,57. Como TAC (600) e IOF (900) saem do valor, o crédito efetivo é de R$ 28.500. Com 28.500 PV, 36 n e 1.084,57 CHS PMT, encontra-se i = 1,81% ao mês, equivalente a 24,41% ao ano.","EXEMPLO B (TAC e IOF financiados): o valor financiado sobe para R$ 31.500 e a parcela vai a R$ 1.138,80. Com 30.000 PV, 36 n e 1.138,80 CHS PMT, encontra-se i = 1,80% ao mês, equivalente a 24,18% ao ano."],"macete":"CET é a taxa que reconcilia o dinheiro que ENTROU no seu bolso com as parcelas que SAEM dele. Ano do CET: 365 dias.","pegadinha":"A banca compara duas ofertas pela taxa nominal. A comparação válida é sempre pelo CET. E o ano do CET tem 365 dias, não 360.","questoes":[{"q":"Financiamento de R$ 30.000 em 36 meses a 1,5% a.m., com TAC de R$ 600 e IOF de R$ 900 pagos à vista. A parcela e o CET mensal são, respectivamente:","alts":["R$ 1.084,57 e 1,50% ao mês.","R$ 1.084,57 e 1,81% ao mês.","R$ 1.138,80 e 1,80% ao mês.","R$ 1.138,80 e 1,50% ao mês."],"c":1,"exp":"A parcela sai de 30.000 PV, 36 n, 1,5 i. Mas o crédito efetivo é 28.500 (descontados TAC e IOF), o que eleva a taxa real a 1,81% ao mês."},{"q":"Duas linhas de crédito: A com 1,5% ao mês e TAC alta mais seguro obrigatório, e B com 2% ao mês e poucos encargos. Segundo o material:","alts":["A linha A é sempre mais barata, pela taxa nominal.","A menor taxa pode ser a mais cara: vale o CET.","As duas linhas terão exatamente o mesmo CET.","O CET só se aplica ao crédito imobiliário."],"c":1,"exp":"Exemplo do material: A pode chegar a CET de 2,5% a.m. e B ficar em 2,1% a.m."},{"q":"Para o cálculo do CET anual, o Banco Central determina o uso de um ano calendário de:","alts":["252 dias úteis.","360 dias.","365 dias.","366 dias."],"c":2,"exp":"365 dias, conforme determinação do Banco Central."},{"q":"REDENÇÃO: compõem o Custo Efetivo Total, EXCETO:","alts":["A taxa de juros contratada.","A tarifa de abertura de crédito (TAC).","O imposto de renda sobre o rendimento.","O IOF e os seguros da operação."],"c":2,"exp":"IR sobre rendimento é tributação de investimento, não custo de crédito. O CET reúne juros, TAC, seguros e IOF."}]},{"id":"2.6.9","titulo":"Consórcio","resumo":["Modalidade de COMPRA PROGRAMADA e colaborativa. Distingue-se do crédito tradicional porque NÃO envolve cobrança de JUROS, embora tenha taxa de administração.","Funcionamento: um grupo contribui mensalmente para um fundo comum e, a cada mês, um integrante é contemplado.","CONTEMPLAÇÃO por SORTEIO (todos com a mesma chance) ou por LANCE (oferta de valor adicional; o maior lance é contemplado).","CUSTOS: TAXA DE ADMINISTRAÇÃO, calculada sobre o VALOR TOTAL DA CARTA DE CRÉDITO; FUNDO DE RESERVA, acumulado para cobrir eventuais inadimplências sem impactar as cotas individuais; e SEGURO, que cobre casos como morte.","Para ENTRAR no consórcio NÃO há necessidade de análise de crédito. A análise é feita quando o participante é CONTEMPLADO, para assegurar sua capacidade de usar a carta.","Flexibilidade: a carta pode adquirir imóveis, veículos, viagens e até procedimentos cirúrgicos, e também LIQUIDAR FINANCIAMENTOS existentes."],"macete":"Consórcio não tem juros, tem taxa de administração sobre a CARTA inteira. Análise de crédito só na contemplação, não na entrada.","pegadinha":"A banca afirma que o consórcio cobra juros (não cobra) ou exige análise de crédito na adesão (só na contemplação). E a taxa de administração incide sobre o valor da carta, não sobre a parcela.","questoes":[{"q":"A análise de crédito em um consórcio é realizada:","alts":["No momento da adesão ao grupo de consórcio.","Na contemplação, antes de liberar a carta.","A cada parcela mensal paga pelo consorciado.","Não há análise de crédito em momento algum."],"c":1,"exp":"Entrar é livre. A análise vem na contemplação, quando o dinheiro será efetivamente liberado."},{"q":"A base de cálculo da taxa de administração do consórcio é:","alts":["O valor da parcela mensal.","O valor total da carta de crédito.","O valor do lance ofertado.","O saldo do fundo de reserva."],"c":1,"exp":"Incide sobre o valor total da carta, remunerando a administradora pela gestão do grupo."},{"q":"O fundo de reserva em um consórcio tem a função de:","alts":["Remunerar a administradora pela gestão do grupo.","Cobrir inadimplências sem atingir as cotas individuais.","Antecipar a contemplação dos participantes.","Pagar o seguro de vida dos consorciados."],"c":1,"exp":"Fundo de reserva protege o grupo contra a inadimplência de alguns."},{"q":"REDENÇÃO: a diferença essencial entre consórcio e financiamento é:","alts":["O consórcio libera o bem imediatamente.","O consórcio não cobra juros, mas tem taxa e fundo.","O consórcio dispensa qualquer custo adicional.","O financiamento não exige nenhuma garantia."],"c":1,"exp":"Sem juros, mas não sem custo: taxa de administração, fundo de reserva e seguro."}]}],"boss":[{"q":"Os tetos de juros do crédito rotativo e do cheque especial são, respectivamente:","alts":["100% da dívida e 8% ao mês.","8% ao mês e 100% da dívida.","50% da dívida e 10% ao mês.","Não há tetos definidos."],"c":0,"exp":"Rotativo: 100% do valor da dívida. Cheque especial: 8% ao mês."},{"q":"Um financiamento de R$ 30.000 em 36 meses a 1,5% a.m. tem TAC de R$ 600 e IOF de R$ 900 FINANCIADOS. A parcela resultante é:","alts":["R$ 1.084,57","R$ 1.138,80","R$ 1.200,00","R$ 1.050,00"],"c":1,"exp":"Financiando os encargos, o PV vira 31.500 e a parcela sobe para R$ 1.138,80."},{"q":"Assinale a associação CORRETA entre score e rating de crédito:","alts":["Score é a nota do banco; rating é a de mercado.","Score é a nota de mercado; rating é a do banco.","O SCR é operado pela Serasa Experian.","O rating é calculado pelo Banco Central."],"c":1,"exp":"Fora, dentro e Banco Central: score, rating e SCR."},{"q":"Os seguros obrigatórios do crédito imobiliário são:","alts":["Prestamista e DFI.","DFI e MIP.","MIP e seguro residencial.","Apenas o MIP."],"c":1,"exp":"DFI (danos físicos ao imóvel) e MIP (morte e invalidez permanente)."},{"q":"Sobre o leasing, é CORRETO afirmar:","alts":["A arrendatária tem a posse do bem e o deprecia.","A arrendatária paga pelo uso e não deprecia o bem.","É modalidade exclusiva para pessoas físicas.","Não admite opção de compra ao final."],"c":1,"exp":"Sem posse, o pagamento vira despesa dedutível e não há depreciação."},{"q":"Um aposentado contrata crédito consignado. A proteção adicional típica desse público é:","alts":["A alienação fiduciária do próprio benefício.","O seguro prestamista, que quita a dívida.","A margem consignável ampliada por lei.","A isenção de IOF sobre a operação."],"c":1,"exp":"Prestamista é a proteção citada para aposentados e pensionistas."},{"q":"Sobre o consórcio, assinale a CORRETA:","alts":["Cobra juros menores que os do financiamento.","Não cobra juros, mas tem taxa sobre a carta.","Exige análise de crédito já na adesão ao grupo.","A contemplação ocorre exclusivamente por lance."],"c":1,"exp":"Sem juros, com taxa de administração, e análise só na contemplação."},{"q":"No cheque especial, os juros são calculados:","alts":["Em capitalização composta sobre o limite total.","Em capitalização simples sobre o valor efetivamente utilizado.","Em capitalização composta sobre o valor utilizado.","Pela tabela regressiva de IR."],"c":1,"exp":"Simples e só sobre o que foi usado."},{"q":"A diferença entre empréstimo e financiamento é:","alts":["O empréstimo tem destinação e o financiamento não.","O empréstimo é livre; o financiamento compra um bem.","Ambos exigem alienação fiduciária do bem.","O financiamento tem juro maior por não ter garantia."],"c":1,"exp":"Livre x carimbado. E é a garantia do bem que barateia o financiamento."},{"q":"Uma empresa precisa pagar fornecedores e repor estoque. A linha adequada é:","alts":["CDC.","Capital de giro.","Crédito consignado.","Consórcio."],"c":1,"exp":"Capital de giro atende necessidades operacionais e é exclusivo para empresas."},{"q":"Compõem o CET, segundo o material:","alts":["Taxa de juros, TAC, seguro e IOF.","Taxa de juros e imposto de renda.","Apenas a taxa de juros contratada.","Taxa de juros, IPCA e taxa de administração."],"c":0,"exp":"Juros, TAC, seguros e IOF. O ano do CET tem 365 dias."},{"q":"O SCR consolida operações de crédito acima de:","alts":["R$ 100","R$ 200","R$ 1.000","R$ 5.000"],"c":1,"exp":"Acima de R$ 200, em todo o sistema financeiro, na base do Banco Central."}]},{"id":"2.7","titulo":"Serviços Bancários","subtitulo":"Contas, Pix, câmbio e a engrenagem do cartão","niveis":[{"id":"2.7.1","titulo":"Conta Corrente x Conta de Pagamento","resumo":["CONTA CORRENTE: conta bancária de DEPÓSITO À VISTA, para movimentações cotidianas e porta de entrada para crédito e investimentos. Emitida por BANCO COMERCIAL e COOPERATIVA DE CRÉDITO.","CONTA DE PAGAMENTO: oferecida por INSTITUIÇÕES DE PAGAMENTO (fintechs).","QUADRO COMPARATIVO: cobertura do FGC, apenas a conta CORRENTE tem. Depósito compulsório, apenas a corrente recolhe. Crédito direto (como cheque especial), apenas a corrente oferece. Serviço de pagamento (como Pix), AMBAS oferecem.","PACOTE DE SERVIÇOS: é permitida a cobrança de tarifa mensal de manutenção. Muitos bancos isentam conforme relacionamento ou saldo, para competir com as fintechs.","O Banco Central EXIGE um pacote de SERVIÇOS ESSENCIAIS gratuito para pessoa física, incluindo quatro saques mensais, acesso aos serviços digitais e um extrato mensal impresso.","CONTA SALÁRIO: variação usada exclusivamente para recebimento de salários, com direito à PORTABILIDADE automática e gratuita para outra conta de escolha do titular."],"macete":"Corrente tem FGC, compulsório e crédito. Pagamento só tem o Pix. Pacote essencial gratuito: 4 saques, digitais e 1 extrato impresso.","pegadinha":"A banca afirma que a conta de fintech tem FGC. Não tem. E confunde o pacote essencial: são QUATRO saques mensais.","questoes":[{"q":"Sobre a diferença entre conta corrente e conta de pagamento, é CORRETO afirmar:","alts":["Ambas têm FGC e recolhem depósito compulsório.","Só a corrente tem FGC, compulsório e crédito direto.","Só a de pagamento oferece limite de cheque especial.","Só a de pagamento é emitida por cooperativa."],"c":1,"exp":"FGC, compulsório e crédito direto são exclusivos da conta corrente. O serviço de pagamento é o único item em comum."},{"q":"O pacote de serviços essenciais gratuito exigido pelo Banco Central para pessoa física inclui:","alts":["Saques ilimitados e cheque especial sem juros.","Quatro saques, serviços digitais e um extrato impresso.","Dois saques mensais e cartão de crédito sem anuidade.","Isenção total de qualquer tarifa cobrada pelo banco."],"c":1,"exp":"Quatro saques, digitais e um extrato impresso ao mês."},{"q":"A vantagem específica da conta salário mencionada no material é:","alts":["A isenção de imposto de renda sobre o saldo.","A portabilidade automática e gratuita do salário.","O rendimento automático, como na poupança.","O limite de cheque especial pré-aprovado."],"c":1,"exp":"Portabilidade automática e gratuita para a conta que o trabalhador escolher."},{"q":"REDENÇÃO: as instituições autorizadas a emitir conta corrente são:","alts":["Instituições de pagamento e fintechs.","Bancos comerciais e cooperativas de crédito.","Securitizadoras e corretoras.","Qualquer instituição autorizada pela CVM."],"c":1,"exp":"Banco comercial e cooperativa de crédito. Instituição de pagamento emite conta de pagamento."}]},{"id":"2.7.2","titulo":"Serviços Digitais e Pix","resumo":["Internet banking e aplicativos permitem que quase todas as operações sejam feitas pela internet.","BOLETO BANCÁRIO: documento de cobrança pagável em bancos, lotéricas ou canais digitais. Boletos podem ser REGISTRADOS e transformados em RECEBÍVEIS, permitindo que a empresa antecipe os valores e assegure fluxo de caixa positivo.","TEF (Transferência Eletrônica de Fundos): ocorre DENTRO da mesma instituição. TED (Transferência Eletrônica Disponível): entre bancos DIFERENTES, liquidada no mesmo dia para solicitações feitas ATÉ AS 17 HORAS.","PIX: transferências instantâneas em qualquer horário. Vantagens: agilidade, custo reduzido e liquidação imediata. Empresas podem enviar débitos diretamente à conta do cliente após autorização.","TARIFAÇÃO: o Pix é GRATUITO para clientes PESSOA FÍSICA. A PESSOA JURÍDICA está sujeita ao pagamento de tarifas."],"macete":"TEF é dentro de casa, TED é entre casas e tem hora (17h). Pix: grátis para PF, tarifado para PJ.","pegadinha":"A banca diz que o Pix é gratuito para todos. Para PJ há tarifa. E troca TEF por TED: TEF é interna, TED é interbancária.","questoes":[{"q":"A diferença entre TEF e TED é:","alts":["A TEF é entre bancos e a TED, dentro do mesmo.","A TEF é interna e a TED, entre bancos, até as 17h.","Ambas são entre bancos, mudando só o valor.","A TED é instantânea e a TEF liquida em D+1."],"c":1,"exp":"TEF interna, TED interbancária com corte às 17h."},{"q":"Sobre a tarifação do Pix, é CORRETO afirmar:","alts":["É gratuito para pessoas físicas e jurídicas.","É gratuito para PF; a PJ está sujeita a tarifas.","É tarifado para PF e gratuito para PJ.","É tarifado para ambas, com desconto para PF."],"c":1,"exp":"PF não paga, PJ paga."},{"q":"REDENÇÃO: boletos registrados podem ser transformados em recebíveis, o que permite à empresa:","alts":["Cancelar a cobrança já emitida ao cliente.","Antecipar os valores antes do pagamento do cliente.","Isentar-se do pagamento das tarifas bancárias.","Converter a cobrança automaticamente em Pix."],"c":1,"exp":"Recebível vira lastro para antecipação junto ao banco."}]},{"id":"2.7.3","titulo":"Conta Internacional","resumo":["Conta mantida em instituição estrangeira (ou via parceira de fintech brasileira) que permite guardar, converter e movimentar dinheiro em moedas diferentes, com cartão global e remessas.","Recebimento de recursos por códigos IBAN (International Bank Account Number), amplamente usado na EUROPA, ou ACH (Automated Clearing House), usado nos ESTADOS UNIDOS.","CUSTOS a observar: IOF, SPREAD CAMBIAL e taxas de saque.","DUAS CATEGORIAS: CONTAS DE INVESTIMENTO, cuja natureza da operação são aplicações financeiras, com IOF de 1,1%; e CONTAS DE DISPONIBILIZAÇÃO DE RECURSOS, cuja natureza é transferência para conta própria no exterior, com IOF de 3,5%."],"macete":"Investimento: 1,1%. Disponibilização (conta própria lá fora): 3,5%. IBAN é Europa, ACH é Estados Unidos.","pegadinha":"A banca inverte as alíquotas de IOF. Investir lá fora custa menos (1,1%) do que simplesmente mandar dinheiro para a própria conta (3,5%).","questoes":[{"q":"As alíquotas de IOF para contas de investimento e contas de disponibilização de recursos são, respectivamente:","alts":["3,5% e 1,1%.","1,1% e 3,5%.","0,38% e 6,38%.","1,1% e 1,1%."],"c":1,"exp":"Investimento 1,1%; transferência para conta própria no exterior 3,5%."},{"q":"O código utilizado para recebimento de recursos na Europa é o:","alts":["ACH.","IBAN.","SWIFT interno.","PTAX."],"c":1,"exp":"IBAN na Europa, ACH nos Estados Unidos."},{"q":"REDENÇÃO: são custos típicos de uma conta internacional, EXCETO:","alts":["IOF sobre a operação de câmbio.","Spread cambial cobrado na conversão.","Taxas de saque em moeda estrangeira.","Depósito compulsório sobre o saldo."],"c":3,"exp":"Compulsório é obrigação do banco junto ao BC, não custo do correntista."}]},{"id":"2.7.4","titulo":"Compra e Venda de Moeda Internacional","resumo":["Operação de câmbio: conversão de uma moeda para outra, por REMESSA via transferência ou compra de moeda EM ESPÉCIE.","SEM LIMITE DE VALOR: bancos comerciais, bancos de investimento e a Caixa Econômica Federal podem operar qualquer montante.","LIMITE DE US$ 500.000: corretoras de câmbio, DTVM, agências de fomento e financeiras.","LIMITE DE US$ 100.000: instituições de pagamento.","CORRESPONDENTES BANCÁRIOS atuam em nome da instituição contratante, e é a CONTRATANTE que responde pela precificação e pelo KYC.","VET (Valor Efetivo Total): custo total da operação de câmbio, expresso como a relação entre o valor em reais pago ou recebido e o montante em moeda estrangeira. TODA operação de câmbio deve divulgar o VET."],"macete":"Escada dos limites: banco não tem teto, corretora tem 500 mil, instituição de pagamento tem 100 mil. E o VET é o CET do câmbio.","pegadinha":"A banca troca os dois limites (500 mil e 100 mil) ou responsabiliza o correspondente bancário pela precificação. Quem responde é a instituição CONTRATANTE.","questoes":[{"q":"Os limites de operação em câmbio para corretoras de câmbio e instituições de pagamento são, respectivamente:","alts":["US$ 100.000 e US$ 500.000.","US$ 500.000 e US$ 100.000.","Ambos US$ 500.000.","Não há limite para nenhuma delas."],"c":1,"exp":"Corretoras, DTVM, agências de fomento e financeiras: US$ 500 mil. Instituições de pagamento: US$ 100 mil."},{"q":"O VET (Valor Efetivo Total) representa:","alts":["A taxa PTAX apurada no dia da operação.","O custo total da operação, divulgado sempre.","O limite máximo de remessa por operação.","O spread cambial cobrado pela instituição."],"c":1,"exp":"É o custo total, e sua divulgação é obrigatória em toda operação de câmbio."},{"q":"Num atendimento por correspondente bancário, a responsabilidade pela precificação e pelo KYC é:","alts":["Do correspondente bancário.","Da instituição contratante.","Do Banco Central.","Compartilhada entre correspondente e cliente."],"c":1,"exp":"O correspondente atua em nome da contratante, e a contratante responde."},{"q":"REDENÇÃO: podem operar câmbio em qualquer montante, sem restrição de valor:","alts":["Corretoras de câmbio e distribuidoras.","Bancos comerciais, de investimento e a Caixa.","Instituições de pagamento autorizadas.","Agências de fomento e financeiras."],"c":1,"exp":"Só os bancos e a Caixa não têm teto."}]},{"id":"2.7.5","titulo":"Atendimento Bancário","resumo":["Bancos comerciais devem estar acessíveis para operações básicas, como pagamento de boletos, INDEPENDENTEMENTE de a pessoa ser cliente. Isso ilustra a obrigatoriedade de prestar certos serviços à comunidade.","HORÁRIO: por normas do Banco Central, bancos comerciais devem operar por, NO MÍNIMO, CINCO HORAS ININTERRUPTAS em dias úteis. Em São Paulo costuma ser das 10h às 16h; em outras localidades, das 9h às 15h.","Esse é o horário de atendimento PRESENCIAL. Backoffice, canais telefônicos e atendimento digital 24/7 podem ocorrer fora desse período.","Algumas cidades têm leis municipais limitando o tempo de fila, como a 'lei dos 15 minutos' em São Paulo, objeto de debates e questionamentos no STF."],"macete":"Cinco horas ininterruptas em dias úteis, no mínimo. E qualquer pessoa pode pagar um boleto na agência, cliente ou não.","pegadinha":"A banca troca o mínimo de horas ou afirma que o banco só atende clientes. O pagamento de boleto é obrigação com a comunidade.","questoes":[{"q":"O tempo mínimo de funcionamento presencial dos bancos comerciais em dias úteis, segundo normas do Banco Central, é de:","alts":["quatro horas ininterruptas.","cinco horas ininterruptas.","seis horas ininterruptas.","oito horas, com intervalo."],"c":1,"exp":"Cinco horas ininterruptas em dias úteis."},{"q":"Uma pessoa sem conta no banco quer pagar um boleto na agência. O banco:","alts":["Pode recusar o pedido, pois o serviço é só para clientes.","Deve atender, por ser obrigação com a comunidade.","Só atende mediante tarifa de não correntista.","Deve encaminhar a pessoa a uma casa lotérica."],"c":1,"exp":"Operações básicas como pagamento de boleto são obrigação com a comunidade."},{"q":"REDENÇÃO: a chamada 'lei dos 15 minutos' em São Paulo trata de:","alts":["Tempo máximo para liquidação de uma TED.","Tempo máximo de espera na fila para atendimento.","Prazo para estorno de operações contestadas.","Prazo mínimo de funcionamento das agências."],"c":1,"exp":"É lei municipal sobre tempo de fila, com debates e questionamentos no STF."}]},{"id":"2.7.6","titulo":"Arranjos de Pagamento e Adquirência","resumo":["BANCO EMISSOR: concede o cartão ao cliente e define o limite de crédito. Assume a análise de risco e a cobrança da fatura. Se o cliente paga integralmente, não recebe juros de mora, mas capta receita por tarifas negociadas com bandeiras e adquirentes. Com atraso, entram os juros rotativos, uma das principais fontes de receita de crédito dos bancos.","BANDEIRA: define as REGRAS do arranjo, padroniza a aceitação do cartão e CONECTA emissores, adquirentes e lojistas. Exemplos: Visa, Mastercard, American Express.","ADQUIRENTE: PROCESSA as transações em nome do LOJISTA. Captura os dados do cartão, encaminha a autorização à bandeira, que redireciona ao emissor, e depois aprova ou rejeita. Na liquidação, CREDITA os valores na conta do lojista. Exemplos: Cielo, Rede, Stone.","SUBADQUIRENTE: atende micro e pequenos empreendedores com soluções simplificadas, menos burocracia e homologação ágil. Agrupa várias operações e as encaminha ao adquirente principal. Exemplos: SumUp, Mercado Pago.","RECEITAS: o lojista recebe valor inferior porque se retém uma TAXA DE DESCONTO, compartilhada entre adquirente, bandeira, emissor e, quando aplicável, subadquirente. A fatia depende do tipo de cartão, do prazo de repasse e do perfil de risco do lojista.","Cada autorização gera RECEITA DE INTERCÂMBIO para o emissor, mesmo quando o cliente paga a fatura integralmente. A bandeira capta por taxas de adesão e de uso da rede. É essa remuneração que viabiliza pontos, cashback e seguros ao portador."],"macete":"Emissor dá o cartão, Bandeira dá as regras, Adquirente atende o lojista, Subadquirente atende o pequeno lojista.","pegadinha":"A banca troca bandeira e adquirente. Bandeira NÃO processa transação nem credita o lojista: ela padroniza e conecta. Quem credita o lojista é o adquirente.","questoes":[{"q":"A instituição responsável por processar as transações em nome do lojista e creditar os valores em sua conta é:","alts":["A bandeira.","O banco emissor.","O adquirente.","O subadquirente exclusivamente."],"c":2,"exp":"Adquirente captura, encaminha a autorização e liquida na conta do lojista. Cielo, Rede e Stone são exemplos."},{"q":"O papel da bandeira no arranjo de pagamento é:","alts":["Conceder o cartão e definir o limite de crédito.","Definir as regras e conectar os participantes.","Creditar os valores na conta do lojista.","Agrupar operações de pequenos empreendedores."],"c":1,"exp":"Regras, padronização e conexão. Conceder cartão é do emissor; creditar é do adquirente; agrupar pequenos é do subadquirente."},{"q":"Mesmo quando o cliente paga a fatura integralmente, o banco emissor obtém receita por meio:","alts":["Dos juros cobrados no crédito rotativo.","Da receita de intercâmbio de cada autorização.","Da taxa de administração cobrada no consórcio.","Do spread cambial das compras internacionais."],"c":1,"exp":"É a receita de intercâmbio que sustenta pontos, cashback e seguros oferecidos ao portador."},{"q":"REDENÇÃO: os subadquirentes surgiram para:","alts":["Substituir as bandeiras internacionais no país.","Atender pequenos lojistas com solução simplificada.","Emitir cartões de crédito diretamente ao público.","Definir as regras gerais do arranjo de pagamento."],"c":1,"exp":"Menos burocracia e homologação mais ágil para o pequeno lojista. SumUp e Mercado Pago são exemplos."}]}],"boss":[{"q":"Assinale a alternativa que diferencia corretamente conta corrente e conta de pagamento:","alts":["Ambas têm cobertura do FGC, mas só a corrente oferece Pix.","Só a corrente tem FGC, compulsório e crédito direto.","Só a de pagamento recolhe depósito compulsório.","A conta de pagamento é emitida por banco comercial."],"c":1,"exp":"O Pix é o único item em comum entre as duas."},{"q":"Uma TED solicitada às 18h será liquidada:","alts":["No mesmo dia, pois a TED é sempre imediata.","Em D+1, pois o corte da TED é às 17 horas.","Instantaneamente, com a mesma regra do Pix.","Em D+2, por ser fora do horário bancário."],"c":1,"exp":"O corte da TED é às 17 horas."},{"q":"Os IOF de conta internacional de investimento e de disponibilização de recursos são:","alts":["1,1% e 3,5%.","3,5% e 1,1%.","0,38% e 1,1%.","6,38% e 3,5%."],"c":0,"exp":"Investimento 1,1%; transferência para conta própria no exterior 3,5%."},{"q":"O limite de operação em câmbio de uma DTVM é de:","alts":["US$ 100.000","US$ 500.000","Não há limite","US$ 1.000.000"],"c":1,"exp":"DTVM, corretoras de câmbio, agências de fomento e financeiras: US$ 500 mil."},{"q":"Numa transação com cartão, quem define as regras do arranjo e padroniza a aceitação é:","alts":["O adquirente.","A bandeira.","O banco emissor.","O subadquirente."],"c":1,"exp":"Bandeira: regras, padronização e conexão entre os participantes."},{"q":"O pacote de serviços essenciais gratuito para pessoa física inclui:","alts":["Dois saques mensais e um cartão de crédito.","Quatro saques, digitais e um extrato impresso.","Saques ilimitados e limite de cheque especial.","Apenas o acesso gratuito ao internet banking."],"c":1,"exp":"Quatro saques, digitais e um extrato impresso."},{"q":"O VET deve ser divulgado:","alts":["Apenas em operações acima de US$ 10.000.","Em toda operação de câmbio.","Apenas em remessas para o exterior.","Apenas por bancos comerciais."],"c":1,"exp":"Divulgação obrigatória em toda operação de câmbio."},{"q":"Sobre a tarifação do Pix:","alts":["Gratuito para PF e PJ.","Gratuito para PF; PJ está sujeita a tarifas.","Tarifado para PF e gratuito para PJ.","Tarifado para ambos."],"c":1,"exp":"PF não paga; PJ paga."},{"q":"O horário mínimo de funcionamento presencial de bancos comerciais em dias úteis é:","alts":["Quatro horas ininterruptas por dia útil.","Cinco horas ininterruptas por dia útil.","Seis horas ininterruptas por dia útil.","Oito horas, admitido intervalo para almoço."],"c":1,"exp":"Cinco horas ininterruptas, conforme normas do Banco Central."},{"q":"SumUp e Mercado Pago, no arranjo de pagamento, atuam como:","alts":["Bandeiras.","Adquirentes.","Subadquirentes.","Bancos emissores."],"c":2,"exp":"Subadquirentes: agrupam operações de pequenos lojistas e encaminham ao adquirente principal."},{"q":"A conta salário oferece ao trabalhador o direito de:","alts":["Cheque especial sem cobrança de juros.","Portabilidade automática e gratuita do salário.","Isenção de imposto de renda sobre o salário.","Rendimento automático de 100% do CDI."],"c":1,"exp":"Portabilidade automática e gratuita."},{"q":"A taxa de desconto retida numa transação com cartão é compartilhada entre:","alts":["Apenas entre o adquirente e o lojista.","Adquirente, bandeira, emissor e subadquirente.","Apenas entre a bandeira e o banco emissor.","Apenas entre o Banco Central e o adquirente."],"c":1,"exp":"A fatia de cada um depende do tipo de cartão, do prazo de repasse e do perfil de risco do lojista."}]},{"id":"2.8","titulo":"Seguros","subtitulo":"Transferindo risco por um prêmio","niveis":[{"id":"2.8.1","titulo":"Princípios de Seguros","resumo":["Contrato entre o SEGURADO (o cliente) e a SEGURADORA. O segurado paga um valor chamado PRÊMIO para TRANSFERIR à seguradora a responsabilidade sobre eventos FUTUROS E INCERTOS.","RISCO PESSOAL: morte prematura, invalidez total ou parcial, doença grave ou crônica, acidente pessoal, perda de emprego por doença ou acidente.","RISCO PATRIMONIAL: incêndio em residência ou empresa, roubo ou furto de bens, desastres naturais, colisão ou roubo de veículos, assistência residencial.","RISCO FINANCEIRO: danos a terceiros, inadimplência em contratos e obrigações, interrupção de atividades empresariais, perda de renda ou emprego, quebra de contratos e multas.","TERMOS ESSENCIAIS: PRÊMIO é o valor PAGO PELO SEGURADO para manter a cobertura. SINISTRO é a OCORRÊNCIA do evento coberto. INDENIZAÇÃO é o valor PAGO PELA SEGURADORA após o sinistro. APÓLICE é o documento formal com todas as condições."],"macete":"Prêmio é o que VOCÊ paga. Indenização é o que a SEGURADORA paga. Sinistro é o evento. Apólice é o contrato.","pegadinha":"A pegadinha eterna: chamar de 'prêmio' o valor que a seguradora paga. Prêmio é o custo do seguro, pago pelo segurado. O que a seguradora paga é a indenização.","questoes":[{"q":"O valor pago pelo segurado à seguradora para manter a cobertura é denominado:","alts":["Indenização.","Prêmio.","Sinistro.","Apólice."],"c":1,"exp":"Prêmio é o custo do seguro. Indenização é o que a seguradora paga quando ocorre o sinistro."},{"q":"A ocorrência do evento contra o qual o cliente está segurado é chamada de:","alts":["Apólice.","Prêmio.","Sinistro.","Franquia."],"c":2,"exp":"Sinistro é o evento. A partir dele nasce o direito à indenização."},{"q":"A perda de renda ou emprego e a inadimplência em contratos classificam-se como:","alts":["Risco pessoal.","Risco patrimonia
