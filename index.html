l.","Risco financeiro.","Risco operacional."],"c":2,"exp":"Risco financeiro atinge a viabilidade econômica. Risco pessoal atinge a vida; patrimonial atinge bens tangíveis."},{"q":"REDENÇÃO: o documento formal que detalha todas as condições do seguro é:","alts":["O prêmio.","A apólice.","O sinistro.","O termo de adesão."],"c":1,"exp":"Apólice é o contrato do seguro, com todas as condições detalhadas."}]},{"id":"2.8.2","titulo":"Seguro Patrimonial","resumo":["Contratos que protegem bens materiais ou obrigações financeiras contra perdas causadas por eventos inesperados: acidentes, furtos, incêndios ou inadimplência.","SEGURO RESIDENCIAL: protege o lar contra incêndio, explosões, roubos, vendaval e danos elétricos. Pode oferecer coberturas adicionais de assistência 24 horas, como falta de eletricidade ou encanamento rompido.","SEGURO DE AUTOMÓVEIS: protege contra colisões, roubos, incêndios e RESPONSABILIDADE CIVIL A TERCEIROS, incluindo despesas médicas.","SEGURO PRESTAMISTA: assegura o PAGAMENTO DE DÍVIDAS em caso de falecimento, invalidez ou desemprego involuntário do segurado. É o seguro que quita o empréstimo."],"macete":"Prestamista protege a DÍVIDA, não o bem nem a pessoa. Automóvel inclui responsabilidade civil a terceiros.","pegadinha":"A banca confunde prestamista com seguro de vida. O prestamista quita a DÍVIDA; o seguro de vida paga indenização aos beneficiários.","questoes":[{"q":"O seguro que assegura o pagamento de dívidas em caso de falecimento, invalidez ou desemprego involuntário é o:","alts":["Seguro de vida tradicional.","Seguro prestamista.","Seguro residencial.","Seguro DFI."],"c":1,"exp":"Prestamista quita a dívida. É o mesmo que aparece no consignado de aposentados e no crédito imobiliário."},{"q":"São coberturas típicas do seguro residencial:","alts":["Colisão, roubo e incêndio de veículos.","Incêndio, roubo, vendaval e danos elétricos.","Morte e invalidez permanente do contratante.","Inadimplência em contratos empresariais."],"c":1,"exp":"As coberturas listadas no material, mais a assistência 24 horas para problemas como falta de eletricidade e encanamento rompido."},{"q":"REDENÇÃO: além dos danos ao próprio veículo, o seguro de automóveis cobre:","alts":["A depreciação do bem ao longo do tempo.","A responsabilidade civil a terceiros e despesas médicas.","As multas de trânsito aplicadas ao condutor.","O financiamento do veículo em caso de desemprego."],"c":1,"exp":"Responsabilidade civil a terceiros é parte central da cobertura de automóveis."}]},{"id":"2.8.3","titulo":"Seguro de Vida","resumo":["Contrato em que a seguradora se compromete a pagar uma INDENIZAÇÃO aos beneficiários designados em caso de falecimento do segurado ou de outros eventos cobertos.","SEGURO DE VIDA TRADICIONAL: proteção enquanto o prêmio mensal estiver sendo pago. O NÃO PAGAMENTO implica PERDA da proteção. É a opção mais simples e acessível.","SEGURO VIDA INTEIRA: cobertura VITALÍCIA, mesmo que os pagamentos sejam feitos por período determinado ou até de uma só vez. Pago o montante acordado, a proteção segue até o falecimento.","SEGURO DE VIDA TEMPORÁRIO: cobertura por tempo limitado, definido pelo contratante para uma necessidade específica. Após o período, decide-se se continua ou não.","ACIDENTES PESSOAIS: cobertura EXCLUSIVAMENTE para morte ou invalidez resultante de ACIDENTES. Indicado para profissões de risco, como motorista ou entregador."],"macete":"Tradicional: pagou, está coberto; parou, perdeu. Vida inteira: paga um tempo, cobre para sempre. Temporário: prazo definido. Acidentes pessoais: só acidente.","pegadinha":"A banca oferece o seguro de acidentes pessoais como cobertura para morte por qualquer causa. Ele cobre EXCLUSIVAMENTE morte ou invalidez por ACIDENTE.","questoes":[{"q":"O seguro que oferece cobertura exclusivamente para morte ou invalidez resultante de acidentes é o:","alts":["Seguro de vida tradicional.","Seguro vida inteira.","Seguro de acidentes pessoais.","Seguro prestamista."],"c":2,"exp":"Só acidente. Morte por doença, por exemplo, não está coberta nessa modalidade."},{"q":"Sobre o seguro VIDA INTEIRA, é CORRETO afirmar:","alts":["A cobertura cessa se o pagamento for interrompido.","A cobertura é vitalícia, mesmo com pagamento por prazo.","O prazo máximo de cobertura é de 20 anos.","Cobre apenas invalidez decorrente de acidente."],"c":1,"exp":"Pago o montante acordado, a proteção segue até o falecimento."},{"q":"Um cliente quer proteger a família apenas durante os quatro anos em que financiará a faculdade do filho. A modalidade adequada é o seguro de vida:","alts":["Tradicional.","Vida inteira.","Temporário.","De acidentes pessoais."],"c":2,"exp":"Temporário: prazo estipulado conforme a necessidade específica, com decisão de renovar ao final."},{"q":"REDENÇÃO: no seguro de vida TRADICIONAL, o não pagamento do prêmio mensal implica:","alts":["Conversão automática em seguro vida inteira.","Perda da proteção.","Redução proporcional da indenização.","Cobrança do saldo devedor com juros."],"c":1,"exp":"A proteção existe enquanto o prêmio é pago."}]}],"boss":[{"q":"Assinale a associação CORRETA entre prêmio e indenização no seguro:","alts":["Prêmio é o que a seguradora paga ao segurado.","Prêmio é pago pelo segurado; indenização, pela seguradora.","Sinistro é o documento formal que rege o seguro.","Indenização é o custo mensal pago pelo segurado."],"c":1,"exp":"A tríade prêmio, sinistro e indenização cai em quase toda prova."},{"q":"Um entregador de aplicativo quer se proteger contra invalidez decorrente de acidente no trabalho. A modalidade indicada é:","alts":["Seguro prestamista, que quita dívidas.","Seguro de acidentes pessoais.","Seguro residencial com assistência 24 horas.","Seguro DFI, de danos físicos ao imóvel."],"c":1,"exp":"Acidentes pessoais cobre morte ou invalidez por acidente, indicado para profissões de risco."},{"q":"Incêndio em residência e roubo de veículo classificam-se como:","alts":["Risco pessoal.","Risco patrimonial.","Risco financeiro.","Risco sistêmico."],"c":1,"exp":"Risco patrimonial atinge bens tangíveis."},{"q":"O seguro que quita a dívida do contratante em caso de falecimento, invalidez ou desemprego involuntário é:","alts":["Vida inteira.","Prestamista.","Temporário.","Acidentes pessoais."],"c":1,"exp":"Prestamista protege a operação de crédito, não a pessoa em si."},{"q":"Doença grave e invalidez total ou parcial classificam-se como:","alts":["Risco patrimonial.","Risco pessoal.","Risco financeiro.","Risco de crédito."],"c":1,"exp":"Risco pessoal abrange eventos que afetam diretamente a vida da pessoa."},{"q":"No seguro de vida TEMPORÁRIO, ao final do período contratado:","alts":["A cobertura se torna vitalícia automaticamente.","O contratante decide se renova ou não o seguro.","A seguradora devolve os prêmios que foram pagos.","A indenização é paga integralmente ao segurado."],"c":1,"exp":"Prazo definido para uma necessidade específica, com decisão de renovar ao final."},{"q":"Danos a terceiros e interrupção de atividades empresariais são exemplos de:","alts":["Risco pessoal.","Risco patrimonial.","Risco financeiro.","Risco operacional."],"c":2,"exp":"Risco financeiro impacta a viabilidade econômica da pessoa ou empresa."},{"q":"A essência do contrato de seguro, segundo o material, é:","alts":["Investir o prêmio para gerar renda ao segurado.","Pagar um prêmio e transferir o risco à seguradora.","Garantir uma rentabilidade mínima ao segurado.","Substituir a previdência complementar aberta."],"c":1,"exp":"Transferência de risco: eventos futuros e incertos, mediante prêmio."}]}]},{id:"3",nome:'Relacionamento com o Cliente',subtitulo:'Suitability, ética e o que vira crime',peso:30,blocos:[{"id":"3.1","titulo":"Finanças Pessoais","subtitulo":"Ciclo de vida, orçamento, balanço e dívidas","niveis":[{"id":"3.1.1","titulo":"Ciclo de Vida da Pessoa Investidora","resumo":["Quatro fases, e a idade é a chave de cada uma.","ACUMULAÇÃO (20 a 30): começa a carreira, poupa pouco, mas tem MUITO tempo para recuperar perdas. Maior tolerância a risco. Ações fazem sentido.","CRESCIMENTO (30 a 50): amplia o patrimônio. Equilíbrio entre risco e retorno.","PRESERVAÇÃO (a partir dos 50): pré-aposentadoria. Sobra pouco tempo para recuperar, então o perfil vira conservador. Baixa volatilidade e proteção contra inflação.","DISTRIBUIÇÃO (60 ou mais): converte patrimônio em renda. Entra o planejamento sucessório."],"macete":"20-30-50-60: Acumula, Cresce, Preserva, Distribui. Quanto menos tempo pela frente, mais conservador.","pegadinha":"A banca inverte a lógica do risco: quem está começando é que pode arriscar mais, porque tem tempo de recuperar. Perto da aposentadoria, o risco cai.","questoes":[{"q":"Um cliente de 55 anos, a dez anos da aposentadoria, está na fase de:","alts":["Acumulação, formando o primeiro patrimônio.","Crescimento, ampliando o patrimônio.","Preservação, protegendo o que acumulou.","Distribuição, convertendo tudo em renda."],"c":2,"exp":"A partir dos 50 começa a preservação: menos tempo para recuperar perdas, perfil mais conservador."},{"q":"A razão pela qual a fase de acumulação admite maior exposição a risco é:","alts":["O patrimônio ainda é pequeno e a perda é irrelevante.","O horizonte de tempo longo permite recuperar eventuais perdas.","A legislação exige carteiras agressivas para jovens.","A renda nessa fase costuma ser a mais alta da vida."],"c":1,"exp":"É o tempo, não o tamanho do patrimônio. Horizonte longo absorve oscilação."},{"q":"O planejamento sucessório ganha relevância central na fase de:","alts":["Acumulação.","Crescimento.","Preservação.","Distribuição."],"c":3,"exp":"Na distribuição define-se como o patrimônio passa aos herdeiros, minimizando custo tributário e conflito."},{"q":"REDENÇÃO: a ordem correta das quatro fases do ciclo de vida é:","alts":["Acumulação, crescimento, preservação e distribuição.","Crescimento, acumulação, distribuição e preservação.","Preservação, acumulação, crescimento e distribuição.","Acumulação, preservação, crescimento e distribuição."],"c":0,"exp":"Acumula, cresce, preserva, distribui. Nessa ordem."}]},{"id":"3.1.2","titulo":"Orçamento e Fluxo de Caixa","resumo":["Fluxo de caixa: todas as entradas e saídas num período, em geral mensal. Revela se o orçamento está equilibrado, superavitário ou deficitário.","RECEITAS REGULARES: contínuas e previsíveis (salário, aluguel). Só elas sustentam compromissos de longo prazo.","RECEITAS ESPORÁDICAS: herança, bônus, venda de bem. NÃO devem lastrear despesas fixas, pois podem não se repetir.","Quatro tipos de despesa: FIXA OBRIGATÓRIA (aluguel), FIXA FACULTATIVA (streaming), VARIÁVEL OBRIGATÓRIA (alimentação), VARIÁVEL FACULTATIVA (jantar fora).","Em desequilíbrio, o corte prioritário é nas FACULTATIVAS.","Capacidade (ou taxa) de poupança: proporção da renda não consumida em despesas."],"macete":"Duas perguntas classificam qualquer gasto: repete todo mês? dá para cortar? Fixa/variável × obrigatória/facultativa.","pegadinha":"A banca usa um bônus ou uma herança para financiar uma prestação longa. Receita esporádica não sustenta despesa fixa.","questoes":[{"q":"Uma assinatura mensal de streaming classifica-se como despesa:","alts":["Fixa obrigatória, por ter valor constante.","Fixa facultativa, pois repete mas pode ser cortada.","Variável obrigatória, por depender do uso.","Variável facultativa, por ser lazer."],"c":1,"exp":"Repete todo mês com valor igual (fixa) e pode ser cancelada (facultativa)."},{"q":"Um cliente quer usar o bônus anual de desempenho para assumir o financiamento de um imóvel. A orientação correta é:","alts":["Aceitar, pois o bônus integra a renda anual.","Recusar: receita esporádica não deve lastrear despesa fixa.","Aceitar, desde que o bônus supere a parcela.","Recusar, pois bônus não é considerado receita."],"c":1,"exp":"Bônus é receita esporádica e pode não se repetir. Compromissos longos exigem receita regular."},{"q":"Diante de um orçamento deficitário, o corte prioritário deve recair sobre:","alts":["As despesas fixas obrigatórias.","As despesas facultativas.","As receitas esporádicas.","A capacidade de poupança."],"c":1,"exp":"Facultativas primeiro, sejam fixas ou variáveis. Obrigatórias são as últimas a mexer."},{"q":"REDENÇÃO: a capacidade de poupança é definida como:","alts":["O saldo da conta corrente no fim do mês.","A proporção da renda que não foi consumida em despesas.","O total das receitas esporádicas do ano.","O valor da reserva de emergência acumulada."],"c":1,"exp":"É o indicador que mostra quanto do orçamento pode ir para metas."}]},{"id":"3.1.3","titulo":"Balanço Patrimonial Pessoal","resumo":["Fotografia do momento: compara ATIVOS (bens e direitos) com PASSIVOS (dívidas).","PATRIMÔNIO LÍQUIDO = Ativos menos Passivos. É ele que revela a saúde financeira real.","BEM DE USO: usado no dia a dia e GERA DESPESA (casa de moradia, carro da família, imóvel de veraneio).","BEM DE NÃO USO: GERA RECEITA (imóvel alugado, CDB, ações, PGBL).","Duas estratégias para melhorar o PL: quitar passivos caros e converter bens de uso em bens de não uso.","Indicadores extraídos do balanço: liquidez, cobertura de despesas mensais e grau de endividamento."],"macete":"O bem de USO consome dinheiro; o de NÃO USO produz dinheiro. Casa em que você mora é uso; casa alugada é não uso.","pegadinha":"A banca coloca a casa própria ou o imóvel de veraneio como bem de não uso. Se não gera receita, é bem de USO, por mais valioso que seja.","questoes":[{"q":"Um imóvel de veraneio usado pela família nos feriados classifica-se como:","alts":["Bem de uso, pois não gera receita.","Bem de não uso, pela alta liquidez.","Passivo, por gerar despesa de manutenção.","Patrimônio líquido, por ser quitado."],"c":0,"exp":"Segunda moradia de lazer não gera receita: é bem de uso, ainda que valioso."},{"q":"Uma família tem R$ 900.000 em ativos e R$ 340.000 em passivos. Seu patrimônio líquido é:","alts":["R$ 1.240.000","R$ 900.000","R$ 560.000","R$ 340.000"],"c":2,"exp":"PL = ativos menos passivos = 900.000 - 340.000 = R$ 560.000."},{"q":"Converter um bem de uso em bem de não uso significa:","alts":["Vender o bem e aplicar o valor em consumo.","Transformar um gerador de despesa em gerador de receita.","Quitar antecipadamente o financiamento do bem.","Reclassificar o bem como passivo no balanço."],"c":1,"exp":"Alugar um imóvel ocioso, por exemplo, transfere o bem da coluna de despesa para a de receita."},{"q":"REDENÇÃO: são exemplos de bens de NÃO USO:","alts":["Casa de moradia e carro da família.","Imóvel alugado, CDB e ações em carteira.","Empréstimo pessoal e saldo do cartão.","Imóvel de veraneio e veículo de passeio."],"c":1,"exp":"Todos geram receita. Empréstimo e cartão são passivos, e os demais são bens de uso."}]},{"id":"3.1.4","titulo":"Reserva de Emergência","resumo":["Também chamada de reserva de liquidez. Protege contra desemprego, saúde e imprevistos.","Dois requisitos, nesta ordem: ALTA LIQUIDEZ e BAIXO RISCO. Rentabilidade NÃO é objetivo.","DIMENSIONAMENTO: de 6 a 12 meses de despesas mensais. Renda instável (autônomo) pede 12 meses; renda estável (servidor) admite menos.","Produtos adequados: poupança, CDB de liquidez diária, fundo de renda fixa simples e Tesouro Selic.","PIRÂMIDE DE ALOCAÇÃO, da base ao topo: reserva de emergência, proteção contra inflação, renda variável e investimentos alternativos. Nada se constrói antes da base."],"macete":"6 a 12 meses de DESPESA, não de renda. Autônomo vai para 12; servidor fica perto de 6.","pegadinha":"A banca dimensiona a reserva em meses de RENDA, ou sugere um produto rentável e sem liquidez. Rentabilidade não é critério aqui.","questoes":[{"q":"Um profissional autônomo com renda variável deve dimensionar a reserva em:","alts":["3 meses de despesas, por ter renda alta.","12 meses de despesas, pela instabilidade da renda.","6 meses de renda bruta mensal.","24 meses de despesas, por precaução."],"c":1,"exp":"A faixa é de 6 a 12 meses de despesas. Renda instável puxa para o topo da faixa."},{"q":"O critério que NÃO deve orientar a escolha do produto para a reserva de emergência é:","alts":["A liquidez imediata do ativo.","O baixo risco de perda do capital.","A maior rentabilidade possível.","A facilidade de resgate."],"c":2,"exp":"O objetivo é acesso rápido e segurança, não retorno. Buscar rentabilidade aqui compromete a função da reserva."},{"q":"Na pirâmide de alocação, a base é ocupada por:","alts":["Investimentos alternativos.","Ativos de renda variável.","A reserva de emergência.","A proteção contra a inflação."],"c":2,"exp":"Reserva na base, depois proteção contra inflação, depois renda variável e por fim alternativos."},{"q":"REDENÇÃO: são produtos adequados à reserva de emergência, EXCETO:","alts":["CDB de liquidez diária de banco médio.","Tesouro Selic, com recompra garantida.","Tesouro IPCA+ com vencimento em 2045.","Fundo de renda fixa simples, com resgate em D0."],"c":2,"exp":"Título longo indexado ao IPCA tem forte risco de mercado na venda antecipada. Serve para aposentadoria, não para emergência."}]},{"id":"3.1.5","titulo":"Gestão de Dívida e Crédito","resumo":["Escada do custo, do mais caro ao mais barato: rotativo do cartão e cheque especial (altíssimo), crédito pessoal (média/alto), consignado e financiamento de veículo (baixo/médio), imobiliário, estudantil, microcrédito, rural e energia sustentável (baixo).","A regra que explica tudo: quanto MELHOR a garantia, MENOR o juro. Sem garantia, o juro dispara.","TROCA DE DÍVIDA: substituir um passivo caro por outro mais barato. É a principal recomendação ao cliente endividado.","Linhas específicas: FIES (carência e juros subsidiados), microcrédito (pequeno empreendedor), crédito rural (produtor) e crédito para energia sustentável (placas solares).","Cartão de crédito pago em dia tem custo ZERO e ainda gera cashback, milhas e pontos. O problema não é o produto, é o rotativo."],"macete":"Sem garantia = caro. Com desconto em folha ou bem em garantia = barato. A troca de dívida é sempre do caro para o barato.","pegadinha":"A banca condena moralmente o cartão. O material é claro: o produto é útil e gratuito se pago pontualmente; o vilão é a permanência no rotativo.","questoes":[{"q":"Um cliente está no rotativo do cartão a juros altíssimos e tem margem consignável livre. A recomendação técnica é:","alts":["Manter o rotativo e aumentar o pagamento mínimo.","Fazer a troca de dívida, migrando para o consignado.","Contratar cheque especial para quitar o cartão.","Suspender o uso do cartão sem quitar o saldo."],"c":1,"exp":"Troca de dívida: o consignado tem desconto em folha, risco baixo e juro muito menor que o rotativo. Cheque especial é tão caro quanto."},{"q":"A variável que melhor explica a diferença de juros entre as modalidades de crédito é:","alts":["O prazo de pagamento contratado na operação.","A qualidade da garantia oferecida ao credor.","O valor total contratado na operação de crédito.","A idade e a escolaridade do tomador do crédito."],"c":1,"exp":"Garantia forte reduz o risco do credor e, com ele, a taxa. É a mesma lógica do imobiliário e do consignado."},{"q":"A linha de crédito destinada à instalação de placas solares tem como garantia típica:","alts":["O aval de um terceiro.","O desconto direto em folha de pagamento.","O próprio bem imóvel.","A safra do produtor rural."],"c":2,"exp":"Crédito para energia sustentável usa o próprio imóvel como garantia, o que o mantém na faixa de custo baixo."},{"q":"REDENÇÃO: sobre o uso do cartão de crédito, o material afirma que:","alts":["Deve ser evitado, por ser sempre oneroso.","Pago pontualmente tem custo zero e ainda gera benefícios.","Só é vantajoso para quem usa o rotativo com moderação.","Tem custo equivalente ao do crédito consignado."],"c":1,"exp":"Custo zero se pago em dia, com cashback, milhas e pontos. O problema começa no rotativo."}]},{"id":"3.1.6","titulo":"As 6 Etapas do Planejamento Financeiro","resumo":["Metodologia reconhecida pela PLANEJAR, responsável pela certificação CFP.","1. ESTABELECER o relacionamento: definir escopo, responsabilidades, prazos e honorários.","2. COLETAR informações: dados quantitativos (renda, despesas, dívidas) e qualitativos (família, objetivos, prioridades).","3. ANALISAR o status: quantificar capacidade de poupança, liquidez, endividamento e alocação. Ajustar objetivos irrealistas.","4. DESENVOLVER e apresentar as recomendações: traduzir a análise em plano prático.","5. IMPLEMENTAR: executar o acordado (abrir contas, contratar seguros).","6. REVER: monitorar continuamente e revisar diante de mudanças."],"macete":"E-C-A-D-I-R: Estabelece, Coleta, Analisa, Desenvolve, Implementa, Revê. Coletar vem antes de analisar; analisar vem antes de recomendar.","pegadinha":"A banca embaralha a ordem, tipicamente colocando a recomendação antes da análise. Nunca se recomenda antes de diagnosticar.","questoes":[{"q":"A definição de escopo, responsabilidades e honorários corresponde a qual etapa?","alts":["Primeira: estabelecer o relacionamento.","Segunda: coletar as informações.","Quarta: desenvolver as recomendações.","Sexta: rever a situação."],"c":0,"exp":"É o ponto de partida, antes de qualquer levantamento de dados."},{"q":"Constatar que a meta do cliente é inatingível no prazo desejado e ajustá-la ocorre na etapa de:","alts":["Coleta de informações.","Análise e avaliação do status financeiro.","Implementação das recomendações.","Revisão da situação do cliente."],"c":1,"exp":"É na análise que se confronta objetivo com realidade e se ajusta o que for necessário."},{"q":"A etapa que distingue um plano pontual de um processo efetivo de planejamento é:","alts":["A coleta detalhada de dados.","A apresentação do plano ao cliente.","A implementação das recomendações.","O monitoramento e a revisão contínuos."],"c":3,"exp":"Sem revisão periódica, o plano envelhece. Mudanças de vida e de economia exigem ajuste."},{"q":"REDENÇÃO: a entidade que reconhece essa metodologia de seis etapas e responde pela certificação CFP é:","alts":["A ANBIMA.","A PLANEJAR.","A ANCORD.","A APIMEC."],"c":1,"exp":"PLANEJAR, Associação Brasileira de Planejamento Financeiro, responsável pelo CFP no Brasil."}]},{"id":"3.1.7","titulo":"Tributação da Pessoa Física na Declaração","resumo":["Três classificações de rendimento na declaração anual:","TRIBUTÁVEL: entra no ajuste anual (salário, aluguel recebido, pró-labore).","TRIBUTAÇÃO EXCLUSIVA/DEFINITIVA: já foi tributado na fonte e NÃO entra no ajuste (CDB, título público, fundos).","ISENTO: livre de IR (poupança, LCI, LCA, LCD, CRI, CRA, debênture incentivada).","MODELO SIMPLIFICADO: desconto padrão de 20% da base, com limitador, sem comprovar despesas.","MODELO COMPLETO: deduz despesas efetivas com saúde, educação, previdência e dependentes. É o único que viabiliza o benefício do PGBL."],"macete":"Exclusiva PAGA imposto mas não entra no ajuste; isenta NÃO paga. Não confunda as duas. PGBL só compensa no modelo completo.","pegadinha":"A banca trata 'tributação exclusiva' como sinônimo de isenção. São coisas diferentes: na exclusiva houve retenção definitiva na fonte.","questoes":[{"q":"Os rendimentos de uma LCA, para pessoa física, classificam-se como:","alts":["Tributáveis, sujeitos a ajuste anual.","De tributação exclusiva na fonte.","Isentos de imposto de renda.","Não declaráveis."],"c":2,"exp":"LCI, LCA, LCD, CRI, CRA e debênture incentivada são isentas para PF. CDB e título público é que têm tributação exclusiva."},{"q":"Um cliente pretende usar o PGBL para reduzir o imposto devido. Isso exige que ele:","alts":["Declare pelo modelo simplificado da Receita.","Declare pelo completo e contribua ao INSS.","Tenha rendimentos exclusivamente isentos.","Aporte mais de 12% da renda bruta no plano."],"c":1,"exp":"O abatimento de até 12% só existe no modelo completo e para quem contribui a regime oficial de previdência."},{"q":"Quem paga plano de saúde caro, tem dependentes e contribui para PGBL tende a se beneficiar de qual modelo de declaração?","alts":["Completo, que deduz as despesas efetivas.","Simplificado, pelo desconto padrão de 20% da base.","Qualquer um dos dois, pois o resultado é idêntico.","Nenhum: gastos com saúde não são dedutíveis."],"c":0,"exp":"Só o modelo completo deduz saúde, dependentes e PGBL; o simplificado troca tudo por 20% com limitador."},{"q":"REDENÇÃO: salário e aluguel recebido são rendimentos:","alts":["Isentos de imposto de renda.","De tributação exclusiva na fonte.","Tributáveis, com ajuste anual.","Dispensados de declaração."],"c":2,"exp":"Entram na base do ajuste anual e são confrontados com o que já foi retido na fonte."}]}],"boss":[{"q":"Um cliente de 27 anos, recém-formado, começa a investir. A fase e a postura de risco adequadas são:","alts":["Acumulação, com maior tolerância a risco.","Acumulação, com postura conservadora.","Crescimento, com maior tolerância a risco.","Preservação, com postura conservadora."],"c":0,"exp":"Acumulação vai dos 20 aos 30, e o horizonte longo permite mais risco."},{"q":"Uma herança recebida em janeiro classifica-se como receita:","alts":["Regular, por integrar o patrimônio.","Esporádica, não devendo lastrear despesa fixa.","Regular, se investida em renda fixa.","Não computável no fluxo de caixa."],"c":1,"exp":"Entra no fluxo do mês, mas não se repete: não sustenta compromisso longo."},{"q":"Ativos de R$ 1.500.000 e passivos de R$ 620.000 resultam em patrimônio líquido de:","alts":["R$ 2.120.000","R$ 880.000","R$ 620.000","R$ 1.500.000"],"c":1,"exp":"1.500.000 - 620.000 = R$ 880.000."},{"q":"Um servidor público estável deve manter reserva de emergência equivalente a:","alts":["12 meses de renda bruta.","Cerca de 6 meses de despesas.","24 meses de despesas.","3 meses de renda líquida."],"c":1,"exp":"A faixa é de 6 a 12 meses de DESPESAS; renda estável fica no piso."},{"q":"A modalidade de crédito com o custo mais elevado, segundo o material, é:","alts":["O crédito pessoal sem garantia.","O rotativo do cartão e o cheque especial.","O financiamento de veículos com alienação.","O crédito consignado em folha de pagamento."],"c":1,"exp":"Ambos sem garantia e de custo altíssimo. São os primeiros alvos de uma troca de dívida."},{"q":"A ordem correta das etapas do planejamento financeiro é:","alts":["Coletar, estabelecer, analisar, implementar, desenvolver e rever.","Estabelecer, coletar, analisar, desenvolver, implementar e rever.","Estabelecer, analisar, coletar, desenvolver, rever e implementar.","Coletar, analisar, desenvolver, estabelecer, implementar e rever."],"c":1,"exp":"E-C-A-D-I-R. Coleta antes de análise, análise antes de recomendação."},{"q":"Um carro usado pela família no dia a dia é classificado no balanço como:","alts":["Bem de não uso, por ter valor de revenda.","Bem de uso, pois gera despesa e não receita.","Passivo, enquanto houver financiamento.","Patrimônio líquido, se estiver quitado."],"c":1,"exp":"Gera manutenção e desgaste, sem receita: bem de uso. O saldo do financiamento é que seria passivo."},{"q":"Rendimentos de um CDB, na declaração de ajuste anual, são classificados como:","alts":["Isentos.","De tributação exclusiva/definitiva.","Tributáveis, com ajuste anual.","Rendimentos não declaráveis."],"c":1,"exp":"Tributação exclusiva na fonte: paga imposto, mas não entra no ajuste."},{"q":"Na pirâmide de alocação, o nível imediatamente acima da reserva de emergência é:","alts":["Renda variável.","Proteção contra a inflação.","Investimentos alternativos.","Previdência complementar."],"c":1,"exp":"Reserva, proteção contra inflação, renda variável e alternativos, nessa ordem."},{"q":"A capacidade de poupança de uma família cai a zero. A primeira medida técnica é:","alts":["Resgatar a reserva de emergência.","Cortar despesas facultativas.","Contratar cheque especial.","Suspender o pagamento das fixas obrigatórias."],"c":1,"exp":"Facultativas são o alvo natural do ajuste, antes de tocar em reserva ou assumir dívida cara."},{"q":"O modelo de declaração que permite deduzir despesas com saúde, educação e previdência é o:","alts":["Simplificado, com desconto de 20%.","Completo, com comprovação das despesas.","Simplificado, para rendimentos isentos.","Completo, apenas para investidor qualificado."],"c":1,"exp":"Completo. O simplificado troca todas as deduções pelo desconto padrão de 20% com teto."},{"q":"Um cliente de 62 anos aposentado precisa transformar patrimônio em renda mensal. Ele está na fase de:","alts":["Preservação.","Distribuição.","Crescimento.","Acumulação."],"c":1,"exp":"60 anos ou mais: distribuição, com o planejamento sucessório ganhando peso."}]},{"id":"3.2","titulo":"Suitability e Perfil do Investidor","subtitulo":"A adequação do produto à pessoa","niveis":[{"id":"3.2.1","titulo":"Suitability: os 3 pilares","resumo":["Suitability é o processo de verificar se o produto é ADEQUADO ao cliente, feito pela API (Análise do Perfil do Investidor). Regulado pela Resolução CVM 30.","TRÊS PILARES que devem ser verificados:","1. SITUAÇÃO FINANCEIRA: valor das receitas regulares, valor e composição do patrimônio, necessidade futura de recursos.","2. OBJETIVOS: horizonte de investimento, preferência declarada quanto a risco, finalidade do investimento.","3. CONHECIMENTO: produtos com que já tem familiaridade; natureza, volume, frequência e período das operações já realizadas; formação acadêmica e experiência profissional.","REGRA DE OURO: é vedado RECOMENDAR sem perfil atualizado. Mas a aplicação por ORDEM do próprio investidor, sem recomendação, PODE ser feita."],"macete":"S-O-C: Situação financeira, Objetivos, Conhecimento. Recomendar exige perfil; executar ordem do cliente, não.","pegadinha":"A banca diz que sem perfil atualizado nada pode ser feito. Errado: a proibição alcança a RECOMENDAÇÃO, não a ordem espontânea do cliente.","questoes":[{"q":"Um cliente com perfil desatualizado liga e ordena a compra de um ativo, sem pedir recomendação. A instituição:","alts":["Deve recusar, pois o perfil está vencido.","Pode executar a ordem, pois a vedação alcança a recomendação.","Deve executar apenas metade da ordem.","Deve atualizar o perfil antes de qualquer execução."],"c":1,"exp":"Vedada é a recomendação sem perfil. A aplicação por ordem do investidor pode ser realizada."},{"q":"Verificar a formação acadêmica e a experiência profissional do cliente atende a qual pilar?","alts":["Situação financeira.","Objetivos de investimento.","Conhecimento.","Tolerância a risco."],"c":2,"exp":"Formação e experiência integram a aferição de conhecimento, junto com o histórico de operações."},{"q":"Um cliente milionário de perfil agressivo tem todo o patrimônio em imóveis. A recomendação adequada é:","alts":["Produtos agressivos, pois o perfil é compatível.","Investimento conservador, pela falta de liquidez.","Recusar o atendimento por incoerência de perfil.","Renda variável de longo prazo, pelo horizonte."],"c":1,"exp":"A situação financeira olha o valor E a composição do patrimônio. Sem liquidez, uma despesa extra o pegaria descoberto."},{"q":"REDENÇÃO: a norma que regulamenta o processo de suitability é a:","alts":["Resolução CVM 30.","Resolução CVM 175.","Lei 9.613/98.","Lei 13.709/2018."],"c":0,"exp":"Resolução CVM 30. A 175 trata de fundos, a 9.613 de lavagem de dinheiro e a 13.709 é a LGPD."}]},{"id":"3.2.2","titulo":"Perfis de Risco e Adequação","resumo":["PERFIL 1, conservador: baixa tolerância a risco, baixo conhecimento, prioriza LIQUIDEZ.","PERFIL 2, moderado: média tolerância, busca preservação de capital no longo prazo, aceita destinar PARTE dos recursos a maior risco.","PERFIL 3, arrojado (agressivo, sofisticado): aceita potenciais PERDAS em busca de maiores retornos.","Três atributos do produto a comparar com o perfil: LIQUIDEZ (tempo até o resgate), PRAZO DE VENCIMENTO (comprometimento dos recursos) e VOLATILIDADE (amplitude das oscilações).","Encaixes típicos: conservador em renda fixa pós-fixada e fundos de curto prazo; moderado em multimercados; arrojado em ações."],"macete":"Perfil 1 quer liquidez, perfil 2 aceita um pedaço de risco, perfil 3 aceita perder para ganhar mais.","pegadinha":"A banca descreve o moderado como quem aceita perdas. Quem aceita perdas é o arrojado; o moderado destina apenas PARTE dos recursos a maior risco.","questoes":[{"q":"O cliente que aceita potenciais perdas em busca de maiores retornos é classificado como perfil:","alts":["1, conservador.","2, moderado.","3, arrojado.","Profissional, por definição legal."],"c":2,"exp":"Aceitar perda é a marca do arrojado. Perfil de risco não se confunde com investidor profissional, que é classificação patrimonial."},{"q":"Os três atributos do produto que devem ser confrontados com o perfil são:","alts":["Rentabilidade, tributação e emissor.","Liquidez, prazo de vencimento e volatilidade.","Garantia, rating e prazo.","Taxa de administração, performance e custódia."],"c":1,"exp":"Liquidez, prazo e volatilidade são os atributos citados no material."},{"q":"Um cliente de perfil moderado busca diversificação com risco controlado. O produto típico é:","alts":["Ações de pequenas empresas.","Fundos multimercados.","Poupança exclusivamente.","Derivativos alavancados."],"c":1,"exp":"Multimercados diversificam estratégias de crédito e renda variável em níveis controlados."},{"q":"REDENÇÃO: a característica central do perfil 1 é:","alts":["Alta tolerância a risco e foco em retorno.","Baixa tolerância a risco e prioridade à liquidez.","Média tolerância a risco com preservação de longo prazo.","Patrimônio superior a R$ 1 milhão."],"c":1,"exp":"Conservador: baixa tolerância, baixo conhecimento e preferência por produtos líquidos."}]},{"id":"3.2.3","titulo":"Classificação: Qualificado, Profissional e Não Residente","resumo":["Perfil de RISCO (1, 2, 3) é uma coisa; CLASSIFICAÇÃO do investidor pela CVM 30 é outra. Não confunda.","QUALIFICADO: mais de R$ 1.000.000 em investimentos financeiros, com atestado por escrito (Anexo B). Também: investidores profissionais, aprovados em exames de qualificação técnica ou certificações aceitas pela CVM (quanto aos recursos próprios) e clubes geridos por cotistas qualificados.","PROFISSIONAL: mais de R$ 10.000.000 com atestado (Anexo A); instituições financeiras; seguradoras e capitalização; entidades de previdência; fundos de investimento; e investidores NÃO RESIDENTES.","Todo PROFISSIONAL é também QUALIFICADO. O contrário não vale.","NÃO RESIDENTE: antes de operar precisa de representante no país, registro na CVM e custodiante autorizado pela CVM."],"macete":"1 milhão = Qualificado (Anexo B). 10 milhões = Profissional (Anexo A). O A é do maior. Profissional está dentro de qualificado.","pegadinha":"A banca cruza perfil de risco com classificação: um investidor profissional pode perfeitamente ter perfil conservador. Patrimônio não define tolerância a risco.","questoes":[{"q":"Um investidor com R$ 3 milhões aplicados e atestado por escrito é classificado como:","alts":["Profissional, por superar R$ 1 milhão.","Qualificado, mas não profissional.","Comum, pois não atingiu R$ 10 milhões.","Não residente, se aplicar no exterior."],"c":1,"exp":"Acima de R$ 1 milhão é qualificado; profissional exige mais de R$ 10 milhões."},{"q":"Um fundo de pensão e um investidor não residente abrem conta na corretora. Pela regra da CVM, eles são classificados como:","alts":["Ambos investidores profissionais, por categoria.","Ambos qualificados, mas nenhum é profissional.","Profissional e qualificado, respectivamente.","Depende do valor que cada um comprovar por atestado."],"c":0,"exp":"Entidades de previdência e não residentes são profissionais por enquadramento, sem depender de atestado patrimonial."},{"q":"Um investidor profissional preenche a API e obtém perfil conservador. Isso significa que:","alts":["Há erro no cadastro, pois profissional é sempre arrojado.","As classificações são independentes e ambas valem.","Ele perde a condição de profissional.","A API não se aplica a investidores profissionais."],"c":1,"exp":"Classificação da CVM 30 mede patrimônio e conhecimento; a API mede tolerância a risco. Um profissional pode ser conservador."},{"q":"REDENÇÃO: os anexos da Resolução CVM 30 aplicáveis ao profissional e ao qualificado são:","alts":["Anexo A e Anexo B.","Anexo B e Anexo A.","Ambos o Anexo A.","Ambos o Anexo B."],"c":0,"exp":"Profissional assina o Anexo A; qualificado, o Anexo B."}]}],"boss":[{"q":"Os três pilares verificados no processo de suitability são:","alts":["Renda, idade e profissão do cliente.","Situação financeira, objetivos e conhecimento.","Liquidez, prazo de vencimento e volatilidade.","Patrimônio, tributação e garantias formais do produto."],"c":1,"exp":"Liquidez, prazo e volatilidade são atributos do PRODUTO, não pilares do cliente."},{"q":"É vedado à instituição, quando o perfil do cliente está desatualizado:","alts":["Executar ordem espontânea do cliente.","Recomendar produtos de investimento.","Manter a conta do cliente ativa.","Enviar extratos e informes."],"c":1,"exp":"A vedação alcança a recomendação. A ordem do investidor pode ser executada."},{"q":"Um cliente aceita destinar parte dos recursos a maior risco, mas prioriza preservar capital no longo prazo. Seu perfil é:","alts":["1, conservador.","2, moderado.","3, arrojado.","Profissional."],"c":1,"exp":"Descrição literal do perfil moderado."},{"q":"Um investidor não residente, antes de operar no Brasil, deve:","alts":["Apenas registrar-se na Receita Federal.","Ter representante, registro na CVM e custodiante.","Obter autorização do Banco Central e da SUSEP.","Contratar apenas um custodiante no exterior."],"c":1,"exp":"Os três requisitos prévios, cumulativos."},{"q":"A norma que regula o suitability e a classificação de investidores é a:","alts":["Resolução CVM 175.","Resolução CVM 30.","Lei 6.385/76.","Circular BACEN 3.978."],"c":1,"exp":"CVM 30. A 175 trata de fundos e a 6.385 dos crimes contra o mercado de capitais."},{"q":"Um cliente conservador solicita, por conta própria, aplicação em ações. A instituição:","alts":["Deve recusar, por incompatibilidade de perfil.","Pode executar, pois não houve recomendação.","Deve reclassificar o perfil antes de executar.","Deve limitar a aplicação a 10% do patrimônio."],"c":1,"exp":"Ordem espontânea, sem recomendação, pode ser executada."},{"q":"O patrimônio mínimo e o anexo do investidor QUALIFICADO pessoa natural são:","alts":["R$ 1 milhão e Anexo B.","R$ 1 milhão e Anexo A.","R$ 10 milhões e Anexo B.","R$ 10 milhões e Anexo A."],"c":0,"exp":"Qualificado: mais de R$ 1 milhão, Anexo B."},{"q":"Avaliar a necessidade futura de recursos declarada pelo cliente integra qual pilar?","alts":["Conhecimento.","Situação financeira.","Objetivos.","Tolerância a risco."],"c":1,"exp":"Situação financeira reúne receitas regulares, patrimônio e necessidade futura de recursos."}]},{"id":"3.3","titulo":"Ética, Conduta e Código de Distribuição","subtitulo":"Os nove princípios e as regras do jogo","niveis":[{"id":"3.3.1","titulo":"Os 9 Princípios Éticos da ANBIMA","resumo":["1. COMPORTAMENTO ÉTICO: preservar a reputação, recusar ganho ilícito e vantagem pessoal indevida.","2. BOA FÉ E TRANSPARÊNCIA: informar taxas, riscos e tributação sem omissões nem promessas.","3. RESPONSABILIDADE E VIGILÂNCIA: reconhecer e corrigir erros, evitar negligência.","4. CONFORMIDADE COM AS REGRAS: cumprir normas, regulamentação e códigos ANBIMA, e ter a certificação exigida.","5. CUMPRIMENTO DAS OBRIGAÇÕES: agir com o zelo que uma pessoa prudente dedicaria aos próprios negócios.","6. ATUALIZAÇÃO TÉCNICA: manter-se atualizado.","7. HONESTIDADE E EQUIDADE: tratar todos com o mesmo padrão.","8. INDEPENDÊNCIA E IMPARCIALIDADE: transparência diante de conflito de interesses.","9. SIGILO: confidencialidade sobre patrimônio, estratégia e dados pessoais, inclusive internamente.","DEVERES do certificado: adequação (suitability), clareza, concorrência leal e transparência de riscos."],"macete":"Nove princípios. Grave os extremos: começa em Comportamento Ético e termina em Sigilo. E são NOVE, não sete nem dez.","pegadinha":"A banca troca o número de princípios ou inventa um (como 'maximização do retorno'). Não existe princípio ético de buscar a maior rentabilidade.","questoes":[{"q":"Um profissional recebe convite de viagem de uma gestora cujos fundos distribui. O princípio diretamente envolvido é:","alts":["Atualização técnica.","Independência e imparcialidade.","Cumprimento das obrigações.","Sigilo de informações."],"c":1,"exp":"Benefício de terceiro ameaça a isenção da recomendação: independência e imparcialidade."},{"q":"Agir com o mesmo cuidado que uma pessoa prudente dedicaria aos próprios negócios corresponde ao princípio de:","alts":["Comportamento ético.","Cumprimento das obrigações.","Responsabilidade e vigilância.","Honestidade e equidade."],"c":1,"exp":"Definição literal do princípio de cumprimento das obrigações."},{"q":"O número de princípios éticos previstos no Código de Conduta da ANBIMA é:","alts":["Cinco.","Sete.","Nove.","Doze."],"c":2,"exp":"São nove, do comportamento ético ao sigilo de informações confidenciais."},{"q":"REDENÇÃO: NÃO é um dever do profissional certificado:","alts":["Garantir a adequação do produto ao perfil.","Assegurar clareza e plena compreensão das informações.","Buscar a maior rentabilidade possível ao cliente.","Informar os riscos dos produtos oferecidos."],"c":2,"exp":"Rentabilidade não é dever nem promessa. Os deveres são adequação, clareza, concorrência leal e transparência de riscos."}]},{"id":"3.3.2","titulo":"Regras de Conduta para Candidatos","resumo":["Valem para quem vai FAZER a prova. Condutas proibidas:","Oferecer, solicitar ou aceitar presente, benefício ou compensação para obter vantagem no processo.","Apropriar-se ou compartilhar o conteúdo dos exames: isso é FRAUDE ao processo de certificação.","Usar qualquer equipamento eletrônico de comunicação durante o exame.","Assumir falsa identidade ou atribuí-la a outra pessoa.","Apresentar-se como certificado ANTES de obter a certificação, ou usar certificação VENCIDA.","Desrespeitar os demais candidatos.","A ANBIMA usa câmeras com inteligência artificial que analisam padrões de comportamento e detectam contato não autorizado."],"macete":"Duas armadilhas fáceis de esquecer: usar certificação VENCIDA e se dizer certificado ANTES da aprovação. Ambas são infração.","pegadinha":"A banca foca só em cola e identidade falsa. Compartilhar o conteúdo da prova depois de fazê-la também é fraude, e anunciar-se como certificado antes da aprovação também.","questoes":[{"q":"Um profissional com certificação vencida continua se apresentando como certificado. Isso é:","alts":["Permitido, se estiver em processo de renovação.","Infração às regras de conduta para candidatos.","Permitido por até 90 dias após o vencimento.","Irrelevante, pois a certificação foi obtida."],"c":1,"exp":"Usar certificação vencida está expressamente no rol de condutas proibidas."},{"q":"Compartilhar em um grupo as questões que caíram no exame configura:","alts":["Conduta aceitável, por ser após a prova.","Fraude ao processo de certificação.","Infração apenas se houver pagamento envolvido.","Conduta permitida entre candidatos aprovados."],"c":1,"exp":"Apropriar-se ou compartilhar o conteúdo dos exames é fraude, conforme o edital."},{"q":"REDENÇÃO: o objetivo declarado das regras gerais de conduta para candidatos é:","alts":["Reduzir o número de aprovados no exame.","Garantir integridade e credibilidade do processo.","Padronizar o conteúdo cobrado nas provas.","Definir o valor das taxas de inscrição."],"c":1,"exp":"Integridade, transparência e credibilidade, prevenindo fraude, cola e uso indevido de material."}]},{"id":"3.3.3","titulo":"Código de Distribuição: Publicidade","resumo":["Três princípios: CLAREZA (informar riscos, custos e benefícios sem ambiguidade), VERACIDADE (refletir fielmente o regulamento) e EQUILÍBRIO (mostrar o positivo E o negativo).","É vedado: qualificações injustificadas, superlativos não comprovados, opiniões sem base técnica, promessa de rentabilidade, garantia de resultado futuro ou isenção de risco.","Performance passada deve privilegiar o LONGO prazo sobre o curto, sem trocar os períodos de análise para esconder fases ruins.","COMPARAÇÃO só entre produtos de MESMA NATUREZA, com períodos idênticos, risco compatível e métricas uniformes. Comparar multimercado com renda fixa é vedado.","FGC: é vedado apresentar a cobertura como elemento de DESTAQUE para pautar a decisão. O caso Banco Master, em 2025, ilustra o risco dessa prática.","Projeções e simulações exigem detalhar todos os critérios, incluindo valores e taxas de comissões."],"macete":"C-V-E: Clareza, Veracidade, Equilíbrio. E o FGC nunca vira selo de segurança na peça publicitária.","pegadinha":"A banca usa o FGC como argumento central de venda. Proibido destacá-lo: ele não elimina risco de crédito, de liquidez nem de mercado.","questoes":[{"q":"Uma peça publicitária destaca em letras grandes 'protegido pelo FGC' como principal argumento. Isso:","alts":["É permitido, pois a informação é verdadeira.","É vedado: o FGC não pode ser elemento de destaque na decisão.","É permitido se o valor estiver dentro de R$ 250 mil.","É permitido apenas para investidor qualificado."],"c":1,"exp":"O código veda apresentar a cobertura de fundos garantidores como destaque. O caso Banco Master mostra o porquê."},{"q":"Comparar a rentabilidade de um fundo multimercado com a de um fundo de renda fixa tradicional é:","alts":["Permitido, se ambos forem da mesma gestora.","Vedado: a comparação exige produtos de mesma natureza.","Permitido, desde que o período seja de 12 meses.","Permitido se o multimercado tiver rendido mais."],"c":1,"exp":"Naturezas diferentes geram conclusão equivocada. Exige-se período idêntico, risco compatível e métrica uniforme."},{"q":"Sobre a divulgação de performance passada, o código determina privilegiar:","alts":["Os períodos de maior rentabilidade.","As informações de longo prazo sobre as de curto prazo.","Os últimos 30 dias, por serem mais atuais.","A rentabilidade bruta, antes de taxas."],"c":1,"exp":"Longo prazo tem prioridade, e é vedado alterar os períodos de análise para realçar fases boas."},{"q":"REDENÇÃO: são vedados na publicidade de produtos de investimento:","alts":["Dados de fácil comparabilidade e linguagem simples.","Superlativos não comprovados e promessa de rentabilidade.","Informações sobre taxas e tributação aplicável.","Detalhamento dos critérios de simulação."],"c":1,"exp":"Qualificação injustificada, superlativo, opinião sem base técnica e promessa de resultado são proibidos."}]},{"id":"3.3.4","titulo":"Transparência na Remuneração","resumo":["REMUNERAÇÃO DIRETA: comissão paga explicitamente pelo emissor ao distribuidor.","REMUNERAÇÃO INDIRETA: benefício embutido, como SPREAD (diferença entre taxa de compra e de venda de um ativo, comum na renda fixa) e REBATE (parte da taxa de administração devolvida pelo gestor ao distribuidor).","INFORMAÇÕES QUALITATIVAS: área exclusiva no site com todas as formas de remuneração e potenciais conflitos.","INFORMAÇÕES QUANTITATIVAS: na aplicação ou resgate, informar valores ou percentuais; não sendo possível, apresentar estimativa de mercado e o link da política completa.","EXTRATO TRIMESTRAL: enviado ao fim de cada trimestre com a remuneração recebida pelo distribuidor nos produtos do cliente.","DUAS DISPENSAS do extrato: quando não houve remuneração no período, e para o INVESTIDOR PROFISSIONAL."],"macete":"Direta é a comissão declarada; indireta é spread e rebate. Extrato é TRIMESTRAL e o profissional está dispensado.","pegadinha":"A banca torna o extrato mensal, ou dispensa o investidor QUALIFICADO. É trimestral, e a dispensa é do PROFISSIONAL.","questoes":[{"q":"A devolução de parte da taxa de administração pelo gestor ao canal de distribuição é chamada de:","alts":["Spread.","Rebate.","Taxa de ingresso.","Comissão direta."],"c":1,"exp":"Rebate. Spread é a diferença entre taxa de compra e de venda, típica da renda fixa."},{"q":"O extrato de remuneração do distribuidor é enviado com qual periodicidade e a quem se dispensa?","alts":["Mensal, dispensado ao investidor qualificado.","Trimestral, dispensado ao investidor profissional.","Semestral, dispensado ao investidor comum.","Anual, sem hipótese de dispensa."],"c":1,"exp":"Trimestral. Dispensa-se quando não houve remuneração no período e para o investidor profissional."},{"q":"As informações qualitativas sobre remuneração devem estar disponíveis:","alts":["No extrato mensal enviado ao cliente.","Em área exclusiva no site do distribuidor.","No regulamento de cada produto.","Apenas mediante solicitação formal."],"c":1,"exp":"Área exclusiva do site, com todas as formas de remuneração e potenciais conflitos de interesse."},{"q":"REDENÇÃO: a diferença entre a taxa de compra e a de venda de um ativo, que gera ganho ao distribuidor, é o:","alts":["Rebate.","Spread.","Extrato trimestral.","Custo efetivo total."],"c":1,"exp":"Spread, mecanismo comum nas operações de renda fixa."}]},{"id":"3.3.5","titulo":"Segmento Private","resumo":["Patrimônio financeiro MÍNIMO de R$ 5 MILHÕES, individual ou coletivamente. A instituição pode exigir mais, nunca menos.","EQUIPE obrigatória: 75% dos gerentes de relacionamento com CFP; um estrategista de investimentos com CFP, CGA, CGE ou CFA; um analista de risco de mercado e crédito; e um economista.","SERVIÇOS: portfólios exclusivos, produtos offshore, planejamento fiscal e sucessório (holding patrimonial, trust, doações estruturadas), previdência personalizada e seguros.","Diferencial: visão holística e CONSOLIDAÇÃO PATRIMONIAL, reunindo conta corrente, aplicações, imóveis e empresas familiares, mesmo em outras instituições.","Antes de iniciar o atendimento private, o distribuidor deve COMUNICAR a ANBIMA e comprovar que atende às exigências."],"macete":"5 milhões de patrimônio, 75% dos gerentes com CFP. Guarde esses dois números e a comunicação prévia à ANBIMA.","pegadinha":"A banca troca o percentual de gerentes certificados ou o patrimônio mínimo. E costuma esquecer a comunicação prévia à ANBIMA, que é obrigatória.","questoes":[{"q":"O patrimônio financeiro mínimo para o segmento private, segundo a ANBIMA, é de:","alts":["R$ 1 milhão.","R$ 3 milhões.","R$ 5 milhões.","R$ 10 milhões."],"c":2,"exp":"R$ 5 milhões, individual ou coletivamente. A instituição pode adotar critério mais rigoroso."},{"q":"A exigência de certificação para os gerentes de relacionamento no private é de:","alts":["50% com CFP.","75% com CFP.","100% com CFP.","75% com CGA ou CFA."],"c":1,"exp":"75% dos gerentes com CFP. O estrategista é que pode ter CFP, CGA, CGE ou CFA."},{"q":"Antes de iniciar o atendimento no segmento private, o distribuidor deve:","alts":["Obter autorização prévia da CVM.","Comunicar a ANBIMA e comprovar o atendimento às exigências.","Registrar cada cliente junto ao Banco Central.","Constituir uma holding patrimonial própria."],"c":1,"exp":"Comunicação à ANBIMA com comprovação dos requisitos do código de distribuição."},{"q":"REDENÇÃO: integram obrigatoriamente a equipe do segmento private:","alts":["Um analista de risco e um economista.","Um auditor independente e um custodiante.","Um atuário e um contador.","Um advogado tributarista e um gestor."],"c":0,"exp":"Analista de risco de mercado e crédito, economista, estrategista certificado e 75% dos gerentes com CFP."}]},{"id":"3.3.6","titulo":"Técnicas de Atendimento","resumo":["ESCUTA ATIVA: ouvir de forma plena o verbal e o NÃO verbal, sem interromper, confirmando o entendimento por paráfrases. Capta a necessidade IMPLÍCITA, aquela que o cliente não verbalizou.","PERSONALIZAÇÃO: adaptar linguagem, ritmo e formato ao perfil e ao momento de vida. Registrar hobbies e estrutura familiar ajuda a criar analogias próximas do universo do cliente.","PROATIVIDADE: antecipar necessidades e apresentar alternativas antes que o problema apareça.","EDUCAÇÃO CONTINUADA: a certificação comprova conhecimento, mas não encerra a atualização.","ALINHAMENTO DE EXPECTATIVAS: esclarecer o que é factível em retorno, prazo, liquidez e risco, REGISTRANDO por escrito as premissas."],"macete":"Escuta ativa capta o que não foi dito. Alinhamento de expectativa se prova por escrito.","pegadinha":"A banca reduz a escuta ativa a 'não interromper'. Ela vai além: inclui linguagem não verbal, paráfrase de confirmação e captura da necessidade implícita.","questoes":[{"q":"Um cliente comenta de passagem a preocupação com a faculdade dos filhos e o desejo de viajar ao exterior. Perceber aí uma oportunidade de seguro de vida e conta internacional é exercício de:","alts":["Proatividade na oferta de produtos.","Escuta ativa, captando o que ficou implícito.","Personalização do atendimento ao cliente.","Alinhamento de expectativas por escrito."],"c":1,"exp":"O cliente não pediu nada: a necessidade estava implícita na fala. Isso é escuta ativa."},{"q":"Registrar por escrito as premissas de retorno, prazo, liquidez e risco acordadas serve para:","alts":["Cumprir exigência da Receita Federal.","Evitar mal-entendidos e servir de referência.","Substituir a análise de perfil do investidor.","Dispensar o envio de extratos periódicos."],"c":1,"exp":"A documentação previne conflito e reforça o compromisso ético."},{"q":"REDENÇÃO: a personalização do atendimento consiste em:","alts":["Oferecer o maior número possível de produtos.","Adaptar linguagem e ritmo ao perfil do cliente.","Reduzir o tempo médio de cada atendimento.","Padronizar o discurso para todos os clientes."],"c":1,"exp":"Não é variedade de produto, é adequação da forma de se comunicar."}]},{"id":"3.3.7","titulo":"Conflito de Interesse e Riscos da Atividade","resumo":["Conflito de interesse: quando o interesse pessoal, institucional ou comercial se sobrepõe ao do cliente. É INEVITÁVEL que exista; o dever é MITIGAR.","SETE MECANISMOS: políticas e procedimentos claros; treinamento e educação; divulgação obrigatória; SEGREGAÇÃO DE FUNÇÕES; revisão e monitoramento contínuos; comitês de ética e compliance; proibição de atividades específicas; e relatórios de transparência.","Exemplo clássico de atividade vedada: distribuir investimentos num banco e, nas horas vagas, atuar como consultor de valores mobiliários independente.","QUATRO RISCOS DA ATIVIDADE: OPERACIONAL (falha de processo, erro humano, sistema, evento externo), REGULATÓRIO (descumprir norma de regulador ou autorregulador), LEGAL (ação judicial, responsabilidade civil ou penal) e DE IMAGEM (dano à reputação)."],"macete":"Quatro riscos: O-R-L-I. Operacional é erro interno, Regulatório é multa do regulador, Legal é processo judicial, Imagem é a repercussão.","pegadinha":"A banca confunde risco regulatório com legal. Regulatório é descumprir norma do regulador; legal é responder a ação judicial ou responsabilidade civil e penal.","questoes":[{"q":"Uma instabilidade no sistema eletrônico impede o registro de ordens por duas horas. Trata-se de risco:","alts":["Regulatório.","Operacional.","Legal.","De imagem."],"c":1,"exp":"Falha de sistema é risco operacional, ao lado de erro humano, defeito de processo e evento externo."},{"q":"O mecanismo que separa a equipe de gestão de recursos da área de atendimento ao cliente é:","alts":["A divulgação obrigatória.","A segregação de funções.","O comitê de ética.","O relatório de transparência."],"c":1,"exp":"Segregação de funções, a chamada muralha da China, evita influência indevida entre áreas conflitantes."},{"q":"Um vazamento de dados de clientes repercute nas redes sociais e provoca saída de recursos. O risco predominante é:","alts":["Operacional apenas.","De imagem.","Regulatório.","De mercado."],"c":1,"exp":"O dano à reputação é o risco de imagem, que no setor financeiro se converte em evasão de recursos."},{"q":"REDENÇÃO: um profissional distribui investimentos num banco e atua como consultor de valores mobiliários independente nas horas vagas. Isso é exemplo de:","alts":["Educação continuada do profissional.","Atividade vedada por conflito de interesse.","Segregação de funções bem aplicada.","Divulgação obrigatória da remuneração."],"c":1,"exp":"É o exemplo clássico do material de dupla atuação que cria conflito e costuma ser vedada pelas instituições."}]}],"boss":[{"q":"O Código de Conduta Ética da ANBIMA estabelece:","alts":["Sete princípios éticos.","Nove princípios éticos.","Doze princípios éticos.","Cinco princípios e quatro deveres."],"c":1,"exp":"Nove princípios, do comportamento ético ao sigilo."},{"q":"Destacar a cobertura do FGC como principal argumento de venda em peça publicitária é:","alts":["Permitido, se a informação for verdadeira.","Vedado pelo Código de Distribuição.","Permitido para investidores comuns.","Permitido até o limite de R$ 250 mil."],"c":1,"exp":"É vedado apresentar fundos garantidores como elemento de destaque na decisão de investimento."},{"q":"O extrato de remuneração ao cliente é dispensado:","alts":["Ao investidor qualificado e quando houve remuneração alta.","Ao investidor profissional e quando não houve remuneração no período.","A todos os clientes de plataforma aberta.","Quando o produto for isento de imposto de renda."],"c":1,"exp":"As duas hipóteses de dispensa previstas no código."},{"q":"No segmento private, o patrimônio mínimo e o percentual de gerentes com CFP são:","alts":["R$ 5 milhões e 75%.","R$ 10 milhões e 75%.","R$ 5 milhões e 100%.","R$ 1 milhão e 50%."],"c":0,"exp":"R$ 5 milhões de patrimônio financeiro e 75% dos gerentes de relacionamento com CFP."},{"q":"Um erro de digitação de um colaborador causa prejuízo ao cliente. O risco envolvido é:","alts":["Regulatório.","Operacional.","De imagem.","Legal, exclusivamente."],"c":1,"exp":"Erro humano é risco operacional. Pode desdobrar-se em legal e de imagem, mas a origem é operacional."},{"q":"Um profissional recebe um presente de valor elevado de um parceiro comercial. A conduta correta é:","alts":["Aceitar, se não houver contrapartida explícita.","Recusar ou registrar formalmente e reportar ao compliance.","Aceitar e dividir com a equipe.","Aceitar e comunicar apenas ao gerente imediato."],"c":1,"exp":"Benefícios acima de valores razoáveis devem ser recusados ou registrados e reportados ao compliance."},{"q":"Apresentar-se como certificado antes de obter a aprovação no exame é:","alts":["Permitido durante o período de inscrição.","Conduta proibida pelas regras da ANBIMA.","Permitido se já houver curso concluído.","Irrelevante para efeitos de conduta."],"c":1,"exp":"Consta expressamente do rol de condutas proibidas, ao lado do uso de certificação vencida."},{"q":"A comparação entre produtos em material publicitário exige:","alts":["Que os produtos sejam da mesma instituição.","Mesma natureza, períodos idênticos e métricas uniformes.","Que se destaque o produto de melhor desempenho.","Autorização prévia da CVM."],"c":1,"exp":"Naturezas diferentes distorcem a análise e violam o princípio de equidade."},{"q":"A escuta ativa se caracteriza principalmente por:","alts":["Responder rapidamente a todas as perguntas.","Captar o implícito, inclusive no não verbal.","Registrar por escrito as premissas acordadas.","Antecipar problemas antes que eles ocorram."],"c":1,"exp":"As outras descrevem alinhamento de expectativas e proatividade."},{"q":"O princípio ético violado por quem comenta o patrimônio de um cliente com colegas de outra área é:","alts":["Atualização técnica permanente.","Sigilo de informações confidenciais.","Conformidade com as regras vigentes.","Boa fé e transparência nas informações."],"c":1,"exp":"A confidencialidade vale inclusive no ambiente interno da instituição."},{"q":"Spread e rebate são formas de remuneração:","alts":["Direta do distribuidor.","Indireta do distribuidor.","Cobradas diretamente do cliente.","Vedadas pelo Código de Distribuição."],"c":1,"exp":"Direta é a comissão explícita do emissor; indireta engloba spread e rebate."},{"q":"O risco decorrente do descumprimento de norma editada por entidade autorreguladora é o risco:","alts":["Operacional.","Regulatório.","Legal.","De imagem."],"c":1,"exp":"Regulatório abrange normas de reguladores e autorreguladores. Legal é a esfera judicial."}]},{"id":"3.4","titulo":"PLDFT, LGPD e Crimes de Mercado","subtitulo":"Onde o erro vira crime","niveis":[{"id":"3.4.1","titulo":"Lavagem de Dinheiro: base legal e órgãos","resumo":["Lavagem: inserir na economia formal recursos de origem ilícita, ocultando ou dissimulando sua origem.","1988, CONVENÇÃO DE VIENA: origem do combate, voltada ao tráfico de drogas.","LEI 9.613/98: primeira lei brasileira sobre o tema. LEI 12.683/12: atualizou e ampliou a 9.613.","Regulamentação setorial: Circular BACEN 3.978/2020 e Resolução CVM 50.","GAFI: organização INTERGOVERNAMENTAL que define padrões globais.","COAF: é a Unidade de Inteligência Financeira do Brasil. Recebe, examina e identifica ocorrências suspeitas; comunica autoridades; propõe cooperação; REGULA os setores SEM órgão regulador próprio; disciplina e aplica penas administrativas.","Sujeitos à lei, entre outros: bancos, corretoras, bolsas, seguradoras, administradoras de cartão, factoring, imobiliárias, transportadoras de valores, comércio de joias e obras de arte, e empresários de artistas e atletas."],"macete":"1988 Viena, 1998 a lei, 2012 a reforma. GAFI é global, COAF é Brasil. O COAF só regula quem não tem regulador próprio.","pegadinha":"A banca faz o COAF regular todo mundo. Ele regula apenas os setores SEM órgão regulador próprio; bancos são do BC e o mercado de capitais é da CVM.","questoes":[{"q":"O COAF exerce a função de órgão regulador:","alts":["De todas as instituições sujeitas à lei.","Apenas dos setores que não possuem regulador próprio.","Somente das instituições financeiras bancárias.","Exclusivamente das seguradoras e corretoras."],"c":1,"exp":"Bancos têm o BC e o mercado de capitais tem a CVM. O COAF cobre as lacunas."},{"q":"A primeira legislação brasileira voltada à prevenção da lavagem de dinheiro é a:","alts":["Lei 9.613/98.","Lei 12.683/12.","Lei 13.810/2019.","Lei 13.709/2018."],"c":0,"exp":"9.613/98. A 12.683/12 a atualizou; a 13.810/19 trata do CSNU e a 13.709/18 é a LGPD."},{"q":"O marco internacional que originou o combate à lavagem de dinheiro foi:","alts":["A criação do GAFI, em 1989.","A Convenção de Viena, em 1988.","O Acordo de Basileia I, em 1988.","A criação do COAF, em 1998."],"c":1,"exp":"Convenção de Viena de 1988, nascida para unir nações contra o tráfico de drogas."},{"q":"REDENÇÃO: estão sujeitos à Lei de Prevenção à Lavagem de Dinheiro, EXCETO:","alts":["Empresas que comercializam joias e obras de arte.","Empresários de artistas e atletas de grande expressão.","Empresas de transporte de valores.","Escolas e instituições de ensino básico."],"c":3,"exp":"O rol alcança setores com fluxo financeiro relevante ou ativos de difícil rastreio. Ensino básico não está na lista."}]},{"id":"3.4.2","titulo":"As 3 Fases da Lavagem","resumo":["COLOCAÇÃO: introduzir o dinheiro sujo no sistema. Depósitos, compra de ativos, fracionamento de valores, uso de comércios que trabalham com espécie, pagamento de serviços de fachada com nota falsa.","OCULTAÇÃO: dissociar o recurso da origem, criando uma teia de transações. Transferências entre países, conversão em joias, obras de arte ou criptomoedas, empresas offshore.","INTEGRAÇÃO: o dinheiro volta com aparência legítima. Compra de imóveis, veículos de luxo, participação societária. Os rendimentos passam a ser apresentados como receita lícita.","TESTE DECISIVO entre ocultação e integração: imóvel comprado em NOME DE TERCEIRO é ocultação; imóvel comprado no PRÓPRIO NOME, incompatível com a renda declarada, é integração."],"macete":"C-O-I: Coloca, Oculta, Integra. Nome de terceiro esconde (ocultação); nome próprio assume (integração).","pegadinha":"A banca usa a compra de um imóvel e espera que você marque 'integração' automaticamente. Olhe em nome de quem: terceiro é ocultação.","questoes":[{"q":"Um criminoso adquire três apartamentos registrados em nome de familiares. A fase caracterizada é:","alts":["Colocação, pela entrada de recursos.","Ocultação, pois o bem está em nome de terceiro.","Integração, pela aquisição de patrimônio.","Não há fase caracterizada."],"c":1,"exp":"Nome de terceiro serve para dissociar o recurso da origem: ocultação."},{"q":"O fracionamento de depósitos em valores menores para não chamar atenção ocorre na fase de:","alts":["Colocação.","Ocultação.","Integração.","Consolidação."],"c":0,"exp":"Colocação é a entrada do dinheiro no sistema, e o fracionamento é sua técnica mais típica."},{"q":"A conversão de recursos em criptomoedas e o uso de empresas offshore caracterizam:","alts":["Colocação.","Ocultação.","Integração.","Crime antecedente."],"c":1,"exp":"São ativos e estruturas de difícil rastreio, usados para criar a teia que dificulta o rastreamento."},{"q":"REDENÇÃO: um empresário compra em seu próprio nome uma mansão incompatível com sua renda declarada. Trata-se de:","alts":["Colocação.","Ocultação.","Integração.","Prática não equitativa."],"c":2,"exp":"Nome próprio e aparência de legitimidade: integração. A incompatibilidade patrimonial é o sinal de alerta."}]},{"id":"3.4.3","titulo":"Processos de PLDFT e Registros","resumo":["AVALIAÇÃO INTERNA DE RISCO (ABR): primeiro passo. Considera fatores geográficos, perfis de clientes, produtos e canais. Quanto maior o risco, mais rigoroso o controle.","KYC, conheça seu cliente: coletar e verificar dados, capacidade econômica e origem dos recursos. PF: endereço, documento, comprovante de renda. PJ: estrutura societária.","CONHEÇA SEU PARCEIRO: estender a análise a fornecedores, parceiros e colaboradores.","PRAZO DE GUARDA, 10 ANOS nos dois casos, mas a contagem muda: CLIENTES conta do 1º dia do ANO SEGUINTE ao encerramento; parceiros, colaboradores e fornecedores contam do próprio encerramento.","ESPÉCIE, acima de R$ 2.000: CPF do PORTADOR e origem/destino. Acima de R$ 50.000: CPF do portador E do PROPRIETÁRIO, mais origem/destino.","SAQUE igual ou superior a R$ 50.000: provisionamento com no mínimo 3 DIAS ÚTEIS de antecedência.","Operação SUSPEITA de QUALQUER valor: comunicar ao COAF.","LEI 13.810/2019, CSNU: bloqueio de bens SEM dar ciência ao cliente, comunicando de imediato BC, COAF e Ministério da Justiça.","RELATÓRIO DE EFETIVIDADE: consolida e avalia anualmente as ações de PLDFT."],"macete":"2 mil pede o portador; 50 mil pede portador e proprietário. Saque de 50 mil exige 3 dias úteis. Suspeita de qualquer valor vai ao COAF.","pegadinha":"A banca coloca um piso de valor para comunicar ao COAF. Não existe: operação suspeita de QUALQUER valor deve ser comunicada.","questoes":[{"q":"Um cliente deposita R$ 3.000 em espécie. A instituição deve coletar:","alts":["Apenas o CPF do proprietário dos recursos.","O CPF do portador e a origem e o destino dos recursos.","O CPF do portador e do proprietário e a origem dos recursos.","Nenhum dado adicional, por estar abaixo de R$ 50.000."],"c":1,"exp":"Acima de R$ 2.000 pede CPF do portador e origem/destino. O CPF do proprietário só entra acima de R$ 50.000."},{"q":"Um cliente quer sacar R$ 60.000 em espécie. A instituição deve exigir provisionamento com antecedência mínima de:","alts":["1 dia útil.","3 dias úteis.","5 dias úteis.","10 dias úteis."],"c":1,"exp":"Saques iguais ou superiores a R$ 50.000 exigem solicitação com no mínimo 3 dias úteis de antecedência."},{"q":"Uma operação de R$ 800 apresenta fortes indícios de irregularidade. A instituição deve:","alts":["Arquivar, pois está abaixo de R$ 2.000.","Comunicar ao COAF: suspeita não tem piso.","Comunicar apenas se houver reincidência do cliente.","Comunicar somente ao Banco Central."],"c":1,"exp":"Não há piso de valor para a comunicação de operação suspeita."},{"q":"REDENÇÃO: recebido pedido de bloqueio de bens do Conselho de Segurança da ONU, a instituição deve:","alts":["Notificar o cliente e aguardar manifestação.","Bloquear sem ciência e comunicar três órgãos.","Solicitar autorização judicial antes do bloqueio.","Bloquear e comunicar apenas à CVM."],"c":1,"exp":"Lei 13.810/2019: bloqueio imediato, sem ciência ao cliente, com comunicação aos três órgãos."}]},{"id":"3.4.4","titulo":"Sanções em PLDFT","resumo":["ADMINISTRATIVAS, para a instituição que descumpre as normas de prevenção:","Multa do DOBRO do lucro obtido ou presumido, limitada a R$ 20 MILHÕES.","Inabilitação temporária de até 10 ANOS para o cargo de administrador.","Cassação ou suspensão da autorização para funcionar.","CRIMINAIS, para quem pratica a lavagem: RECLUSÃO DE 3 A 10 ANOS mais multa.","Pena AUMENTADA de 1 a 2/3 se houver reiteração, organização criminosa ou uso de ativos virtuais.","Pena REDUZIDA de 1 a 2/3, ou convertida em regime semiaberto, se houver colaboração com as investigações.","A multa CRIMINAL não tem teto legal: o juiz fixa conforme a gravidade. O teto de R$ 20 milhões é só da esfera administrativa.","CRIME ANTECEDENTE: a lavagem pressupõe um crime de origem, mas a condenação por lavagem INDEPENDE de condenação prévia pelo delito-base."],"macete":"Administrativa: dobro do lucro, teto de 20 milhões, inabilitação de 10 anos. Criminal: 3 a 10 anos, multa sem teto.","pegadinha":"A banca aplica o teto de R$ 20 milhões à multa criminal. Aquele teto é administrativo; a multa criminal é fixada livremente pelo juiz.","questoes":[{"q":"A pena de reclusão prevista para o crime de lavagem de dinheiro é de:","alts":["1 a 5 anos e multa.","3 a 10 anos e multa.","1 a 8 anos e multa.","6 a 24 meses e multa."],"c":1,"exp":"3 a 10 anos. As penas de 1 a 8 e de 1 a 5 anos são dos crimes contra o mercado de capitais."},{"q":"O teto da multa administrativa em PLDFT é de:","alts":["R$ 20 milhões.","R$ 50 milhões.","O dobro do lucro, sem teto.","Três vezes a vantagem obtida."],"c":0,"exp":"Dobro do lucro obtido ou presumido, limitado a R$ 20 milhões. Os R$ 50 milhões são o teto da LGPD e das práticas não equitativas."},{"q":"A utilização de ativos virtuais na prática da lavagem de dinheiro:","alts":["Reduz a pena em até 2/3.","Aumenta a pena de 1 a 2/3.","Não altera a dosimetria da pena.","Converte a pena em regime semiaberto."],"c":1,"exp":"Causa de aumento, ao lado da reiteração e da organização criminosa. A redução vem da colaboração."},{"q":"REDENÇÃO: sobre a relação com o crime antecedente, é CORRETO afirmar:","alts":["A condenação por lavagem exige condenação prévia pelo delito-base.","A condenação por lavagem independe de condenação prévia pelo crime antecedente.","Não é necessário haver crime antecedente.","O crime antecedente absorve o de lavagem."],"c":1,"exp":"Basta a comprovação material da origem ilícita dos valores."}]},{"id":"3.4.5","titulo":"LGPD e Sigilo Bancário","resumo":["LGPD é a Lei 13.709/2018. Aplica-se a toda empresa que coleta, trata ou armazena dados de clientes.","DEZ PRINCÍPIOS: finalidade, adequação, necessidade, livre acesso, qualidade dos dados, transparência, segurança, prevenção, não discriminação, e responsabilização e prestação de contas.","PENALIDADE: multa de até 2% do faturamento, limitada a R$ 50 MILHÕES POR INFRAÇÃO.","SIGILO BANCÁRIO: Lei Complementar 105/2001. Restringe a divulgação de saldos e movimentações.","Violar o sigilo bancário é CRIME: reclusão de 1 A 4 ANOS, mais multa."],"macete":"LGPD: 2% do faturamento com teto de 50 milhões. Sigilo bancário: LC 105/2001, reclusão de 1 a 4 anos.","pegadinha":"A banca troca o teto da LGPD (R$ 50 milhões) com o das sanções de PLDFT (R$ 20 milhões). E cuidado: a multa da LGPD é por INFRAÇÃO.","questoes":[{"q":"A penalidade máxima prevista na LGPD é de:","alts":["2% do faturamento, limitada a R$ 20 milhões.","2% do faturamento, limitada a R$ 50 milhões por infração.","5% do faturamento, sem limite de valor.","O dobro do lucro obtido com o tratamento."],"c":1,"exp":"2% do faturamento com teto de R$ 50 milhões por infração. Os R$ 20 milhões são de PLDFT."},{"q":"O princípio da LGPD que limita a coleta ao mínimo indispensável é o da:","alts":["Finalidade.","Adequação.","Necessidade.","Prevenção."],"c":2,"exp":"Necessidade limita a quantidade. Finalidade trata do propósito legítimo e adequação da compatibilidade entre propósito e uso."},{"q":"O sigilo bancário está previsto na:","alts":["Lei 13.709/2018, conhecida como LGPD.","Lei Complementar 105/2001.","Lei 9.613/98, de lavagem.","Lei 6.385/76, do mercado."],"c":1,"exp":"LC 105/2001. A 13.709 é a LGPD, a 9.613 é lavagem e a 6.385 trata do mercado de valores mobiliários."},{"q":"REDENÇÃO: a pena para a violação do sigilo bancário é de:","alts":["Detenção de 6 a 24 meses e multa.","Reclusão de 1 a 4 anos e multa.","Reclusão de 3 a 10 anos e multa.","Apenas multa administrativa."],"c":1,"exp":"Reclusão de 1 a 4 anos e multa, além de outras sanções cabíveis."}]},{"id":"3.4.6","titulo":"Crimes contra o Mercado: as 3 penas","resumo":["MANIPULAÇÃO DE MERCADO: operações simuladas ou manobras para elevar, manter ou baixar cotação, preço ou volume. RECLUSÃO DE 1 A 8 ANOS mais multa de até 3 vezes a vantagem.","USO INDEVIDO DE INFORMAÇÃO PRIVILEGIADA: negociar com informação relevante ainda não divulgada. RECLUSÃO DE 1 A 5 ANOS mais multa de até 3 vezes a vantagem.","EXERCÍCIO IRREGULAR DE CARGO OU FUNÇÃO: atuar como administrador de carteira, assessor, auditor, analista ou agente fiduciário sem registro ou autorização, AINDA QUE A TÍTULO GRATUITO. DETENÇÃO DE 6 A 24 MESES mais multa.","Enquadram-se na MANIPULAÇÃO: condições artificiais, manipulação de preço e operação fraudulenta.","Enquadra-se no USO INDEVIDO DE INFORMAÇÃO: a prática não equitativa.","OMISSÃO IMPRÓPRIA: quem tinha o dever de evitar e se omite responde pela MESMA pena do crime que a omissão permitiu."],"macete":"8-5-2: Manipulação até 8 anos, Informação até 5 anos, Exercício irregular até 24 meses (e é DETENÇÃO, não reclusão).","pegadinha":"Duas armadilhas: trocar 1 a 8 por 1 a 5 anos, e esquecer que o exercício irregular é crime mesmo A TÍTULO GRATUITO.","questoes":[{"q":"A pena para a manipulação de mercado é de:","alts":["Reclusão de 1 a 5 anos e multa.","Reclusão de 1 a 8 anos e multa.","Reclusão de 3 a 10 anos e multa.","Detenção de 6 a 24 meses e multa."],"c":1,"exp":"1 a 8 anos. O uso de informação privilegiada é que vai de 1 a 5 anos."},{"q":"Um profissional atua como administrador de carteira sem registro, sem cobrar nada por isso. Essa conduta:","alts":["Não é crime, pois foi a título gratuito.","É crime, com detenção de 6 a 24 meses e multa.","É apenas infração administrativa.","É crime com reclusão de 1 a 8 anos."],"c":1,"exp":"A lei é expressa: 'ainda que a título gratuito'. E a pena é de DETENÇÃO, não reclusão."},{"q":"A prática não equitativa enquadra-se em qual tipo penal?","alts":["Manipulação de mercado, com 1 a 8 anos.","Uso indevido de informação privilegiada.","Exercício irregular de cargo ou função.","Omissão imprópria do agente responsável."],"c":1,"exp":"Prática não equitativa está sob o uso indevido de informação privilegiada. Condições artificiais, manipulação de preço e operação fraudulenta é que são manipulação."},{"q":"REDENÇÃO: um funcionário de PLDFT omite ao COAF informação suspeita para viabilizar o crime. Ele responde:","alts":["Apenas administrativamente perante o COAF.","Pela mesma pena do crime que a omissão permitiu.","Com metade da pena do crime principal.","Somente com advertência e multa."],"c":1,"exp":"Omissão imprópria: quem tinha o dever de evitar responde pela mesma penalidade."}]},{"id":"3.4.7","titulo":"Ilícitos: Spoofing, Layering, Churning e Front Running","resumo":["MONEY PASS (condição artificial): usar operações em bolsa para transferir recursos disfarçadamente. Só funciona em ativo de BAIXA liquidez, onde dá para combinar o preço.","SPOOFING: UMA ordem grande e falsa para mover o preço, retirada antes de executar.","LAYERING: MÚLTIPLAS ordens em camadas, simulando vários investidores.","MANIPULAÇÃO DE BENCHMARK: alterar índice de referência. Difícil no Brasil, pois os benchmarks são oficiais (BC, ANBIMA, IBGE).","CHURNING (operação fraudulenta): girar excessivamente a carteira do cliente para gerar corretagem.","INSIDER PRIMÁRIO: quem soube pela função. SECUNDÁRIO: quem recebeu do primário. REPASSE: apenas divulgar já é proibido, mesmo sem ganho.","FRONT RUNNING: executar ordem própria ANTES da ordem grande do cliente, para se beneficiar do movimento.","Sanções administrativas para práticas não equitativas: advertência; multa do dobro da operação, limitada a R$ 50 MILHÕES; inabilitação de até 20 ANOS; proibição de atuar na distribuição por até 20 anos; e proibição de operar por até 10 anos."],"macete":"Spoofing é UMA ordem; Layering são VÁRIAS camadas. Churning gira a carteira; Front running corre na frente.","pegadinha":"Spoofing e layering são trocados o tempo todo. E lembre: o repasse de informação privilegiada é ilícito mesmo que quem repassou não tenha lucrado nada.","questoes":[{"q":"Um operador insere diversas ordens escalonadas em diferentes preços para simular demanda de vários investidores. A prática é:","alts":["Spoofing.","Layering.","Churning.","Money pass."],"c":1,"exp":"Camadas de ordens: layering. Uma única ordem grande caracteriza spoofing."},{"q":"Um assessor gira excessivamente a carteira do cliente para elevar sua receita de corretagem. Isso é:","alts":["Front running.","Churning.","Insider trading secundário.","Manipulação de benchmark."],"c":1,"exp":"Churning: operação fraudulenta que despreza o interesse do cliente em favor da comissão."},{"q":"Um profissional executa ordem própria de compra imediatamente antes da ordem volumosa de seu cliente. A prática é:","alts":["Churning.","Front running.","Spoofing.","Money pass."],"c":1,"exp":"Correr na frente da ordem do cliente para capturar o movimento de preço."},{"q":"REDENÇÃO: o teto da multa administrativa por prática não equitativa é de:","alts":["R$ 20 milhões.","R$ 50 milhões.","R$ 100 milhões.","Três vezes a vantagem obtida."],"c":1,"exp":"Dobro da operação irregular, limitada a R$ 50 milhões, com inabilitação de até 20 anos."}]}],"boss":[{"q":"As penas de manipulação de mercado e de uso de informação privilegiada são, respectivamente:","alts":["1 a 5 anos e 1 a 8 anos.","1 a 8 anos e 1 a 5 anos.","3 a 10 anos e 1 a 8 anos.","1 a 8 anos e 6 a 24 meses."],"c":1,"exp":"Manipulação até 8, informação até 5. Ambas com multa de até três vezes a vantagem."},{"q":"Depósito em espécie de R$ 70.000 exige a coleta de:","alts":["Apenas o CPF do portador do valor.","CPF do portador e do proprietário, e a origem.","Apenas a origem e o destino dos recursos.","Nenhum dado, se o cliente já for cadastrado."],"c":1,"exp":"Acima de R$ 50.000 entram os dois CPFs. Acima de R$ 2.000 basta o do portador."},{"q":"Os prazos de guarda de registros de clientes e de fornecedores são:","alts":["5 anos para ambos.","10 anos para ambos, com contagens distintas.","10 anos para clientes e 5 para fornecedores.","Indeterminados."],"c":1,"exp":"10 anos nos dois casos. Cliente conta do 1º dia do ano seguinte ao encerramento; fornecedor conta do próprio encerramento."},{"q":"A pena criminal para lavagem de dinheiro e a multa administrativa máxima são:","alts":["3 a 10 anos e R$ 20 milhões.","1 a 8 anos e R$ 50 milhões.","3 a 10 anos e R$ 50 milhões.","1 a 5 anos e R$ 20 milhões."],"c":0,"exp":"Reclusão de 3 a 10 anos; multa administrativa limitada a R$ 20 milhões."},{"q":"A compra de obras de arte com recursos ilícitos, para dificultar o rastreamento, caracteriza:","alts":["Colocação.","Ocultação.","Integração.","Crime antecedente."],"c":1,"exp":"Ativo de difícil rastreio usado para dissociar o recurso da origem: ocultação."},{"q":"A multa máxima prevista na LGPD é de:","alts":["2% do faturamento, até R$ 20 milhões.","2% do faturamento, até R$ 50 milhões por infração.","5% do faturamento, sem teto.","R$ 50 milhões, independentemente do faturamento."],"c":1,"exp":"2% do faturamento com teto de R$ 50 milhões por infração."},{"q":"Inserir uma única ordem falsa de grande volume para mover o preço e retirá-la em seguida é:","alts":["Layering.","Spoofing.","Churning.","Front running."],"c":1,"exp":"Uma ordem grande e falsa: spoofing. Várias em camadas: layering.
