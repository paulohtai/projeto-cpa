antia de rentabilidade mínima.","A eliminação do risco de mercado."],"c":1,"exp":"Fracionamento é o que democratiza o acesso a imóveis, ouro e outros ativos caros."},{"q":"Os mineradores são remunerados:","alts":["Por taxa fixa paga pelo Banco Central.","Com frações da própria criptomoeda validada.","Por comissão cobrada das exchanges.","Com tokens de utilidade da plataforma."],"c":1,"exp":"No Bitcoin, a recompensa vem em frações da própria moeda."},{"q":"A privacidade nas finanças descentralizadas se caracteriza por:","alts":["Identificação completa exigida por KYC.","Anonimato ou pseudônimo por endereço criptográfico.","Sigilo total das transações realizadas.","Divulgação de nomes com valores ocultos."],"c":1,"exp":"Endereços criptográficos substituem nomes, mas as transações seguem públicas."},{"q":"Um smart contract de empréstimo libera os fundos quando:","alts":["O credor autoriza manualmente a operação.","A garantia digital é depositada conforme programado.","O regulador aprova a transação.","O prazo contratual se encerra."],"c":1,"exp":"Condição atendida, execução automática, com juros calculados e cobrados pelo próprio código."},{"q":"O hash, no contexto do blockchain, é:","alts":["A chave privada que assina a transação.","O código único que garante a validade.","O endereço público usado no destino.","O contrato autoexecutável do bloco."],"c":1,"exp":"Funciona como a impressão digital do bloco e da transação."},{"q":"A negociação P2P de criptomoedas caracteriza-se por:","alts":["Maior segurança e regulação rigorosa.","Transação direta, flexível e mais arriscada.","Custódia obrigatória em cold wallet.","Intermediação por corretora autorizada."],"c":1,"exp":"Compradores e vendedores negociam preço e forma de pagamento diretamente, sem intermediário."}]},{"id":"4.3","titulo":"Novas Estruturas de Mercado","subtitulo":"Stablecoin, NFT, renda fixa digital e DREX","niveis":[{"id":"4.3.1","titulo":"Stablecoins e ETFs de Cripto","resumo":["STABLECOIN: criptomoeda com valor ATRELADO a um ativo estável, como o dólar ou o ouro. O propósito é reduzir a volatilidade típica das moedas digitais.","A emissora mantém RESERVAS na moeda fiduciária, garantindo que cada unidade seja conversível pelo valor correspondente. Exemplo: USDC, em que 1 USDC vale 1 dólar.","Usos práticos: transferência rápida de valores sem correspondente bancário, participação em DeFi e pagamentos em regiões com infraestrutura bancária limitada.","ETF DE BITCOIN: fundo de índice que replica a variação do Bitcoin, permitindo exposição regulada SEM possuir a moeda. No Brasil, o QBTC11 foi o primeiro listado na B3.","ETF DE CRIPTOMOEDAS: cesta diversificada. O HASH11 investe em Bitcoin, Ethereum e outras, diluindo o risco.","Vantagem dos ETFs: convertem a exposição a criptoativos num produto familiar de renda variável, com regulamentação clara e sem gestão de chaves privadas."],"macete":"Stablecoin busca ESTABILIDADE por lastro. ETF busca ACESSO regulado sem custódia própria. QBTC11 é só Bitcoin; HASH11 é cesta.","pegadinha":"A banca diz que quem compra ETF de Bitcoin passa a deter a moeda. Não detém: a exposição é via cota, sem posse do criptoativo nem gestão de chave privada.","questoes":[{"q":"A finalidade central de uma stablecoin é:","alts":["Maximizar o retorno frente ao Bitcoin.","Reduzir a volatilidade por meio de lastro em ativo estável.","Substituir a moeda oficial emitida pelo Banco Central.","Garantir anonimato total nas transferências."],"c":1,"exp":"O lastro em dólar ou ouro é o que estabiliza o valor. USDC é o exemplo citado."},{"q":"Um investidor compra cotas de ETF de Bitcoin na B3. Ele:","alts":["Passa a deter Bitcoin em carteira própria.","Obtém exposição à variação sem possuir a moeda.","Precisa configurar uma cold wallet para custódia.","Fica sujeito à tributação de criptoativos no exterior."],"c":1,"exp":"A cota reflete a variação diária do preço, deduzidas as taxas, sem posse nem gestão de chaves."},{"q":"A diferença entre QBTC11 e HASH11 é que:","alts":["O primeiro replica só o Bitcoin e o segundo, uma cesta.","O primeiro é uma stablecoin e o segundo, um ETF.","O primeiro é negociado no exterior e o segundo, no Brasil.","O primeiro é fundo fechado e o segundo, aberto."],"c":0,"exp":"QBTC11 acompanha exclusivamente o Bitcoin; HASH11 inclui Ethereum e outras moedas."},{"q":"REDENÇÃO: a garantia de conversibilidade de uma stablecoin decorre:","alts":["Da cobertura do Fundo Garantidor de Créditos.","Das reservas em moeda fiduciária mantidas pela emissora.","Da validação por mineradores independentes.","Do registro na Comissão de Valores Mobiliários."],"c":1,"exp":"A emissora mantém reservas correspondentes a cada unidade em circulação."}]},{"id":"4.3.2","titulo":"NFT e Renda Fixa Digital","resumo":["NFT, Non Fungible Token: ativo digital ÚNICO, com identificador exclusivo que não pode ser substituído por outro. Confere prova criptográfica de titularidade.","FUNGÍVEL x NÃO FUNGÍVEL: dinheiro e ações são fungíveis, pois uma unidade equivale a outra. O NFT carrega informação irreproduzível.","Aplicações do NFT: arte digital (com royalties automáticos ao artista em cada revenda, via smart contract), jogos e entretenimento (itens e personagens únicos negociáveis) e INGRESSOS de eventos (evita fraude e controla a revenda).","RENDA FIXA DIGITAL: emissão e negociação de títulos de dívida diretamente em blockchain. Mantém cupom, prazo e rating como no título tradicional.","O que muda: registro e liquidação em tempo real, sem custodiante intermediário; distribuição automática de juros e principal por smart contract; fracionamento que permite lotes menores.","Ganhos: liquidez, rastreabilidade, redução do risco de contraparte e do custo de custódia. Exemplo citado: debêntures tokenizadas emitidas pelo Santander."],"macete":"NFT é único (não fungível); renda fixa digital é o título de sempre rodando em blockchain. Royalty automático em revenda é a marca do NFT de arte.","pegadinha":"A banca diz que a renda fixa digital muda as características do título. Não muda: cupom, prazo e rating continuam iguais. O que muda é o REGISTRO e a LIQUIDAÇÃO.","questoes":[{"q":"A característica que distingue o NFT dos demais tokens é:","alts":["O lastro em moeda fiduciária.","A singularidade: cada token é único e insubstituível.","A isenção de imposto sobre o ganho de capital.","A emissão exclusiva por bancos centrais."],"c":1,"exp":"Não fungível significa que uma unidade não equivale a outra, ao contrário de dinheiro e ações."},{"q":"Na renda fixa digital, o que se altera em relação ao título tradicional é:","alts":["A existência de cupom e de prazo de vencimento.","O registro e a liquidação, que ocorrem em tempo real.","A necessidade de avaliação de rating de crédito.","A tributação aplicável ao investidor."],"c":1,"exp":"Cupom, prazo e rating permanecem. Muda o registro descentralizado e a liquidação quase instantânea."},{"q":"Um artista digital programa no smart contract o recebimento de percentual em cada revenda da obra. Isso é:","alts":["Tokenização de renda fixa.","Royalty automático em NFT.","Colateralização no Drex.","Emissão de stablecoin lastreada em arte."],"c":1,"exp":"Royalties personalizados em cadeia de revendas são uma das aplicações mais consolidadas do NFT."},{"q":"REDENÇÃO: entre os ganhos da renda fixa digital, o material destaca:","alts":["A garantia de rentabilidade mínima ao investidor.","Maior liquidez, rastreabilidade e menor custo de custódia.","A isenção de imposto de renda para pessoa física.","A dispensa de análise de risco de crédito."],"c":1,"exp":"Liquidação quase instantânea reduz risco de contraparte e custo, e o fracionamento amplia o acesso."}]},{"id":"4.3.3","titulo":"DREX e as CBDCs","resumo":["CBDC, Central Bank Digital Currency: moeda digital emitida por BANCO CENTRAL, com lastro em moeda fiduciária e garantia SOBERANA. No Brasil é o Real Digital, ou DREX.","DIFERENÇA para a criptomoeda: a CBDC tem segurança jurídica e estabilidade de valor; a criptomoeda é descentralizada e pode ser muito volátil.","ARQUITETURA HÍBRIDA: registro digital CENTRALIZADO, mantido pelo Banco Central, mas inspirado em princípios de blockchain. Combina a confiabilidade da autoridade soberana com a automação das redes distribuídas.","FUNÇÃO PRINCIPAL: estender a TOKENIZAÇÃO ao universo regulado, oferecendo um livro centralizado para emissão e circulação de tokens lastreados em ativos financeiros. Um título público pode virar tokens fracionados, negociáveis ou usados como garantia.","COLATERALIZAÇÃO NO DREX: o token do ativo é registrado na plataforma e o smart contract bloqueia ou libera automaticamente conforme o cumprimento das condições, permitindo execução imediata em caso de inadimplência.","CRONOGRAMA: escala esperada a partir de 2026, com adoção comum entre 2028 e 2030."],"macete":"DREX é CENTRALIZADO no Banco Central, mas usa a lógica do blockchain. Criptomoeda é descentralizada e volátil; CBDC é soberana e estável.","pegadinha":"A banca chama o DREX de criptomoeda descentralizada. Ele é o oposto: registro centralizado no Banco Central, com garantia soberana.","questoes":[{"q":"A arquitetura do Real Digital caracteriza-se por ser:","alts":["Totalmente descentralizada, como o Bitcoin.","Centralizada no BC, com lógica de blockchain.","Mantida por um consórcio fechado de bancos privados.","Idêntica à das exchanges descentralizadas."],"c":1,"exp":"Modelo híbrido: livro centralizado da autoridade soberana com automação das redes distribuídas."},{"q":"A principal diferença entre uma CBDC e uma criptomoeda tradicional é:","alts":["A CBDC tem lastro fiduciário e garantia soberana.","A criptomoeda é emitida por autoridade monetária.","A CBDC não permite tokenização de ativos.","A criptomoeda oferece maior segurança jurídica."],"c":0,"exp":"Estabilidade e segurança jurídica de um lado; descentralização e volatilidade do outro."},{"q":"Na colateralização via DREX, o smart contract:","alts":["Define o valor de mercado do ativo dado em garantia.","Bloqueia ou libera o token automaticamente conforme as condições.","Substitui a análise de crédito feita pela instituição.","Elimina a necessidade de registro do ativo."],"c":1,"exp":"Execução imediata do colateral em caso de inadimplência, sem etapas manuais."},{"q":"REDENÇÃO: a expectativa de adoção comum do Real Digital nas negociações, segundo o material, ocorre:","alts":["Já em 2025, com escala plena.","Entre 2028 e 2030.","Somente após 2035.","Sem previsão definida."],"c":1,"exp":"Escala a partir de 2026 e adoção comum entre 2028 e 2030."}]}],"boss":[{"q":"Uma criptomoeda cujo valor é atrelado ao dólar, com reservas mantidas pela emissora, é:","alts":["Uma CBDC.","Uma stablecoin.","Um NFT.","Um token de utilidade."],"c":1,"exp":"Lastro em ativo estável e reservas correspondentes. USDC é o exemplo."},{"q":"O DREX é classificado como:","alts":["Criptomoeda descentralizada de emissão privada.","CBDC, moeda digital de banco central.","Stablecoin lastreada em ouro.","Token não fungível emitido pelo Tesouro."],"c":1,"exp":"Real Digital, com lastro fiduciário e garantia soberana."},{"q":"Ingressos de eventos emitidos em blockchain para evitar fraude são exemplo de:","alts":["Renda fixa digital.","NFT.","Stablecoin.","ETF de criptomoedas."],"c":1,"exp":"Cada ingresso é único e rastreável, facilitando o controle de acesso e a revenda regulada."},{"q":"Na renda fixa digital, a distribuição automática de juros e principal é feita:","alts":["Pelo custodiante centralizado do título.","Por smart contract programado na emissão.","Pela clearing da B3, em D+1.","Pelo Banco Central, na plataforma do DREX."],"c":1,"exp":"A automação reduz riscos operacionais e dispensa o custodiante intermediário."},{"q":"O ETF que oferece exposição a uma cesta de criptomoedas, e não apenas ao Bitcoin, é o:","alts":["QBTC11.","HASH11.","USDC.","BOVA11."],"c":1,"exp":"HASH11 inclui Bitcoin, Ethereum e outras, diluindo o risco."},{"q":"A vantagem central do ETF de criptoativos para o investidor tradicional é:","alts":["Garantir rentabilidade superior ao Bitcoin.","Dar exposição regulada sem gestão de chaves privadas.","Eliminar a volatilidade do ativo subjacente.","Isentar o ganho de imposto de renda."],"c":1,"exp":"Converte o criptoativo num produto familiar de renda variável, com regulamentação clara."},{"q":"No DREX, um título público pode ser transformado em tokens que:","alts":["Perdem a garantia do Tesouro Nacional.","Representam frações negociáveis e utilizáveis como garantia.","Só podem ser mantidos até o vencimento.","São convertidos automaticamente em stablecoins."],"c":1,"exp":"Tokenização no ambiente regulado, com registro instantâneo na plataforma do Banco Central."},{"q":"Dinheiro e ações são exemplos de ativos:","alts":["Não fungíveis, pois cada unidade é única.","Fungíveis, pois uma unidade equivale a outra.","Tokenizados por natureza.","Lastreados em reservas soberanas."],"c":1,"exp":"Justamente o oposto do NFT, cuja identidade é irreproduzível."}]},{"id":"4.4","titulo":"Open Finance, IA e Fintechs","subtitulo":"Dados abertos, automação e novos entrantes","niveis":[{"id":"4.4.1","titulo":"Open Finance e seus Módulos","resumo":["PREMISSA CENTRAL: o histórico financeiro PERTENCE AO CLIENTE. É ele quem decide quais dados são compartilhados, com quem e por quanto tempo.","Objetivo: ampliar a concorrência, personalizar serviços e estimular a inovação. O cliente compara tarifas, juros e condições entre instituições.","TRÊS MÓDULOS: OPEN BANKING (dados bancários, de crédito e pagamentos), OPEN INVESTMENTS (informações de investimentos, facilitando portabilidade, comparação e diversificação) e OPEN INSURANCE (dados de seguros, para cotações mais justas e produtos personalizados).","ORIGEM histórica: a confiança era medida pelo tempo de relacionamento com um único banco. Compartilhar o histórico permitiu ao cliente PORTAR sua reputação de crédito para novas instituições.","CREDIT SCORE no Open Finance: com acesso ao histórico completo, a análise de crédito fica mais precisa, o que tende a beneficiar o bom pagador com taxas menores.","BASE NORMATIVA: Resolução Conjunta nº 1, de 2020, do Banco Central e do CMN, que instituiu o Open Banking. No mercado de capitais, as Resoluções CVM 209, 210 e 229 tratam da portabilidade de valores mobiliários."],"macete":"Banking é conta e crédito, Investments é aplicação, Insurance é seguro. O dono do dado é sempre o CLIENTE.","pegadinha":"A banca diz que a instituição decide o que compartilhar. Nunca: o consentimento é do cliente, inclusive quanto ao prazo de validade da autorização.","questoes":[{"q":"A premissa fundamental do Open Finance é que:","alts":["Os dados pertencem à instituição que os coletou.","O histórico financeiro pertence ao cliente, que autoriza o uso.","O Banco Central centraliza todos os dados do sistema.","O compartilhamento é automático entre instituições."],"c":1,"exp":"O cliente decide o que compartilhar, com quem e por quanto tempo."},{"q":"O módulo que trata do compartilhamento de informações de aplicações financeiras, facilitando portabilidade e comparação, é o:","alts":["Open Banking.","Open Investments.","Open Insurance.","Open Credit."],"c":1,"exp":"Banking cuida de conta, crédito e pagamentos; Insurance cuida de seguros."},{"q":"A norma que instituiu o Open Banking no Brasil foi:","alts":["Resolução Conjunta nº 1, de 2020.","Resolução CVM 175, de 2022.","Lei Complementar 105, de 2001.","Instrução Normativa BCB nº 153."],"c":0,"exp":"Resolução Conjunta BC e CMN. A CVM 175 trata de fundos e a IN 153, do relatório GRSAC."},{"q":"REDENÇÃO: o efeito esperado do Open Finance sobre a análise de crédito é:","alts":["Elevar as taxas por aumentar o custo de análise.","Tornar a avaliação mais precisa, beneficiando o bom pagador.","Eliminar a necessidade de score de crédito.","Restringir o crédito a clientes de um único banco."],"c":1,"exp":"Histórico completo permite precificar melhor o risco, o que tende a reduzir juros para quem paga bem."}]},{"id":"4.4.2","titulo":"Inteligência Artificial no Mercado Financeiro","resumo":["TRÊS CATEGORIAS:","IA GENERATIVA: PRODUZ conteúdo novo (textos, imagens, relatórios, apresentações) a partir de modelos treinados. Exige validação humana, pois não tem repertório contextualizado próprio e pode fornecer informação equivocada.","IA REGENERATIVA: APRENDE CONTINUAMENTE com dados em TEMPO REAL, ajustando previsões e detectando padrões. Usada para monitorar transações, identificar fraude e medir risco em tempo real.","MODELOS PREDITIVOS: ANTECIPAM tendências combinando séries históricas, indicadores macroeconômicos e métricas setoriais. Apoiam alocação de carteira, gestão de risco e decisões de crédito.","CHATBOT x ASSISTENTE VIRTUAL: o CHATBOT segue lógica pré-programada, com scripts e menus fixos, e NÃO integra dados internos. O ASSISTENTE VIRTUAL conecta-se a múltiplas bases e serviços, podendo executar PIX, consultar saldo e sugerir investimentos.","REGRA DE OURO: a IA não substitui o julgamento humano. Empatia, negociação e avaliação de eventos excepcionais continuam sendo do profissional."],"macete":"Generativa CRIA, Regenerativa APRENDE em tempo real, Preditiva ANTECIPA. Chatbot segue script; assistente virtual executa transação.","pegadinha":"A banca troca generativa por preditiva. Gerar conteúdo é uma coisa; prever tendência com base em séries históricas é outra.","questoes":[{"q":"O sistema que aprende continuamente com dados em tempo real para detectar fraudes é a IA:","alts":["Generativa.","Regenerativa.","Preditiva.","Conversacional."],"c":1,"exp":"Ajuste contínuo conforme mudanças no comportamento e nas condições de mercado."},{"q":"A diferença central entre chatbot e assistente virtual é que o assistente:","alts":["Responde mais rápido às perguntas do cliente.","Integra bases internas e executa transações.","Opera exclusivamente por comando de voz.","Dispensa qualquer supervisão humana."],"c":1,"exp":"Chatbot segue script fixo; o assistente consulta saldo, faz PIX e sugere investimentos."},{"q":"Ao usar IA generativa para produzir um relatório ao cliente, o profissional deve:","alts":["Encaminhar diretamente, pela precisão do modelo.","Validar o conteúdo, pois a IA pode fornecer informação equivocada.","Substituir sua análise pela recomendação do sistema.","Registrar o uso junto ao Banco Central."],"c":1,"exp":"A IA não tem repertório contextualizado próprio. A validação humana é indispensável."},{"q":"REDENÇÃO: os modelos preditivos no mercado financeiro servem principalmente para:","alts":["Criar textos, imagens e apresentações comerciais.","Antecipar tendências para investimento e crédito.","Responder dúvidas em menus fixos de atendimento.","Executar transações automáticas de PIX."],"c":1,"exp":"Combinam séries históricas e indicadores para projetar cenários de juros, crédito e renda variável."}]},{"id":"4.4.3","titulo":"Sandbox Regulatório","resumo":["SANDBOX significa 'caixa de areia': ambiente de TESTES AUTORIZADO pelo regulador, em que a instituição aplica soluções inovadoras a um grupo RESTRITO de clientes e por PRAZO DETERMINADO.","Reguladores que operam sandbox no Brasil: BANCO CENTRAL e CVM.","TRÊS OBJETIVOS: modernizar serviços preservando a estabilidade sistêmica; fomentar a COMPETITIVIDADE, reduzindo barreiras à entrada; e ampliar a INCLUSÃO FINANCEIRA, testando modelos para públicos pouco atendidos.","FASES: chamamento público ou convite; submissão de projeto com objetivos, público-alvo, controles de risco e indicadores; aprovação em escala reduzida e prazo definido; reporte de ocorrências, erros e feedback durante os testes; e decisão final do regulador entre liberação em regime regular, ajuste regulatório ou encerramento.","Exemplos de sucesso de testes pré-mercado: o Open Banking e o PIX, ambos com fases-piloto antes do lançamento amplo.","DESAFIOS: definir critérios de entrada, proteger o consumidor e evitar desigualdade de acesso."],"macete":"Grupo restrito, prazo determinado, supervisão do regulador. Ao final: libera, ajusta ou encerra.","pegadinha":"A banca amplia o sandbox para todos os clientes ou o torna permanente. São dois limites essenciais: público restrito e prazo determinado.","questoes":[{"q":"O sandbox regulatório caracteriza-se por permitir testes:","alts":["Com todos os clientes, por prazo indeterminado.","Com grupo restrito de clientes e por prazo determinado.","Sem qualquer supervisão do regulador.","Apenas após a aprovação do produto no mercado."],"c":1,"exp":"Escala reduzida e prazo definido são os dois limites que tornam o teste seguro."},{"q":"Ao término da fase experimental do sandbox, o regulador pode:","alts":["Apenas aprovar o produto em regime regular.","Liberar em regime regular, ajustar regras ou encerrar o projeto.","Transferir a solução a outra instituição.","Prorrogar automaticamente por prazo indeterminado."],"c":1,"exp":"As três saídas possíveis após a análise dos resultados reportados."},{"q":"São reguladores que operam sandbox no Brasil:","alts":["Banco Central e CVM.","SUSEP e PREVIC.","ANBIMA e B3, na autorregulação.","CMN e COAF, por lei própria."],"c":0,"exp":"BC e CVM, cada um em seu escopo de supervisão."},{"q":"REDENÇÃO: entre os objetivos do sandbox regulatório NÃO se inclui:","alts":["Fomentar a competitividade do setor.","Ampliar a inclusão financeira da população.","Garantir rentabilidade mínima aos participantes.","Preservar a estabilidade sistêmica do sistema."],"c":2,"exp":"Sandbox testa viabilidade técnica, legal e de mercado. Rentabilidade não é objetivo do regulador."}]},{"id":"4.4.4","titulo":"Fintechs e Desintermediação","resumo":["FINTECH: empresa que usa tecnologia para oferecer serviços financeiros com mais eficiência, menor custo e melhor experiência. Atuam em pagamentos, crédito, investimentos, câmbio e seguros.","REGULAÇÃO no Brasil: fintechs de pagamento operam como INSTITUIÇÕES DE PAGAMENTO, autorizadas pelo Banco Central e emissoras de CONTA DE PAGAMENTO (sem FGC, sem compulsório e sem crédito direto). As de crédito operam como SCD ou SEP, também autorizadas pelo BC.","DESINTERMEDIAÇÃO FINANCEIRA: poupador e tomador se conectam SEM o banco tradicional no meio, via plataformas, mercado de capitais e DeFi. Reduz o spread e amplia o acesso.","RELAÇÃO COM O OPEN FINANCE: ao dar às fintechs acesso ao histórico do cliente mediante consentimento, o Open Finance derruba a principal barreira de entrada, que era a assimetria de informação dos grandes bancos.","MEIOS DE PAGAMENTO: o ARRANJO define as regras; a BANDEIRA padroniza e conecta; o ADQUIRENTE processa e credita o lojista; o SUBADQUIRENTE agrupa pequenos lojistas e os encaminha ao adquirente."],"macete":"Conta de pagamento não tem FGC nem compulsório. Open Finance é o que tirou a vantagem informacional dos bancos grandes.","pegadinha":"A banca dá FGC à conta de pagamento de fintech. Não tem. E confunde bandeira com adquirente: quem credita o lojista é o ADQUIRENTE.","questoes":[{"q":"A conta de pagamento emitida por uma fintech, comparada à conta corrente bancária:","alts":["Tem FGC e recolhe depósito compulsório.","Não tem FGC, mas oferece serviços de pagamento.","Oferece cheque especial e crédito direto.","É autorizada pela CVM, e não pelo BC."],"c":1,"exp":"FGC, compulsório e crédito direto são exclusivos da conta corrente. O Pix é o item em comum."},{"q":"O Open Finance favorece as fintechs porque:","alts":["Obriga os bancos a transferir clientes a novos entrantes.","Reduz a assimetria de informação que protegia os grandes bancos.","Isenta as fintechs de autorização do Banco Central.","Elimina a exigência de análise de crédito."],"c":1,"exp":"Com o histórico do cliente acessível mediante consentimento, cai a principal barreira de entrada."},{"q":"No arranjo de pagamento, quem processa a transação e credita os valores na conta do lojista é:","alts":["A bandeira.","O adquirente.","O banco emissor.","O subadquirente exclusivamente."],"c":1,"exp":"A bandeira define regras e conecta; o emissor concede o cartão; o adquirente liquida ao lojista."},{"q":"REDENÇÃO: a desintermediação financeira consiste em:","alts":["Aumentar o número de intermediários na operação.","Conectar poupador e tomador sem o banco tradicional no meio.","Centralizar as operações em câmaras de compensação.","Elevar o spread cobrado nas operações de crédito."],"c":1,"exp":"Plataformas, mercado de capitais e DeFi ligam as pontas direto, reduzindo o spread."}]}],"boss":[{"q":"Os três módulos do Open Finance são:","alts":["Banking, Investments e Insurance.","Banking, Credit e Payments.","Investments, Insurance e Pension.","Banking, Insurance e Exchange."],"c":0,"exp":"Conta e crédito, aplicações e seguros, respectivamente."},{"q":"A IA que produz textos, relatórios e apresentações a partir de modelos treinados é a:","alts":["Generativa.","Regenerativa.","Preditiva.","Reativa."],"c":0,"exp":"Gera conteúdo novo, exigindo validação humana pela ausência de repertório contextualizado."},{"q":"O sandbox regulatório é operado no Brasil:","alts":["Pela ANBIMA e pela B3.","Pelo Banco Central e pela CVM.","Pelo CMN e pelo COAF.","Pela SUSEP e pela PREVIC."],"c":1,"exp":"Ambos utilizam o mecanismo para testar inovações sob supervisão."},{"q":"Um assistente virtual difere de um chatbot porque:","alts":["Utiliza linguagem mais formal no atendimento.","Integra bases internas e executa transações como PIX.","Funciona apenas em horário comercial.","Depende de validação humana em cada resposta."],"c":1,"exp":"Chatbot opera com scripts e menus fixos, sem integração com sistemas internos."},{"q":"A norma conjunta do Banco Central e do CMN que instituiu o Open Banking é a:","alts":["Resolução Conjunta nº 1, de 2020.","Resolução CVM 175, de 2022.","Instrução Normativa BCB nº 153.","Lei Complementar 179, de 2021."],"c":0,"exp":"A CVM 175 trata de fundos, a IN 153 do GRSAC e a LC 179 da autonomia do BC."},{"q":"Sobre a conta de pagamento oferecida por fintechs, é CORRETO afirmar:","alts":["Possui cobertura do FGC até R$ 250 mil.","Não possui FGC, compulsório nem crédito direto.","Recolhe depósito compulsório diretamente ao Banco Central.","É emitida mediante autorização da CVM."],"c":1,"exp":"Oferece serviços de pagamento, mas não as garantias e obrigações da conta corrente."},{"q":"No sandbox, a instituição deve submeter projeto contendo:","alts":["Apenas a descrição comercial do produto.","Objetivos, público-alvo, controles de risco e indicadores.","Garantia de retorno financeiro aos participantes.","Autorização prévia da ANBIMA."],"c":1,"exp":"O plano estruturado permite ao regulador avaliar viabilidade técnica, legal e de mercado."},{"q":"O PIX e o Open Banking são citados no material como exemplos de:","alts":["Falhas na implementação de inovações.","Sucesso de testes pré-mercado em fases-piloto.","Produtos criados fora do ambiente regulado.","Iniciativas exclusivas do setor privado."],"c":1,"exp":"Ambos passaram por piloto com participantes selecionados antes do lançamento amplo."},{"q":"A IA regenerativa distingue-se por:","alts":["Criar conteúdos originais sob demanda.","Aprender continuamente com dados em tempo real.","Seguir fluxogramas pré-programados de atendimento.","Depender exclusivamente de séries históricas."],"c":1,"exp":"Ajusta previsões e detecta padrões conforme o comportamento muda, ideal para fraude e risco."},{"q":"No Open Finance, o prazo de validade do compartilhamento de dados é definido:","alts":["Pela instituição financeira detentora dos dados.","Pelo cliente, ao conceder o consentimento.","Pelo Banco Central, de forma padronizada.","Pela instituição receptora dos dados."],"c":1,"exp":"O cliente decide o que, com quem e por quanto tempo compartilhar."},{"q":"As fintechs de crédito operam no Brasil sob a forma de:","alts":["Bancos múltiplos autorizados pela CVM.","SCD ou SEP, autorizadas pelo Banco Central.","Cooperativas de crédito com FGCOOP.","Sociedades de arrendamento mercantil."],"c":1,"exp":"Sociedades de crédito direto e sociedades entre pessoas, ambas sob autorização do BC."},{"q":"A validação humana permanece indispensável no uso de IA porque:","alts":["A legislação proíbe decisões automatizadas.","A IA carece de repertório contextualizado e pode errar.","Os modelos são lentos para processar dados.","O cliente exige atendimento presencial."],"c":1,"exp":"Empatia, negociação e avaliação de eventos excepcionais seguem sendo do profissional."}]}]}];// =====================================================================
// EXEMPLOS APLICADOS — escritos exclusivamente para as fichas.
// Nenhum deles reproduz questão do banco: servem para fixar o macete
// num caso concreto, sem entregar gabarito de exercício algum.
// Formato: id do nível -> [situação, como a regra resolve]
