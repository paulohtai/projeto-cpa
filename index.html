das previsíveis, em intervalos constantes. Permitem o uso da função PMT.","IRREGULARES: valores e frequências variados, mais comuns no mundo real.","Conceitos de viabilidade: VPL (diferença entre o valor presente das entradas e saídas, descontadas pela taxa de atratividade; positivo = lucrativo), TIR (taxa que zera o VPL) e TMA (taxa mínima esperada pelo investidor, considerando custo de oportunidade, riscos e perfil; não é fixa)."],"macete":"PMT só serve para fluxo REGULAR. Fluxo irregular pede CFj. O sinal depende do lado do balcão em que você está.","pegadinha":"A banca descreve o fluxo pela ótica do banco e pergunta o que é entrada para o cliente. Identifique de quem é o ponto de vista ANTES de montar os sinais.","questoes":[{"q":"Um cliente toma um empréstimo bancário. Sob a ótica do CLIENTE, o diagrama apresenta:","alts":["Saída inicial seguida de entradas mensais.","Entrada inicial seguida de saídas mensais.","Somente saídas.","Somente entradas."],"c":1,"exp":"Para o tomador, o dinheiro entra no início e sai nas parcelas."},{"q":"A função PMT pode ser utilizada quando o fluxo de caixa é:","alts":["Irregular, com valores e frequências variados.","Regular, com parcelas iguais em intervalos constantes.","Composto por uma única entrada e uma única saída.","Descontado pela taxa mínima de atratividade."],"c":1,"exp":"PMT pressupõe parcelas iguais em intervalos constantes."},{"q":"Assinale a definição CORRETA:","alts":["A TIR é a taxa mínima que o investidor espera receber.","O VPL é a taxa que zera o valor presente do projeto.","A TMA depende do perfil do investidor e não é fixa.","A TMA é definida pelo mercado e é igual para todos."],"c":2,"exp":"TMA = exigência do investidor. TIR = taxa que zera o VPL."},{"q":"REDENÇÃO: o VPL indica viabilidade financeira quando:","alts":["É negativo.","É positivo.","É igual a zero.","É igual à TIR."],"c":1,"exp":"VPL positivo significa retorno superior ao exigido pela taxa de atratividade."}]},{"id":"1.3.5","titulo":"Viabilidade de Projetos (TIR, VPL e TMA)","resumo":["Exemplo do material: investimento inicial de R$ 500.000; entradas de 100.000, 150.000, 200.000 e 250.000; TMA de 10% ao ano.","Sequência HP12C: 500000 CHS g CF0 → 100000 g CFj → 150000 g CFj → 200000 g CFj → 250000 g CFj → 10 i → f NPV.","Resultado: VPL = R$ 35.892,36 (positivo, projeto viável). Com f IRR: TIR = 12,83% ao ano, acima da TMA de 10%.","REGRA DE DECISÃO: TIR > TMA → VPL positivo → viável. TIR = TMA → VPL zero. TIR < TMA → VPL negativo → inviável.","Efeito do TIMING: mantendo o total recebido, mas com fluxos 100.000, 150.000, 0 e 450.000, o VPL cai para R$ 22.232,09 e a TIR para 11,61%. Períodos sem fluxo precisam ser informados como 0 g CFj."],"macete":"TIR maior que TMA = luz verde. Nunca pule um período vazio: digite 0 g CFj.","pegadinha":"A pegadinha é o timing: dois projetos com o MESMO total recebido podem ter VPL e TIR bem diferentes. Receber mais cedo vale mais.","questoes":[{"q":"Projeto com investimento inicial de R$ 500.000 e entradas de 100.000, 150.000, 200.000 e 250.000, com TMA de 10% ao ano. O VPL e a TIR são:","alts":["R$ 35.892,36 e 12,83% ao ano.","R$ 22.232,09 e 11,61% ao ano.","R$ 200.000,00 e 10,00% ao ano.","Negativo e inferior à TMA."],"c":0,"exp":"VPL = 35.892,36 e TIR = 12,83%. Como TIR > TMA, o projeto é viável."},{"q":"Mantendo o mesmo total recebido, mas com fluxos 100.000, 150.000, 0 e 450.000, o efeito é:","alts":["VPL e TIR sobem, pois o total recebido é o mesmo.","VPL cai para R$ 22.232,09 e a TIR, para 11,61%.","VPL e TIR ficam inalterados, pois o total é o mesmo.","O projeto se torna inviável, com VPL negativo."],"c":1,"exp":"Receber mais tarde reduz o valor presente. O projeto segue viável, porém menos atrativo."},{"q":"Na HP12C, um período sem qualquer fluxo de caixa deve ser informado como:","alts":["Ignorado, pulando para o próximo período.","0 g CFj, para não deslocar os fluxos seguintes.","0 PMT.","0 CHS g CF0."],"c":1,"exp":"Pular o período desloca todo o restante e distorce o cálculo."},{"q":"REDENÇÃO: quando a TIR é exatamente igual à TMA, o VPL do projeto é:","alts":["Positivo.","Negativo.","Igual a zero.","Indeterminado."],"c":2,"exp":"TIR é, por definição, a taxa que zera o VPL."}]},{"id":"1.3.6","titulo":"Modelos de Desconto Financeiro","resumo":["Desconto = antecipação de valores, calculada sobre o período restante até o vencimento.","POR FORA (bancário ou comercial): incide sobre o VALOR NOMINAL (futuro). VP = VF × (1 - i)^n. Usado na antecipação de recebíveis (cartão, cheque, boleto).","Exemplo: título de R$ 10.000, 6 meses, 3% a.m. → VP = 10.000 × (0,97)^6 = R$ 8.329,72. Desconto = R$ 1.670,28.","POR DENTRO (racional): incide sobre o VALOR PRESENTE. VP = VF ÷ (1 + i)^n. Usado na compra de título de renda fixa PREFIXADO.","Mesmo exemplo: VP = 10.000 ÷ (1,03)^6 = R$ 8.374,84. Desconto = R$ 1.625,16.","Na HP12C (por dentro): 10.000 FV, 6 n, 3 i, PV → 8.374,84."],"macete":"POR FORA = banco antecipando recebível, desconto MAIOR. POR DENTRO = título prefixado, desconto MENOR.","pegadinha":"Quem multiplica por (1 - i)^n é o POR FORA; quem divide por (1 + i)^n é o POR DENTRO. O desconto por fora sempre resulta em valor líquido MENOR.","questoes":[{"q":"Título de R$ 10.000 com vencimento em 6 meses, descontado a 3% ao mês pelo regime POR FORA. O valor presente e o desconto são:","alts":["R$ 8.374,84 e R$ 1.625,16.","R$ 8.329,72 e R$ 1.670,28.","R$ 8.200,00 e R$ 1.800,00.","R$ 9.700,00 e R$ 300,00."],"c":1,"exp":"Por fora: 10.000 × (0,97)^6 = 8.329,72. Os outros valores são do desconto POR DENTRO."},{"q":"Ao antecipar recebíveis de cartão de crédito em um banco, a modalidade de desconto utilizada é:","alts":["Desconto por dentro (racional).","Desconto por fora (bancário ou comercial).","Desconto composto misto.","Não há desconto algum, apenas juros compostos."],"c":1,"exp":"Antecipação de recebíveis usa desconto bancário (por fora)."},{"q":"Na HP12C, o cálculo do desconto POR DENTRO de um título de R$ 10.000, 6 meses, 3% ao mês, é feito por:","alts":["10.000 FV, 6 n, 3 i, PV.","10.000 PV, 6 n, 3 i, FV.","10.000 CHS PMT, 6 n, 3 i, PV.","10.000 g CF0, 3 i, f NPV."],"c":0,"exp":"Informa-se FV, n e i, e busca-se o PV: 8.374,84."},{"q":"REDENÇÃO: comparando as duas modalidades para o mesmo título, prazo e taxa:","alts":["O desconto por dentro é maior, gerando valor líquido menor.","O desconto por fora é maior, gerando valor líquido menor.","Os dois produzem o mesmo resultado.","O desconto por fora só se aplica em capitalização simples."],"c":1,"exp":"Por fora: desconto de 1.670,28. Por dentro: 1.625,16. O por fora tira mais do cliente."}]},{"id":"1.3.7","titulo":"Sistemas de Amortização","resumo":["Definições: AMORTIZAÇÃO é o pagamento do principal; JUROS é o custo do crédito; SALDO DEVEDOR é o principal em aberto; PRESTAÇÃO = amortização + juros.","PRICE: parcelas FIXAS. Os juros começam altos e caem; a amortização começa baixa e cresce. Por isso é chamado de sistema de amortização CRESCENTE.","Exemplo (R$ 10.000, 5 parcelas, 5% a.m.): parcela de R$ 2.309,75. HP12C: 10000 PV, 5 i, 5 n, PMT.","Tabela Price: juros do período = 5% do saldo devedor anterior; amortização = parcela menos juros. Parcela 1: juros 500 e amortização 1.809,75. Parcela 2: saldo 8.190,25, juros 409,51, amortização 1.900,24.","SAC: amortização CONSTANTE (empréstimo ÷ número de prestações). Parcelas DECRESCEM. Fórmula da parcela t: (PV ÷ n) × [1 + (n - t + 1) × i].","Mesmo exemplo no SAC: amortização de R$ 2.000. Parcela 1 = 2.500, parcela 2 = 2.400, parcela 3 = 2.300.","AMERICANO: paga só os JUROS periodicamente e quita o principal INTEGRALMENTE no final."],"macete":"Price: parcela fixa, amortização cresce. SAC: amortização fixa, parcela cai. Americano: só juros e um tiro no final.","pegadinha":"No início da tabela Price, o que é ALTO é o juro, não a amortização. E 'amortização crescente' descreve o Price, não o SAC.","questoes":[{"q":"Empréstimo de R$ 10.000 em 5 parcelas mensais a 5% ao mês pelo sistema PRICE. A parcela e a composição da primeira parcela são:","alts":["R$ 2.309,75, com juros de 500,00 e amortização de 1.809,75.","R$ 2.500,00, com juros de 500,00 e amortização de 2.000,00.","R$ 2.309,75, com juros de 1.809,75 e amortização de 500,00.","R$ 2.000,00, com juros de 309,75 e amortização de 1.690,25."],"c":0,"exp":"PMT = 2.309,75. Juros = 5% de 10.000 = 500. Amortização = 1.809,75."},{"q":"No mesmo empréstimo pelo sistema SAC, o valor da SEGUNDA parcela é:","alts":["R$ 2.500,00","R$ 2.400,00","R$ 2.309,75","R$ 2.000,00"],"c":1,"exp":"Amortização fixa = 2.000. Parcela 2 = 2.000 × [1 + (5 - 2 + 1) × 0,05] = 2.000 × 1,2 = 2.400."},{"q":"Sobre o comportamento das parcelas, é CORRETO afirmar:","alts":["No Price as parcelas decrescem e no SAC são fixas.","No Price a parcela é fixa e no SAC ela decresce.","Em ambos os sistemas as parcelas permanecem fixas.","No americano as parcelas crescem ao longo do contrato."],"c":1,"exp":"Price: parcela fixa. SAC: amortização constante, parcela decrescente."},{"q":"REDENÇÃO: no sistema AMERICANO, o pagamento do principal ocorre:","alts":["Em parcelas constantes ao longo de todo o contrato.","Integralmente no vencimento, pagando só juros antes.","No início do contrato, junto com a primeira parcela.","Junto com os juros, diluído em parcelas fixas."],"c":1,"exp":"Juros periódicos durante o contrato e amortização integral no vencimento."}]},{"id":"1.3.8","titulo":"Taxa de Juros Nominal e Real","resumo":["NOMINAL: a taxa divulgada no contrato, na aplicação ou no reajuste salarial, sem considerar a variação de preços.","REAL: ajusta a nominal pela inflação do mesmo período, revelando o ganho ou perda de PODER DE COMPRA.","O cálculo NÃO é subtração simples. Fórmula de Fisher: Taxa real = [(1 + taxa nominal) ÷ (1 + inflação)] - 1.","Exemplo: nominal 6% e inflação 1,2% → (1,06 ÷ 1,012) - 1 = 4,74% (e não os 4,8% da subtração).","Com DEFLAÇÃO de 1,2% e nominal de 6%: (1,06 ÷ 0,988) - 1 = 7,29%. A valorização da moeda aumenta o ganho real.","Aplica-se também a salários: reajuste nominal de 5% com inflação de 7% significa perda de poder de compra."],"macete":"Fisher: divide (1+nominal) por (1+inflação) e tira 1. Deflação entra com sinal NEGATIVO no denominador.","pegadinha":"A subtração simples é a armadilha padrão: a banca coloca 4,8% como distração quando a resposta é 4,74%.","questoes":[{"q":"Um investimento rende 6% ao ano com inflação de 1,2% no período. A taxa real é:","alts":["4,80%","4,74%","7,29%","6,00%"],"c":1,"exp":"(1,06 ÷ 1,012) - 1 = 4,74%. Os 4,8% são a armadilha da subtração."},{"q":"Com taxa nominal de 6% ao ano e DEFLAÇÃO de 1,2%, a taxa real é:","alts":["4,74%","7,20%","7,29%","4,80%"],"c":2,"exp":"(1,06 ÷ 0,988) - 1 = 7,29%. A deflação amplia o ganho real."},{"q":"Um trabalhador recebe reajuste nominal de 5% num ano em que a inflação foi de 7%. Conclui-se que:","alts":["Houve ganho real de 2%.","Houve perda de poder de compra.","O poder de compra permaneceu inalterado.","A taxa real foi de 12%."],"c":1,"exp":"Inflação acima do reajuste nominal significa taxa real negativa."},{"q":"REDENÇÃO: uma aplicação rende 10% ao ano com inflação de 4%. A taxa real aproximada é:","alts":["6,00%","5,77%","14,40%","6,50%"],"c":1,"exp":"(1,10 ÷ 1,04) - 1 = 5,77%. A subtração simples daria 6%."}]},{"id":"1.3.9","titulo":"Duration de Macaulay","resumo":["Prazo médio PONDERADO dos fluxos de caixa de um título: o tempo médio para o investidor recuperar o capital aplicado, considerando juros e principal.","Traduz em TEMPO a sensibilidade do título à variação das taxas de juros de mercado.","Título SEM cupom: a duration COINCIDE com o prazo de vencimento.","Título COM cupom: parte do capital retorna antes, então a duration é MENOR que o vencimento. Mais cupons, menor duration.","Dois títulos com o mesmo vencimento podem ter sensibilidades diferentes, por causa do cronograma de cupons.","Cálculo na HP12C: traga cada fluxo a valor presente e use a média ponderada (período Enter, valor presente, ∑+; ao final g x̄w). No exemplo do material, 5,21 semestres para um título de 6 semestres."],"macete":"Sem cupom: duration = prazo. Com cupom: duration menor que o prazo. Mais cupom, menos risco de juros.","pegadinha":"A banca afirma que duration e prazo de vencimento são sempre iguais. Só é verdade no título SEM cupom.","questoes":[{"q":"Um título zero cupom com vencimento em 4 anos apresenta duration de Macaulay igual a:","alts":["Menos de 4 anos, pelo efeito do reinvestimento.","Exatamente 4 anos, pois coincide com o vencimento.","Mais de 4 anos, pelo desconto a valor presente.","Indeterminada sem conhecer a taxa de mercado."],"c":1,"exp":"Sem pagamentos intermediários, todo o retorno vem no vencimento."},{"q":"Dois títulos têm o mesmo vencimento, mas o título A paga cupons semestrais e o B não. É CORRETO afirmar:","alts":["O A tem duration maior e é mais sensível a juros.","O A tem duration menor e é menos sensível a juros.","Ambos têm duration idêntica, pois vencem no mesmo dia.","A duration independe do cronograma de pagamentos."],"c":1,"exp":"Cupons reduzem o prazo médio ponderado e a sensibilidade à taxa de juros."},{"q":"No exemplo do material (título de 6 semestres, cupons de R$ 48,81, preço R$ 725,85, taxa de 11,44% ao semestre), a duration encontrada foi:","alts":["6,00 semestres.","5,21 semestres.","3,00 semestres.","11,44 semestres."],"c":1,"exp":"A média ponderada dos fluxos trazidos a valor presente resultou em 5,21 semestres."},{"q":"REDENÇÃO: a duration de Macaulay é definida como:","alts":["A taxa de desconto que zera o valor presente líquido do título.","O prazo médio ponderado dos fluxos de caixa do título.","O prazo de vencimento acrescido do prazo dos cupons.","A diferença entre o valor nominal e o preço unitário."],"c":1,"exp":"Prazo médio ponderado dos fluxos, que traduz em tempo a exposição ao risco de juros."}]}],"boss":[{"q":"R$ 5.000 aplicados a 2% ao mês por 6 meses em capitalização composta resultam em, aproximadamente:","alts":["R$ 5.600,00","R$ 5.630,81","R$ 5.100,00","R$ 6.000,00"],"c":1,"exp":"5.000 × 1,02^6 = 5.630,81. O regime simples daria 5.600."},{"q":"Uma taxa de 2% ao mês corresponde, ao ano, a quais taxas proporcional (simples) e equivalente (composta)?","alts":["24% e 26,82%.","26,82% e 24%.","24% e 24%.","12% e 26,82%."],"c":0,"exp":"Proporcional = 24%. Equivalente = 26,82%."},{"q":"No projeto do material (investimento de R$ 500.000; entradas de 100k, 150k, 200k e 250k; TMA 10%), a decisão correta é:","alts":["Rejeitar, pois a TIR de 12,83% é inferior à TMA.","Aceitar, pois o VPL é positivo e a TIR supera a TMA.","Indiferente, pois o VPL do projeto é igual a zero.","Rejeitar, pois o VPL apurado é negativo em R$ 35 mil."],"c":1,"exp":"VPL positivo e TIR acima da TMA: projeto viável."},{"q":"Título de R$ 10.000, 6 meses, taxa de 3% ao mês. Os valores líquidos nos descontos POR FORA e POR DENTRO são:","alts":["R$ 8.374,84 e R$ 8.329,72.","R$ 8.329,72 e R$ 8.374,84.","R$ 8.329,72 e R$ 8.329,72.","R$ 9.700,00 e R$ 9.708,74."],"c":1,"exp":"Por fora: 8.329,72. Por dentro: 8.374,84."},{"q":"Empréstimo de R$ 10.000 em 5 parcelas a 5% ao mês. Compare a PRIMEIRA parcela no Price e no SAC:","alts":["Price 2.309,75 e SAC 2.500,00.","Price 2.500,00 e SAC 2.309,75.","Ambas 2.309,75.","Price 2.000,00 e SAC 2.400,00."],"c":0,"exp":"Price: parcela fixa de 2.309,75. SAC: 2.000 de amortização + 500 de juros = 2.500."},{"q":"Aplicação com rendimento nominal de 6% e inflação de 1,2%. A taxa real, pela fórmula de Fisher, é:","alts":["4,80%","4,74%","7,29%","5,00%"],"c":1,"exp":"(1,06 ÷ 1,012) - 1 = 4,74%."},{"q":"Um título paga cupons semestrais e vence em 3 anos. Sua duration de Macaulay será:","alts":["Igual a 3 anos, pois acompanha o vencimento.","Menor que 3 anos, pois o cupom antecipa o retorno.","Maior que 3 anos, pelo efeito do reinvestimento dos cupons.","Igual ao número de cupons pagos até o vencimento."],"c":1,"exp":"Cupons antecipam capital e reduzem o prazo médio ponderado."},{"q":"Na HP12C, para calcular a parcela de um financiamento de R$ 10.000 em 5 meses a 5% ao mês:","alts":["10000 PV, 5 i, 5 n, PMT.","10000 CHS FV, 5 i, 5 n, PMT.","10000 g CF0, 5 i, f NPV.","10000 PV, 5 n, 5 PMT, i."],"c":0,"exp":"PV, i, n e então PMT. Resultado: 2.309,75."},{"q":"Sobre a descapitalização de 18% ao ano para o trimestre:","alts":["O composto gera 4,50% e o simples, 4,22%.","O simples gera 4,50% e o composto, 4,22%.","Ambos os regimes geram exatamente 4,50%.","Ambos os regimes geram exatamente 4,22%."],"c":1,"exp":"Descendo de período, a proporcional simples fica acima da equivalente composta."},{"q":"Um projeto tem períodos sem fluxo de caixa. Ao informar os dados na HP12C, você deve:","alts":["Pular o período e seguir para o próximo.","Digitar 0 g CFj para o período vazio.","Digitar 0 PMT.","Reiniciar o cálculo com CF0 igual a zero."],"c":1,"exp":"Sem isso, todos os fluxos seguintes se deslocam no tempo."},{"q":"Em capitalização SIMPLES, R$ 2.000 a 3% ao mês por 10 meses resultam em:","alts":["R$ 2.600,00","R$ 2.687,83","R$ 2.060,00","R$ 2.300,00"],"c":0,"exp":"2.000 × (1 + 0,03 × 10) = 2.600. O regime composto daria 2.687,83."},{"q":"Assinale a associação CORRETA entre operação e tipo de desconto:","alts":["Recebível de cartão: por dentro; prefixado: por fora.","Recebível de cartão: por fora; prefixado: por dentro.","Recebível de cartão e prefixado: ambos por dentro.","Recebível de cartão e prefixado: ambos por fora."],"c":1,"exp":"Banco antecipando recebível usa o comercial; título prefixado usa o racional."},{"q":"A TMA de um investidor:","alts":["É fixada pelo Banco Central a cada reunião do Copom.","É sempre igual à taxa Selic Meta vigente no período.","Não é fixa: varia conforme o perfil de cada investidor.","É sempre igual à TIR apurada para o projeto."],"c":2,"exp":"TMA reflete a exigência individual do investidor."}]},{"id":"1.4","titulo":"Infraestrutura e Estabilidade","subtitulo":"Os trilhos por onde o dinheiro corre","niveis":[{"id":"1.4.2","titulo":"Sistema de Pagamento Brasileiro (SPB)","resumo":["SPB: conjunto de entidades, sistemas e mecanismos ligados ao processamento e à liquidação de transferências de fundos, operações com moeda estrangeira, ativos financeiros e valores mobiliários.","Reforma de 2002, decorrente da Lei 10.214/2001 (a 'Lei do SPB'), que deu o fundamento legal às câmaras de compensação e liquidação.","Serviços que o integram: compensação e liquidação de créditos e débitos; transferência de fundos e outros ativos; liquidação de transferência em tempo real (LBTR).","Características atuais: base legal sólida, uso OBRIGATÓRIO de contrapartes centrais, certeza da liquidação com gerenciamento de riscos e salvaguardas, além de irrevogabilidade e finalidade das liquidações.","LBTR: liquidação em tempo real, com débito imediato na conta da instituição pagadora. É o caso da TED.","LDL: liquidação em D+1 ou mais, por diferença de saldo entre as instituições.","SPI: infraestrutura centralizada e única para pagamentos instantâneos, opera em LBTR, transação por transação, e as liquidações são irrevogáveis. O PIX passa pelo SPI, NÃO pelo SPB."],"macete":"TED = SPB. PIX = SPI. Ambos LBTR, mas moram em sistemas diferentes. LDL é o saldo líquido em D+1.","pegadinha":"A pegadinha estrela: dizer que o PIX passa pelo SPB. A apostila é explícita: o PIX passa pelo SPI, que é a evolução do SPB.","questoes":[{"q":"Sobre o PIX e o SPI, é CORRETO afirmar:","alts":["O PIX é liquidado pelo SPB, em regime de LDL.","O PIX passa pelo SPI e é liquidado em LBTR.","O PIX passa pelo SPI e é liquidado em LDL.","O SPI é gerido pela B3 e liquida em D+1."],"c":1,"exp":"O PIX não passa pelo SPB, e sim pelo SPI, que liquida transação por transação em tempo real."},{"q":"A diferença entre LBTR e LDL é:","alts":["A LBTR liquida por saldo em D+1; a LDL, em tempo real.","A LBTR liquida em tempo real; a LDL, por saldo em D+1.","Ambas liquidam em tempo real, mudando o valor mínimo.","A LDL é usada apenas em operações de câmbio."],"c":1,"exp":"Bruta em tempo real x diferida líquida por saldo. A TED é exemplo de LBTR."},{"q":"A lei que estabeleceu o fundamento legal das câmaras de compensação e liquidação foi:","alts":["Lei 4.595/1964, que criou o CMN.","Lei 10.214/2001, a Lei do SPB.","Lei Complementar 179/2021.","Lei 13.709/2018, sobre proteção de dados."],"c":1,"exp":"Lei 10.214/2001, que gerou a reforma do SPB em 2002."},{"q":"REDENÇÃO: entre as características atuais do SPB, destaca-se:","alts":["O uso facultativo de contrapartes centrais.","O uso obrigatório de contrapartes centrais.","A ausência de mecanismos de controle de risco.","A liquidação obrigatória em D+3 pelas câmaras."],"c":1,"exp":"Contraparte central OBRIGATÓRIA, salvaguardas de risco e liquidações irrevogáveis."}]},{"id":"1.4.3","titulo":"Clearing House","resumo":["Centrais de compensação garantem que as transações ocorram com segurança e eficiência, minimizando riscos e assegurando o cumprimento das obrigações.","Os títulos negociados hoje são apenas ESCRITURAIS: não existem títulos físicos, apenas informação lógica nos sistemas.","SELIC (Sistema Especial de Liquidação e Custódia): custodia e liquida os TÍTULOS PÚBLICOS FEDERAIS negociados no mercado institucional.","CLEARING DA B3: registra, compensa e liquida os DEMAIS títulos do mercado financeiro, INCLUSIVE os títulos públicos negociados via Tesouro Direto."],"macete":"SELIC = título público no atacado (institucional). B3 = todo o resto, incluindo o Tesouro Direto do varejo.","pegadinha":"Título público do Tesouro Direto NÃO é liquidado no SELIC, e sim na clearing da B3.","questoes":[{"q":"Um investidor pessoa física compra um título público pelo Tesouro Direto. A custódia e liquidação ocorrem:","alts":["No SELIC, por se tratar de título público federal.","Na clearing da B3, que atende o Tesouro Direto.","No SPI, junto com os pagamentos instantâneos.","Na SUSEP, que homologa a custódia do investidor."],"c":1,"exp":"SELIC cuida dos títulos públicos no mercado institucional; o Tesouro Direto passa pela B3."},{"q":"O SELIC é responsável por:","alts":["Registrar debêntures, ações e cotas de fundos.","Custodiar títulos públicos no mercado institucional.","Liquidar os pagamentos instantâneos realizados por meio do Pix.","Fiscalizar corretoras e distribuidoras de valores."],"c":1,"exp":"Sistema Especial de Liquidação e Custódia: títulos públicos federais no mercado institucional."},{"q":"REDENÇÃO: os títulos negociados hoje no sistema financeiro são:","alts":["Físicos, guardados nos cofres das corretoras.","Escriturais, existindo só como informação lógica.","Emitidos em papel timbrado pelo Banco Central.","Registrados em cartório, com fé pública."],"c":1,"exp":"Só existe informação lógica nos sistemas, o que torna a clearing indispensável."}]},{"id":"1.4.4","titulo":"Risco Sistêmico e Mecanismos de Estabilidade","resumo":["Risco sistêmico: risco de colapso de uma parte relevante do sistema financeiro, capaz de gerar efeitos em cadeia que comprometem a economia como um todo. A analogia é o dominó.","Exemplos citados: a crise do subprime de 2008 (crédito imobiliário sem verificação, quebra do Lehman Brothers) e a pandemia de Covid-19 em março de 2020.","MECANISMOS DE MITIGAÇÃO: Depósitos Compulsórios; Linhas Financeiras de Liquidez (empréstimos do BC no curto prazo, LLI, ou médio prazo, LLT); COMEF (Comitê de Estabilidade Financeira, grupo técnico do BC); e o Acordo de Basileia."],"macete":"Quatro escudos: Compulsório, Linhas de Liquidez (LLI curto / LLT médio), COMEF e Basileia.","pegadinha":"A banca troca LLI e LLT. LLI é a de curto prazo, LLT a de médio prazo. E o COMEF é do BANCO CENTRAL, não do CMN.","questoes":[{"q":"As Linhas Financeiras de Liquidez do Banco Central se dividem em:","alts":["LLI para o curto prazo e LLT para o médio prazo.","LLT para o curto prazo e LLI para o médio prazo.","LLI e LLT, ambas exclusivas para o longo prazo.","Uma única linha, sem distinção de prazo."],"c":0,"exp":"LLI garante liquidez no curto prazo; LLT no médio prazo."},{"q":"O Comitê de Estabilidade Financeira (COMEF) é:","alts":["Órgão normativo vinculado ao CMN.","Grupo técnico do BC que monitora riscos sistêmicos.","Entidade autorreguladora vinculada à B3.","Câmara de compensação e liquidação de contratos de derivativos."],"c":1,"exp":"COMEF é grupo técnico do BC."},{"q":"Segundo o material, são mecanismos de mitigação de risco sistêmico:","alts":["Compulsório, linhas de liquidez, COMEF e Basileia.","IPCA, Selic, PTAX e Taxa Referencial.","MRP, FGC e FGCOOP, que cobrem prejuízos.","SELIC, B3, SPI e SPB, as infraestruturas."],"c":0,"exp":"Os quatro mecanismos listados na apostila."},{"q":"REDENÇÃO: risco sistêmico pode ser definido como:","alts":["O risco de um investidor perder dinheiro numa aplicação.","O risco de colapso de parte relevante do sistema financeiro.","O risco de variação da taxa de juros sobre um título.","O risco de fraude operacional em uma única corretora."],"c":1,"exp":"Efeito dominó: a queda de uma peça relevante derruba as demais."}]},{"id":"1.4.5","titulo":"Acordo de Basileia","resumo":["Conjunto de normas internacionais para garantir a solidez dos bancos, exigindo capital suficiente para absorver perdas e gerenciar riscos.","Sede: cidade de Basileia, na Suíça, onde fica o BIS (Banco Internacional de Compensações), o 'banco central dos bancos centrais'.","BASILEIA I (1988): capital mínimo equivalente a 8% do total dos empréstimos.","BASILEIA II (2004): ampliou o leque de riscos considerados e tornou as normas mais robustas, mas não foi à prova de crises.","BASILEIA III (2010): surgiu após a crise de 2008 com exigências mais rigorosas. No BRASIL, o Índice de Basileia foi elevado para 11%, acima do mínimo internacional de 8%.","Também trata do Capital de Nível I e Nível II e das regras para risco de crédito, mercado e operacional, com modelos padronizados ou internos (estes mediante autorização)."],"macete":"1988 / 2004 / 2010. Internacional 8%, Brasil 11%. BIS = banco central dos bancos centrais.","pegadinha":"A banca inverte os percentuais: o mínimo INTERNACIONAL é 8%, e o brasileiro é 11%, mais rigoroso.","questoes":[{"q":"O Índice de Basileia mínimo exigido no Brasil e o padrão internacional são, respectivamente:","alts":["8% e 11%.","11% e 8%.","8% e 8%.","11% e 11%."],"c":1,"exp":"O Brasil adota 11%, superior ao mínimo internacional de 8%."},{"q":"O Acordo de Basileia III foi editado em qual ano e em resposta a qual evento?","alts":["1988, em resposta à hiperinflação global.","2004, em resposta ao avanço tecnológico.","2010, em resposta à crise financeira de 2008.","2020, em resposta à pandemia."],"c":2,"exp":"Basileia III, em 2010, endureceu as exigências após a crise de 2008."},{"q":"O BIS é descrito no material como:","alts":["O órgão regulador do mercado de capitais europeu.","O banco central dos bancos centrais, sediado na Suíça.","Uma câmara de compensação de contratos de derivativos.","O fundo garantidor internacional de depósitos bancários."],"c":1,"exp":"Reúne presidentes de bancos centrais para deliberar sobre questões globais."},{"q":"REDENÇÃO: a exigência estabelecida originalmente por Basileia I (1988) era:","alts":["Capital mínimo de 11% do total dos empréstimos.","Capital mínimo de 8% do total dos empréstimos.","Reserva integral dos depósitos à vista captados.","Proibição de operar com contratos de derivativos."],"c":1,"exp":"Basileia I fixou o capital mínimo em 8% do total de empréstimos."}]},{"id":"1.4.6","titulo":"Classificação da Pessoa Investidora","resumo":["A classificação é feita pela CVM e define o acesso a produtos, com base em renda, patrimônio e conhecimento técnico. Quatro tipos: comum, qualificado, profissional e não residente.","COMUM: qualquer PF ou PJ que acessa o mercado de capitais.","QUALIFICADO: investimentos financeiros SUPERIORES a R$ 1.000.000,00, com atestado por escrito (Anexo B da Instrução CVM 30). Também são qualificados: os investidores profissionais; pessoas naturais aprovadas em exames de qualificação técnica ou com certificações aprovadas pela CVM para registro de assessores, administradores de carteira, analistas e consultores, quanto a seus recursos próprios; e clubes de investimento com carteira gerida por cotistas qualificados.","PROFISSIONAL: instituições financeiras e demais autorizadas pelo BC; seguradoras e sociedades de capitalização; entidades abertas e fechadas de previdência complementar; PF ou PJ com investimentos SUPERIORES a R$ 10.000.000,00 e atestado por escrito (Anexo A da Instrução CVM 30); fundos de investimento; clubes geridos por administrador de carteira autorizado pela CVM; assessores, administradores, analistas e consultores autorizados pela CVM quanto a seus recursos próprios; e investidores não residentes.","REGRA DE OURO: todo profissional é também qualificado, mas nem todo qualificado é profissional.","NÃO RESIDENTE: pessoa física ou jurídica, fundos e entidades com residência, sede ou domicílio no exterior que investem no país. Antes de operar deve: constituir representante(s) no país, obter registro na CVM e constituir custodiante(s) autorizado(s) pela CVM."],"macete":"1 milhão = Qualificado (Anexo B). 10 milhões = Profissional (Anexo A). Não residente: representante, registro na CVM e custodiante.","pegadinha":"Duas armadilhas: inverter os anexos (A é do profissional, B é do qualificado) e afirmar que todo qualificado é profissional. É o contrário.","questoes":[{"q":"Uma pessoa física com R$ 1.500.000,00 em investimentos financeiros, que atesta sua condição por escrito, é classificada como:","alts":["Investidor profissional.","Investidor qualificado.","Investidor comum apenas.","Investidor não residente."],"c":1,"exp":"Acima de R$ 1 milhão com atestado = qualificado. Profissional exige mais de R$ 10 milhões."},{"q":"Sobre a relação entre as categorias, é CORRETO afirmar:","alts":["Todo qualificado é também profissional, mas não o inverso.","Todo profissional é também qualificado, mas não o inverso.","As duas categorias são mutuamente excludentes.","O investidor não residente é sempre classificado como comum."],"c":1,"exp":"Nota literal da apostila. O investidor não residente consta na lista de profissionais."},{"q":"Antes de iniciar suas operações, o investidor não residente deve:","alts":["Apenas obter registro junto à Receita Federal.","Constituir representante e custodiante e registrar-se na CVM.","Constituir apenas um custodiante sediado no exterior.","Obter autorização prévia do Banco Central e da SUSEP."],"c":1,"exp":"Os três requisitos prévios: representante, registro na CVM e custodiante autorizado."},{"q":"REDENÇÃO: o valor mínimo e o anexo aplicáveis ao investidor PROFISSIONAL pessoa natural são:","alts":["R$ 1 milhão, Anexo B.","R$ 10 milhões, Anexo A.","R$ 10 milhões, Anexo B.","R$ 1 milhão, Anexo A."],"c":1,"exp":"Profissional: mais de R$ 10 milhões, Anexo A. Qualificado: mais de R$ 1 milhão, Anexo B."}]}],"boss":[{"q":"Uma TED e um PIX são liquidados, respectivamente, por:","alts":["SPI e SPB.","SPB (LBTR) e SPI (LBTR).","LDL e LDL.","Clearing da B3 e o sistema SELIC."],"c":1,"exp":"TED passa pelo SPB em LBTR; o PIX passa pelo SPI, também em LBTR."},{"q":"Um fundo institucional compra títulos públicos federais no mercado institucional. A custódia e liquidação ocorrem:","alts":["Na clearing da B3.","No SELIC.","No SPI.","Na BSM."],"c":1,"exp":"SELIC cuida do mercado institucional. O Tesouro Direto passa pela B3."},{"q":"O Índice de Basileia adotado no Brasil é:","alts":["8%","11%","10%","12%"],"c":1,"exp":"O Brasil elevou o índice para 11%, acima do mínimo internacional de 8%."},{"q":"São mecanismos de mitigação de risco sistêmico, EXCETO:","alts":["Depósitos compulsórios.","Linhas financeiras de liquidez (LLI e LLT).","Mecanismo de Ressarcimento de Prejuízos (MRP).","Acordo de Basileia."],"c":2,"exp":"O MRP ressarce prejuízos causados por participantes na intermediação, não é ferramenta de estabilidade sistêmica."},{"q":"Um investidor com R$ 12 milhões em investimentos financeiros, com atestado por escrito, é:","alts":["Qualificado, mas ainda não profissional.","Profissional e, por definição, também qualificado.","Comum, pois não atingiu o limite exigido.","Não residente, pela natureza da aplicação."],"c":1,"exp":"Acima de R$ 10 milhões = profissional. E todo profissional é também qualificado."},{"q":"A Lei 10.214/2001 é conhecida como:","alts":["Lei da Autonomia do Banco Central.","Lei do SPB, base das câmaras de compensação.","Lei do Sistema Financeiro Nacional.","Lei Geral de Proteção de Dados Pessoais."],"c":1,"exp":"A Lei do SPB gerou a reforma de 2002."},{"q":"Sobre a liquidação diferida líquida (LDL):","alts":["Ocorre em tempo real, transação por transação.","Ocorre em D+1 ou mais, por diferença de saldo.","É o regime usado exclusivamente pelo Pix.","Foi extinta com a edição da Lei do SPB."],"c":1,"exp":"LDL apura o saldo líquido entre instituições e liquida em D+1 ou mais."},{"q":"Basileia I, II e III foram editados, respectivamente, em:","alts":["1988, 2004 e 2010.","1990, 2000 e 2008.","1988, 2008 e 2020.","1994, 2004 e 2014."],"c":0,"exp":"1988 (capital mínimo de 8%), 2004 (mais riscos) e 2010 (pós-crise)."},{"q":"Um profissional aprovado em certificação exigida pela CVM para registro de assessor de investimentos é considerado, quanto a seus recursos próprios:","alts":["Investidor comum.","Investidor qualificado.","Investidor não residente.","Investidor sem classificação específica."],"c":1,"exp":"A certificação aprovada pela CVM confere a condição de qualificado quanto aos recursos próprios."},{"q":"A analogia usada no material para explicar o risco sistêmico é:","alts":["Uma corrida de revezamento entre bancos.","Uma fila de dominós: um cai e derruba os outros.","Um cofre com várias fechaduras independentes.","Uma balança de dois pratos em equilíbrio."],"c":1,"exp":"Efeito dominó: colapso de uma parte relevante contamina o sistema todo."},{"q":"Entre as características do SPB atual está:","alts":["A revogabilidade das liquidações até D+2.","O uso obrigatório de contrapartes centrais.","A ausência de base legal específica para as câmaras.","A liquidação manual feita pelas tesourarias."],"c":1,"exp":"Contraparte central obrigatória, salvaguardas de risco e liquidações irrevogáveis."},{"q":"Os anexos da Instrução CVM 30 aplicáveis ao investidor profissional e ao qualificado são, respectivamente:","alts":["Anexo B e Anexo A.","Anexo A e Anexo B.","Ambos o Anexo A.","Ambos o Anexo B."],"c":1,"exp":"Profissional: Anexo A. Qualificado: Anexo B."}]}]},{id:"2",nome:'Produtos do Mercado Financeiro',subtitulo:'O que você vai vender e para quem',peso:40,blocos:[{"id":"2.1","titulo":"Renda Fixa","subtitulo":"Você empresta, o emissor paga juros","niveis":[{"id":"2.1.1","titulo":"Renda Fixa: conceito e características","resumo":["Classe formada por títulos de crédito emitidos por instituições públicas ou privadas. O investidor EMPRESTA dinheiro ao emissor em troca de remuneração previamente acordada.","Emissores: Governo (títulos públicos federais), Bancos (CDB, LCI, LCA) e Empresas (notas promissórias, debêntures, CRI, CRA).","Características: Data de Emissão, Data de Vencimento, Valor da Emissão, VNA (valor de emissão corrigido pelo indexador), PU (valor de mercado no dia), Rentabilidade, Resgate, Liquidez, Ágio/Deságio, Cupom, Cupom Rate e Duration.","Rentabilidade: PREFIXADA (taxa fixa acordada na compra), PÓS-FIXADA (atrelada a CDI ou inflação) ou HÍBRIDA (combina as duas)."],"macete":"VNA é o valor CORRIGIDO pelo indexador. PU é o valor de MERCADO no dia da negociação. Não confunda os dois.","pegadinha":"A banca troca VNA e PU, e chama híbrido de pós-fixado. Híbrido = taxa fixa MAIS índice (ex.: IPCA + 6%). Pós-fixado puro = só o índice (ex.: 101% do CDI).","questoes":[{"q":"Um título remunera IPCA + 5,5% ao ano. Essa rentabilidade é classificada como:","alts":["Prefixada, pois há uma taxa fixa definida.","Pós-fixada, pois depende de um índice.","Híbrida, pois combina taxa fixa com a variação de um índice.","Indexada, categoria distinta das três anteriores."],"c":2,"exp":"Híbrida combina os dois aspectos: parte fixa (5,5%) mais parte atrelada ao índice (IPCA). Pós-fixado puro seria apenas '101% do CDI'."},{"q":"O valor de emissão do título corrigido pelo seu respectivo indexador até o dia atual é chamado de:","alts":["Preço Unitário (PU)","Valor Nominal Atualizado (VNA)","Cupom Rate do período","Ágio sobre o valor de face"],"c":1,"exp":"VNA = valor de emissão corrigido pelo indexador. PU é o valor de mercado do título no dia da negociação, que pode estar acima (ágio) ou abaixo (deságio) do VNA."},{"q":"São emissores típicos de títulos de renda fixa, conforme o material, EXCETO:","alts":["O Governo, por meio dos títulos públicos federais.","Os bancos, por meio de CDB, LCI e LCA.","As empresas, por meio de debêntures, notas promissórias, CRI e CRA.","As bolsas de valores, por meio de ações preferenciais."],"c":3,"exp":"Ação é renda variável e representa participação societária, não empréstimo. Os três emissores de renda fixa são governo, bancos e empresas."},{"q":"REDENÇÃO: a lógica essencial de qualquer investimento em renda fixa é:","alts":["O investidor se torna sócio do emissor e participa dos lucros.","O investidor empresta dinheiro ao emissor e recebe juros previamente acordados.","O investidor adquire um bem real e lucra com sua valorização.","O investidor delega a gestão a um administrador profissional."],"c":1,"exp":"Renda fixa funciona como um empréstimo: você é CREDOR, não sócio. Ser sócio é renda variável."}]},{"id":"2.1.1.1","titulo":"Tributação em Renda Fixa (IOF e IR)","resumo":["IOF: incide apenas em resgates com MENOS de 30 dias. Até o 29º dia cobra-se 1% ao dia sobre o valor total resgatado, LIMITADO ao percentual da tabela regressiva sobre o RENDIMENTO. Do 30º dia em diante, alíquota ZERO.","Cálculo do IOF em 2 passos: (1) 1% ao dia sobre o valor resgatado; (2) comparar com o limite da tabela aplicado ao rendimento. Vale o MENOR dos dois.","Tabela de IR (regressiva, sobre o rendimento): até 180 dias 22,5%; de 181 a 360 dias 20%; de 361 a 720 dias 17,5%; acima de 720 dias 15%.","O IR é calculado LÍQUIDO de IOF: primeiro deduz o IOF, depois aplica a alíquota de IR sobre o rendimento remanescente.","Ambos são retidos NA FONTE: o investidor recebe o valor já líquido. Dica de ouro do material: renda variável NÃO sofre IOF."],"macete":"IOF morre no 30º dia. IR só encerra a queda acima de 720 dias, em 15%. Ordem sagrada: IOF primeiro, IR depois.","pegadinha":"A banca aplica o 1% ao dia sem checar o limite da tabela, ou aplica o IR sobre o rendimento bruto ignorando o IOF já deduzido. E cuidado com a faixa de 361 a 720 dias: é 17,5%, não 17%.","questoes":[{"q":"Aplicação de R$ 100 mil resgatada no 11º dia por R$ 108 mil. O limite da tabela para 11 dias é 63% do rendimento. O IOF devido é:","alts":["R$ 11.880,00","R$ 5.040,00","R$ 8.000,00","Zero, pois o resgate ocorreu antes de 30 dias."],"c":1,"exp":"Passo 1: 108.000 × 1% × 11 = 11.880. Passo 2: rendimento de 8.000 × 63% = 5.040. Como 11.880 ultrapassa o limite, vale o limite: R$ 5.040,00."},{"q":"Aplicação de R$ 50 mil resgatada no 3º dia por R$ 55 mil, com limite de 90% para 3 dias. O IOF devido é:","alts":["R$ 4.500,00","R$ 1.650,00","R$ 5.000,00","R$ 550,00"],"c":1,"exp":"Passo 1: 55.000 × 1% × 3 = 1.650. Passo 2: rendimento de 5.000 × 90% = 4.500. Como 1.650 NÃO ultrapassa o limite, o IOF é o próprio 1.650."},{"q":"Um CDB é resgatado 400 dias após a aplicação. A alíquota de IR sobre o rendimento é:","alts":["22,5%","20%","17,5%","15%"],"c":2,"exp":"400 dias cai na faixa de 361 a 720 dias: 17,5%. Os 15% só valem ACIMA de 720 dias."},{"q":"REDENÇÃO: sobre a ordem de incidência dos tributos em renda fixa, é CORRETO afirmar:","alts":["O IR é calculado sobre o rendimento bruto e depois se aplica o IOF.","Primeiro calcula-se o IOF e depois o IR incide sobre o rendimento já deduzido do IOF.","IOF e IR incidem simultaneamente sobre o valor total resgatado.","O IOF incide sobre o rendimento e o IR sobre o principal."],"c":1,"exp":"A cobrança de IR é líquida de IOF. E ambos são retidos na fonte."}]},{"id":"2.1.2","titulo":"Títulos Públicos Federais","resumo":["Títulos de crédito emitidos pelo Tesouro Nacional para financiar a dívida pública. Como têm garantia do governo federal, possuem o MENOR risco de crédito.","LFT: pós-fixada, indexada à Selic Over. LTN: prefixada. NTN-B Principal: híbrida, IPCA, sem cupom. NTN-B: híbrida, IPCA, com juros semestrais. NTN-F: prefixada com juros semestrais.","Macete das letras: na LFT o T está no FINAL, então só conheço a taxa no final (pós-fixado). Na LTN o T vem ANTES, conheço a taxa antes (prefixado).","NTN-B: B de Brasil, e o índice oficial de inflação do Brasil é o IPCA.","LETRAS (LFT e LTN) não pagam cupom. NOTAS (NTN-B e NTN-F) pagam cupom. Exceção: a NTN-B Principal paga o rendimento junto com o principal, ou seja, NÃO paga cupom periódico."],"macete":"LFT: T no fim, taxa no fim (pós). LTN: T antes, taxa antes (pré). Letra não paga cupom, Nota paga. Principal é a exceção que não paga.","pegadinha":"A pegadinha favorita é a NTN-B Principal: por ser 'Nota', muita gente marca que paga cupom. Não paga. E a LFT segue a Selic OVER, não a Meta.","questoes":[{"q":"Um investidor quer um título prefixado que pague juros semestrais. Ele deve escolher:","alts":["LTN.","NTN-F.","NTN-B.","LFT."],"c":1,"exp":"NTN-F: prefixada COM juros semestrais. A LTN é prefixada sem cupom, a NTN-B é IPCA com cupom e a LFT é pós-fixada à Selic."},{"q":"Sobre a NTN-B Principal, é CORRETO afirmar:","alts":["É indexada ao IPCA e paga cupons semestrais.","É indexada ao IPCA e paga tudo no vencimento.","É prefixada e paga tudo no vencimento.","É indexada à Selic Over e paga cupons semestrais."],"c":1,"exp":"A regra geral diz que Notas pagam cupom, mas a NTN-B Principal é a exceção: tudo é pago no vencimento."},{"q":"O indexador da LFT é:","alts":["O IPCA.","A Selic Over.","A taxa prefixada definida no leilão.","O IGP-M."],"c":1,"exp":"LFT é pós-fixada, indexada à variação da Selic Over. IPCA é indexador das NTN-B."},{"q":"REDENÇÃO: qual característica torna os títulos públicos federais os de MENOR risco de crédito do mercado?","alts":["A cobertura do FGC até R$ 250 mil.","A garantia real dada por imóveis do governo.","A garantia do próprio governo federal, emissor da moeda.","O registro na clearing da B3."],"c":2,"exp":"A garantia é do governo federal. E atenção: títulos públicos NÃO têm cobertura do FGC, justamente porque a garantia soberana é superior."}]},{"id":"2.1.2.1","titulo":"Formas de Negociação de TPF","resumo":["Os TPF são negociados no mercado institucional entre grandes instituições e também por pessoas físicas via Tesouro Direto.","Dealers no Mercado Primário: instituições autorizadas a participar dos leilões da Secretaria do Tesouro Nacional.","Dealers do Banco Central: instituições autorizadas a negociar no mercado SECUNDÁRIO junto ao Banco Central.","Mercado Institucional: negociação no mercado secundário por bancos e fundos de investimento.","Tesouro Direto: acesso aos títulos públicos federais para o investidor pessoa física."],"macete":"Dealer do Tesouro = leilão primário. Dealer do BC = secundário. Pessoa física = Tesouro Direto.","pegadinha":"A banca troca primário e secundário entre os dois tipos de dealer. Leilão da STN é PRIMÁRIO; junto ao BC é SECUNDÁRIO.","questoes":[{"q":"As instituições autorizadas a participar dos leilões da Secretaria do Tesouro Nacional são denominadas:","alts":["Dealers do Banco Central, atuando no mercado secundário.","Dealers do mercado primário.","Agentes de custódia do Tesouro Direto.","Securitizadoras."],"c":1,"exp":"Leilão da STN = mercado primário. Os dealers do BC atuam no secundário."},{"q":"Uma pessoa física deseja comprar títulos públicos federais. O canal adequado é:","alts":["O leilão primário da Secretaria do Tesouro Nacional.","O Tesouro Direto, por meio de um agente de custódia.","A mesa de operações do Banco Central.","O mercado de balcão organizado da B3, diretamente."],"c":1,"exp":"O Tesouro Direto foi criado justamente para dar acesso ao investidor pessoa física, sempre por meio de um agente de custódia."},{"q":"REDENÇÃO: a negociação de títulos públicos no mercado secundário realizada por bancos e fundos de investimento é chamada de:","alts":["Mercado primário.","Mercado institucional.","Tesouro Direto.","Open market conduzido pelo Copom."],"c":1,"exp":"Mercado institucional: negociação no secundário entre bancos e fundos."}]},{"id":"2.1.2.3","titulo":"Tesouro Direto: nomes, regras e riscos","resumo":["Programa do Tesouro Nacional em parceria com a B3, lançado em 2002, 100% online, para democratizar o acesso aos títulos públicos.","Nomes comerciais: LFT = Tesouro Selic; LTN = Tesouro Prefixado; NTN-B Principal = Tesouro IPCA+; NTN-F = Tesouro Prefixado com juros semestrais; NTN-B = Tesouro IPCA+ com juros semestrais. Há ainda Tesouro Renda+ e Tesouro Educa+.","Regras: negociação via agente de custódia; compra mínima de 0,01 (1%) do título; investimento máximo de R$ 2.000.000,00 POR MÊS; liquidez diária com recompra garantida pelo Tesouro; resgate até as 13h paga em D0, após as 13h paga em D+1.","Custos: taxa de custódia da B3 de 0,20% ao ano sobre o valor custodiado, com ISENÇÃO de até R$ 10.000,00 para LFT, cobrada no resgate ou vencimento, o que vier primeiro. Taxa da instituição financeira é incomum, mas possível.","Tesouro Educa+: renda mensal por 60 meses (5 anos) antes do vencimento, atualizada pelo IPCA, resgate antecipado só 60 dias após a compra, custódia zerada se permanecer até a conversão e receber até 4 salários mínimos.","Tesouro Renda+: renda mensal por 240 meses (20 anos), atualizada pelo IPCA, resgate antecipado só após 60 dias, custódia zerada se permanecer até a conversão e receber até 6 salários mínimos.","Sem cobertura do FGC e tributados pela tabela regressiva de IR. Risco de crédito baixo, mas o RISCO DE MERCADO existe: o preço oscila com a taxa de juros. Reserva de emergência pede Tesouro Selic; aposentadoria pede Tesouro IPCA+ e Renda+."],"macete":"Educa+ = 60 meses e 4 salários. Renda+ = 240 meses e 6 salários. Custódia B3: 0,20% a.a., isenta até R$ 10 mil só na LFT. Teto de R$ 2 milhões por MÊS.","pegadinha":"Três armadilhas: dizer que o Tesouro Direto tem FGC (não tem); trocar os números do Educa+ e do Renda+; e afirmar que não há risco porque o emissor é o governo, esquecendo o risco de MERCADO na venda antecipada.","questoes":[{"q":"Sobre a taxa de custódia da B3 no Tesouro Direto, é CORRETO afirmar:","alts":["É de 0,20% ao ano, com isenção de até R$ 10.000,00 para investimentos em LFT.","É de 0,25% ao ano, sem qualquer isenção.","É de 0,20% ao ano, com isenção de até R$ 10.000,00 para qualquer título.","É cobrada apenas na compra do título."],"c":0,"exp":"0,20% a.a. sobre o valor custodiado, isenção de até R$ 10 mil exclusivamente para LFT, cobrada no resgate ou vencimento."},{"q":"Um cliente quer montar sua reserva de emergência. O título mais adequado, segundo o material, é:","alts":["Tesouro IPCA+ com juros semestrais, pela proteção contra inflação.","Tesouro Prefixado, pela previsibilidade da taxa.","Tesouro Selic, por seu baixo risco de mercado e alta liquidez.","Tesouro Renda+, pela renda mensal garantida."],"c":2,"exp":"Reserva de emergência exige baixo risco de mercado e liquidez: Tesouro Selic. Os demais têm maior oscilação de preço."},{"q":"Sobre o Tesouro Renda+, é CORRETO afirmar:","alts":["Renda por 60 meses, custódia zerada até 4 salários mínimos.","Renda por 240 meses, custódia zerada até 6 salários mínimos.","Renda por 240 meses, custódia zerada até 4 salários mínimos.","Renda por 60 meses, custódia zerada até 6 salários mínimos."],"c":1,"exp":"Renda+ = 240 meses (20 anos) e 6 salários mínimos. O Educa+ é que tem 60 meses e 4 salários. Ambos exigem 60 dias para resgate antecipado e são atualizados pelo IPCA."},{"q":"REDENÇÃO: o principal risco a que está exposto o investidor do Tesouro Direto é:","alts":["De crédito, pela possibilidade de calote do governo federal.","De mercado, pela oscilação do preço com a taxa de juros.","De liquidez, pois não há recompra garantida pelo Tesouro.","Operacional, por falha nos sistemas de custódia da B3."],"c":1,"exp":"O risco de crédito é baixo. O Tesouro garante a recompra diária, então liquidez também não é o problema. O que machuca é o risco de mercado na venda antecipada."}]},{"id":"2.1.3","titulo":"Títulos Bancários: visão geral","resumo":["Títulos de crédito emitidos por instituições financeiras para captar recursos junto ao público. O investidor empresta ao banco e recebe remuneração acordada.","Os tipos: CDB (Certificado de Depósito Bancário), RDB (Recibo de Depósito Bancário), RDC (Recibo de Depósito Cooperativo), LCI (Letra de Crédito Imobiliário), LCA (Letra de Crédito do Agronegócio) e LCD (Letra de Crédito de Desenvolvimento).","Remuneração: prefixada (ex.: 10% ao ano), pós-fixada (ex.: 101% do CDI) ou híbrida (combina as duas)."],"macete":"Depósito (CDB, RDB, RDC) capta livre. Letra (LCI, LCA, LCD) capta com destino carimbado.","pegadinha":"A banca inclui debêntures na lista de títulos bancários. Debênture é CORPORATIVA, emitida por sociedade anônima não financeira.","questoes":[{"q":"São títulos bancários, segundo o material, EXCETO:","alts":["CDB e RDB, emitidos por bancos.","LCI e LCA, emitidas por bancos.","Debêntures e CRI, emitidos por empresas.","RDC e LCD, de cooperativas e bancos."],"c":2,"exp":"Debêntures e CRI são títulos corporativos. Banco não emite debênture."},{"q":"Um CDB remunera 101% do CDI. Essa remuneração é:","alts":["Prefixada.","Pós-fixada.","Híbrida.","Isenta de indexador."],"c":1,"exp":"Atrelada exclusivamente a um índice (CDI): pós-fixada. Híbrida teria uma parte fixa somada ao índice."},{"q":"REDENÇÃO: a finalidade econômica dos títulos bancários é:","alts":["Financiar a dívida pública mobiliária do governo federal.","Captar recursos do público para as instituições financeiras.","Transformar recebíveis em valores mobiliários negociáveis.","Distribuir participação societária a novos investidores."],"c":1,"exp":"Captação de recursos pelo banco. Financiar a dívida pública é dos TPF; securitizar recebíveis é do CRI e CRA."}]},{"id":"2.1.3.1","titulo":"FGC e FGCOOP","resumo":["FGC: entidade PRIVADA sem fins lucrativos que protege depositantes e investidores, garantindo a devolução dos valores aplicados em caso de falência da instituição.","Regras do FGC: cobre somente recursos aplicados em BANCOS; R$ 250 mil por CPF/CNPJ por instituição, limitado a R$ 1 MILHÃO no total; conta conjunta tem garantia máxima de R$ 250 mil (dividida entre os titulares); o valor utilizado renova-se a cada 4 ANOS.","Exemplo do material: R$ 1 milhão distribuído em quatro bancos. Se um quebra, recebe R$ 250 mil, e o teto agregado cai para R$ 750 mil pelos próximos 4 anos.","Conta conjunta: R$ 500 mil de um casal em banco que quebra resulta em R$ 125 mil para cada (R$ 250 mil dividido por dois).","FGCOOP: mesma lógica, mas exclusivo para COOPERATIVAS. R$ 250 mil por CPF/CNPJ por instituição, sem limitador temporal e SEM teto agregado. Cada quebra gera cobertura de até R$ 250 mil, sem renovação de 4 anos."],"macete":"FGC: 250 mil por banco, teto de 1 milhão, renova em 4 anos. FGCOOP: 250 mil por cooperativa, sem teto agregado e sem prazo de renovação.","pegadinha":"A pegadinha campeã é a conta conjunta: a garantia NÃO é de R$ 250 mil para cada titular, é R$ 250 mil no total, dividido entre eles. E o FGCOOP não tem o limite de R$ 1 milhão nem o prazo de 4 anos.","questoes":[{"q":"Um casal mantém R$ 500.000,00 em conta conjunta num banco que entra em liquidação. A cobertura do FGC para cada titular será de:","alts":["R$ 250.000,00 para cada um, totalizando R$ 500.000,00.","R$ 125.000,00 para cada um, totalizando R$ 250.000,00.","R$ 500.000,00, pois há dois CPFs.","Nenhuma, pois contas conjuntas não são cobertas."],"c":1,"exp":"A garantia é calculada sobre o OBJETO (a conta): R$ 250 mil divididos por dois titulares = R$ 125 mil cada."},{"q":"Um investidor acionou o FGC e recebeu R$ 250.000,00 hoje. Nos próximos quatro anos, seu teto agregado de cobertura será de:","alts":["R$ 1.000.000,00, pois o teto é por instituição.","R$ 750.000,00, pois já utilizou R$ 250.000,00 do limite de R$ 1 milhão.","Zero, pois a garantia se esgota após o primeiro acionamento.","R$ 250.000,00, renovável anualmente."],"c":1,"exp":"O teto agregado de R$ 1 milhão é consumido. Volta a ser de R$ 1 milhão apenas 4 anos após o recebimento."},{"q":"A principal diferença entre FGC e FGCOOP é:","alts":["O FGCOOP cobre R$ 500 mil por instituição, contra R$ 250 mil.","O FGCOOP cobre cooperativas e não tem teto agregado.","O FGC cobre cooperativas e o FGCOOP cobre bancos.","O FGCOOP é autarquia federal e o FGC é entidade privada."],"c":1,"exp":"Ambos cobrem R$ 250 mil por instituição, mas o FGCOOP não tem teto agregado nem renovação de 4 anos."},{"q":"REDENÇÃO: a natureza jurídica do FGC é:","alts":["Autarquia federal vinculada ao Banco Central.","Entidade privada sem fins lucrativos.","Departamento da B3.","Empresa pública de direito privado."],"c":1,"exp":"Entidade privada sem fins lucrativos, criada para proteger depositantes e investidores."}]},{"id":"2.1.3.2","titulo":"CDB, RDB e RDC","resumo":["CDB e RDB: emitidos por bancos comerciais, de investimento, múltiplos e financeiras. RDC: exclusivo das cooperativas de crédito.","Garantia: CDB e RDB têm FGC. RDC tem FGCOOP.","Prazo: não há regra fixa imposta por regulação, os emissores definem conforme conveniência. Resgate antecipado: facultativo nos três.","A DIFERENÇA-CHAVE: o CDB pode ser negociado no mercado secundário; o RDB NÃO. O RDC também não é negociável.","Tributação: os três seguem a tabela regressiva de IR. Registro: clearing da B3 nos três."],"macete":"CDB é o único negociável dos três. RDB e RDC ficam presos até o vencimento ou resgate junto ao emissor. RDC = Cooperativa = FGCOOP.","pegadinha":"A banca afirma que o RDB é negociável (não é) ou que o RDC tem FGC (tem FGCOOP). E cuidado: nenhum dos três é isento de IR.","questoes":[{"q":"A diferença fundamental entre CDB e RDB é:","alts":["O CDB é isento de IR e o RDB segue a tabela regressiva.","O CDB pode ser negociado no secundário e o RDB não.","O CDB tem cobertura do FGC e o RDB não tem garantia.","O RDB é emitido apenas por cooperativas de crédito."],"c":1,"exp":"Negociabilidade é a diferença. Ambos têm FGC, ambos seguem a tabela regressiva, e quem é exclusivo de cooperativa é o RDC."},{"q":"Um investidor aplica em RDC emitido por uma cooperativa de crédito. A garantia desse título é:","alts":["FGC, até R$ 250 mil com teto agregado de R$ 1 milhão.","FGCOOP, até R$ 250 mil por instituição.","Garantia real sobre a carteira de crédito.","Não há garantia."],"c":1,"exp":"RDC é exclusivo de cooperativas e, portanto, coberto pelo FGCOOP."},{"q":"Sobre a tributação de CDB, RDB e RDC, é CORRETO afirmar:","alts":["Todos são isentos de IR para pessoa física.","Todos seguem a tabela regressiva de imposto de renda.","Apenas o CDB é tributado; RDB e RDC são isentos.","Todos pagam alíquota fixa de 15%."],"c":1,"exp":"Os três seguem a tabela regressiva. Quem tem isenção para PF é a LCI, a LCA, a LCD, o CRI, o CRA e a debênture incentivada."},{"q":"REDENÇÃO: os emissores autorizados de CDB são:","alts":["Exclusivamente bancos comerciais e a Caixa Econômica.","Bancos comerciais, de investimento, múltiplos e financeiras.","Cooperativas de crédito e sociedades securitizadoras.","Sociedades anônimas não financeiras de capital aberto."],"c":1,"exp":"Bancos comerciais, de investimento, múltiplos e financeiras. Cooperativa emite RDC, e sociedade não financeira emite debênture."}]},{"id":"2.1.3.3","titulo":"LCI, LCA e LCD","resumo":["Títulos emitidos por instituições financeiras para financiar o setor imobiliário (LCI), o agronegócio (LCA) ou o desenvolvimento (LCD).","PRAZO MÍNIMO DE APLICAÇÃO: 6 meses para LCI e LCA; 12 MESES para LCD. Prazo máximo: de acordo com o vencimento da carteira que dá lastro.","Garantia dupla: FGC MAIS garantia real. O lastro são os créditos imobiliários, do agronegócio ou de desenvolvimento que o banco detém em carteira. Na insolvência do emissor, o investidor tem direito a esses créditos.","Tributação: ISENTO para pessoa física nos três. Registro: clearing da B3. Negociáveis: sim, nos três.","Emissores: LCI por banco comercial, de investimento, sociedade de crédito imobiliário e cooperativas; LCA por banco comercial, de investimento e cooperativas; LCD por banco de DESENVOLVIMENTO."],"macete":"LCI e LCA: 6 meses. LCD: 12 meses e emissor é banco de desenvolvimento. Todas: FGC + garantia real + isenção para PF.","pegadinha":"A banca uniformiza o prazo em 6 meses para as três. A LCD exige 12 meses. E cuidado: essas letras têm FGC E garantia real, não apenas uma das duas.","questoes":[{"q":"Os prazos mínimos de aplicação da LCI, LCA e LCD são, respectivamente:","alts":["6, 6 e 6 meses.","6, 6 e 12 meses.","12, 12 e 6 meses.","Não há prazo mínimo para nenhuma delas."],"c":1,"exp":"LCI e LCA exigem 6 meses; a LCD exige 12 meses."},{"q":"Sobre as garantias da LCI, é CORRETO afirmar:","alts":["Possui apenas garantia real, sem cobertura do FGC.","Possui apenas cobertura do FGC, sem garantia real.","Possui cobertura do FGC e também garantia real.","Não possui garantia, por ser título de emissão livre."],"c":2,"exp":"Garantia dupla: FGC mais garantia real. Na insolvência, o investidor tem direito ao recebimento dos créditos que dão lastro."},{"q":"Sobre a tributação da LCI, LCA e LCD para pessoa física:","alts":["Seguem a tabela regressiva de IR.","São isentas de imposto de renda.","Pagam alíquota fixa de 15%.","Pagam 20% independentemente do prazo."],"c":1,"exp":"Isentas para PF. É justamente esse benefício que compensa o prazo mínimo de carência."},{"q":"REDENÇÃO: o emissor típico da LCD é:","alts":["Securitizadora.","Banco de desenvolvimento.","Sociedade anônima não financeira.","Cooperativa de crédito exclusivamente."],"c":1,"exp":"A LCD é emitida por banco de desenvolvimento e financia infraestrutura, indústria e setores prioritários como saneamento, energia, transporte e tecnologia."}]},{"id":"2.1.4","titulo":"Títulos Corporativos: visão geral","resumo":["Instrumentos de dívida emitidos por empresas NÃO financeiras para captar recursos.","São eles: Debêntures, Notas Promissórias, CRI (Certificado de Recebíveis Imobiliários) e CRA (Certificado de Recebíveis do Agronegócio).","Regra de ouro do grupo: NÃO possuem garantia do FGC, mas PODEM oferecer garantia real."],"macete":"Corporativo = sem FGC. Se aparecer FGC numa alternativa sobre debênture, CRI ou CRA, é erro.","pegadinha":"A banca oferece 'cobertura do FGC' como garantia de debênture ou CRI. Nunca. FGC cobre banco, e essas empresas não são bancos.","questoes":[{"q":"São títulos corporativos, segundo o material:","alts":["CDB, RDB e RDC, emitidos por bancos.","Debêntures, notas promissórias, CRI e CRA.","LCI, LCA e LCD, com lastro carimbado.","LFT, LTN e NTN-B, do Tesouro Nacional."],"c":1,"exp":"Corporativos são emitidos por empresas não financeiras. CDB e letras são bancários; LFT e LTN são públicos."},{"q":"Sobre as garantias dos títulos corporativos, é CORRETO afirmar:","alts":["Têm cobertura do FGC até o limite de R$ 250 mil.","Não têm FGC, mas podem oferecer garantia real.","Têm garantia do Tesouro Nacional, como os públicos.","Têm cobertura do FGCOOP, por serem privados."],"c":1,"exp":"Sem FGC, mas com possibilidade de garantia real."},{"q":"REDENÇÃO: a característica que define o emissor de um título corporativo é:","alts":["Ser uma instituição financeira autorizada pelo BC.","Ser uma empresa não financeira.","Ser uma cooperativa de crédito.","Ser um ente público."],"c":1,"exp":"Empresas NÃO financeiras. Banco não emite debênture."}]},{"id":"2.1.4.1","titulo":"Debêntures","resumo":["Títulos de dívida emitidos por sociedades anônimas NÃO financeiras (abertas ou fechadas) para captar recursos no mercado.","AS QUATRO GARANTIAS, da mais forte para a mais fraca: REAL (bem específico fica preso, não pode ser negociado até a quitação); FLUTUANTE (também há bem real, mas ele PODE ser substituído); QUIROGRAFÁRIA (sem bem real, o investidor concorre em IGUALDADE com os demais credores); SUBORDINADA (o investidor é o ÚLTIMO da fila, subordinado aos demais credores).","Debênture COMUM: sem incentivo fiscal, tabela regressiva de IR, sem prazo mínimo.","Debênture de INFRAESTRUTURA (incentivada): financia grandes projetos, prazo MÍNIMO de 24 meses, ISENTA para PF e alíquota de 15% para PJ.","Ambas: sem FGC mas podem ter garantia real, negociáveis, registradas na clearing da B3, admitem repactuação e o resgate pode ser em dinheiro ou em ações se previsto na escritura.","CONVERSÍVEL em ações: no vencimento o investidor recebe ações da PRÓPRIA companhia emissora. PERMUTÁVEL: recebe ações de OUTRA empresa."],"macete":"Fila da falência: Real, Flutuante, Quirografária, Subordinada. Subordinada é o último da fila. Incentivada: 24 meses, isenta PF, 15% PJ. Conversível = ações da própria; Permutável = ações de outra.","pegadinha":"Duas armadilhas: confundir quirografária (igualdade com os demais credores) com subordinada (atrás de todos), e trocar conversível por permutável. E lembre: a incentivada é 15% para PJ, não isenta.","questoes":[{"q":"Uma debênture cuja garantia é um bem real que a empresa PODE substituir por outro ao longo do contrato é classificada como:","alts":["Real.","Flutuante.","Quirografária.","Subordinada."],"c":1,"exp":"Flutuante: há bem real, mas ele pode ser trocado. Na garantia real o bem fica preso até a quitação."},{"q":"Numa falência, o detentor de debênture SUBORDINADA:","alts":["Recebe antes dos demais credores, por ter garantia real.","Concorre em igualdade de condições com os demais credores.","É o último da fila, subordinado aos demais credores.","É coberto pelo FGC até R$ 250 mil."],"c":2,"exp":"Subordinada = último da fila. Quem concorre em igualdade é o quirografário."},{"q":"Sobre a debênture de infraestrutura (incentivada), é CORRETO afirmar:","alts":["Prazo mínimo de 24 meses, isenta para PF e 15% para PJ.","Prazo mínimo de 6 meses, isenta para PF e para PJ.","Prazo mínimo de 24 meses e tabela regressiva para ambos.","Prazo mínimo de 6 meses, com cobertura do FGC."],"c":0,"exp":"24 meses de prazo mínimo, isenta para PF e 15% para PJ. A comum é que segue a tabela regressiva."},{"q":"REDENÇÃO: um investidor mantém até o vencimento uma debênture PERMUTÁVEL. Ele receberá:","alts":["Ações da própria companhia emissora do papel.","Ações de outra empresa, conforme a escritura.","Obrigatoriamente o valor de resgate em dinheiro.","Cotas de um fundo de investimento imobiliário."],"c":1,"exp":"Permutável entrega ações de OUTRA empresa. Quem entrega ações da própria emissora é a conversível."}]},{"id":"2.1.4.2","titulo":"CRI e CRA","resumo":["Títulos de renda fixa emitidos por SECURITIZADORAS, lastreados em recebíveis originados no setor imobiliário (CRI) ou do agronegócio (CRA).","Securitização: processo em que a securitizadora transforma direitos creditórios em títulos negociáveis. Ela compra a carteira de crédito do banco, pagando à vista, e recebe a prazo dos tomadores.","Exemplo do material: banco com R$ 1 bilhão em recebíveis imobiliários de 30 anos vende a carteira à securitizadora por R$ 900 milhões. A securitizadora levanta esse dinheiro emitindo CRI no mercado.","Sem cobertura do FGC, mas COM garantia real, pois são lastreados por carteiras de crédito.","Isentos de imposto de renda para PESSOA FÍSICA. Negociáveis, sem regra de prazo, registrados na clearing da B3."],"macete":"Quem emite CRI e CRA é a SECURITIZADORA, não o banco nem a empresa do setor. Sem FGC, com garantia real, isento para PF.","pegadinha":"A banca coloca o banco ou a incorporadora como emissor. O emissor é sempre a securitizadora. E não confunda com LCI e LCA, que são bancárias e TÊM FGC.","questoes":[{"q":"O emissor de um CRI é:","alts":["O banco detentor da carteira de crédito imobiliário.","A securitizadora.","A incorporadora responsável pelo empreendimento.","O Tesouro Nacional."],"c":1,"exp":"A securitizadora compra a carteira do banco e emite o CRI no mercado para se financiar."},{"q":"Assinale a alternativa que diferencia corretamente LCI e CRI:","alts":["A LCI é emitida por securitizadora e o CRI por banco.","A LCI tem FGC mais garantia real; o CRI não tem FGC, apenas garantia real.","Ambos são isentos e ambos têm FGC.","O CRI é tributado pela tabela regressiva e a LCI é isenta."],"c":1,"exp":"Ambos são isentos para PF, mas só a LCI (bancária) tem FGC. O CRI conta apenas com a garantia real do lastro."},{"q":"A palavra 'securitizadora' deriva do termo inglês 'security', que se refere a:","alts":["Sistema de segurança patrimonial.","Valor mobiliário.","Seguro de crédito.","Garantia real."],"c":1,"exp":"Security = valor mobiliário. A securitizadora transforma direitos creditórios em títulos negociáveis."},{"q":"REDENÇÃO: sobre a tributação do CRI e do CRA para pessoa física:","alts":["Seguem a tabela regressiva de IR.","São isentos de imposto de renda.","Pagam 15% fixos.","Pagam 22,5% independentemente do prazo."],"c":1,"exp":"Isentos para PF. É o incentivo criado para atrair investidores a financiar os setores imobiliário e do agronegócio."}]},{"id":"2.1.5","titulo":"Caderneta de Poupança","resumo":["É um DEPÓSITO À VISTA com remuneração automática estabelecida por LEI. Não há aquisição de título: o dinheiro é depositado e retirado a qualquer momento.","REGRA DE RENTABILIDADE: se a Selic Meta está ACIMA de 8,5% ao ano, rende 0,5% ao mês mais TR. Se a Selic Meta é IGUAL OU INFERIOR a 8,5%, rende 70% da Selic mais TR.","Regra criada em 2012. Aplicações feitas ANTES de 03 de maio de 2012 rendem 0,5% ao mês mais TR independentemente da Selic.","Aniversário da poupança: rendimento creditado mensalmente para PF e PJ sem fins lucrativos. Depósito em 10 de janeiro rende só em 10 de fevereiro. Depósitos nos dias 29, 30 ou 31 têm aniversário ajustado para o dia 1º do mês seguinte.","A remuneração é calculada sobre o MENOR SALDO do período. Exemplo: R$ 5.000 no dia 10 e saque de R$ 3.000 no dia 20 fazem o rendimento incidir sobre R$ 2.000.","Pessoa jurídica com fins lucrativos recebe rentabilidade TRIMESTRAL. Tributação: isento para PF e PJ imune; demais PJ pagam pela tabela regressiva. Tem cobertura do FGC."],"macete":"8,5% é a chave: acima disso, 0,5% + TR; até lá, 70% da Selic + TR. Rendimento sobre o MENOR saldo. Sacou antes do aniversário, perdeu o rendimento daquele valor.","pegadinha":"A banca inverte a regra dos 8,5% ou faz o cálculo sobre o saldo inicial em vez do menor saldo. E lembre: PJ com fins lucrativos recebe TRIMESTRALMENTE, não mensalmente.","questoes":[{"q":"Com a Selic Meta em 7,5% ao ano, a remuneração da caderneta de poupança para depósitos feitos hoje será:","alts":["0,5% ao mês mais TR.","70% da Selic mais TR.","100% da taxa Selic ao ano.","0,5% ao mês, sem TR."],"c":1,"exp":"Selic Meta igual ou inferior a 8,5%: rende 70% da Selic mais TR. Acima de 8,5% é que vale a regra de 0,5% ao mês mais TR."},{"q":"Um cliente deposita R$ 5.000 no dia 10 de outubro e saca R$ 3.000 no dia 20 do mesmo mês. O rendimento do período incidirá sobre:","alts":["R$ 5.000, o saldo inicial.","R$ 2.000, o menor saldo do período.","R$ 4.000, a média dos saldos.","R$ 3.000, o valor sacado."],"c":1,"exp":"A remuneração é calculada sobre o MENOR saldo de cada período de rendimento: R$ 2.000."},{"q":"Sobre a poupança de pessoa jurídica com fins lucrativos, é CORRETO afirmar:","alts":["Rendimento mensal, com isenção de imposto de renda.","Rendimento trimestral, tributado pela tabela regressiva.","Rendimento creditado a cada trimestre, com isenção de imposto de renda.","Não pode manter conta poupança em nenhuma hipótese."],"c":1,"exp":"PJ com fins lucrativos: rendimento trimestral e tributação pela tabela regressiva. Isentos são a PF e a PJ imune."},{"q":"REDENÇÃO: a poupança NÃO se aplica à portabilidade de investimentos porque:","alts":["Tem o rendimento definido diretamente por lei.","É depósito à vista, e não um título negociável.","É isenta de imposto de renda para pessoa física.","Já conta com a cobertura integral do FGC."],"c":1,"exp":"Depósito à vista não é um título a ser transferido, por isso fica de fora da portabilidade."}]},{"id":"2.1.6","titulo":"Emissor, Distribuidor e Plataformas","resumo":["Uma coisa é o EMISSOR do título (quem toma o dinheiro emprestado), outra é o DISTRIBUIDOR (quem vende o título ao investidor).","Plataforma ABERTA: permite comprar títulos de VÁRIAS instituições. Exemplo do material: comprar um CDB emitido pelo Banco Master através do BTG, que atua como distribuidor.","Plataforma FECHADA: as opções ficam limitadas aos produtos emitidos pela própria instituição. Mais conveniência, menos diversidade.","A escolha do título depende de objetivos, necessidades e perfil. Reserva de emergência exige alta liquidez e títulos pós-fixados, mais conservadores, como o Tesouro Selic."],"macete":"Aberta = prateleira com marcas de todo mundo. Fechada = só a marca da casa. Quem emite assume a dívida; quem distribui só vende.","pegadinha":"A banca sugere que o distribuidor garante o título. Não garante: o risco de crédito é do EMISSOR. Se o Banco Master quebrar, quem responde é o FGC, não o distribuidor.","questoes":[{"q":"Um investidor compra, pela corretora BTG, um CDB emitido pelo Banco Master. Nessa operação:","alts":["O BTG é o emissor e assume o risco de crédito.","O BTG distribui e o risco de crédito é do Banco Master.","Não há emissor definido, pois a plataforma é aberta.","O risco de crédito é dividido entre as duas instituições."],"c":1,"exp":"Distribuidor vende, emissor deve. O risco de crédito acompanha o emissor, e a cobertura do FGC também se refere a ele."},{"q":"A característica de uma plataforma FECHADA é:","alts":["Oferecer títulos de diversas instituições emissoras.","Limitar as opções aos produtos emitidos pela própria instituição.","Isentar o investidor de imposto de renda.","Dispensar o agente de custódia."],"c":1,"exp":"Plataforma fechada restringe às emissões da própria casa. A aberta traz emissores variados."},{"q":"REDENÇÃO: para uma reserva de emergência, o material recomenda títulos com:","alts":["Alta rentabilidade esperada e prazo longo de vencimento.","Alta liquidez e perfil conservador, como o Tesouro Selic.","Isenção de imposto de renda e prazo mínimo de 24 meses.","Alta duration, para capturar a queda dos juros."],"c":1,"exp":"Reserva de emergência pede acesso rápido ao dinheiro e baixa oscilação: liquidez e pós-fixados."}]},{"id":"2.1.6.1","titulo":"Portabilidade de Investimentos","resumo":["Permite ao investidor transferir recursos de uma instituição para outra SEM resgatar e reinvestir, ou seja, sem custos adicionais e sem perder as condições originalmente acordadas.","Aplica-se a títulos públicos, CDB, LCI, LCA, e também a ações e fundos de investimento imobiliário.","NÃO se aplica à caderneta de poupança, porque ela é caracterizada como depósito à vista.","Efeito prático: mantém o cliente no controle do patrimônio e é uma poderosa ferramenta de atração e retenção de clientes."],"macete":"Portabilidade preserva taxa, prazo e prazo de IR. Poupança fica de fora porque é depósito à vista, não título.","pegadinha":"A banca afirma que a portabilidade gera resgate e nova contagem de prazo para o IR. Não gera: as condições originais são preservadas, sem impactos fiscais.","questoes":[{"q":"Sobre a portabilidade de investimentos, é CORRETO afirmar:","alts":["Exige resgate na origem e nova aplicação no destino.","Transfere os recursos sem resgate e sem perder condições.","Aplica-se exclusivamente a títulos públicos federais.","Gera cobrança de IOF sobre o valor transferido."],"c":1,"exp":"A portabilidade transfere o próprio título, preservando taxa, prazo e condições, sem custos adicionais nem impacto fiscal."},{"q":"A caderneta de poupança está excluída da portabilidade porque:","alts":["É isenta de imposto de renda.","É caracterizada como depósito à vista.","Tem rentabilidade definida por lei.","Possui cobertura do FGC."],"c":1,"exp":"Sendo depósito à vista, não existe um título a ser transferido."},{"q":"REDENÇÃO: são passíveis de portabilidade, segundo o material:","alts":["Somente CDB e LCI, por serem títulos bancários.","Títulos públicos, CDB, LCI, LCA, ações e FII.","Apenas os produtos de previdência complementar.","Somente ativos isentos de imposto de renda."],"c":1,"exp":"A lista do material abrange renda fixa bancária, títulos públicos, ações e FII."}]}],"boss":[{"q":"Aplicação de R$ 200 mil resgatada no 5º dia por R$ 210 mil, com limite de 83% para 5 dias. O IOF devido é:","alts":["R$ 10.500,00","R$ 8.300,00","R$ 10.000,00","R$ 1.660,00"],"c":1,"exp":"Passo 1: 210.000 × 1% × 5 = 10.500. Passo 2: rendimento de 10.000 × 83% = 8.300. Como 10.500 ultrapassa o limite, vale R$ 8.300."},{"q":"Um CDB resgatado no 200º dia tem alíquota de IR de:","alts":["22,5%","20%","17,5%","15%"],"c":1,"exp":"De 181 a 360 dias: 20%."},{"q":"Assinale o título público prefixado SEM pagamento de cupom:","alts":["NTN-F.","LTN.","NTN-B.","LFT."],"c":1,"exp":"LTN é prefixada e, sendo Letra, não paga cupom. A NTN-F é prefixada COM cupom semestral."},{"q":"Um investidor tem R$ 300 mil em CDB de um único banco que entra em liquidação. Receberá do FGC:","alts":["R$ 300 mil, o valor integral aplicado.","R$ 250 mil, o limite por CPF por instituição.","R$ 150 mil, metade do valor aplicado.","Nada, pois o CDB não tem cobertura do FGC."],"c":1,"exp":"Teto de R$ 250 mil por CPF por instituição. Os R$ 50 mil restantes entram na fila da massa falida."},{"q":"Sobre LCI e CRI, assinale a CORRETA:","alts":["Ambos são emitidos por securitizadoras e têm FGC.","A LCI tem FGC e o CRI não; ambos isentos para PF.","O CRI tem FGC e a LCI não; ambos isentos para PF.","Ambos seguem a tabela regressiva de imposto de renda."],"c":1,"exp":"A diferença decisiva é o FGC: só a LCI, por ser bancária, tem."},{"q":"Numa falência, a ordem de recebimento entre debenturistas, do primeiro ao último, é:","alts":["Subordinada, quirografária, flutuante, real.","Real, flutuante, quirografária, subordinada.","Quirografária, real, subordinada, flutuante.","Todas concorrem em igualdade."],"c":1,"exp":"Real tem bem preso, flutuante tem bem substituível, quirografária concorre em igualdade e subordinada é a última da fila."},{"q":"Selic Meta em 12% ao ano. A poupança de uma pessoa física renderá:","alts":["70% da Selic mais TR.","0,5% ao mês mais TR.","12% ao ano mais TR.","0,5% ao mês, sem TR."],"c":1,"exp":"Acima de 8,5% ao ano, vale a regra fixa: 0,5% ao mês mais TR."},{"q":"Sobre a debênture de infraestrutura, é CORRETO afirmar:","alts":["Prazo mínimo de 24 meses, isenta para PF e 15% para PJ.","Prazo mínimo de 12 meses e isenta para PF e PJ.","Sem prazo mínimo, tributada pela tabela regressiva.","Coberta pelo FGC até R$ 250 mil."],"c":0,"exp":"24 meses, isenta para PF, 15% para PJ, sem FGC."},{"q":"Um investidor precisa resgatar o dinheiro do Tesouro Direto às 15h de uma quarta-feira. O pagamento ocorrerá:","alts":["No mesmo dia (D0).","No dia útil seguinte (D+1).","Em D+2.","Somente no vencimento do título."],"c":1,"exp":"Resgate até as 13h paga em D0; após as 13h, paga em D+1."},{"q":"Qual destes NÃO é isento de imposto de renda para pessoa física?","alts":["LCA.","CRA.","RDB.","Debênture incentivada."],"c":2,"exp":"RDB segue a tabela regressiva. LCA, CRA e debênture incentivada são isentas para PF."},{"q":"A NTN-B Principal difere da NTN-B porque:","alts":["É prefixada, enquanto a NTN-B segue o IPCA.","Não paga cupom: o rendimento vem no vencimento.","É indexada à taxa Selic Over diária, e não ao IPCA.","Tem prazo máximo de 24 meses até o vencimento."],"c":1,"exp":"Ambas são IPCA. A diferença é o cupom: a Principal concentra tudo no vencimento."},{"q":"Um investidor recebeu cobertura do FGC de R$ 250 mil há dois anos. Hoje, seu teto agregado disponível é:","alts":["R$ 1.000.000,00","R$ 750.000,00","R$ 250.000,00","Zero até completar 4 anos."],"c":1,"exp":"O teto de R$ 1 milhão fica reduzido a R$ 750 mil até completar 4 anos do recebimento."}]},{"id":"2.2","titulo":"Renda Variável","subtitulo":"Você vira sócio, não credor","niveis":[{"id":"2.2.1","titulo":"Instrumentos de Renda Variável","resumo":["Regra de partida: renda variável NUNCA representa a dívida do emissor. Qualquer investimento sem promessa de pagamento é renda variável.","Você adquire PROPRIEDADE, não uma dívida. Não há promessa de recompra nem taxa de remuneração pactuada.","Não possui data de VENCIMENTO. Uma ação ou cota de FII não vence: para virar dinheiro é preciso vender no mercado secundário.","Quadro comparativo: renda fixa representa dívida, tem vencimento, tem taxa previamente acordada e segue tabela regressiva. Renda variável é título de propriedade, sem vencimento, sem taxa acordada e tributada por ALÍQUOTA FIXA."],"macete":"Fixa: eu sou credor, tem prazo, tem taxa, tabela regressiva. Variável: eu sou dono, sem prazo, sem taxa, alíquota fixa.","pegadinha":"A banca diz que a renda variável 'tem tributação regressiva conforme o prazo'. Não tem: é alíquota FIXA (15% ou 20%). E renda variável não sofre IOF.","questoes":[{"q":"Assinale a característica que distingue corretamente renda fixa de renda variável:","alts":["A variável tem vencimento definido e taxa pactuada.","A fixa é propriedade e a variável representa dívida.","A fixa é dívida com tabela regressiva; a variável, propriedade.","Ambas seguem a tabela regressiva de imposto de renda."],"c":2,"exp":"Dívida x propriedade, com vencimento x sem vencimento, regressiva x alíquota fixa. Esse quadro cai direto na prova."},{"q":"Um investidor compra um imóvel para renda. Segundo a lógica apresentada no material, essa aplicação se assemelha à renda variável porque:","alts":["Possui data de vencimento previamente definida.","Não há promessa de recompra nem taxa pactuada.","É garantida pelo FGC até o limite de R$ 250 mil.","É tributada pela tabela regressiva conforme o prazo."],"c":1,"exp":"Sem promessa de devolução do capital e sem taxa acordada: para transformar em dinheiro é preciso vender no mercado secundário."},{"q":"REDENÇÃO: sobre o vencimento dos ativos de renda variável, é CORRETO afirmar:","alts":["Vencem em prazo definido no prospecto.","Não possuem vencimento; a saída se dá pela venda no mercado.","Vencem em 720 dias, quando a alíquota se estabiliza.","Vencem apenas se a empresa for liquidada."],"c":1,"exp":"Ação e cota de fundo não vencem. Você sai vendendo, conforme as condições de mercado."}]},{"id":"2.2.2","titulo":"Tipos de Empresas","resumo":["SOCIEDADE LIMITADA (Ltda): capital dividido em COTAS, responsabilidade dos sócios limitada ao valor das cotas. Estrutura simples, típica de pequenas e médias empresas. Sócios definidos, sem livre negociação da participação. NÃO PODE EMITIR AÇÕES.","SOCIEDADE ANÔNIMA (S/A): capital dividido em AÇÕES, acionistas com responsabilidade limitada ao valor das ações. Permite maior captação de recursos e PODE ABRIR CAPITAL, o que é essencial para a listagem em bolsa."],"macete":"Ltda tem cota e não emite ação. S/A tem ação e pode abrir capital.","pegadinha":"A banca sugere que uma Ltda pode emitir debêntures ou abrir capital. Debênture exige S/A (aberta ou fechada), e ação exige S/A.","questoes":[{"q":"Sobre a Sociedade Limitada, é CORRETO afirmar:","alts":["Tem capital em ações e pode ser listada em bolsa.","Tem capital em cotas e não pode emitir ações.","Tem capital em cotas e os sócios respondem sem limite.","Pode emitir ações preferenciais, mas não ordinárias."],"c":1,"exp":"Cotas, responsabilidade limitada e proibição de emitir ações."},{"q":"A estrutura societária necessária para uma empresa listar suas ações em bolsa é:","alts":["Sociedade Limitada.","Sociedade Anônima.","Empresa Individual.","Cooperativa."],"c":1,"exp":"Só a S/A tem capital dividido em ações e pode
